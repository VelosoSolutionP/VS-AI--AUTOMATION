.cv-filtros button{padding:6px 8px;font-size:11.5px;white-space:nowrap;border-radius:11px;display:flex;justify-content:space-between;align-items:center}
.cv-filtros button em{font-style:normal;font-size:10.5px;margin-left:4px;padding:0 5px;border-radius:99px;background:var(--raised);color:var(--muted)}
.cv-filtros button.on em{background:var(--ac-soft);color:var(--ac)}
.cv-sit{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;white-space:nowrap}
.cv-sit i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sit-aguarda{color:var(--err)} .sit-aguarda i{box-shadow:0 0 0 0 var(--err);animation:pulsa 1.6s infinite}
.sit-vendedor{color:var(--ac-2)} .sit-ok{color:var(--ok)} .sit-bot{color:var(--dim)}
.cv-mini-ped{font-size:11px;color:var(--warn);font-weight:600}
.cv-cab .cv-sit{margin-left:auto}
.cv-cab-a{display:flex;gap:6px;align-items:center;flex:none}
.cv-pedido{display:flex;align-items:center;gap:12px;margin:10px 16px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel-2);border-left:3px solid var(--warn);flex:none}
.cv-pedido.cp-ok{border-left-color:var(--ok)} .cv-pedido.cp-morto{border-left-color:var(--dim);opacity:.8}
.cp-rot{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.cv-pedido b{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:1px}
.cv-pedido.cp-ok b{color:var(--ok)}
.cv-pedido small{display:block;font-size:12px;color:var(--muted)}
.ev-transf{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)} .ev-transf svg{color:var(--warn)}
.ev-assum{color:var(--ac-2);border-color:var(--ac-line);background:var(--ac-soft)} .ev-assum svg{color:var(--ac-2)}
.b-autor{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac-2);margin-bottom:2px}
.page-head .ph-acts .badge svg{width:13px;height:13px;margin-right:4px;vertical-align:-2px}
@media(max-width:900px){.cv-cab{flex-wrap:wrap}.cv-cab .cv-sit{margin-left:0}.cv-cab-a{width:100%;justify-content:flex-end}}

body.tela-chat .toasts{top:66px;bottom:auto}

/* ── Telegram: quadro de fila + painel lateral ── */
.fila{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.fila-col{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);min-height:220px;border-top:3px solid currentColor}
.fila-col.sit-aguarda{color:var(--err)} .fila-col.sit-vendedor{color:var(--ac-2)} .fila-col.sit-bot{color:var(--line-2)}
.fila-col header{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line)}
.fila-col header em{font-style:normal;font-size:12px;font-weight:700;color:var(--fg);background:var(--raised);border-radius:99px;padding:1px 9px}
.fila-cards{display:grid;gap:8px;padding:10px;max-height:calc(100vh - 330px);overflow-y:auto}
.fila-vazia{color:var(--dim);font-size:12.5px;text-align:center;padding:26px 8px}
.fila-card{display:block;width:100%;text-align:left;color:var(--fg);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  transition:border-color .15s,transform .15s,box-shadow .15s}
.fila-card:hover{border-color:var(--ac-line);transform:translateY(-1px);box-shadow:var(--sh-2)}
.fila-card.ativo{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.fc-top{display:flex;align-items:center;gap:10px}
.fc-t{min-width:0;flex:1} .fc-t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .fc-t small{font-size:11.5px;color:var(--dim)}
.fc-msg{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-ped{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;font-weight:650}
.fc-ped svg{width:12px;height:12px} .fc-ped.ok{color:var(--ok)} .fc-ped.aberto{color:var(--warn)}
.fila-aviso{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:11px 14px;border-radius:12px;border:1px solid var(--ac-line);background:var(--ac-soft);font-size:13px}
.fila-aviso > svg{width:18px;height:18px;color:var(--ac-2);flex:none} .fila-aviso span{flex:1}
.fila-busca{margin-bottom:12px;max-width:360px}
.gaveta-bg{position:fixed;inset:0;background:rgba(5,8,16,.45);z-index:35;animation:t-entra .2s ease}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);z-index:36;display:flex;flex-direction:column;
  background:var(--panel);border-left:1px solid var(--line-2);box-shadow:var(--sh-3);animation:gaveta-entra .22s ease}
@keyframes gaveta-entra{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.gaveta .cv-cab{padding:14px 16px}
.gv-acoes{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gv-acoes .cv-sit{margin-right:auto}
.gaveta .conversa-fluxo{flex:1;min-height:0}
[data-theme="dark"] .gaveta{background:#101829}
[data-theme="dark"] .fila-col{background:#0e1627}
@media(max-width:900px){.fila{grid-template-columns:1fr}.fila-cards{max-height:none}.fila-col{min-height:0}}
@media (prefers-reduced-motion:reduce){.gaveta,.gaveta-bg{animation:none}}

/* fila: resumo, tempo de espera, assumir no cartao */
.fila-resumo{display:flex;gap:18px;flex-wrap:wrap;margin:-8px 0 14px;font-size:12.5px}
.fila-resumo .cv-sit{font-size:12.5px} .fila-resumo b{color:var(--fg);margin-left:2px}
.fila-card{cursor:pointer}
.fila-card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.fc-rodape{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px}
.fc-rodape .fc-ped{margin-top:0}
.fc-espera{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--dim)}
.fc-espera svg{width:12px;height:12px}
.fc-espera.aguarda{color:var(--muted)} .fc-espera.morno{color:var(--warn)} .fc-espera.quente{color:var(--err)}
.fc-assumir{margin-left:auto}
/* Telegram · Campanhas: assistente com previa ao lado */
.cp-passos{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 0 18px}
.cp-passo{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
  border-radius:99px;padding:6px 13px 6px 6px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.cp-passo[disabled]{cursor:default;opacity:.55}
.cp-passo .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--raised);color:var(--muted)}
.cp-passo .n svg{width:12px;height:12px}
.cp-passo.on{border-color:var(--ac-line);background:var(--ac-soft);color:var(--ac)} .cp-passo.on .n{background:var(--ac);color:var(--ac-fg)}
.cp-passo.feito .n{background:var(--ok-bg);color:var(--ok)}
.cp-sep{flex:0 0 14px;height:1px;background:var(--line-2)}
.cp-grade{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.cp-form{display:grid;gap:14px;min-width:0}
.cp-lado{position:sticky;top:14px}
.cp-lado-t{font-size:11.5px;font-weight:650;color:var(--muted);margin-bottom:8px}
@media(max-width:980px){.cp-grade{grid-template-columns:1fr}.cp-lado{position:static}}
.cp-h{margin:4px 0 2px;font-size:13.5px;font-weight:680}
.cp-objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cp-obj{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px;
  font:inherit;color:var(--fg);cursor:pointer;transition:border-color .14s,background .14s}
.cp-obj svg{width:18px;height:18px;color:var(--muted);margin-bottom:4px}
.cp-obj b{font-size:13px} .cp-obj small{font-size:11.5px;color:var(--dim)}
.cp-obj:hover{border-color:var(--line-2)}
.cp-obj.on{border-color:var(--ac);background:var(--ac-soft)} .cp-obj.on svg{color:var(--ac)}
.cp-form textarea{width:100%;resize:vertical}
.cp-conta{font-size:11px;font-weight:600;color:var(--dim)} .cp-conta.estourou{color:var(--err)}
.cp-img{display:flex;gap:12px;align-items:center} .cp-img img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.cp-img b{font-size:12.5px}
.cp-rodape{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.cp-veredito{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:550}
.cp-veredito.b-ok,.cp-veredito.b-warn,.cp-veredito.b-err,.cp-veredito.b-ac{border-style:solid}
.cp-aud{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2)}
.cp-aud-h{display:flex;align-items:center;gap:8px;font-size:13px}
.cp-aud ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.cp-aud li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)} .cp-aud li .badge{flex:0 0 auto}
.cp-ressalva{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;cursor:pointer}
.cp-det{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px} @media(max-width:720px){.cp-det{grid-template-columns:1fr}}
.cp-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cp-num{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel-2)} .cp-num small{display:block;font-size:11px;color:var(--dim)} .cp-num b{font-size:18px}
td.num,th.num{text-align:right;white-space:nowrap}
.cp-linha{cursor:pointer} .cp-linha:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
/* previa estilo Telegram (cores do app, nao do tema: e o que o cliente vai ver) */
.tgp{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.tgp-top{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#517da2;color:#fff}
.tgp-top b{display:block;font-size:13px} .tgp-top small{font-size:11px;opacity:.8}
.tgp-av{width:30px;height:30px;border-radius:50%;background:#7fa7c9;display:grid;place-items:center;font-weight:700;font-size:13px}
.tgp-chat{background:#cfdcc8;padding:14px 12px 16px;min-height:220px}
.tgp-msg{background:#fff;border-radius:12px 12px 12px 4px;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.12);max-width:100%}
.tgp-msg img{display:block;width:100%;max-height:320px;object-fit:cover}
.tgp-semimg{padding:30px 10px;text-align:center;font-size:12px;color:#8a8a8a;background:#f1f1f1}
.tgp-txt{padding:8px 10px 6px;font-size:13.5px;line-height:1.42;color:#111;overflow-wrap:anywhere}
.tgp-hora{float:right;font-size:10.5px;color:#9aa;margin:6px 0 0 10px}
.tgp-bt{margin-top:5px;background:rgba(0,0,0,.18);color:#fff;border-radius:10px;padding:8px;text-align:center;font-size:13px;font-weight:600}
/* Qualificacao: cartao da oportunidade, tags e tela de regras */
.q-card{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:10px 12px;margin:10px 0}
.gaveta .q-card,.inbox-conversa .q-card{max-height:42vh;overflow:auto;flex:0 0 auto;margin:10px 16px}
.q-card summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;flex-wrap:wrap}
.q-card summary::-webkit-details-marker{display:none}
.q-h{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:680} .q-h svg{width:15px;height:15px;color:var(--ac)}
.q-tier{display:inline-flex;align-items:center;font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--raised)}
.q-tier.t2{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)} .q-tier.t1{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.q-resp{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ac);background:var(--ac-soft);border:1px solid var(--ac-line);padding:2px 8px;border-radius:99px}
.q-resp svg{width:11px;height:11px}
.cv-tags .q-tier,.cv-tags .q-resp{margin-left:4px}
.fc-q{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.q-resumo{font-size:12.5px;margin:8px 0;color:var(--fg);line-height:1.45}
.q-ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.q-item{border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--panel);min-width:0}
.q-item small{display:block;font-size:10.5px;color:var(--dim)} .q-item b{font-size:12px;font-weight:600;overflow-wrap:anywhere} .q-item b.q-nao{color:var(--dim);font-weight:500}
.q-rodape{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.q-rodape small{display:block;font-size:10.5px;color:var(--dim)} .q-rodape b{font-size:12.5px}
.q-sel{margin-top:5px;width:100%;font-size:12px;padding:4px 6px}
.q-falta{margin-top:8px;display:flex;gap:6px;align-items:center} .q-falta svg{width:13px;height:13px;color:var(--warn)}
.q-regras{display:grid;gap:8px}
.q-regra{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel-2)}
.q-regra.off{opacity:.55}
.q-n{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ac-soft);color:var(--ac);margin-top:5px}
.q-liga{margin-top:7px}
.q-regra-c{flex:1;min-width:0;display:grid;gap:6px}
.q-nome{font-weight:600;font-size:13px;border:0;background:none;box-shadow:none;padding:4px 0}
.q-linha{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.q-linha select,.q-linha input{font-size:12.5px;padding:5px 8px;max-width:100%}
.q-regra-c .hint svg,.q-card .hint svg{width:13px;height:13px;vertical-align:-2px;flex:0 0 13px}
.q-sim{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2)}
@media(max-width:560px){.q-regra{flex-wrap:wrap}.q-regra .acoes{width:100%}}
/* Historico de atendimentos */
.h-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.h-kpi{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:11px 13px;box-shadow:var(--sh-1)}
.h-kpi small{display:block;font-size:11px;color:var(--dim)} .h-kpi b{font-size:20px;letter-spacing:-.02em} .h-kpi span{display:block;font-size:11.5px;color:var(--muted)}
.h-filtros{margin:0 0 12px;flex-wrap:wrap;border-radius:12px}
.h-estrelas{color:#f5b301;letter-spacing:1px;font-size:13px;white-space:nowrap} .h-estrelas i{color:var(--line-2);font-style:normal}
.h-coment{display:flex;gap:10px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.h-coment svg{width:16px;height:16px;color:var(--warn);flex:0 0 16px} .h-coment small{font-size:11px;color:var(--muted)} .h-coment p{margin:2px 0 0;font-size:13px}
.h-conversa{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2)}
.cv-final{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);padding:4px 9px;border-radius:99px}
.cv-final svg{width:12px;height:12px}
.h-motivo{display:block;color:var(--muted);font-size:11px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Tela sem atendimento */
.tranq{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:22px;box-shadow:var(--sh-1)}
.tranq-top{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.tranq-top h3{margin:0 0 3px;font-size:16px}
.tranq-ic{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.tranq-ic svg{width:22px;height:22px}
.tranq-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

.orc-ant-l:first-of-type{border-top:0}

.prosp-aprov{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:12px;border:1px solid var(--ok-line);border-radius:12px;background:var(--ok-bg);color:var(--ok)}

.prosp-tela .btn-p{background:linear-gradient(180deg,#1a9142,#15803d);border-color:#15803d;color:#fff;box-shadow:0 8px 20px -12px #15803d}

  .orc-t{min-width:0}
}

function setTema(t){
  try{localStorage.setItem('vs-tema',t);}catch{}
  document.documentElement.setAttribute('data-theme',t);
  marcarTema(t);
}
function marcarTema(t){
  document.getElementById('thLight')?.classList.toggle('on',t==='light');
  document.getElementById('thDark')?.classList.toggle('on',t==='dark');
}
(function(){
  let t=null; try{t=localStorage.getItem('vs-tema');}catch{}

})();

   formulario continua com o formulario e o que digitou. */
const AV_ICO={ok:'check',err:'alerta',warn:'alerta',info:'relogio'};
function toast(t,tipo,segundos,op){
  op=op||{};
  tipo=AV_ICO[tipo]?tipo:'ok';
  let c=document.getElementById('toasts');
  if(!c){ c=document.createElement('div'); c.id='toasts'; c.className='toasts'; document.body.appendChild(c); }
  const corpo=op.html!=null?op.html:esc(t).replace(/\n/g,'<br>');
  const lista=(op.motivos||[]).filter(Boolean);
  // O mesmo aviso de novo (clique duplo, tentar de novo) nao empilha: renova o que ja esta la.
  const chave=tipo+'|'+(op.titulo||'')+'|'+corpo;
  [...c.children].forEach(x=>{ if(x.dataset.chave===chave) x.remove(); });
  /* TODO aviso fecha sozinho — erro tambem, so que mais devagar (10 a 20 s,
     conforme o tamanho), pra dar tempo de ler. Aviso que nunca sai obrigava a
     fechar um por um. So fica quem pedir `fixo` explicitamente. */
  const fica=op.fixo===true;
  const tamanho=String(op.titulo||'').length+String(corpo).replace(/<[^>]+>/g,'').length+lista.join(' ').length;
  const dur=(segundos||(tipo==='err'?Math.min(20,10+Math.floor(tamanho/40)):(op.titulo?6:4)))*1000;
  const el=document.createElement('div');
  el.className='toast t-'+tipo; el.dataset.chave=chave;
  el.setAttribute('role',tipo==='err'?'alert':'status');
  el.innerHTML=`<span class="t-ic">${ico(AV_ICO[tipo])}</span>
    <div class="t-txt">${op.titulo?`<b>${esc(op.titulo)}</b>`:''}<div class="t-corpo">${corpo}</div>
      ${lista.length?`<ul class="notas">${lista.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}
      ${op.acao?`<button class="t-acao">${esc(op.acao.rotulo)}</button>`:''}</div>
    <button class="t-x" aria-label="Fechar aviso">&times;</button>
    ${fica?'':`<i class="t-barra" style="animation-duration:${dur}ms"></i>`}`;
  const sair=()=>{ if(el.classList.contains('saindo')) return; el.classList.add('saindo'); setTimeout(()=>el.remove(),230); };
  el.querySelector('.t-x').onclick=sair;
  if(op.acao) el.querySelector('.t-acao').onclick=()=>{ sair(); op.acao.on(); };
  /* Relogio, nao `animationend`: com "reduzir animacoes" ligado no sistema a
     barra fica escondida, a animacao nunca termina — e o aviso ficava pra
     sempre. Mouse em cima pausa (a barra tambem pausa, pelo CSS). */
  if(!fica){
    let resta=dur, ini=0, tm=null;
    const armar=()=>{ ini=Date.now(); clearTimeout(tm); tm=setTimeout(sair,resta); };
    el.addEventListener('mouseenter',()=>{ clearTimeout(tm); resta=Math.max(800,resta-(Date.now()-ini)); });
    el.addEventListener('mouseleave',armar);
    armar();
  }
  c.appendChild(el);
  while(c.children.length>4) c.firstElementChild.remove();
  return el;
}

  const j=await res.json().catch(()=>({erro:[502,503,504,520,521,522,523,524,530].includes(res.status)||res.status===0

  if(!res.ok||j.erro) throw new Error(j.erro||('HTTP '+res.status));

/**
 * Dois numeros brasileiros sao o MESMO?
 *
 * O WhatsApp entrega celular brasileiro sem o nono digito: 553175127978 e
 * 5531975127978 sao a mesma linha. Comparar como texto acusava divergencia de
 * contrato onde nao havia — e um alerta que grita errado ensina todo mundo a
 * ignorar alerta.
 */
function mesmoNumero(a,b){
  const so=(x)=>String(x||'').replace(/\D/g,'');
  const sem9=(x)=>{
    const d=so(x);
    // 55 + DDD(2) + 9 + 8 digitos = 13. Tira o 9 pra comparar com o formato antigo.
    if(d.length===13&&d.startsWith('55')&&d[4]==='9') return d.slice(0,4)+d.slice(5);
    if(d.length===11&&d[2]==='9') return d.slice(0,2)+d.slice(3); // sem DDI
    return d;
  };
  const x=so(a), y=so(b);
  if(!x||!y) return true;                    // faltando dado nao e divergencia
  return x===y||sem9(x)===sem9(y)||sem9(x).slice(-10)===sem9(y).slice(-10);
}

/** Numero bonito pra tela: +55 (31) 97512-7978. */
function numeroBonito(n){
  const d=String(n||'').replace(/\D/g,'');
  if(d.length<10) return d?'+'+d:'—';
  const ddi=d.length>11?d.slice(0,d.length-11)||'55':'55';
  const resto=d.slice(-11).length===11?d.slice(-11):d.slice(-10);
  const ddd=resto.slice(0,2), linha=resto.slice(2);
  const meio=linha.length===9?linha.slice(0,5):linha.slice(0,4);
  return `+${ddi} (${ddd}) ${meio}-${linha.slice(meio.length)}`;
}

async function sincronizarShop(){
  try{
    const r=await api('tiktok/sincronizar',{});
    TKSHOP=await api('tiktok/shop').catch(()=>TKSHOP);
    if(r.ok){
      avisoOk('Sincronizado com a TikTok',
        `A API respondeu com <b>${r.total}</b> produto(s) da loja <b>${esc(r.loja||'—')}</b>.`);
    }else{
      /* Falha de integracao NAO vira aviso que some: e o motivo pelo qual o
         numero na tela nao mudou, e quem opera precisa ler. */
      avisoErro('A TikTok não respondeu a consulta',esc(r.motivo||'sem motivo informado'));
    }
    render();
  }catch(e){ avisoErro('Não consegui sincronizar',e.message); }
}

async function carregarTiktokLoja(){
  TKLOJA=await api('tiktok/loja').catch(()=>({pronto:false,motivo:'não consegui falar com o painel'}));
  render();
}
async function carregarTiktokAds(){
  TKADS=await api('tiktok/campanhas').catch(()=>({pronto:false,motivo:'não consegui falar com o painel'}));
  render();
}

async function descobrirLojaTiktok(){
  try{
    const r=await api('tiktok/descobrir-loja',{});
    const lojas=r.lojas||[];
    if(!lojas.length){
      abrirModal('Nenhuma loja encontrada',
        `<p class="hint">Esta conta do TikTok não administra nenhuma loja do TikTok Shop, ou o app não tem
          permissão para vê-las.</p>`,
        `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
      return;
    }
    /* Uma conta pode ter varias lojas. Escolher a primeira sozinho poria produto
       na loja errada — e "produto errado na loja errada" e do tipo que so se
       descobre pelo cliente reclamando. */
    abrirModal('Qual é a loja desta operação?',
      `<p class="hint" style="margin-bottom:12px">Os produtos publicados daqui vão para a loja escolhida.</p>
       <ul class="notas">${lojas.map(l=>`<li><button class="btn btn-s" style="margin:2px"
         onclick="fecharModal();escolherLojaTiktok('${esc(l.cipher)}','${esc(l.id||'')}','${esc(l.name||'')}')">${esc(l.name||l.id)}</button></li>`).join('')}</ul>`,
      `<button class="btn btn-g" onclick="fecharModal()">Agora não</button>`);
  }catch(e){ avisoErro('Não consegui concluir',e.message); }
}
async function escolherLojaTiktok(cipher,id,nome){
  try{ await api('tiktok/loja-ativa',{cipher,id,nome}); flash(`Loja "${nome}" selecionada.`,'ok'); await carregarTiktokLoja(); }
  catch(e){ avisoErro('Não consegui concluir',e.message); }
}

async function escolherCategoriaTiktok(){
  try{
    const r=await api('tiktok/categorias',{});
    const lista=(r.dados?.categories||r.categorias||[]).filter(c=>c.is_leaf!==false).slice(0,60);
    if(!lista.length){ avisoErro('Não consegui concluir','A TikTok não devolveu categorias para esta loja.'); return; }
    abrirModal('Categoria dos produtos enviados daqui',
      `<p class="hint" style="margin-bottom:12px">A TikTok exige categoria em todo produto. Escolha a que mais se
        aproxima do que você vende — dá pra trocar depois.</p>
       <ul class="notas">${lista.map(c=>`<li><button class="btn btn-s" style="margin:2px"
         onclick="fecharModal();salvarPadraoTiktok({categoriaId:'${esc(c.id)}',categoriaNome:'${esc(c.local_name||c.name||c.id)}'})">${esc(c.local_name||c.name||c.id)}</button></li>`).join('')}</ul>`,
      `<button class="btn btn-g" onclick="fecharModal()">Agora não</button>`);
  }catch(e){ avisoErro('Não consegui concluir',e.message); }
}

async function escolherArmazemTiktok(){
  try{
    const r=await api('tiktok/armazens',{});
    const lista=r.dados?.warehouses||r.armazens||[];
    if(!lista.length){ avisoErro('Não consegui concluir','Nenhum armazém cadastrado na sua loja do TikTok.'); return; }

async function publicarNoTiktok(){
  const arq=(document.getElementById('tkVideo')||{}).files?.[0];
  const alvo=document.getElementById('tkPubResultado');
  if(!arq) return avisoErro('Não consegui concluir','Escolha o arquivo de vídeo.');
  const titulo=(document.getElementById('tkTitulo')||{}).value?.trim()||'';
  const priv=(document.getElementById('tkPriv')||{}).value||'SELF_ONLY';
  alvo.innerHTML='<p class="hint">Enviando o arquivo…</p>';
  try{
    // O vídeo NÃO vai em JSON: sobe cru, em streaming, pra rota própria — o leitor
    // de JSON do painel corta em 256 KB.
    const up=await fetch('/crm/api/midia?nome='+encodeURIComponent(arq.name),
      {method:'POST',headers:{'content-type':arq.type||'video/mp4',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:arq});
    const uj=await up.json().catch(()=>({erro:'resposta inválida do servidor'}));
    if(!up.ok||uj.erro) throw new Error(uj.erro||('HTTP '+up.status));

    alvo.innerHTML='<p class="hint">Arquivo no ar. Mandando pra TikTok…</p>';
    const r=await api('tiktok/publicar',{videoUrl:uj.url,titulo,privacidade:priv});
    alvo.innerHTML=`<div class="card" style="margin-top:12px;border-style:dashed">
    ${cardH('redes',`Enviado pra TikTok`,``,3)}${linha('Arquivo','hospedado neste painel',(uj.bytes/1048576).toFixed(1)+' MB','b-ok')}
      ${linha('Quem vê','',priv==='SELF_ONLY'?'só você (privado)':priv,'')}
      ${r.publishId?linha('Id da publicação','a TikTok ainda processa o vídeo',esc(r.publishId),'b-warn'):''}
      ${(r.avisos||[]).map(a=>`<p class="hint">⚠ ${esc(a)}</p>`).join('')}
      ${r.publishId?`<button class="btn btn-s" onclick="verStatusTiktok('${esc(r.publishId)}')">${ico('ver')}Ver situação</button>`:''}</div>`;
    flash('Vídeo enviado. A TikTok processa em alguns segundos.','ok');
  }catch(e){ alvo.innerHTML=''; avisoErro('Não consegui concluir',e.message); }
}

/* Valor digitado por gente: "R$ 1.299,90", "1299,90", "1299.90". O que NAO pode
   e virar 0 calado — cobranca de zero passa reto e so aparece no extrato. */
function centavosDe(bruto){
  const t=String(bruto||'').replace(/[^\d,.-]/g,'').trim();
  if(!t) return null;
  const norm=t.includes(',')?t.replace(/\./g,'').replace(',','.'):t;
  const n=Number(norm);
  if(!Number.isFinite(n)||n<=0) return null;
  return Math.round(n*100);
}

/* Tom e ícone do indicador saem do que ele MEDE, não da ordem em que aparece:
   assim "Ganhos" é o mesmo verde-azulado em toda tela do console, e quem já viu
   uma vez reconhece na outra. Quem quiser fugir da regra passa tom/ícone na mão.
   A primeira regra que casar vence — por isso as mais específicas vêm antes. */
const TONS=[
  [/perdid|problema|sem saldo|esquecid|vencid|saiu|chargeback|invalid/i, 5,'alerta'],
  /* Casos em que a regra geral juntava 3 ou 4 indicadores da MESMA tela no mesmo
     tom — quatro caixas iguais outra vez. Cada um destes veio de olhar a tela. */
  [/com verde|verde valido|em vigor|licenca/i, 2,'check'],
  [/\bversao|\bversoes/i, 3,'versao'],
  [/aceite/i, 1,'registrar'],
  [/rascunho/i, 4,'editar'],
  [/validade/i, 4,'relogio'],
  [/enviad/i, 1,'enviar'],
  [/recebid|disponivel/i, 6,'baixar'],
  [/\bestado\b/i, 4,'power'],
  [/saldo do mes/i, 6,'caixa'],
  [/entrou/i, 2,'mais'],
  [/numa venda/i, 4,'gerar'],
  [/\bconversa\b/i, 2,'whats'],
  [/repositorio|recibo/i, 6,'auditor'],
  [/nunca rodaram|nunca rodou/i, 4,'relogio'],
  [/a pagar|comiss|pago|fatur/i, 2,'financeiro'],
  [/ganho|receita|confirmad|disponivel|saldo|entrou|vendeu|viraram venda/i, 2,'financeiro'],
  [/venda|ticket/i, 3,'consumo'],
  [/parceir/i, 1,'indicacao'],
  [/indicad/i, 3,'crm'],
  [/convers|ticket|ciclo|gmv|custo|valor parado/i, 3,'consumo'],
  [/aguardand|pendente|em andamento/i, 4,'relogio'],
  [/lead|abert|pipeline|pedido/i, 1,'crm'],
  [/unidade|reservad|lote/i, 6,'caixa'],
  [/produto|estoque|catalogo/i, 4,'estoque'],
  [/chamam gente|handoff|humano/i, 3,'usuario'],
  [/canal|whatsapp/i, 2,'whats'],
  [/bot|motor|regra|estado|automa/i, 6,'bot'],
  [/mensage|enviad|recebid|interac|whats|conversa/i, 2,'whats'],
  [/evento|qualific|trilha|auditor/i, 6,'auditor'],
  [/licenca|plano|validade|\bvers(ao|oes|ão|ões)|aceite|rascunho|em vigor|contrato/i, 3,'contrato'],
  [/origem|origens|rede|conex/i, 6,'redes'],
];
const semAcento=(t)=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tomDoIndicador=(l)=>(TONS.find(([re])=>re.test(semAcento(l)))||[null,1,'visao']).slice(1);
/* Indicador: rótulo, número e a linha que explica de onde ele vem. */
const kpi=(l,v,e,tom,icone)=>{
  const [t,ic]=tomDoIndicador(l);
  tom=tom||t; icone=icone===undefined?ic:icone;
  return `<div class="kpi" style="--kt:var(--t${tom});--kt-bg:var(--t${tom}-bg)">`+
    `<div class="kpi-top"><span>${esc(l)}</span>${icone?`<div class="chip">${ico(icone)}</div>`:""}</div>`+
    `<b>${esc(String(v))}</b><em>${esc(e)}</em></div>`;
};
/* ── Modelo de botão ───────────────────────────────────────────────────────
   UM lugar monta todo botão de texto do console. Tela nova usa isto e já nasce
   com ícone, altura, raio e tom iguais aos do resto — foi a falta disso que fez
   a plataforma virar uma coleção de botões parecidos, mas nenhum igual.

     botao({t:'Salvar', ic:'salvar', v:'p', on:'salvar()'})

   t  texto (obrigatório)      ic ícone do conjunto `I` (obrigatório na prática)
   v  p | s | g | ok | dan | no        sz xs | lg        on conteúdo do onclick
   off desabilita              tit  title/tooltip        extra classes a mais  */
function botao({t,ic,v='s',sz,on,id,tit,off,extra}){
  return `<button class="btn btn-${v}${sz?' btn-'+sz:''}${extra?' '+extra:''}"`+
    `${id?` id="${id}"`:''}${on?` onclick="${on}"`:''}${tit?` title="${esc(tit)}"`:''}`+
    `${off?' disabled':''}>${ic?ico(ic):''}<span>${esc(t)}</span></button>`;
}
/* Cabeçalho de cartão: chip de ícone + título + apoio + ações à direita.
   O chip é o que diferencia um bloco do outro quando a tela tem seis cartões. */
const cardH=(icone,titulo,dica,tom,acts)=>
  `<div class="card-h"><div class="chip" style="--ct:var(--t${tom||1});--ct-bg:var(--t${tom||1}-bg)">${ico(icone)}</div>`+
  `<div class="card-h-t"><h3>${esc(titulo)}</h3>${dica?`<p class="hint">${dica}</p>`:''}</div>`+
  `${acts?`<div class="card-h-a">${acts}</div>`:''}</div>`;

function vazio(icone,titulo,texto,passos){
  return `<div class="empty"><div class="ico">${ico(icone)}</div><h3>${esc(titulo)}</h3><p>${texto}</p>
   ${passos?`<div class="steps">${passos.map((p,i)=>`<div class="step"><div class="n">${i+1}</div><div>${p}</div></div>`).join('')}</div>`:''}</div>`;
}
/* Botao so de icone. `title` e `aria-label` sao obrigatorios aqui: icone sem nome
   e adivinhacao pra quem chega hoje e barreira pra leitor de tela. */
const bi=(icone,rotulo,onclick,classe='')=>
  `<button class="bi ${classe}" title="${esc(rotulo)}" aria-label="${esc(rotulo)}" onclick="${onclick}">${ico(icone)}</button>`;

/* Lista de ressalvas — texto corrido, nao par rotulo/estado. Antes isto era
   `linha('•',' ',texto)`: a frase ia parar dentro do badge, espremida na ponta
   direita, e a coluna da esquerda ficava com uma bolinha sozinha. */
const notas=(lista)=>`<ul class="notas">${lista.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;

const linha=(l,s,b,c)=>`<div class="stat-row"><div class="lbl">${esc(l)}${s?`<small>${s}</small>`:''}</div><span class="badge ${c||''}">${esc(b)}</span></div>`;

/* ---- CRUD do catálogo ---- */

/* O formulário de cadastro é o MESMO da edição. Dois formulários iguais lado a
   lado divergem na primeira mudança de campo — e aí um passa a aceitar o que o
   outro recusa. `EDITANDO` diz em qual modo ele está. */
let EDITANDO=null;
/* Ordenacao e pagina vivem fora do render: a tela e redesenhada inteira a cada
   `carregar()`, e estado guardado no DOM se perderia a cada atualizacao. */
let TAB={ordem:'nome',desc:false,pagina:1,porPagina:20,busca:''};
/* Lista OU funil. O funil e bom pra arrastar a venda; a lista e melhor pra achar
   um lead pelo nome no meio de trezentos. Quem escolhe e quem usa. */
let VISAO_LEAD='tabela';
let EDITANDO_LANC=null;
let PERIODO={de:'',ate:''};
let EDITANDO_REGRA=null;
let SIMULACAO=[];
/* Desligado por padrao: conferir o fluxo nao pode criar cobranca sem querer. */
let SIM_COBRAR=false;

const campoProduto={eNome:'nome',ePreco:'preco',ePromo:'precoPromocional',eQtd:'quantidade',
  eMarca:'marca',eCat:'categoria',eGtin:'gtin',eLink:'link',eImgs:'imagens',eDesc:'descricao'};

  return {nome:v('eNome'),preco:v('ePreco'),precoPromocional:v('ePromo')||null,

async function salvarProduto(){
  const d=lerFormProduto();
  if(!d.nome) return avisoErro('Não consegui concluir','O nome é obrigatório.');
  if(!EDITANDO&&!d.preco) return avisoErro('Não consegui concluir','O preço é obrigatório.');
  try{
    const r=EDITANDO
      ? await api('estoque/editar',{sku:EDITANDO,mudancas:d})
      : await api('estoque/produto',d);
    if(r.erros?.length) return avisoErro('Não consegui concluir',r.erros.join(' · '));
    const feito=EDITANDO?'Produto atualizado.':'Produto cadastrado.';
    EDITANDO=null;
    fecharModal();
    // `carregar()` REDESENHA a tela: mostrar aviso antes dele e desenhar num
    // elemento que vai ser jogado fora no instante seguinte.
    await carregar();
    flash(feito,'ok');
    mostrarPendencias(r.produto||{nome:d.nome},r.avisos||[]);
  }catch(e){avisoErro('Não consegui concluir',e.message);}
}



/* Um modal só, reaproveitado. Vários modais no HTML viram vários lugares pra
   esquecer de fechar — e aí um fica por cima do outro sem ninguém perceber. */
let FECHAR_MODAL=null;
function abrirModal(titulo,corpo,rodape,op){
  document.querySelector('#modalBg .modal').className='modal'+(op?.classe?' '+op.classe:'');
  document.getElementById('modalT').textContent=titulo;
  document.getElementById('modalB').innerHTML=corpo;
  document.getElementById('modalF').innerHTML=rodape||'';
  document.getElementById('modalBg').classList.add('show');
  // Trava o fundo: sem isso a pagina atras rola junto e a pessoa perde o modal.
  document.body.style.overflow='hidden';
  FECHAR_MODAL=(e)=>{if(e.key==='Escape')fecharModal();};
  document.addEventListener('keydown',FECHAR_MODAL);
  setTimeout(()=>{
    document.querySelector('#modalB input:not([type=hidden]),#modalB textarea,#modalB select')?.focus();
    if(document.getElementById('eFotos')) pintarFotos();
  },60);
}
/* ---------------------------------------------------------------------------
   Modais padrao. UM lugar decide como o sistema fala com quem clicou.

   Antes cada tela inventava o seu: umas usavam a barra do topo (que saiu),
   outras um toast de canto, e as que perguntavam "tem certeza?" usavam o
   `confirm()` do navegador — aquela caixinha cinza do sistema operacional, sem
   icone, sem cor, com botao escrito "OK". Num painel que se vende como premium,
   o `confirm()` e a parte mais barata da tela, e aparece justamente na hora
   mais tensa: a de apagar.
   --------------------------------------------------------------------------- */

const BT = {
  /** Botao de fechar, que e o que a maioria dos avisos precisa. */
  fechar: (rot = 'Entendi') => `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}<span>${esc(rot)}</span></button>`,
  cancelar: (rot = 'Cancelar') => `<button class="btn btn-g" onclick="fecharModal()">${ico('fechar')}<span>${esc(rot)}</span></button>`,
};

/** Deu certo. Curto, com o que foi feito escrito de forma conferivel. Texto longo fica mais tempo. */
function avisoOk(titulo, corpo) {
  const html = corpo || 'Pronto, feito.';
  toast(null, 'ok', html.length > 90 ? 10 : 6, { titulo, html });
}

/**
 * Nao deu. Fica mais que o de sucesso (10 a 20 s, conforme o tamanho) pra dar
 * tempo de ler o motivo — mas fecha sozinho: aviso que nunca sai (era assim)
 * obrigava a fechar um por um. Mouse em cima segura; o × fecha na hora.
 */
function avisoErro(titulo, corpo, motivos, acao) {
  toast(null, 'err', 0, { titulo: titulo || 'Não consegui fazer isso', html: corpo || 'O servidor recusou a operação.', motivos, acao });
}

/**
 * Pergunta antes de fazer algo que nao volta.
 *
 * O texto diz O QUE acontece, nao "tem certeza?" — "tem certeza" nao informa
 * nada e vira reflexo de clicar em sim. E o botao perigoso NAO e o primeiro:
 * quem chega com o dedo pronto acerta o Cancelar.
 */
function confirmar({ titulo, texto, consequencia, rotulo = 'Excluir', icone = 'excluir', perigo = true, aoConfirmar }) {
  const id = 'cfm' + Math.random().toString(36).slice(2, 9);
  window[id] = async () => {
    fecharModal();
    try { await aoConfirmar(); } catch (e) { avisoErro('Não consegui concluir', e.message); }
    delete window[id];
  };
  abrirModal(titulo,
    `<div class="cfm"><span class="cfm-ic">${ico(perigo ? 'alerta' : icone)}</span><div>
      <p>${texto}</p>${consequencia ? `<p class="cfm-aviso">${consequencia}</p>` : ''}</div></div>`,
    BT.cancelar() + `<button class="btn ${perigo ? 'btn-d' : 'btn-p'}" onclick="window['${id}']()">${ico(icone)}<span>${esc(rotulo)}</span></button>`,
    { classe: 'modal-sm' + (perigo ? ' modal-perigo' : '') });
}

function fecharModal(){
  document.getElementById('modalBg').classList.remove('show');
  document.body.style.overflow='';
  /* LIMPA o conteudo, nao so esconde. Modal escondido com formulario dentro deixa
     os mesmos ids (#eNome, #ePreco) duplicados na pagina e botoes fantasmas
     respondendo a clique — a tela passa a ter dois "Editar" pro mesmo produto. */
  document.getElementById('modalB').innerHTML='';
  document.getElementById('modalF').innerHTML='';
  document.getElementById('modalT').textContent='';
  if(FECHAR_MODAL){document.removeEventListener('keydown',FECHAR_MODAL);FECHAR_MODAL=null;}
}




const campoNum=(v)=>v==null?'':String(v);
/* O que falta pro produto ENTRAR no feed dos canais. Fica na tela ate a pessoa

/* ---- fotos do produto ---- */

/* A lista real mora no input escondido: é ela que vai pro backend. As miniaturas
   são só a leitura dela — assim não existe um segundo lugar pra divergir. */
const fotosAtuais=()=>((document.getElementById('eImgs')||{}).value||'')
  .split(',').map(x=>x.trim()).filter(Boolean);

function pintarFotos(){
  const alvo=document.getElementById('eFotos');
  if(!alvo) return;
  const fs=fotosAtuais();
  alvo.innerHTML=fs.map((u,i)=>`<div class="ft">
    <img src="${esc(u)}" alt="" onerror="this.parentNode.classList.add('semfoto');this.remove()">
    <button type="button" class="x" title="Remover" aria-label="Remover foto" onclick="removerFoto(${i})">×</button>
    ${i===0?'<span class="capa">capa</span>':''}</div>`).join('');
}

function definirFotos(lista){
  const campo=document.getElementById('eImgs');
  if(campo) campo.value=lista.join(', ');
  pintarFotos();
}

function removerFoto(i){
  const fs=fotosAtuais();
  fs.splice(i,1);
  definirFotos(fs);
}

function colarUrlFoto(){
  const u=prompt('Cole o endereço da imagem (https://...)');
  if(!u) return;
  if(!/^https?:\/\//i.test(u.trim())) return avisoErro('Não consegui concluir','O endereço precisa começar com http:// ou https://');
  definirFotos([...fotosAtuais(),u.trim()]);
}

async function subirFotos(input){
  const arquivos=[...(input.files||[])];
  if(!arquivos.length) return;
  const alvo=document.getElementById('eFotos');
  const antes=fotosAtuais();
  // Mostra o espaço reservado antes de subir: upload sem retorno visual parece travado.
  if(alvo) alvo.insertAdjacentHTML('beforeend',arquivos.map(()=>'<div class="ft subindo">enviando…</div>').join(''));
  const novas=[]; const erros=[];
  for(const f of arquivos){
    try{
      const r=await fetch('/crm/api/midia?tipo=imagem&nome='+encodeURIComponent(f.name),
        {method:'POST',headers:{'content-type':f.type||'image/jpeg',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:f});
      const j=await r.json().catch(()=>({erro:'resposta inválida do servidor'}));
      if(!r.ok||j.erro) throw new Error(j.erro||('HTTP '+r.status));
      novas.push(j.url);
    }catch(e){ erros.push(`${f.name}: ${e.message}`); }
  }
  input.value='';
  definirFotos([...antes,...novas]);
  // Falha parcial é o caso normal com vários arquivos: dizer só "enviado"
  // esconderia o que ficou de fora.
  if(erros.length) flash(`${novas.length} enviada(s). Falhou: ${erros.join('; ')}`,'err');
  else if(novas.length) flash(`${novas.length} foto(s) enviada(s).`,'ok');
}

async function importarProdutos(){
  const txt=(document.getElementById('impTxt')||{}).value?.trim()||'';
  if(!txt) return avisoErro('Não consegui concluir','Cole o conteúdo primeiro.');
  let itens;
  try{
    const d=JSON.parse(txt);
    itens=Array.isArray(d)?d:(d.produtos||[]);
  }catch(e){ return avisoErro('Não consegui concluir','JSON inválido: '+e.message); }
  if(!itens.length) return avisoErro('Não consegui concluir','Nenhum item encontrado no conteúdo.');

  const erros=[]; let entraram=0;
  for(const it of itens){
    try{
      const r=await api('estoque/produto',{...it,preco:it.preco??(it.precoCentavos!=null?it.precoCentavos/100:undefined)});
      if(r.erros?.length) erros.push(`${it.nome||it.sku||'sem nome'}: ${r.erros.join('; ')}`);
      else entraram++;
    }catch(e){ erros.push(`${it.nome||it.sku||'sem nome'}: ${e.message}`); }
  }
  fecharModal(); await carregar();
  // Importacao parcial e o caso normal: dizer so "importado" esconderia o que ficou de fora.
  if(erros.length) abrirModal('Importação concluída em parte',
    `${linha('Entraram','',String(entraram),'b-ok')}${linha('Recusados','',String(erros.length),'b-warn')}
     <div style="margin-top:12px">${erros.map(e=>`<p class="hint">• ${esc(e)}</p>`).join('')}</div>`,
    `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
  else flash(`${entraram} produto(s) importado(s).`,'ok');
}

async function baixarLote(id){

      {headers:TOKEN?{'x-crm-token':TOKEN}:{}});

/* ---- DataTable genérica ----
   Uma só, usada por todas as telas de cadastro. Cada tela repetindo a sua
   diverge na primeira mudança: uma ganha busca, outra não; uma trata lista vazia,
   outra mostra tabela sem linha. */
const BUSCA={};
function buscarEm(chave,valor){ BUSCA[chave]=valor; render(); }
const casa=(termo,campos)=>{
  const t=String(termo||'').toLowerCase().trim();
  return !t || campos.filter(Boolean).some(c=>String(c).toLowerCase().includes(t));
};

/* `todos` e a lista antes do filtro. Sem ela nao da pra distinguir "nada
   cadastrado" de "a busca nao achou" — e sao duas telas diferentes: uma convida
   a cadastrar, a outra a corrigir o termo. */
function tabela({colunas,itens,todos,acoes,vazio,nenhum}){
  const bruto=todos||itens;
  if(!bruto.length) return `<p class="hint" style="padding:24px 0;text-align:center">${vazio||'Nada cadastrado ainda.'}</p>`;
  if(!itens.length) return `<p class="hint" style="padding:24px 0;text-align:center">${nenhum||'Nada encontrado.'}</p>`;
  const cab=colunas.map(c=>`<th style="text-align:${c.al||'left'}">${esc(c.t)}</th>`).join('');
  const corpo=itens.map(x=>`<tr>${colunas.map(c=>`<td style="text-align:${c.al||'left'}">${c.cel(x)}</td>`).join('')}
    ${acoes?`<td><div class="acoes">${acoes(x)}</div></td>`:''}</tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${cab}${acoes?'<th></th>':''}</tr></thead>
    <tbody>${corpo}</tbody></table></div>
    <p class="hint" style="margin-top:10px">${itens.length} registro(s)</p>`;
}

const COLUNAS=[
  {k:'imagem',t:'',ord:null,cel:(x)=>x.imagemUrl

  {k:'estoque',t:'Estoque',ord:'disponivel',al:'center',cel:(x)=>`<b>${x.disponivel}</b>${x.reservado?`<br><small class="hint">${x.reservado} reservado</small>`:''}`},

  }},

function ordenar(campo){
  if(!campo) return;
  if(TAB.ordem===campo) TAB.desc=!TAB.desc; else {TAB.ordem=campo;TAB.desc=false;}
  TAB.pagina=1; render();
}
function irPagina(n){ TAB.pagina=n; render(); }
function buscarNaTabela(v){ TAB.busca=v; TAB.pagina=1; render(); }
function porPagina(n){ TAB.porPagina=Number(n); TAB.pagina=1; render(); }

/* Filtra, ordena e pagina no cliente. A especificação pede servidor "quando o
   volume justificar" — com catálogo de loja pequena, ida ao servidor a cada
   tecla é pior: trava em rede ruim e não melhora nada. */
function linhasVisiveis(produtos){
  const t=TAB.busca.toLowerCase().trim();
  let ps=t?produtos.filter(p=>`${p.nome} ${p.sku} ${p.marca||''} ${p.categoria||''}`.toLowerCase().includes(t)):produtos.slice();
  const c=TAB.ordem;
  ps.sort((a,b)=>{
    const x=a[c],y=b[c];
    if(x==null&&y==null) return 0;
    if(x==null) return 1;   // vazio sempre no fim, subindo ou descendo
    if(y==null) return -1;
    const r=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'pt-BR');
    return TAB.desc?-r:r;
  });
  const total=ps.length;
  const paginas=Math.max(1,Math.ceil(total/TAB.porPagina));
  if(TAB.pagina>paginas) TAB.pagina=paginas;
  const ini=(TAB.pagina-1)*TAB.porPagina;
  return {pagina:ps.slice(ini,ini+TAB.porPagina),total,paginas,ini};
}

function tabelaProdutos(produtos){
  const {pagina,total,paginas,ini}=linhasVisiveis(produtos);
  const seta=(campo)=>TAB.ordem!==campo?'':(TAB.desc?' ↓':' ↑');
  const cab=COLUNAS.map(c=>c.ord
    ?`<th style="text-align:${c.al||'left'}"><button class="th-ord" onclick="ordenar('${c.ord}')">${esc(c.t)}${seta(c.ord)}</button></th>`
    :`<th style="text-align:${c.al||'left'}">${esc(c.t)}</th>`).join('');

  const corpo=pagina.map(x=>`<tr>${COLUNAS.map(c=>`<td style="text-align:${c.al||'left'}">${c.cel(x)}</td>`).join('')}
    <td><div class="acoes">
      ${bi('ver','Visualizar',`verProduto('${esc(x.sku)}')`)}
      ${bi('editar','Editar',`editarProduto('${esc(x.sku)}')`)}
      ${bi('comprar','Comprar (dar entrada)',`comprarProduto('${esc(x.sku)}','${esc(x.nome).replace(/'/g,"\\'")}')`)}
      ${x.naVitrine?bi('publicar','Tirar da vitrine',`tirarDaVitrine('${esc(x.sku)}')`):bi('publicar','Pôr na vitrine (loja e Google)',`porNaVitrine('${esc(x.sku)}')`)}
      ${bi('vender','Vender no canal',`venderProduto('${esc(x.sku)}','${esc(x.nome).replace(/'/g,"\\'")}')`,'pri')}
      ${bi('excluir','Excluir',`excluirProduto('${esc(x.sku)}','${esc(x.nome).replace(/'/g,"\\'")}')`,'dan')}
    </div></td></tr>`).join('');

  if(!produtos.length) return `<p class="hint" style="padding:26px 0;text-align:center">
    Catálogo vazio — clique em <b>+ Novo produto</b> pra cadastrar o primeiro.</p>`;
  if(!total) return `<p class="hint" style="padding:26px 0;text-align:center">Nenhum produto com “${esc(TAB.busca)}”.</p>`;

  const nav=paginas>1?`<div class="pag">
    <span class="hint">${ini+1}–${ini+pagina.length} de ${total}</span>
    <div style="display:flex;gap:4px">
      <button class="btn btn-s btn-xs" ${TAB.pagina<=1?'disabled':''} onclick="irPagina(${TAB.pagina-1})">${ico('ant')}anterior</button>
      ${Array.from({length:paginas},(_,i)=>i+1).filter(n=>Math.abs(n-TAB.pagina)<3||n===1||n===paginas)
        .map(n=>`<button class="btn btn-xs ${n===TAB.pagina?'btn-p':'btn-s'}" onclick="irPagina(${n})">${n}</button>`).join('')}
      <button class="btn btn-s btn-xs" ${TAB.pagina>=paginas?'disabled':''} onclick="irPagina(${TAB.pagina+1})">próxima${ico('prox')}</button>
    </div></div>`:`<p class="hint" style="margin-top:10px">${total} produto(s)</p>`;

  return `<div class="tbl-wrap"><table id="tblProdutos"><thead><tr>${cab}<th></th></tr></thead>
    <tbody>${corpo}</tbody></table></div>${nav}`;
}

/* Achata o histórico de todos os leads numa lista só, do mais novo pro mais
   velho. O histórico já é gravado por evento desde o início — o que faltava era
   olhar pra ele como TRILHA, não como detalhe de um lead. */
function trilhaDeLeads(){
  const out=[];
  for(const l of (ST.leads||[])){
    for(const h of (l.historico||[])){
      out.push({...h,lead:l.nome||('+'+l.telefone),telefone:l.telefone});
    }
  }
  return out.sort((a,b)=>String(b.quando||'').localeCompare(String(a.quando||'')));
}

const rotuloEvento=(e)=>({
  criado:'lead cadastrado',
  etapa:'mudou de etapa',
  fechado:'lead fechado',
  qualificado:'score calculado',
  interacao:'mensagem',
  valor:'valor do lead',
}[e.tipo]||e.tipo);

function detalheEvento(e){
  const au=e.auto?' · automático'+(e.motivo&&e.tipo==='etapa'?` (${e.motivo})`:''):'';
  if(e.tipo==='etapa') return `${e.de||'—'} → ${e.para||'—'}${au}`;
  if(e.tipo==='fechado') return e.status+(e.motivo?` · ${e.motivo}`:'')+(e.auto?' · automático':'');
  if(e.tipo==='valor') return `${brl(e.de)} → ${brl(e.para)}${e.motivo?' · '+e.motivo:''}${e.auto?' · automático':''}`;
  if(e.tipo==='qualificado') return `${e.faixa||'—'}${e.score!=null?' · '+e.score:''}${(e.motivos||[]).length?' · '+e.motivos.join('; '):''}`;
  if(e.tipo==='interacao') return `${e.direcao==='saida'?'enviada':'recebida'} · ${String(e.texto||'').slice(0,60)}`;
  if(e.tipo==='criado') return e.etapa||'';
  return '';
}

/** Quantos caminhos da arvore terminam com uma pessoa assumindo. */
function contarEncaminhamentos(fluxo){
  let n=0;
  for(const p of fluxo?.passos||[]){
    if(p.acao==='encaminhar') n++;
    for(const o of p.opcoes||[]) if(o.acao==='encaminhar') n++;
  }
  return n;
}

async function simular(){
  const campo=document.getElementById('simTxt');
  const txt=(campo?.value||'').trim();
  if(!txt) return;
  try{
    // Manda a conversa INTEIRA: o contador de falhas seguidas depende do que veio
    // antes, e mandar so a ultima mensagem faria o bot nunca chamar gente.
    const msgs=[...SIMULACAO.map(t=>t.recebida),txt];
    const r=await api('bot/simular',{mensagens:msgs,cobrar:SIM_COBRAR,canal:BOT_CANAL});

    campo.value='';

/**
 * Trocar o nome do assistente deixa o nome ANTIGO escrito nas mensagens.
 *
 * A saudacao, o "nao entendi" e o handoff sao escritos com o nome DENTRO. Trocar
 * a persona de "Micaela" para "Paulao" fazia o cliente continuar sendo recebido
 * por "Olá! Eu sou a Micaela" — o painel dizia uma coisa e a conversa outra.
 *
 * A troca e OFERECIDA, nao imposta: quem escreveu aquele texto pode ter posto o
 * nome de proposito. As duas saidas salvam; o que muda e se os textos vao junto.
 */
const CAMPOS_COM_NOME=[['pzSaud','saudação'],['pzFall','quando não entende'],
  ['pzHand','ao passar pra uma pessoa'],['pzCat','catálogo'],['pzSemTexto','áudio e imagem']];

const escapaRe=(t)=>String(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/**
 * O que procurar quando o nome muda.
 *
 * A persona costuma ser "Micaela · Veloso Solution" ou "Micaela (demonstração)",
 * e a saudação diz só "Micaela". Procurar o nome INTEIRO nao achava nada — e a
 * tela dizia que estava tudo certo com o nome velho na saudação. Entao procura
 * do mais especifico pro mais curto: o nome cheio, depois o primeiro pedaco.
 */
function apelidos(nome){
  const inteiro=String(nome||'').trim();
  const primeiro=inteiro.split(/[\s·|(,\-–—]+/)[0]||'';
  const lista=[inteiro];
  if(primeiro.length>=3&&primeiro.toLowerCase()!==inteiro.toLowerCase()) lista.push(primeiro);
  return lista;
}

function camposComNomeAntigo(antigo){
  const res=apelidos(antigo).map((a)=>new RegExp(escapaRe(a),'i'));
  return CAMPOS_COM_NOME.filter(([id])=>{
    const el=document.getElementById(id);
    return el&&el.value&&res.some((re)=>re.test(el.value));
  });
}

function aplicarNomeNosTextos(antigo,novo){
  /* Do mais LONGO pro mais curto: trocar "Micaela" antes de
     "Micaela (demonstração)" deixaria "Paulão (demonstração)" pra tras. */
  const alvos=apelidos(antigo).sort((a,b)=>b.length-a.length);
  for(const [id] of camposComNomeAntigo(antigo)){
    const el=document.getElementById(id);
    for(const a of alvos){ el.value=el.value.replace(new RegExp(escapaRe(a),'gi'),novo); }
  }
}

/** Resolve true se a pessoa quiser trocar os textos junto, false se nao. */
function perguntarTrocaDeNome(antigo,novo,afetados){
  return new Promise((resolve)=>{
    const id='tn'+Math.random().toString(36).slice(2,9);
    window[id]=(trocar)=>{ fecharModal(); delete window[id]; resolve(trocar); };
    abrirModal(`O nome antigo ainda está nos textos`,
      `<p class="hint">Você trocou <b>${esc(antigo)}</b> por <b>${esc(novo)}</b>, mas "${esc(antigo)}" continua escrito em: `+
      `<b>${afetados.map(([,r])=>esc(r)).join('</b>, <b>')}</b>.</p>`+
      `<p class="hint" style="margin-top:8px">Sem trocar, o cliente continua sendo recebido por <b>${esc(antigo)}</b>.</p>`,
      `<button class="btn btn-s" onclick="window['${id}'](false)">${ico('salvar')}<span>Só o nome</span></button>`+
      `<button class="btn btn-p" onclick="window['${id}'](true)">${ico('atualizar')}<span>Trocar nos textos também</span></button>`);
  });
}

async function salvarPersonalizacao(){
  const v=(id)=>(document.getElementById(id)||{}).value?.trim()||'';
  /* ANTES de salvar: depois seria tarde, a mensagem ja teria ido pro ar. */
  const antigo=String(BOT?.config?.nome||'').trim();
  const agora=v('pzNome');
  if(antigo&&agora&&antigo.toLowerCase()!==agora.toLowerCase()){
    const afetados=camposComNomeAntigo(antigo);
    if(afetados.length&&await perguntarTrocaDeNome(antigo,agora,afetados)){
      aplicarNomeNosTextos(antigo,agora);
    }
  }
  return salvar({
    titulo:'Salvar a personalização',
    campos:[
      {id:'pzNome',rotulo:'Nome do atendente',obrigatorio:true},
      {id:'pzSaud',rotulo:'Saudação',obrigatorio:true},
      {id:'pzFall',rotulo:'Quando não entende',obrigatorio:true},
      {id:'pzHand',rotulo:'Ao passar pra uma pessoa',obrigatorio:true},
      {id:'pzFalhas',rotulo:'Falhas até chamar gente',obrigatorio:true,numero:true,min:1},
    ],
    rota:'bot/config',

/* ── Horário de funcionamento: calendário ─────────────────────────────────────
   Semana (dia, início, fim, segundo turno) + DATAS ESPECIAIS (feriado fechado ou
   horário diferente). Grava no mesmo formato que o bot já entende:
   { seg:'08:00-12:00, 13:00-18:00', …, excecoes:{'2026-12-25':{horario:'fechado',nome:'Natal'}} }. */
const HR_DIAS=[['seg','Segunda'],['ter','Terça'],['qua','Quarta'],['qui','Quinta'],['sex','Sexta'],['sab','Sábado'],['dom','Domingo']];
let HR=null;
function hrDoTexto(txt){ const f=String(txt||'').split(',').map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}$/.test(x)).map(x=>x.split('-').map(y=>y.trim().padStart(5,'0')));
  return {aberto:f.length>0,t1:f[0]||['08:00','18:00'],t2:f[1]||null}; }
function hrIniciar(h){
  HR={dias:Object.fromEntries(HR_DIAS.map(([d])=>[d,h?hrDoTexto(h[d]):{aberto:!['dom'].includes(d),t1:d==='sab'?['08:00','12:00']:['08:00','18:00'],t2:null}])),
    excecoes:Object.entries(h?.excecoes||{}).sort(([a],[b])=>a.localeCompare(b)).map(([data,e])=>({data,nome:e.nome||'',...hrDoTexto(e.horario)}))};
}
const hrTxt=(x)=>x.aberto?[x.t1,x.t2].filter(Boolean).map(t=>`${t[0]}-${t[1]}`).join(', '):'fechado';
function hrLer(){
  if(!HR) return null;
  const out=Object.fromEntries(HR_DIAS.map(([d])=>[d,hrTxt(HR.dias[d])]));
  const ex={}; for(const e of HR.excecoes){ if(e.data) ex[e.data]={horario:hrTxt(e),...(e.nome.trim()?{nome:e.nome.trim()}:{})}; }
  if(Object.keys(ex).length) out.excecoes=ex;
  return out;
}
function hrSet(caminho,v){ const [a,b,c,dd]=caminho.split('.'); let o=a==='d'?HR.dias[b]:HR.excecoes[Number(b)];
  if((c==='t1'||c==='t2')&&dd!==undefined){ o[c]=o[c]||['08:00','18:00']; o[c][Number(dd)]=v; } else o[c]=v; }
function hrRedesenhar(){ const el=document.getElementById('bcHorDias'); if(el) el.innerHTML=hrHtml(); }
function hrTurno(t,cam,rot){ const vira=t&&t[1]<=t[0];
  return `<span class="hr-turno"><input type="time" value="${esc(t[0])}" aria-label="${rot} início" onchange="hrSet('${cam}.0',this.value);hrRedesenhar()"><span>às</span>
    <input type="time" value="${esc(t[1])}" aria-label="${rot} fim" onchange="hrSet('${cam}.1',this.value);hrRedesenhar()">${vira?'<em title="Termina depois da meia-noite">até a madrugada</em>':''}</span>`; }
function hrLinha(x,cam,rot,extra=''){
  return `<div class="hr-linha${x.aberto?'':' off'}">${extra}
    <label class="hr-aberto"><input type="checkbox" ${x.aberto?'checked':''} onchange="hrSet('${cam}.aberto',this.checked);hrRedesenhar()"><span>${x.aberto?'Aberto':'Fechado'}</span></label>
    ${x.aberto?`${hrTurno(x.t1,cam+'.t1',rot)}${x.t2?`<span class="hr-e">e</span>${hrTurno(x.t2,cam+'.t2',rot+' 2º turno')}${bi('fechar','Tirar o 2º turno',`hrSet('${cam}.t2',null);hrRedesenhar()`)}`
      :botao({t:'2º turno',ic:'mais',v:'g',sz:'xs',on:`hrSet('${cam}.t2',['13:00','18:00']);hrRedesenhar()`,tit:'Ex.: fecha no almoço e volta à tarde'})}`:''}</div>`;
}
function hrHtml(){
  const hoje=new Date().toISOString().slice(0,10);
  return `<div class="hr-semana">${HR_DIAS.map(([d,n])=>hrLinha(HR.dias[d],'d.'+d,n,`<b class="hr-dia">${n}</b>`)).join('')}</div>
    <div class="hr-atalhos">${botao({t:'Copiar segunda para os dias úteis',ic:'copiar',v:'g',sz:'xs',on:'hrCopiarUteis()'})}${botao({t:'Horário comercial',ic:'relogio',v:'g',sz:'xs',on:'hrComercial()',tit:'Seg a sex 08:00–18:00, sáb 08:00–12:00, dom fechado'})}</div>
    <div class="hr-esp"><b>Datas especiais</b><small class="hint">Feriado, recesso ou dia com horário diferente — vale no lugar do dia da semana.</small>
      ${HR.excecoes.length?HR.excecoes.map((e,i)=>hrLinha(e,'e.'+i,e.nome||'data',
        `<input type="date" class="hr-data" value="${esc(e.data)}" min="${hoje}" onchange="hrSet('e.${i}.data',this.value)" aria-label="Data">
         <input class="hr-nome" value="${esc(e.nome)}" placeholder="Ex.: Natal" maxlength="40" oninput="hrSet('e.${i}.nome',this.value)">`)
        .replace('</div>',`${bi('excluir','Remover esta data',`HR.excecoes.splice(${i},1);hrRedesenhar()`,'dan')}</div>`)).join(''):'<p class="hint">Nenhuma data especial.</p>'}
      <div class="hr-atalhos">${botao({t:'Adicionar data',ic:'mais',v:'s',sz:'xs',on:"HR.excecoes.push({data:'',nome:'',aberto:false,t1:['08:00','12:00'],t2:null});hrRedesenhar()"})}
        ${botao({t:`Feriados nacionais de ${new Date().getFullYear()}`,ic:'gerar',v:'g',sz:'xs',on:'hrFeriados()',tit:'Adiciona os feriados nacionais que ainda vão acontecer, como fechado'})}</div></div>`;
}
function hrCopiarUteis(){ const s=HR.dias.seg; ['ter','qua','qui','sex'].forEach(d=>HR.dias[d]={aberto:s.aberto,t1:[...s.t1],t2:s.t2?[...s.t2]:null}); hrRedesenhar(); flash('Segunda copiada para terça a sexta.','ok'); }
function hrComercial(){ HR_DIAS.forEach(([d])=>HR.dias[d]={aberto:d!=='dom',t1:d==='sab'?['08:00','12:00']:['08:00','18:00'],t2:null}); hrRedesenhar(); }
/* Pascoa (algoritmo de Meeus) -> Carnaval, Sexta-feira Santa e Corpus Christi. */
function hrFeriados(){
  const a=new Date().getFullYear(), f=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).toISOString().slice(0,10);
  const A=a%19,B=Math.floor(a/100),C=a%100,D=Math.floor(B/4),E=B%4,F=Math.floor((B+8)/25),G=Math.floor((B-F+1)/3),H=(19*A+B-D-G+15)%30,I=Math.floor(C/4),K=C%4,L=(32+2*E+2*I-H-K)%7,M=Math.floor((A+11*H+22*L)/451);
  const mes=Math.floor((H+L-7*M+114)/31), dia=((H+L-7*M+114)%31)+1, pascoa=Date.UTC(a,mes-1,dia), mais=(n)=>new Date(pascoa+n*86400000).toISOString().slice(0,10);
  const lista=[[f(a,1,1),'Confraternização'],[mais(-47),'Carnaval'],[mais(-2),'Sexta-feira Santa'],[f(a,4,21),'Tiradentes'],[f(a,5,1),'Dia do Trabalho'],[mais(60),'Corpus Christi'],
    [f(a,9,7),'Independência'],[f(a,10,12),'Nossa Senhora Aparecida'],[f(a,11,2),'Finados'],[f(a,11,15),'Proclamação da República'],[f(a,11,20),'Consciência Negra'],[f(a,12,25),'Natal']];
  const hoje=new Date().toISOString().slice(0,10); let n=0;
  for(const [data,nome] of lista){ if(data<hoje||HR.excecoes.some(e=>e.data===data)) continue; HR.excecoes.push({data,nome,aberto:false,t1:['08:00','12:00'],t2:null}); n++; }
  HR.excecoes.sort((x,y)=>x.data.localeCompare(y.data)); hrRedesenhar();
  flash(n?`${n} feriado(s) adicionado(s) como fechado — ajuste se for abrir em algum.`:'Os feriados que faltam deste ano já estão na lista.','ok');
}

/* ---------- telas ---------- */
/* A tela de abertura tinha quatro números e duas listas soltas, terminando num
   vão branco. Agora ela responde três perguntas em ordem: como está a operação
   (números), o que está ligado (integrações × pendências) e pra onde ir agora
   (atalhos). Os atalhos são as MESMAS rotas do menu — nenhuma tela nova. */
/**
 * Trilha de um canal. `canal` vazio mostra tudo — util enquanto so existe um.
 * Evento sem canal declarado entra no WhatsApp, que e de onde vieram todos ate
 * hoje: escondê-lo seria pior que classificá-lo com uma suposição declarada.
 */
/* ── Auditor do canal no padrão de mercado ───────────────────────────────────
   Camada 1: desempenho (TPR, TMA, SLA, CSAT, resolução pelo bot) com variação
   sobre o período anterior e gráficos padrão. Camada 2: log de auditoria.
   Gráficos em SVG próprio: paleta validada (azul = bot, laranja = equipe),
   marcas finas, dica no hover e "ver dados" em tabela. */
let AUDC={}, AUDC_LOG=false, AUDC_DIAS=30, AUDC_TIPO='', AUDC_Q='', AUDC_PAG=0;
async function carregarAuditorCanal(canal,forcar){
  const k=canal+':'+AUDC_DIAS; if(AUDC[k]&&!forcar) return AUDC[k];
  try{ AUDC[k]=await apiCru(`auditor/canal?canal=${canal}&dias=${AUDC_DIAS}`); }catch(e){ AUDC[k]={erro:e.message}; }
  if(rota===(canal==='telegram'?'tg-auditor':'wa-auditor')) render();
  return AUDC[k];
}
const audFmtMin=(m)=>m==null?'—':m<1?'< 1 min':m<60?`${String(Math.round(m*10)/10).replace('.',',')} min`:`${Math.floor(m/60)} h ${Math.round(m%60)} min`;
const audPct=(x)=>x==null?'—':`${Math.round(x*100)}%`;
/* Variação: seta + texto; a COR diz se melhorou (tempo menor é melhor). */
function audDelta(v,menorMelhor){
  if(v==null) return '<span class="aud-delta">sem base anterior</span>';
  const bom=menorMelhor?v<0:v>0, zero=Math.abs(v)<0.005;
  return `<span class="aud-delta ${zero?'':bom?'bom':'ruim'}">${zero?'=':v>0?'▲':'▼'} ${Math.abs(Math.round(v*100))}% <small>vs período anterior</small></span>`;
}
function audKpi(rot,val,sub,delta,dica){ return `<div class="aud-kpi" title="${esc(dica||'')}"><small>${rot}</small><b>${val}</b><span class="aud-sub">${sub||''}</span>${delta||''}</div>`; }
function audBarrasDia(serie){
  const W=720,H=200,PB=22,PL=28, max=Math.max(1,...serie.map(x=>x.bot+x.equipe)), n=serie.length, passo=(W-PL)/n, bw=Math.min(36,Math.max(3,passo-3)), off=(passo-bw)/2;
  const y=(v)=>H-PB-(v/max)*(H-PB-10);
  const ticks=[0,Math.ceil(max/2),max];
  const barras=serie.map((x,i)=>{ const X=PL+i*passo+off, yb=y(x.bot), ye=y(x.bot+x.equipe), dt=x.dia.split('-').reverse().slice(0,2).join('/');
    const tip=`${dt} · ${x.bot+x.equipe} atendimento(s) — bot ${x.bot} · equipe ${x.equipe}`;
    return `<g class="aud-hit" data-tip="${esc(tip)}"><rect x="${X-1}" y="0" width="${bw+2}" height="${H-PB}" fill="transparent"/>
      ${x.bot?`<rect x="${X}" y="${yb}" width="${bw}" height="${H-PB-yb}" rx="2" fill="var(--s1)"/>`:''}
      ${x.equipe?`<rect x="${X}" y="${ye}" width="${bw}" height="${Math.max(0,yb-ye-2)}" rx="2" fill="var(--s2)"/>`:''}</g>`; }).join('');

function visIntegracoes(){

/* Barra de distribuição: quanto de cada etapa no total em aberto. Os tons giram
   na régua --t1..--t6 pra duas etapas vizinhas nunca saírem da mesma cor. */
function funilBarra(){
  const et=ST.resumo.etapas.filter(e=>e.leads>0);
  const total=et.reduce((s,e)=>s+e.leads,0);
  if(!total) return '';
  const tom=(i)=>`var(--t${(i%6)+1})`;
  return `<div class="card" style="margin-bottom:16px">
    ${cardH('visao','Onde os leads estão','Distribuição do que está em aberto, por etapa.',1,
      `<span class="badge b-ac">${total} em aberto</span>`)}
    <div class="funil-barra">${et.map((e,i)=>
      `<i style="width:${(e.leads/total*100).toFixed(1)}%;background:${tom(i)}" title="${esc(e.etapa)}: ${e.leads}"></i>`).join('')}</div>
    <div class="funil-leg">${et.map((e,i)=>
      `<div><span class="pt" style="background:${tom(i)}"></span>${esc(e.etapa)} <b>${e.leads}</b>
        <small>${Math.round(e.leads/total*100)}%${e.valor?' · '+brl(e.valor):''}</small></div>`).join('')}</div></div>`;
}

/* ---- Clientes e licenças ----
   A carteira da Veloso Solution: cadastro → contrato → assinatura gov.br →
   cobrança → chave no WhatsApp. A regra mora em engine/vsclientes; esta tela
   só desenha e manda. Cada passo diz o que falta, na ordem em que acontece. */
const reais=(c)=>c==null?'—':(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dataBr=(iso)=>iso?new Date(iso).toLocaleDateString('pt-BR'):'—';
const TOM_SIT={ativo:'b-ok',vencendo:'b-warn',vencido:'b-err',aguardando_pagamento:'b-warn',assinado:'b-ok',contrato_gerado:'b-warn',cadastrado:''};

/* ── Clientes e licenças: abas Carteira | Preços ─────────────────────────── */
let CLI_ABA='carteira', CLI_FILTRO='todos', CLI_Q='', PRECOS=null;
const MODS_CLI=[['whatsapp','WhatsApp'],['telegram','Telegram'],['redes','Redes sociais'],['combo','WhatsApp + Redes'],['sob','Sob consulta']];
const FILTROS_CLI=[['todos','Todos',()=>true],['cadastro','Em cadastro',c=>['cadastrado','contrato_gerado','assinado'].includes(c.situacao.codigo)],
  ['aguardando','Aguardando pagamento',c=>c.situacao.codigo==='aguardando_pagamento'],['ativos','Ativos',c=>c.situacao.codigo==='ativo'],
  ['vencendo','Vencendo',c=>c.situacao.codigo==='vencendo'],['vencidos','Vencidos',c=>c.situacao.codigo==='vencido']];
const MESES_CICLO={mensal:1,semestral:6,anual:12};
/* Valor/mês: o do CONTRATO (é o que se cobra); sem contrato, o da tabela. */
function valorMesCliente(c){
  const k=(c.contratos||[]).at(-1);
  if(k?.valorCiclo) return {v:Math.round(k.valorCiclo/(MESES_CICLO[k.ciclo]||1)),fonte:'contrato'};
  let m=0; for(const code of c.produtos||[]){ const o=(CLIENTES?.ofertas||[]).find(x=>x.code===code); if(!o) continue;
    m+=o.sobConsulta?(c.valorCombinadoMensal||0):(c.ciclo==='semestral'?o.semestralMensal:c.ciclo==='anual'?o.anualMensal:o.mensal)||0; }
  return {v:m||null,fonte:'tabela'};
}

  return `<div class="seg seg-mod" role="tablist">${[['carteira','Carteira'],['precos','Preços']].map(([k,n])=>`<button role="tab" class="${CLI_ABA===k?'on':''}" onclick="CLI_ABA='${k}';${k==='precos'?'carregarPrecos();':''}render()">${n}</button>`).join('')}</div>`;
}

  if(PRECOS.erro) return `<div class="card"><p class="hint">Não consegui carregar: ${esc(PRECOS.erro)}</p></div>`;
  const desc=Math.round((PRECOS.ciclos?.semestral?.desconto||0)*100);
  const n=(x)=>x==null?'':String(x);
  const secao=([mod,nome])=>{
    const ps=PRECOS.planos.filter(p=>p.module===mod).sort((a,b)=>a.monthly_price-b.monthly_price);
    if(!ps.length) return '';
    const redes=['redes','combo'].includes(mod);

const centavos=(t)=>{ const x=String(t||'').trim().replace(/\./g,'').replace(',','.'); return x===''?null:Math.round(Number(x)*100); };
async function salvarPrecos(mod){
  const linhas=[...document.querySelectorAll(`.pr-mod[data-mod="${mod}"] tr[data-code]`)];
  const msgs=[];
  try{
    for(const tr of linhas){
      const code=tr.dataset.code, p=PRECOS.planos.find(x=>x.code===code), v=(k)=>tr.querySelector(`[data-k="${k}"]`);
      const num=(k)=>{ const e=v(k); if(!e) return p[k]; return e.value===''?null:Number(e.value); };
      const preco=centavos(v('monthly_price').value);
      if(preco==null||!Number.isFinite(preco)||preco<0) throw new Error(`preço do ${p.nome} inválido`);
      const gb=v('storage_limit_mb').value;
      const m={monthly_price:preco,attendants:num('attendants'),products_limit:num('products_limit'),campaigns_limit:num('campaigns_limit'),
        storage_limit_mb:gb===''?null:Math.round(Number(gb)*1024),social_accounts:num('social_accounts'),
        auditor_enabled:v('auditor_enabled').checked,destaque:v('destaque').checked};
      const antes={monthly_price:p.monthly_price,attendants:p.attendants??null,products_limit:p.products_limit??null,campaigns_limit:p.campaigns_limit??null,
        storage_limit_mb:p.storage_limit_mb??null,social_accounts:p.social_accounts??null,auditor_enabled:!!p.auditor_enabled,destaque:!!p.destaque};
      if(JSON.stringify(antes)===JSON.stringify({...m,social_accounts:m.social_accounts??null})) continue;
      const r=await api('precos/plano',{code,mudancas:m});
      msgs.push(r.versionado?`${p.nome}: versão nova para vendas novas (quem assinou fica em ${reais(p.monthly_price)})`:`${p.nome} salvo`);
    }
    flash(msgs.length?msgs.join(' · '):'Nada mudou.','ok');
    await Promise.all([carregarPrecos(),(async()=>{CKCFG=await api('checkout/config').catch(()=>CKCFG);CLIENTES=await api('clientes').catch(()=>CLIENTES);})()]);
    render();
  }catch(e){ avisoErro('Não consegui salvar os preços',esc(e.message)); }
}
async function salvarAdendosPreco(){
  try{
    await api('precos/adicional',{code:'atendente-extra',monthly_price:centavos(document.getElementById('prAt').value)});
    await api('precos/adicional',{code:'banda-extra',monthly_price:centavos(document.getElementById('prBd').value),gb:document.getElementById('prBdGb').value});
    flash('Adendos salvos.','ok'); await carregarPrecos();
  }catch(e){ avisoErro('Não consegui salvar os adendos',esc(e.message)); }
}

function planoPadrao(mod){ const os=(CLIENTES?.ofertas||[]).filter(o=>o.catalogo&&o.ativo!==false&&o.modulo===mod).sort((a,b)=>a.mensal-b.mensal); return (os.find(o=>o.destaque)||os[0])?.code||null; }

/* Mesma soma do servidor (liberacoesPadrao): o formulário já nasce com o que
   os produtos incluem, e quem cadastra ajusta. */
function padraoLib(codes){
  const b={operadores:0,campanhasMes:0,auditor:false,botFunil:false,bandaGbMes:0,redes:[]};
  for(const code of codes){ const o=(CLIENTES?.ofertas||[]).find(x=>x.code===code); if(!o) continue; const l=o.liberacoes;
    b.operadores+=l.operadores; b.campanhasMes+=l.campanhasMes; b.bandaGbMes+=l.bandaGbMes;
    b.auditor=b.auditor||l.auditor; b.botFunil=b.botFunil||l.botFunil; b.redes=[...new Set([...b.redes,...l.redes])]; }
  return b;
}

function lerFormCliente(){

function resumoPreco(f){
  const anual=f.ciclo==='anual'; let mensal=0, cheio=0;
  for(const code of f.produtos||[]){ const o=CLIENTES.ofertas.find(x=>x.code===code); if(!o) continue;
    if(o.sobConsulta){ if(!f.valorCombinadoMensal) return '<span class="hint">informe o valor combinado do produto sob consulta</span>';
      mensal+=f.valorCombinadoMensal; cheio+=f.valorCombinadoMensal; continue; }
    const m=anual?o.anualMensal:f.ciclo==='semestral'?o.semestralMensal:o.mensal;
    if(m==null) return `<span class="hint">${esc(o.nome)} não tem ciclo ${f.ciclo}</span>`;
    mensal+=m; cheio+=o.mensal; }
  if(!(f.produtos||[]).length) return '<span class="hint">escolha ao menos um produto</span>';
  if(f.ciclo==='semestral') return `<b>${reais(mensal)}/mês</b> · cobrança semestral de <b>${reais(mensal*6)}</b> <small class="hint">(economiza ${reais((cheio-mensal)*6)} no semestre)</small>`;
  return anual
    ?`<b>${reais(mensal)}/mês</b> · cobrança anual de <b>${reais(mensal*12)}</b> <small class="hint">(economiza ${reais((cheio-mensal)*12)} no ano)</small>`
    :`<b>${reais(mensal)}/mês</b> · cobrado todo mês`;
}
