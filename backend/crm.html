<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolso Cheio — Veloso Solution</title>
<script>/* Noite e o padrao; o claro fica pra quem escolher. Roda antes do CSS pintar. */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('vs-tema')||'dark');}catch{document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="icon" type="image/png" href="/crm/favicon.png?v=1">
<link rel="apple-touch-icon" href="/crm/simbolo.png?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EVS%3C/text%3E%3C/svg%3E">
<style>
/* ── Sistema visual do console ────────────────────────────────────────────
   Antes era grafite em tudo: correto, mas plano — a tela inteira tinha o mesmo
   peso e nada puxava o olho. Agora existe UMA tinta de marca (índigo, a mesma
   do favicon e do painel de entrada) que marca o que é ação e o que está ativo,
   mais uma régua de tons (teal/violeta/âmbar/rosa) que só os indicadores usam,
   pra um número não parecer o outro. Cor de estado (ok/atenção/erro) continua
   significando estado, nunca decoração.

   Profundidade é em três degraus e só isso: repouso (sh-1), card (sh-2) e o que
   flutua por cima (sh-3). Sem borda grossa, sem sombra dura. */
:root{
  --serie-receita:#059669;
  --bg:#f7f7f9; --panel:#fff; --panel-2:#fcfcfd; --raised:#f4f4f6; --line:#e6e6eb; --line-2:#d3d3dc;
  --fg:#16161c; --muted:#56565f; --dim:#9a9aa6;
  --ink:#16161c; --ink-fg:#fff;

  /* Tinta da marca */
  --ac:#4f46e5; --ac-2:#6366f1; --ac-3:#818cf8; --ac-fg:#fff;
  --ac-soft:#eef1ff; --ac-line:#c9cffb; --ac-glow:rgba(79,70,229,.32);

  /* Régua de tons — só indicadores e chips de seção */
  --t1:#4f46e5; --t1-bg:#eef1ff; --t2:#0d9488; --t2-bg:#e9f8f5;
  --t3:#7c3aed; --t3-bg:#f3edff; --t4:#c2410c; --t4-bg:#fff1e9;
  --t5:#be123c; --t5-bg:#ffeef2; --t6:#0369a1; --t6-bg:#e9f4fd;

  --ok:#15803d; --ok-bg:#effaf2; --ok-line:#b7e9c6;
  --warn:#b45309; --warn-bg:#fdf7e8; --warn-line:#f4dfa3;
  --err:#b91c1c; --err-bg:#fdf1f1; --err-line:#f6c7c7;

  --r:14px; --r-sm:10px; --r-xs:8px; --sidebar:252px;
  --sh-1:0 1px 2px rgba(20,20,35,.05);
  --sh-2:0 1px 2px rgba(20,20,35,.05), 0 6px 16px -10px rgba(20,20,35,.2);
  --sh-3:0 2px 6px -2px rgba(20,20,35,.1), 0 18px 40px -18px rgba(20,20,35,.32);
  --sh-ac:0 1px 2px rgba(20,20,35,.14), 0 8px 18px -10px var(--ac-glow);
  --shadow:var(--sh-1); --shadow-2:var(--sh-3); /* nomes antigos, ainda usados na entrada */
  color-scheme:light;
}
/* aninhar @media dentro da regra depende de CSS Nesting; versao plana funciona em todo lugar */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0a0d; --panel:#131318; --panel-2:#16161c; --raised:#1d1d24; --line:#292930; --line-2:#3d3d46;
  --fg:#f7f7f9; --muted:#a3a3ae; --dim:#71717e;
  --ink:#f7f7f9; --ink-fg:#16161c;
  --ac:#7c7cf5; --ac-2:#8f8cf8; --ac-3:#a5a2fb; --ac-fg:#fff;
  --ac-soft:rgba(124,124,245,.14); --ac-line:rgba(124,124,245,.32); --ac-glow:rgba(99,102,241,.45);
  --t1:#a5b4fc; --t1-bg:rgba(129,140,248,.14); --t2:#5eead4; --t2-bg:rgba(45,212,191,.13);
  --t3:#c4b5fd; --t3-bg:rgba(167,139,250,.14); --t4:#fdba74; --t4-bg:rgba(251,146,60,.13);
  --t5:#fda4af; --t5-bg:rgba(251,113,133,.13); --t6:#7dd3fc; --t6-bg:rgba(56,189,248,.13);
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.12); --ok-line:rgba(34,197,94,.3);
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.12); --warn-line:rgba(245,158,11,.3);
  --err:#f87171; --err-bg:rgba(239,68,68,.12); --err-line:rgba(239,68,68,.3);
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.8);
  --sh-3:0 2px 6px -2px rgba(0,0,0,.6), 0 18px 40px -18px rgba(0,0,0,.9);
  --sh-ac:0 1px 2px rgba(0,0,0,.5), 0 8px 18px -10px var(--ac-glow);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0a0d; --panel:#131318; --panel-2:#16161c; --raised:#1d1d24; --line:#292930; --line-2:#3d3d46;
  --fg:#f7f7f9; --muted:#a3a3ae; --dim:#71717e;
  --ink:#f7f7f9; --ink-fg:#16161c;
  --ac:#7c7cf5; --ac-2:#8f8cf8; --ac-3:#a5a2fb; --ac-fg:#fff;
  --ac-soft:rgba(124,124,245,.14); --ac-line:rgba(124,124,245,.32); --ac-glow:rgba(99,102,241,.45);
  --t1:#a5b4fc; --t1-bg:rgba(129,140,248,.14); --t2:#5eead4; --t2-bg:rgba(45,212,191,.13);
  --t3:#c4b5fd; --t3-bg:rgba(167,139,250,.14); --t4:#fdba74; --t4-bg:rgba(251,146,60,.13);
  --t5:#fda4af; --t5-bg:rgba(251,113,133,.13); --t6:#7dd3fc; --t6-bg:rgba(56,189,248,.13);
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.12); --ok-line:rgba(34,197,94,.3);
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.12); --warn-line:rgba(245,158,11,.3);
  --err:#f87171; --err-bg:rgba(239,68,68,.12); --err-line:rgba(239,68,68,.3);
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.8);
  --sh-3:0 2px 6px -2px rgba(0,0,0,.6), 0 18px 40px -18px rgba(0,0,0,.9);
  --sh-ac:0 1px 2px rgba(0,0,0,.5), 0 8px 18px -10px var(--ac-glow);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--ac-soft);color:var(--ac)}
a{color:var(--ac);text-underline-offset:2px}
a:hover{text-decoration:none}

.shell{display:flex;min-height:100vh}

/* ── Barra lateral ─────────────────────────────────────────────────────── */
aside{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:11px;padding:17px 16px;border-bottom:1px solid var(--line)}
.mark{width:32px;height:32px;border-radius:10px;flex:0 0 32px;display:grid;place-items:center;font-weight:750;font-size:12px;
  letter-spacing:-.03em;background:linear-gradient(145deg,var(--ac-2),var(--ac));color:var(--ac-fg);
  box-shadow:var(--sh-ac)}
/* O simbolo entra como IMAGEM, entao nao leva o fundo em degrade nem a sombra
   que existiam pra dar corpo as duas letras. Com eles, a logo ficava colada num
   quadrado colorido que briga com ela. */
.mark-img{background:none;box-shadow:none;border-radius:0;object-fit:contain;
  width:34px;height:34px;flex:0 0 34px}
/* Logo da tela de entrada: manda na largura e deixa a altura seguir, senao ela
   estica em tela estreita. */
.entrar-logo{display:block;width:min(260px,72vw);height:auto;margin:0 auto 6px}
/* Titulo que so o leitor de tela ve: a marca esta na imagem, mas a pagina nao
   pode ficar sem <h1> pra quem navega por audio. */
.sr-oculto{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* GRADE DE CANAIS. `auto-fill` com minimo de 232px: no celular vira uma coluna,
   no monitor enche a largura sem esticar cartao. */
.g-canais{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));margin-top:12px}
.canal{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--panel);
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.canal:hover{border-color:var(--ac);transform:translateY(-1px)}
/* Canal que ainda nao existe nao pisca nem convida o clique. */
.canal-breve{opacity:.62}
.canal-breve:hover{border-color:var(--line);transform:none}
.canal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.canal-h b{font-size:13.5px;letter-spacing:-.01em}
.canal-ic{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;border-radius:8px;
  background:var(--t2-bg);color:var(--t2)}
.canal-ic svg{width:15px;height:15px}
.canal .hint{margin:0;flex:1}
.canal-a{margin-top:2px}
.canal-a .btn{width:100%;justify-content:center}
/* Quem chegou pelo "Configurar" precisa ver ONDE chegou. */
.piscou>.card{outline:2px solid var(--ac);outline-offset:3px;border-radius:14px;
  transition:outline-color .6s ease}
.sair{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--mut);
  font:inherit;font-size:12.5px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.sair:hover{background:var(--err-bg,rgba(220,38,38,.08));color:var(--err,#dc2626);border-color:currentColor}
.sair svg{width:15px;height:15px;flex:0 0 15px}
.sair.trocar:hover{background:var(--bg-2,rgba(79,70,229,.08));color:var(--fg);border-color:var(--line-2,currentColor)}
.brand b{display:block;font-size:13.5px;line-height:1.3;letter-spacing:-.015em}
.brand span{display:block;font-size:11px;color:var(--dim)}
nav{flex:1;overflow-y:auto;padding:10px 10px 4px}
.sec-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:15px 9px 6px;font-weight:700}
/* O item ativo ganha tinta + uma barra na borda esquerda: em menu comprido,
   a barra é o que se acha de relance, a cor confirma. */
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:var(--r-sm);
  color:var(--muted);font-size:13.5px;text-align:left;transition:background .14s,color .14s}
.nav-item:hover{background:var(--raised);color:var(--fg)}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.65;transition:opacity .14s,color .14s}
.nav-item:hover svg{opacity:.9}
.nav-item.active{background:var(--ac-soft);color:var(--ac);font-weight:650}
.nav-item.active svg{opacity:1;color:var(--ac)}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;
  border-radius:0 3px 3px 0;background:var(--ac)}
.chev{margin-left:auto;transition:transform .18s;opacity:.45}
.nav-item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.submenu{overflow:hidden;max-height:0;transition:max-height .22s ease}
.submenu.open{max-height:340px}
.sub-item{display:block;width:100%;padding:6.5px 9px 6.5px 34px;border-radius:var(--r-sm);color:var(--dim);
  font-size:12.8px;text-align:left;position:relative;transition:color .14s,background .14s}
.sub-item::before{content:'';position:absolute;left:18px;top:2px;bottom:2px;width:1.5px;background:var(--line);border-radius:2px}
.sub-item:hover{color:var(--fg);background:var(--raised)}
.sub-item.active{color:var(--ac);font-weight:650}
.sub-item.active::before{background:var(--ac)}
.side-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--panel-2)}
.env{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-sm);background:var(--raised);
  border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--dim)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.env small{font-size:11px;color:var(--dim);line-height:1.3}
.env b{display:block;color:var(--fg);font-size:11.5px;font-weight:650}
.theme{display:flex;gap:3px;padding:3px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm)}
.theme button{flex:1;padding:6px;border-radius:7px;font-size:11.5px;color:var(--dim);display:flex;align-items:center;
  justify-content:center;gap:6px;transition:background .14s,color .14s}
.theme button svg{width:13px;height:13px}
.theme button:hover{color:var(--fg)}
.theme button.on{background:var(--panel);color:var(--fg);font-weight:650;box-shadow:var(--sh-1)}

/* ── Topo e área de conteúdo ───────────────────────────────────────────── */
main{flex:1;min-width:0;display:flex;flex-direction:column}
/* O topo fica translúcido com desfoque: a tela rola por baixo dele e continua
   legível, sem virar uma tarja opaca cortando o conteúdo. */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:11px 26px;
  padding-top:calc(11px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px) saturate(1.6);
  -webkit-backdrop-filter:blur(12px) saturate(1.6)}
.burger{display:none;padding:7px;border-radius:var(--r-xs);border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.crumb{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.crumb i{opacity:.45;font-style:normal}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:550;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap;box-shadow:var(--sh-1)}
.content{padding:26px;max-width:1440px;width:100%;margin:0 auto;flex:1}

/* Cabeçalho de página: sobrancelha em tinta, título grande, texto de apoio.
   A sobrancelha existe pra dizer ONDE a pessoa está sem ela reler o menu. */
.page-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.page-head .ph-txt{min-width:0;flex:1}
.page-head .eyebrow{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ac);margin-bottom:7px}
.page-head .eyebrow::before{content:'';width:14px;height:2px;border-radius:2px;background:var(--ac)}
.page-head h1{font-size:25px;letter-spacing:-.03em;font-weight:680;line-height:1.2}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:74ch;line-height:1.55}
.page-head .ph-acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* ── Cartões ───────────────────────────────────────────────────────────── */
.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--sh-2)}
.card h3{font-size:14px;font-weight:680;margin-bottom:3px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.card .hint{color:var(--dim);font-size:12.5px;line-height:1.5}
/* Chip de ícone: identifica o bloco de longe e é onde entra o tom. */
.chip{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;
  background:var(--ct-bg,var(--t1-bg));color:var(--ct,var(--t1));border:1px solid transparent}
.chip svg{width:16px;height:16px}
.card-h{display:flex;align-items:flex-start;gap:11px;margin:-2px 0 14px}
.card-h .card-h-t{min-width:0;flex:1}
.card-h h3{margin-bottom:2px}
.card-h .card-h-a{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* Indicador: rótulo, número grande e a linha que explica de onde ele vem.
   A faixa de tom no topo é o que faz quatro deles lado a lado pararem de
   parecer a mesma caixa repetida quatro vezes. */
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh-2);
  transition:box-shadow .18s,transform .18s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--kt,var(--t1)),transparent 88%)}
.kpi:hover{box-shadow:var(--sh-3);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.075em;color:var(--dim);font-weight:700}
.kpi .chip{width:28px;height:28px;flex:0 0 28px;border-radius:8px;margin-left:auto;
  background:var(--kt-bg,var(--t1-bg));color:var(--kt,var(--t1))}
.kpi .chip svg{width:15px;height:15px}
.kpi b{display:block;font-size:28px;font-weight:680;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:5px;line-height:1.4}

/* ── Estado vazio ──────────────────────────────────────────────────────── */
.empty{text-align:center;padding:46px 24px;border:1px solid var(--line);border-radius:var(--r);
  background:radial-gradient(120% 90% at 50% 0%,var(--ac-soft),transparent 62%),var(--panel);box-shadow:var(--sh-2)}
.empty .ico{width:52px;height:52px;border-radius:15px;margin:0 auto 15px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--ac-2),var(--ac));color:var(--ac-fg);box-shadow:var(--sh-ac)}
.empty .ico svg{width:24px;height:24px}
.empty h3{font-size:16px;margin-bottom:6px;font-weight:680;letter-spacing:-.02em}
.empty p{color:var(--muted);font-size:13px;max-width:56ch;margin:0 auto 18px;line-height:1.6}
.steps{text-align:left;max-width:540px;margin:0 auto;display:grid;gap:8px}
.step{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 13px;box-shadow:var(--sh-1)}
.step .n{width:21px;height:21px;flex:0 0 21px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:750;
  background:var(--ac-soft);color:var(--ac);border:1px solid var(--ac-line)}
.step div{font-size:12.5px;color:var(--muted);line-height:1.55}

/* ── Linha de estado ───────────────────────────────────────────────────── */
.stat-row{display:flex;align-items:center;gap:12px;padding:11px 8px;margin:0 -8px;border-bottom:1px solid var(--line);
  border-radius:var(--r-xs);transition:background .14s}
.stat-row:hover{background:var(--raised)}
.stat-row:last-child{border-bottom:0}
.stat-row .lbl{font-size:13px;min-width:0;font-weight:550}
.stat-row .lbl small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;font-weight:400}
.stat-row .btn,.stat-row .acoes{margin-left:auto}
.badge{margin-left:auto;font-size:11px;font-weight:650;padding:4px 10px;border-radius:99px;white-space:nowrap;
  border:1px solid var(--line);color:var(--muted);background:var(--raised)}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.b-err{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.b-ac{background:var(--ac-soft);color:var(--ac);border-color:var(--ac-line)}

/* ── Funil ─────────────────────────────────────────────────────────────── */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--r);
  min-width:272px;flex:1 0 272px;padding:13px;box-shadow:var(--sh-2)}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.col-h h3{font-size:12.5px;font-weight:680;letter-spacing:-.01em}
.col-h .n{font-size:11px;font-weight:650;color:var(--ac);background:var(--ac-soft);border:1px solid var(--ac-line);
  border-radius:99px;padding:1px 8px}
.col-h .v{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.lead{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;
  margin-bottom:9px;box-shadow:var(--sh-1);transition:box-shadow .16s,transform .16s,border-color .16s}
.lead:hover{border-color:var(--line-2);box-shadow:var(--sh-2);transform:translateY(-1px)}
.lead .nm{font-weight:680;font-size:13.5px;letter-spacing:-.01em}
.lead .meta{color:var(--dim);font-size:12px;margin:3px 0 9px;word-break:break-word}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:10px;font-weight:650;padding:2.5px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--raised)}
.t-quente{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.t-morno{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.t-frio{background:var(--raised);color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ── Campos ────────────────────────────────────────────────────────────── */
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:8.5px 11px;width:100%;
  transition:border-color .14s,box-shadow .14s;box-shadow:var(--sh-1)}
select:hover,input:hover,textarea:hover{border-color:var(--line-2)}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3.5px var(--ac-soft)}
select{flex:1;min-width:104px;font-size:12.5px;padding:6.5px 9px}
::placeholder{color:var(--dim)}

/* ── Botão: UM modelo, variações por tom e tamanho ─────────────────────────
   Todo botão de texto nasce daqui e todo botão leva ícone — o ícone é o que
   permite achar "Salvar" numa tela cheia sem ler botão por botão. No JS existe
   o atalho `botao({t,ic,v,on})`, que monta exatamente esta marcação.

     v:'p'  ação principal da tela (tinta cheia) — uma por tela
     v:'s'  ação secundária (contorno)
     v:'g'  ação discreta, sem peso visual
     v:'ok' confirma   v:'dan' destrói   v:'no' recusa
     sz:'xs' em linha de tabela/card   sz:'lg' formulário de entrada         */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--r-sm);font-size:13px;font-weight:650;letter-spacing:-.012em;
  border:1px solid transparent;white-space:nowrap;
  transition:transform .12s,box-shadow .18s,background .18s,border-color .18s,color .18s,opacity .18s}
.btn svg{width:15px;height:15px;flex:0 0 15px}
a.btn{text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn:disabled,.btn[disabled]{opacity:.5;pointer-events:none;box-shadow:none}
.btn-p{background:linear-gradient(180deg,var(--ac-2),var(--ac));color:var(--ac-fg);
  box-shadow:var(--sh-ac),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,20,35,.16),0 12px 24px -10px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.26)}
.btn-p:active{transform:translateY(0)}
.btn-s{background:var(--panel);border-color:var(--line);color:var(--fg);box-shadow:var(--sh-1)}
.btn-s:hover{border-color:var(--ac-line);color:var(--ac);background:var(--ac-soft);box-shadow:var(--sh-2)}
.btn-g{background:none;color:var(--muted)}
.btn-g:hover{background:var(--raised);color:var(--fg)}
.btn-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.btn-ok:hover{background:var(--ok);color:#fff;border-color:transparent;box-shadow:var(--sh-2)}
.btn-dan{background:var(--panel);color:var(--err);border-color:var(--err-line)}
.btn-dan:hover{background:var(--err);color:#fff;border-color:transparent;box-shadow:var(--sh-2)}
.btn-no{background:var(--panel);color:var(--dim);border-color:var(--line)}
.btn-no:hover{color:var(--err);border-color:var(--err-line);background:var(--err-bg)}
.btn-xs{padding:5.5px 10px;font-size:11.5px;border-radius:var(--r-xs);gap:5px}
.btn-xs svg{width:13px;height:13px;flex:0 0 13px}
.btn-lg{padding:12px 20px;font-size:14.5px;border-radius:12px}
.btn-lg svg{width:17px;height:17px;flex:0 0 17px}
.btn-block{width:100%}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;align-items:end}
.form-grid > .btn{justify-self:start;align-self:end}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:650}
/* A barra de aviso do topo saiu: era um tarjao sem vida que empurrava a tela
   pra baixo e ficava longe de onde a pessoa clicou. Confirmacao agora e modal
   (quando exige leitura) ou toast (quando e so um "pronto"). */
.overlay{display:none;position:fixed;inset:0;background:rgba(10,10,16,.45);backdrop-filter:blur(2px);z-index:29}

/* ── Tabela ────────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
  padding:10px;font-weight:700;background:var(--raised);border-bottom:1px solid var(--line)}
th:first-child{border-radius:var(--r-xs) 0 0 0}
th:last-child{border-radius:0 var(--r-xs) 0 0}
td{padding:12px 10px;border-top:1px solid var(--line)}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--raised)}
tbody tr:first-child td{border-top:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:5px 5px 5px 12px}
.linkbox span{flex:1;font:12px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Modal. `dialog` nativo daria o backdrop de graca, mas nao fecha no Esc do jeito
   que a gente quer nem centraliza igual em navegador antigo — dois divs resolvem. */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,10,16,.55);backdrop-filter:blur(3px);
  z-index:40;padding:20px;overflow-y:auto}
.modal-bg.show{display:block}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;margin:44px auto;
  box-shadow:var(--sh-3);animation:sobe .18s ease}
@keyframes sobe{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal-h{display:flex;align-items:center;gap:11px;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.02em}
.modal-b{padding:22px}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:15px 22px;border-top:1px solid var(--line);background:var(--panel-2);
  border-radius:0 0 15px 15px}
.x{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;cursor:pointer;padding:2px 7px;border-radius:var(--r-xs);
  transition:background .14s,color .14s}
.x:hover{color:var(--fg);background:var(--raised)}

/* Barra acima da tabela: busca a esquerda, acao primaria a direita. */
.tbl-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tbl-bar input{flex:1;min-width:190px}
.acoes{display:flex;gap:3px;justify-content:flex-end}
/* Botao so de icone. `title` e `aria-label` sao obrigatorios: icone sem nome
   e adivinhacao pra quem chega hoje e barreira pra leitor de tela. */
.bi{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-xs);border:1px solid transparent;
  background:none;color:var(--muted);cursor:pointer;transition:background .14s,color .14s,border-color .14s}
.bi svg{width:16px;height:16px}
.bi:hover{background:var(--ac-soft);color:var(--ac);border-color:var(--ac-line)}
.bi.dan:hover{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.bi.pri:hover{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.bi:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.bi[disabled]{opacity:.3;cursor:default}
.bi[disabled]:hover{background:none;color:var(--muted);border-color:transparent}
.thumb{width:42px;height:42px;border-radius:var(--r-xs);object-fit:cover;display:block;background:var(--raised);
  border:1px solid var(--line)}
.thumb.vazia{background:var(--raised)}
.th-ord{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;
  text-transform:inherit;cursor:pointer;transition:color .14s}
.th-ord:hover{color:var(--ac)}
.pag{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.fotos{display:flex;gap:9px;flex-wrap:wrap;min-height:4px}
.fotos .ft{position:relative;width:78px;height:78px;border-radius:11px;overflow:hidden;
  border:1px solid var(--line);background:var(--bg);box-shadow:var(--sh-1)}
.fotos .ft img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .ft .x{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:7px;
  background:rgba(0,0,0,.62);color:#fff;border:0;font-size:13px;line-height:1;cursor:pointer;padding:0}
.fotos .ft .capa{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.66);color:#fff;
  font-size:9.5px;text-align:center;padding:2.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.fotos .subindo{display:grid;place-items:center;color:var(--dim);font-size:11px}
@media(max-width:640px){.modal{margin:0;border-radius:14px}.modal-b{padding:16px}}

.notas{list-style:none;display:grid;gap:9px;margin:2px 0 0;padding:0}
.notas li{position:relative;padding-left:20px;font-size:13px;color:var(--muted);line-height:1.5}
.notas li::before{content:'';position:absolute;left:5px;top:8px;width:6px;height:6px;border-radius:50%;
  background:var(--ac);opacity:.55}

/* Campo recusado: borda vermelha e o motivo logo embaixo. Mensagem de erro
   longe do campo obriga a pessoa a adivinhar qual deles era. */
input.erro-campo,select.erro-campo,textarea.erro-campo{border-color:var(--err);box-shadow:0 0 0 3.5px var(--err-bg)}
.campo-erro{font-size:12.5px;margin-top:6px;font-weight:550;display:none}
.campo-erro.on{display:block;color:var(--err)}

.toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:grid;gap:10px;width:min(400px,calc(100vw - 32px))}
.toast{--tc:var(--ok);position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
  padding:14px 12px 15px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--sh-3),0 0 0 1px color-mix(in srgb,var(--tc) 10%,transparent);font-size:13px;line-height:1.5;
  animation:t-entra .32s cubic-bezier(.2,.9,.3,1.15) both}
.toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc);box-shadow:0 0 14px var(--tc)}
.toast.t-err{--tc:var(--err);animation:t-entra .32s cubic-bezier(.2,.9,.3,1.15) both,t-treme .42s .3s both}
.toast.t-warn{--tc:var(--warn)} .toast.t-info{--tc:var(--ac)}
.t-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--tc);
  background:color-mix(in srgb,var(--tc) 15%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 6%,transparent)}
.t-ic svg{width:16px;height:16px}
.t-txt{min-width:0;padding-top:4px}
.t-txt b{display:block;font-size:13.5px;font-weight:680;letter-spacing:-.01em;margin-bottom:2px}
.t-corpo{color:var(--muted)} .t-txt b+.t-corpo{font-size:12.5px}
.t-txt b:only-child,.t-corpo:only-child{color:var(--fg)}
.t-txt .notas{margin-top:8px;gap:5px} .t-txt .notas li{font-size:12.5px}
.t-acao{margin-top:9px;font-size:12.5px;font-weight:650;color:var(--ac);padding:5px 11px;border-radius:8px;
  background:var(--ac-soft);border:1px solid var(--ac-line)}
.t-acao:hover{background:var(--ac);color:#fff}
.t-x{width:26px;height:26px;border-radius:8px;color:var(--dim);font-size:18px;line-height:1;display:grid;place-items:center}
.t-x:hover{background:var(--raised);color:var(--fg)}
.t-barra{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--tc);opacity:.55;transform-origin:left;
  animation:t-tempo linear forwards}
.toast:hover .t-barra{animation-play-state:paused}
.toast.saindo{animation:t-sai .23s ease forwards}
@keyframes t-entra{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes t-sai{to{opacity:0;transform:translateX(24px)}}
@keyframes t-tempo{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes t-treme{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media(max-width:640px){.toasts{left:12px;right:12px;bottom:12px;width:auto}}
/* Com modal aberto o aviso sobe: embaixo ele tapava justo o botao Salvar do formulario. */
body:has(#modalBg.show) .toasts{top:20px;bottom:auto}
@media(max-width:640px){body:has(#modalBg.show) .toasts{top:12px}}
@media (prefers-reduced-motion:reduce){.toast,.toast.t-err,.toast.saindo{animation:none}.t-barra{animation-duration:0s!important;display:none}}

/* botao trabalhando: o texto some e um giro ocupa o lugar, no mesmo tamanho */
/* color:transparent e nao visibility: botao montado a mao tem o texto solto, fora de <span>. */
.btn.trabalhando,.bi.trabalhando{pointer-events:none;position:relative;color:transparent!important;--giro:var(--muted)}
.btn-p.trabalhando,.btn-d.trabalhando{--giro:#fff}
.btn.trabalhando > *,.bi.trabalhando > *{visibility:hidden}
.btn.trabalhando::after,.bi.trabalhando::after{content:'';position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;
  border:2px solid var(--giro);border-right-color:transparent;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* perigo: nao existia — o "Excluir" da confirmacao saia sem estilo nenhum */
.btn-d{background:var(--err);color:#fff;box-shadow:0 8px 20px -10px var(--err)}
.btn-d:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* confirmacao: caixa pequena, o que acontece em destaque, perigo em vermelho */
.modal.modal-sm{max-width:440px;margin-top:12vh}
.modal-sm .modal-h{border-bottom:0;padding-bottom:4px}
.modal-sm .modal-f{border-top:0;background:none;padding-top:6px}
.modal-sm .modal-f .btn{flex:1}
.cfm{display:flex;gap:14px;align-items:flex-start}
.cfm-ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;color:var(--ac);background:var(--ac-soft)}
.cfm-ic svg{width:19px;height:19px}
.modal-perigo .cfm-ic{color:var(--err);background:var(--err-bg);box-shadow:0 0 22px -6px var(--err)}
.cfm p{color:var(--muted);font-size:13.5px;line-height:1.55}
.cfm-aviso{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--err-bg);border:1px solid var(--err-line);
  color:var(--err)!important;font-weight:600;font-size:12.5px!important}
[data-theme="dark"] .toast{background:#131d33;border-color:var(--line-2)}

.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted,inherit);font:600 13px inherit;padding:7px 16px;border-radius:999px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--panel);color:var(--txt,inherit);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button em{font-style:normal;font-size:11px;color:var(--muted);margin-left:4px}
.seg-mod{margin-bottom:18px}
.tier-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:16px}
.tier{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px 22px;display:flex;flex-direction:column}
.tier.destaque{border:1.5px solid var(--fg)}
.tier-selo{position:absolute;top:-11px;left:22px;background:var(--fg);color:var(--panel);font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.tier h4{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.tier-preco{margin:10px 0 2px;display:flex;align-items:baseline;gap:5px}
.tier-preco b{font-size:34px;letter-spacing:-.025em;color:var(--fg)}
.tier-preco small{color:var(--muted)}
.tier-sub{margin:0 0 18px;font-size:13px;color:var(--muted)}
.tier-bt{width:100%;justify-content:center}
.tier-lista{list-style:none;margin:20px 0 0;padding:18px 0 0;border-top:1px solid var(--line);display:grid;gap:10px}
.tier-lista li{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--fg)}
.tier-lista li svg{width:15px;height:15px;color:var(--muted);flex:none;margin-top:2px}
.tier-adendo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border:1px dashed var(--line-2);border-radius:var(--r);font-size:14px;color:var(--muted);margin-bottom:18px}
.tier-adendo b{color:var(--fg);font-weight:600}
.tier-teste{color:var(--muted)}
.ck-trilha{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.ck-trilha div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted,#71717a);padding:6px 12px 6px 6px;border-radius:999px;background:var(--raised)}
.ck-trilha span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);font-weight:700;font-size:12px}
.ck-trilha span svg{width:13px;height:13px}
.ck-trilha .agora{color:var(--fg);font-weight:600}.ck-trilha .agora span{background:var(--fg);color:var(--panel)}
.ck-trilha .feito span{background:var(--raised);color:var(--fg)}
.ck-grade{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.ck-grade{grid-template-columns:1fr}}
.ck-resumo{position:sticky;top:76px}.ck-resumo h3{margin:0 0 12px;font-size:15px}
.ck-linha{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.ck-linha.ok{color:var(--ok)}
.ck-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.ck-total b{font-size:24px;letter-spacing:-.02em}
.ck-metodos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.ck-metodos button{display:flex;gap:10px;align-items:center;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:var(--r-sm,10px);background:var(--panel);cursor:pointer;font-family:inherit;color:inherit}
.ck-metodos button.on{border-color:var(--fg)}
.ck-metodos button:disabled{opacity:.5;cursor:not-allowed}
.ck-metodos svg{width:22px;height:22px}.ck-metodos small{display:block;color:var(--muted,#71717a);font-size:12px}
.ck-pix{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-top:14px}
.ck-pix img{border-radius:10px;background:#fff;padding:8px;border:1px solid var(--line)}
.ck-pix>div{flex:1;min-width:220px}
.ck-pix textarea{width:100%;font:12px ui-monospace,monospace;margin-bottom:8px;resize:none}
.ck-espera{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted,#71717a);margin:14px 0 0}
.giro{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:giro .8s linear infinite;flex:none}
@keyframes giro{to{transform:rotate(360deg)}}
.ck-seguro{display:flex;gap:6px;align-items:center;margin:14px 0 0;font-size:12px}.ck-seguro svg{width:14px;height:14px;color:var(--muted)}
.ck-fim{text-align:center;padding:34px 24px}
.ck-fim h2{margin:10px 0 6px;font-size:22px}
.ck-selo{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%}
.ck-selo svg{width:30px;height:30px}
.ck-fim.ok .ck-selo{background:var(--ok-bg);color:var(--ok)}
.ck-fim.warn .ck-selo{background:var(--warn-bg,#fef3c7);color:var(--warn,#b45309)}
.ck-fim.err .ck-selo{background:var(--err-bg);color:var(--err)}
.ck-chave{display:inline-flex;flex-direction:column;gap:4px;margin:16px 0;padding:14px 22px;border:1.5px dashed var(--line-2);border-radius:12px}
.ck-chave b{font:700 22px ui-monospace,monospace;letter-spacing:.06em}
.ck-chave small{color:var(--muted,#71717a)}
.ck-acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ck-espera,.ck-fim .ck-espera{justify-content:center}
.ck-area-l .ck-espera{justify-content:flex-start}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .trilho{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line-2);transition:background .18s;flex:none}
.sw .trilho::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.sw input:checked+.trilho{background:var(--ok)}
.sw input:checked+.trilho::after{transform:translateX(16px)}
.sw input:focus-visible+.trilho{outline:2px solid var(--ok);outline-offset:2px}
.planos-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.plano-card{position:relative;padding:18px 16px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);box-shadow:var(--sh-1);display:flex;flex-direction:column}
.plano-card.destaque{border-color:var(--ac);box-shadow:var(--sh-ac)}
.plano-card.meu{border-color:var(--ok);background:var(--ok-bg)}
.plano-selo{position:absolute;top:-9px;left:16px;font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--ac);color:#fff}
.plano-selo.selo-meu{background:var(--ok)}
.plano-card h4{font-size:15px;font-weight:680;letter-spacing:-.02em;margin-bottom:6px}
.plano-preco{display:flex;align-items:baseline;gap:4px;margin-bottom:12px}
.plano-preco b{font-size:26px;font-weight:680;letter-spacing:-.03em}
.plano-preco small{font-size:12px;color:var(--dim)}
.plano-lista{list-style:none;display:grid;gap:6px;margin:0 0 14px;padding:0;font-size:12.5px;color:var(--muted);flex:1}
.plano-lista li{position:relative;padding-left:17px;line-height:1.45}
.plano-lista li::before{content:'';position:absolute;left:3px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--ac);opacity:.55}

/* ── Preview do perfil no celular ──────────────────────────────────────────
   Um celular desenhado em CSS. Nao e enfeite: e onde se ve o corte CIRCULAR da
   foto antes de aplicar no numero de verdade. */
.perfil-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.celular{background:#0b1120;border-radius:22px;padding:14px 12px 12px;border:1px solid var(--line-2);
  box-shadow:var(--sh-3)}
.cel-topo{display:flex;align-items:center;gap:10px;padding:0 4px 11px;border-bottom:1px solid rgba(255,255,255,.1)}
.cel-foto{width:42px;height:42px;border-radius:50%;flex:none;background:#334155 center/cover no-repeat}
.cel-id b{display:block;color:#f1f5f9;font-size:13px;font-weight:600;line-height:1.3}
.cel-id small{display:block;color:#94a3b8;font-size:11px;line-height:1.3;max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel-conversa{display:grid;gap:7px;padding:12px 4px 4px}
.cel-bolha{max-width:85%;padding:7px 10px;border-radius:10px;font-size:11.5px;line-height:1.45;
  background:#1e293b;color:#e2e8f0;justify-self:start;border-bottom-left-radius:3px}
.cel-bolha.cel-eu{background:#065f46;color:#d1fae5;justify-self:end;border-bottom-right-radius:3px;border-bottom-left-radius:10px}
@media(max-width:900px){.perfil-grid{grid-template-columns:1fr}}

/* ── Caixa de entrada do atendente ─────────────────────────────────────────
   Lista à esquerda, conversa à direita — o formato que todo mundo já sabe usar,
   e que deixa o atendente pular de uma conversa pra outra sem perder o lugar. */
/* Uma caixa so, altura fixa: lista rola de um lado, conversa do outro, e a
   pagina em si nao rola. E o que faz parecer chat em vez de relatorio. */
.inbox{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;
  height:calc(100vh - 210px);min-height:440px}
.inbox-lateral{display:flex;flex-direction:column;gap:10px;min-height:0}
.inbox-lista{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;overflow-y:auto;overflow-x:hidden;align-content:start;padding-right:4px;flex:1;min-height:0}
.inbox-lista > .conversa{min-width:0}
/* com a faixa de "desconectado" em cima, a caixa encolhe o mesmo tanto — senao o campo de resposta cai pra fora da tela */
@media(min-width:901px){.cv-offline + .inbox{height:calc(100vh - 276px)}}
.cv-busca{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);flex:none}
.cv-busca svg{width:15px;height:15px;color:var(--dim);flex:none}
.cv-busca input{border:0!important;background:none!important;box-shadow:none!important;padding:10px 0;font-size:13px}
.cv-busca:focus-within{border-color:var(--ac);box-shadow:0 0 0 3.5px var(--ac-soft)}
.av{--h:260;width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;
  letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 58%),hsl(calc(var(--h) + 40) 75% 48%));
  box-shadow:0 0 0 2px var(--panel),0 6px 14px -6px hsl(var(--h) 80% 50%)}
.av-lg{width:42px;height:42px;flex-basis:42px;font-size:14px}
.cv-corpo{flex:1;min-width:0}
.cv-tags{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.cv-proto{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);letter-spacing:.02em}
.badge.cv-proto{margin-left:0}
.cv-dia{display:flex;align-items:center;gap:10px;margin:6px 0;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cv-dia::before,.cv-dia::after{content:'';flex:1;height:1px;background:var(--line)}
.cv-evento{justify-self:center;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  padding:4px 11px;border-radius:99px;background:var(--raised);border:1px solid var(--line)}
.cv-evento svg{width:12px;height:12px;color:var(--ac)}
.cv-offline{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;border-radius:12px;
  background:var(--warn-bg);border:1px solid var(--warn-line);font-size:13px;color:var(--fg)}
.cv-offline svg{width:17px;height:17px;color:var(--warn);flex:none}
.cv-offline span{flex:1}
.cv-offline .t-acao{margin:0}
.cv-compor{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 14px;border:1px solid var(--line-2);border-radius:16px;background:var(--panel)}
.cv-compor:focus-within{border-color:var(--ac);box-shadow:0 0 0 3.5px var(--ac-soft)}
.cv-compor textarea{border:0!important;background:none!important;box-shadow:none!important;padding:8px 0;resize:none;min-height:22px;max-height:160px;line-height:1.45}
.cv-enviar{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--ac-2),var(--ac));box-shadow:var(--sh-ac);transition:transform .12s,filter .15s}
.cv-enviar svg{width:17px;height:17px}
.cv-enviar:hover{transform:translateY(-1px);filter:brightness(1.1)}
.cv-enviar:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.cv-dica{margin-right:auto;font-size:11.5px}
kbd{font:600 10.5px ui-monospace,Menlo,monospace;padding:1px 5px;border-radius:5px;border:1px solid var(--line-2);background:var(--raised)}
[data-theme="dark"] .cv-enviar{background:var(--neon)}
[data-theme="dark"] .cv-busca,[data-theme="dark"] .cv-compor{background:#0b1222}
.inbox-conversa{display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden}
.conversa{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;
  transition:border-color .16s,background .16s}
.conversa:hover{border-color:var(--ac-line);background:var(--ac-soft)}
.conversa.ativa{border-color:var(--ac);background:var(--ac-soft)}
/* Quem espera gente ganha uma barra na borda: da pra varrer a lista sem ler. */
.conversa.espera{border-left:3px solid var(--err)}
.cv-top{display:flex;align-items:baseline;gap:8px}
.cv-top b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-top small{font-size:11px;color:var(--dim);flex:none}
.cv-msg{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-eu{color:var(--dim)}
.cv-espera{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:var(--err)}
/* bolinha pulsando: quem espera gente se ve de longe, sem ler */
.cv-espera i{width:7px;height:7px;border-radius:50%;background:var(--err);box-shadow:0 0 0 0 var(--err);animation:pulsa 1.6s infinite}
@keyframes pulsa{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.cv-espera i{animation:none}}

.cv-cab{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none}
.cv-cab-t{flex:1;min-width:0}
.cv-cab-t b{display:block;font-size:14px;font-weight:680;letter-spacing:-.015em}
.cv-cab-t small{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}

/* O contexto no topo, em uma faixa — quem atende le antes da conversa. */
.ctx-micaela{display:flex;gap:10px;padding:11px 16px;background:var(--t2-bg);border-bottom:1px solid var(--line);flex:none;font-size:12.5px}
.ctx-micaela svg{width:16px;height:16px;color:var(--t2);flex:none;margin-top:2px}
.ctx-micaela b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);margin-bottom:3px}
.ctx-micaela span{display:block;color:var(--muted);line-height:1.5}
.ctx-micaela i{font-style:normal;color:var(--fg);font-weight:550}

.conversa-fluxo{display:grid;gap:9px;flex:1;min-height:0;overflow-y:auto;padding:16px;background:var(--bg)}
.bolha{max-width:74%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;position:relative;box-shadow:var(--sh-1)}
.bolha small{display:block;font-size:10.5px;opacity:.6;margin-top:4px}
/* Cliente à esquerda, nós à direita: a mesma convenção do app que ele usa. */
.b-cliente{background:var(--panel);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.b-nossa{background:var(--ac-soft);border:1px solid var(--ac-line);color:var(--fg);justify-self:end;border-bottom-right-radius:4px}
.b-nossa small{text-align:right}
.responder{display:grid;gap:9px;padding:13px 16px;border-top:1px solid var(--line);flex:none;background:var(--panel)}
.responder textarea{resize:vertical}
.responder-acoes{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){
  .inbox{grid-template-columns:1fr;height:auto}
  .inbox-lista{max-height:34vh}
  .cv-dica{display:none}
  .inbox-conversa{height:70vh}
}

/* ── Atalhos da visão geral ────────────────────────────────────────────── */
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}
.atalho{display:flex;align-items:center;gap:11px;padding:11px 13px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);box-shadow:var(--sh-1);
  color:var(--fg);transition:border-color .16s,box-shadow .16s,transform .16s,background .16s}
.atalho:hover{border-color:var(--ac-line);background:var(--ac-soft);box-shadow:var(--sh-2);transform:translateY(-1px)}
.atalho .at-t{flex:1;min-width:0}
.atalho b{display:block;font-size:13px;font-weight:650;letter-spacing:-.01em}
.atalho small{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.atalho > svg{width:15px;height:15px;flex:0 0 15px;color:var(--dim);transition:transform .16s,color .16s}
.atalho:hover > svg{color:var(--ac);transform:translateX(2px)}

/* ── Distribuição do funil ─────────────────────────────────────────────────
   Uma barra por etapa, largura proporcional. O funil em coluna já mostra os
   leads; isto mostra ONDE eles estão empilhados, que é a pergunta de quem abre
   o CRM de manhã. Sem lead nenhum a barra não aparece. */
.funil-barra{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--raised);gap:2px;margin:2px 0 14px}
.funil-barra i{display:block;height:100%;border-radius:99px;transition:opacity .16s}
.funil-barra i:hover{opacity:.75}
.funil-leg{display:flex;flex-wrap:wrap;gap:7px 16px}
.funil-leg div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.funil-leg .pt{width:9px;height:9px;border-radius:3px;flex:none}
.funil-leg b{color:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}
.funil-leg small{color:var(--dim);font-size:11.5px}

@media(max-width:900px){
  aside{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sh-3)}
  aside.open{transform:none}
  .overlay.show{display:block}
  .burger{display:grid;place-items:center}
  .content,.topbar{padding-left:16px;padding-right:16px}
  .crumb .pai{display:none}
  .top-right .pill:first-child{display:none}
  .page-head h1{font-size:21px}
  /* No telefone os indicadores vao a DOIS por linha: um por linha empurrava o
     conteudo da tela pra baixo da dobra so pra mostrar quatro numeros. */
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:13px}
  .kpi b{font-size:22px}
  .kpi em{font-size:11.5px}
  .kpi span{font-size:10px}
  .kpi .chip{width:24px;height:24px;flex:0 0 24px;border-radius:7px}
  .kpi .chip svg{width:13px;height:13px}
  .page-head{padding-bottom:15px;margin-bottom:18px}
  .kpi b{font-size:25px}
}
/* ── Entrada do console ──────────────────────────────────────────────────
   Painel de marca à esquerda, formulário à direita — o padrão que todo mundo
   já reconhece. No celular a marca encolhe e o formulário vem primeiro: quem
   abre no telefone quer entrar, não ler sobre o produto. */
.entrar{display:grid;grid-template-columns:1fr;min-height:100vh}
.entrar-marca{display:none}
.entrar-form{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 18px}
.entrar-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:26px 24px;box-shadow:var(--shadow-2)}
.entrar-box h2{font-size:19px;margin:0;letter-spacing:-.02em}
.entrar-sub{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.entrar .senha-wrap{position:relative}
.entrar .senha-wrap input{width:100%;padding-right:74px;height:46px;font-size:15px}
.entrar .senha-wrap input.erro{border-color:var(--err)}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:6px}
.olho:hover{background:var(--raised);color:var(--fg)}
.campo-erro,.campo-dica{display:none;font-size:12.5px;margin-top:7px;font-weight:500}
.campo-erro.on{display:block;color:var(--err)}
.campo-dica.on{display:block;color:var(--warn)}
.entrar-btn{width:100%;height:46px;font-size:14.5px;margin-top:18px}
.entrar-btn:disabled{opacity:.6;cursor:progress}
.entrar-ajuda{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.entrar-ajuda b{font-size:12.5px;display:block;margin-bottom:4px}
.entrar-ajuda p{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}
.entrar-rodape{margin-top:22px;font-size:12px;color:var(--dim)}
@media (min-width:900px){
  .entrar{grid-template-columns:1.05fr 1fr}
  /* O painel de marca é escuro nos DOIS temas. Usar --ink faria ele inverter no
     modo escuro e virar uma placa branca gigante ao lado do formulário escuro. */
  .entrar-marca{display:flex;flex-direction:column;justify-content:space-between;
    padding:44px 40px;background:#141417;color:#fafafa}
  .entrar-marca h1{font-size:27px;margin:20px 0 10px;letter-spacing:-.03em}
  .entrar-marca p{font-size:14.5px;opacity:.72;max-width:34ch;line-height:1.6;margin:0}
  .entrar-marca small{font-size:12px;opacity:.5}
  .entrar-marca .brand-badge{background:#fafafa;color:#141417;
    width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    font-size:16px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .entrar-lista{list-style:none;padding:0;margin:26px 0 0;font-size:13.5px}
  .entrar-lista li{padding:7px 0 7px 22px;position:relative;opacity:.78}
  .entrar-lista li::before{content:'';position:absolute;left:0;top:14px;width:8px;height:8px;
    border-radius:50%;background:currentColor;opacity:.5}
}



/* ── Vida no painel de entrada ───────────────────────────────────────────
   A versão anterior era texto corrido com bolinha cinza na frente, num
   retângulo preto com um vão enorme no meio. Aqui entram três coisas: um
   fundo que respira, ícone de verdade em cada capacidade (bolinha não diz
   nada) e a tira de produtos embaixo, que é o que ocupa o vazio com
   informação em vez de espaço. */
.entrar-marca{position:relative;overflow:hidden}

/* Duas manchas de luz que derivam devagar. 22s e 28s de propósito: períodos
   diferentes nunca sincronizam, então o movimento não vira um pulso óbvio. */
.entrar-brilho{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.entrar-brilho::before,.entrar-brilho::after{content:'';position:absolute;border-radius:50%;filter:blur(72px)}
.entrar-brilho::before{width:460px;height:460px;top:-140px;left:-120px;
  background:radial-gradient(circle,rgba(99,102,241,.5),transparent 68%);animation:deriva1 22s ease-in-out infinite}
.entrar-brilho::after{width:400px;height:400px;bottom:-130px;right:-90px;
  background:radial-gradient(circle,rgba(13,148,136,.42),transparent 68%);animation:deriva2 28s ease-in-out infinite}
@keyframes deriva1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,70px)}}
@keyframes deriva2{0%,100%{transform:translate(0,0)}50%{transform:translate(-55px,-45px)}}
/* Malha fina por cima: dá textura de console sem competir com o texto. */
.entrar-grade{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(120% 90% at 20% 15%,#000,transparent 72%);
          mask-image:radial-gradient(120% 90% at 20% 15%,#000,transparent 72%)}
/* Só o conteúdo sobe; as camadas de fundo levam aria-hidden e ficam de fora.
   Com `> *` genérico, esta regra vinha depois e trocava o position:absolute
   do brilho por relative — as manchas caíam no fluxo e o painel ficava preto
   chapado, sem nada do fundo aparecer. */
.entrar-marca > div:not([aria-hidden]){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){
  .entrar-brilho::before,.entrar-brilho::after{animation:none}
}

/* ---- capacidades: ícone, título e a linha que explica ---- */
.entrar-caps{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:3px}
.entrar-caps li{display:flex;gap:13px;align-items:flex-start;padding:11px 12px;border-radius:11px;
  transition:background .25s ease}
.entrar-caps li:hover{background:rgba(255,255,255,.055)}
.entrar-caps .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--ct,#a5b4fc)}
.entrar-caps .ic svg{width:16px;height:16px}
.entrar-caps b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.entrar-caps small{display:block;font-size:12px;opacity:.58;line-height:1.45;margin-top:2px}

/* ---- tira de produtos, no rodapé do painel ---- */
.entrar-suite{margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.entrar-suite-t{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.45;
  font-weight:600;margin:0 0 13px}
.entrar-prods{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.entrar-prods li{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:100px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-size:12px;
  transition:background .25s ease,border-color .25s ease}
.entrar-prods li:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16)}
.entrar-prods .pg{width:22px;height:22px;flex:none;border-radius:8px;display:grid;place-items:center;
  background:var(--pc,#6366f1);color:#fff}
.entrar-prods .pg svg{width:13px;height:13px}
/* Ponto de estado: quem está pronto acende, quem não está fica apagado. */
.entrar-prods .pt{width:6px;height:6px;border-radius:50%;background:#22c55e;flex:none;margin-left:2px}
.entrar-prods .breve .pt{background:rgba(255,255,255,.28)}
.entrar-prods .breve{opacity:.62}
.entrar-prods .aqui{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);font-weight:600}

@media (max-height:760px){
  .entrar-caps li{padding:8px 12px}
  .entrar-caps small{display:none}
  .entrar-suite{margin-top:18px;padding-top:14px}
}

/* Enquanto o login está na tela, a navegação não aparece: nada de dado do painel
   piscando antes da autenticação. */
body.sem-nav #side,body.sem-nav .topbar,body.sem-nav #ov{display:none!important}
body.sem-nav #view{margin:0!important;padding:0!important;max-width:none!important}
body.sem-nav .content{padding:0!important;max-width:none!important}
body.sem-nav main,body.sem-nav .main{margin-left:0!important}

#sireneTela{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:rgba(10,10,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#sireneTela .sirene-caixa{position:relative;max-width:600px;width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:26px 24px 20px;box-shadow:var(--sh-3);overflow:hidden}
#sireneTela .sirene-caixa::before{content:'';position:absolute;inset:0 0 auto;height:4px;background:var(--err)}
#sireneTela .sirene-cab{display:flex;align-items:center;gap:14px;margin-bottom:14px}
#sireneTela .sirene-anel{position:relative;width:44px;height:44px;border-radius:50%;background:var(--err-bg);display:grid;place-items:center;font-size:20px;flex:none}
#sireneTela .sirene-anel::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--err);animation:sireneAnel 1.6s ease-out infinite}
@keyframes sireneAnel{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){#sireneTela .sirene-anel::after{animation:none}}
#sireneTela .sirene-titulo{font-weight:700;font-size:20px;line-height:1.25;letter-spacing:-.01em}
#sireneTela .sirene-sub{color:var(--muted);font-size:13px;margin-top:2px}
#sireneTela .sirene-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel-2);font-size:14px}
#sireneTela .sirene-item small{color:var(--dim)}
#sireneTela .sirene-aviso{font-weight:600;color:var(--err);margin:10px 0 0;font-size:13px}
#sireneTela .sirene-botoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#sireneTela .sirene-botoes .btn{padding:11px 16px;font-weight:600}
#sireneTela .sirene-botoes .sirene-parar{background:#b91c1c;color:#fff;border-color:#b91c1c}
#sireneTela .sirene-rodape{font-size:12px;color:var(--dim);margin:14px 0 0}
/* Card de segurança: a paleta da marca. Verde só onde é "deu certo". */
#segCard .sw input:checked+.trilho{background:var(--ac)}
#segCard .sw input:focus-visible+.trilho{outline-color:var(--ac)}
#segCard .seg-ctl{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:none;min-width:38px}
#segCard .sw input:disabled+.trilho{opacity:.5;cursor:not-allowed}
#segCard .sw:has(input:disabled){cursor:not-allowed}
#segCard .seg-estado{font-size:13px;font-weight:600;color:var(--muted)}
#segCard .seg-estado.off{color:var(--err)}
#segCard .seg-secao{font-weight:600;font-size:11px;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:22px 0 6px}
#segCard .seg-fone{width:72px;text-align:center;border-radius:999px;padding:7px 8px;font-variant-numeric:tabular-nums}
#segCard .seg-sos{margin-top:18px;padding:16px 18px;border:1px solid var(--line);border-left:3px solid var(--err);border-radius:12px;background:var(--panel-2);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#segCard .seg-sos .btn{background:#b91c1c;color:#fff;border-color:#b91c1c;font-weight:600;padding:10px 18px}
#segCard .seg-frase{margin:0 0 4px;padding:10px 12px;border-radius:10px;background:var(--ac-soft);color:var(--fg);font-size:13px}

/* ══ Noite Bolso Cheio ═══════════════════════════════════════════════════
   O visual padrao do console. Referencia: os paineis de comando em fundo
   roxo profundo (pasta Layouy) — mas com a cor DO PRODUTO, nao a do template:
   o verde e o dourado vem do logo (o bolso e as moedas), o violeta neon e a
   tinta de acao. Painel de CRM costuma ser planilha branca; este e o que a
   pessoa abre de noite no balcao sem cansar a vista.

   Tudo aqui e escopo do tema escuro: o claro continua como estava, pra quem
   prefere. Cor de estado (ok/atencao/erro) continua significando estado.   */
:root[data-theme="dark"]{
  /* Navy neutro nas SUPERFICIES; violeta so na marca e na acao; esmeralda no
     dinheiro. Antes o roxo estava no fundo, no menu, nos cartoes e nos avisos
     ao mesmo tempo — consistente, mas tudo se misturava e nada se destacava. */
  --bg:#0a0f1c; --panel:#111a2e; --panel-2:#0e1627; --raised:#18223a;
  --line:rgba(148,163,196,.13); --line-2:rgba(148,163,196,.24);
  --fg:#e8ecf5; --muted:#a3adc2; --dim:#6f7a93;
  --ink:#e8ecf5; --ink-fg:#0e1627;
  --ac:#8b5cf6; --ac-2:#a78bfa; --ac-3:#c4b5fd; --ac-fg:#fff;
  --ac-soft:rgba(139,92,246,.14); --ac-line:rgba(167,139,250,.38); --ac-glow:rgba(124,92,246,.45);
  --verde:#34d399; --ouro:#fbbf24; --serie-receita:#12a877;
  --t1:#a78bfa; --t1-bg:rgba(167,139,250,.13); --t2:#34d399; --t2-bg:rgba(52,211,153,.12);
  --t3:#38bdf8; --t3-bg:rgba(56,189,248,.12); --t4:#fbbf24; --t4-bg:rgba(251,191,36,.12);
  --t5:#fb7185; --t5-bg:rgba(251,113,133,.12); --t6:#60a5fa; --t6-bg:rgba(96,165,250,.12);
  --ok:#34d399; --ok-bg:rgba(52,211,153,.11); --ok-line:rgba(52,211,153,.32);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.11); --warn-line:rgba(251,191,36,.32);
  --err:#fb7185; --err-bg:rgba(251,113,133,.11); --err-line:rgba(251,113,133,.34);
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 1px 2px rgba(0,0,0,.45), 0 14px 30px -20px rgba(0,0,0,.85);
  --sh-3:0 2px 8px -2px rgba(0,0,0,.55), 0 28px 60px -26px rgba(0,0,0,.9);
  --sh-ac:0 10px 26px -12px rgba(124,92,246,.55);
  --vidro:linear-gradient(180deg,#131d33,#101829);
  --neon:linear-gradient(135deg,#8b5cf6 0%,#6d5df0 100%);
  color-scheme:dark;
}
[data-theme="dark"] body{
  background:
    radial-gradient(1000px 600px at -10% -20%,rgba(139,92,246,.07),transparent 60%),
    radial-gradient(900px 640px at 115% 120%,rgba(52,211,153,.05),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
[data-theme="dark"] ::selection{background:rgba(124,92,246,.35);color:#fff}

/* barra lateral e topo em vidro fosco: o brilho do fundo passa por tras */
[data-theme="dark"] aside{background:#0c1322;backdrop-filter:blur(14px);border-right-color:var(--line)}
[data-theme="dark"] .side-foot{background:rgba(255,255,255,.015)}
[data-theme="dark"] .topbar{background:rgba(10,15,28,.8);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
[data-theme="dark"] .pill{background:rgba(255,255,255,.035);border-color:var(--line)}
[data-theme="dark"] .nav-item{color:var(--muted)}
[data-theme="dark"] .nav-item:hover{background:rgba(255,255,255,.04);color:var(--fg)}
[data-theme="dark"] .nav-item.active{background:rgba(139,92,246,.14);color:#fff}
[data-theme="dark"] .nav-item.active svg{color:var(--ac-3)}
[data-theme="dark"] .nav-item.active::before{background:var(--neon);box-shadow:0 0 12px rgba(124,92,246,.8)}
[data-theme="dark"] .sub-item.active{color:#fff}
[data-theme="dark"] .sub-item.active::before{background:var(--ac-3);box-shadow:0 0 8px rgba(167,139,250,.8)}
[data-theme="dark"] .sec-label{color:#5d6781}

/* cabecalho da pagina: titulo com leve degrade, sem virar arco-iris */
[data-theme="dark"] .page-head{border-bottom-color:var(--line)}
[data-theme="dark"] .page-head h1{background:linear-gradient(90deg,#fff 30%,#dfe4f0);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="dark"] .page-head .eyebrow{color:var(--ac-3)}
[data-theme="dark"] .page-head .eyebrow::before{background:var(--neon);box-shadow:0 0 8px rgba(124,92,246,.8)}

/* cartoes: vidro, fio de luz no topo, brilho so no hover */
[data-theme="dark"] .card,[data-theme="dark"] .kpi,[data-theme="dark"] .empty,[data-theme="dark"] .inbox-conversa{
  background:var(--vidro);border-color:var(--line);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh-2)}
[data-theme="dark"] .card{transition:border-color .2s,box-shadow .2s}
[data-theme="dark"] .card:hover{border-color:rgba(148,163,196,.26)}
[data-theme="dark"] .kpi::before{height:2px;background:linear-gradient(90deg,transparent,var(--kt),transparent);box-shadow:0 0 14px var(--kt)}
[data-theme="dark"] .kpi:hover{border-color:color-mix(in srgb,var(--kt) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px color-mix(in srgb,var(--kt) 18%,transparent),0 24px 50px -26px color-mix(in srgb,var(--kt) 55%,transparent)}
[data-theme="dark"] .kpi b{color:#fff;text-shadow:none}
[data-theme="dark"] .chip{box-shadow:0 0 0 1px color-mix(in srgb,var(--ct,var(--kt)) 22%,transparent),0 0 18px -4px color-mix(in srgb,var(--ct,var(--kt)) 55%,transparent)}
[data-theme="dark"] .stat-row:hover,[data-theme="dark"] tbody tr:hover{background:rgba(255,255,255,.03)}
[data-theme="dark"] th{background:rgba(255,255,255,.035)}
[data-theme="dark"] .tbl-wrap{background:#0e1627}
[data-theme="dark"] .step{background:rgba(255,255,255,.025)}
[data-theme="dark"] .empty .ico{background:var(--neon);box-shadow:0 12px 30px -8px rgba(124,92,246,.65)}
[data-theme="dark"] .badge.b-ok{box-shadow:0 0 12px -4px var(--ok)}
[data-theme="dark"] .badge.b-err{box-shadow:0 0 12px -4px var(--err)}
[data-theme="dark"] code{background:rgba(255,255,255,.05)}

/* campos: fundo mais fundo que o cartao, foco com halo neon */
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:#0b1222;border-color:var(--line-2)}
[data-theme="dark"] input:focus,[data-theme="dark"] select:focus,[data-theme="dark"] textarea:focus{border-color:var(--ac-2);box-shadow:0 0 0 3.5px rgba(139,92,246,.22),0 0 22px -6px rgba(124,92,246,.55)}

/* botoes */
[data-theme="dark"] .btn-p{background:var(--neon);box-shadow:var(--sh-ac),inset 0 1px 0 rgba(255,255,255,.25)}
[data-theme="dark"] .btn-p:hover{box-shadow:0 14px 34px -10px rgba(124,92,246,.8),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.08)}
[data-theme="dark"] .btn-s{background:rgba(255,255,255,.04);border-color:var(--line-2);box-shadow:none}
[data-theme="dark"] .btn-s:hover{background:var(--ac-soft);border-color:var(--ac-line);color:#fff}
[data-theme="dark"] .btn-g:hover{background:rgba(255,255,255,.05)}
[data-theme="dark"] .btn-ok{background:var(--ok-bg)}
[data-theme="dark"] .btn-ok:hover{background:var(--ok);color:#06140d;box-shadow:0 10px 26px -10px var(--ok)}
[data-theme="dark"] .btn-d{box-shadow:0 10px 26px -12px var(--err)}
[data-theme="dark"] .bi:hover{background:var(--ac-soft);color:#fff}

/* modal: vidro escuro com borda de luz */
[data-theme="dark"] .modal-bg{background:rgba(5,2,12,.66);backdrop-filter:blur(6px)}
[data-theme="dark"] .modal{background:#121b30;border-color:var(--line-2);
  box-shadow:0 0 0 1px rgba(124,92,246,.08),0 30px 80px -20px rgba(0,0,0,.95),0 0 60px -20px rgba(139,92,246,.45)}
[data-theme="dark"] .modal-h,[data-theme="dark"] .modal-f{border-color:var(--line)}
[data-theme="dark"] .modal-f{background:rgba(255,255,255,.02)}

/* conversa do WhatsApp */
[data-theme="dark"] .conversa{background:rgba(255,255,255,.025);border-color:var(--line)}
[data-theme="dark"] .conversa:hover{background:rgba(139,92,246,.08)}
[data-theme="dark"] .conversa.ativa{background:linear-gradient(90deg,rgba(139,92,246,.22),rgba(139,92,246,.05));border-color:var(--ac-line)}
[data-theme="dark"] .conversa-fluxo{background:#0c1426}
[data-theme="dark"] .b-cliente{background:rgba(255,255,255,.055);border-color:var(--line)}
[data-theme="dark"] .b-nossa{background:rgba(139,92,246,.17);border-color:rgba(167,139,250,.28);color:var(--fg);box-shadow:none}
[data-theme="dark"] .responder{background:rgba(255,255,255,.02)}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(148,163,196,.22)}
@media (prefers-reduced-motion:reduce){[data-theme="dark"] *{transition:none!important}}

/* ── Entrada: refinamento ── */
.entrar-selo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;color:#fff;
  background:linear-gradient(135deg,var(--ac-2),var(--ac));box-shadow:var(--sh-ac)}
.entrar-selo svg{width:20px;height:20px}
.entrar-box h2{font-size:22px!important;letter-spacing:-.03em!important}
.entrar-box.treme{animation:t-treme .42s}
.entrar #lgErro.on{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:10px;background:var(--err-bg);border:1px solid var(--err-line)}
.entrar #lgErro svg{width:15px;height:15px;flex:none}
.entrar-ajuda{display:grid;gap:6px}
.entrar-linha{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  color:var(--fg);text-decoration:none;cursor:pointer;list-style:none;transition:background .15s,border-color .15s}
.entrar-linha::-webkit-details-marker{display:none}
.entrar-linha:hover{background:var(--ac-soft);border-color:var(--ac-line)}
.entrar-linha > svg{width:16px;height:16px;flex:none;color:var(--ac)}
.entrar-linha > svg:last-child{color:var(--dim);width:14px;height:14px;transition:transform .2s}
.entrar-linha span{flex:1;min-width:0}
.entrar-linha b{display:block;font-size:12.5px;margin:0}
.entrar-linha small{display:block;font-size:11.5px;color:var(--dim)}
.entrar-linha-d[open] > .entrar-linha > svg:last-child{transform:rotate(90deg)}
[data-theme="dark"] .entrar-form{background:transparent}
[data-theme="dark"] .entrar-box{background:var(--vidro);border-color:var(--line-2);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 70px -30px rgba(0,0,0,.9),0 0 70px -30px rgba(139,92,246,.55)}
[data-theme="dark"] .entrar-selo{background:var(--neon)}
@media (prefers-reduced-motion:reduce){.entrar-box.treme{animation:none}}

/* Celular: endereco longo (webhook, OAuth) e lista de tipos quebram linha em vez
   de empurrar a pagina pro lado; tabela solta rola dentro do cartao. */
@media(max-width:640px){
  #view .badge{white-space:normal;overflow-wrap:anywhere;text-align:right;max-width:62%}
  #view code{overflow-wrap:anywhere;word-break:break-all}
  #view .card > table,#view .card > div > table:not(.tbl-wrap table){display:block;overflow-x:auto;max-width:100%}
}

/* Icone do cartao: SO o icone, sem caixinha. O quadrado com fundo e borda nao
   era clicavel nem dizia nada — parecia botao e nao era. Agora e sinal, do
   mesmo tamanho e peso em todo cartao. */
.chip,.kpi .chip{width:auto!important;height:auto!important;flex:none!important;background:none!important;border:0!important;
  box-shadow:none!important;border-radius:0!important;padding:0;color:var(--ct,var(--kt,var(--t1)));opacity:.9}
.chip svg,.kpi .chip svg{width:19px!important;height:19px!important;stroke-width:1.7}
.card-h .chip{margin-top:1px}
[data-theme="dark"] .chip svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ct,var(--kt,var(--t1))) 45%,transparent))}

/* ── Resultados ── */
.kpi-dinheiro b{color:var(--serie-receita)!important}
[data-theme="dark"] .kpi-dinheiro b{color:var(--verde)!important}
.kpi-dinheiro em.sobe{color:var(--ok)} .kpi-dinheiro em.desce{color:var(--err)}
.medidor{height:10px;border-radius:99px;background:var(--raised);overflow:hidden}
.medidor i{display:block;height:100%;border-radius:99px;background:var(--serie-receita)}
.grafico{position:relative}
.grafico svg{width:100%;height:auto;display:block}
.g-grade{stroke:var(--line);stroke-width:1}
.g-eixo{fill:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.g-barra{fill:var(--serie-receita)}
.g-alvo{fill:transparent;cursor:crosshair}
.g-alvo:hover{fill:color-mix(in srgb,var(--fg) 5%,transparent)}
.g-dica{position:absolute;top:0;width:120px;padding:7px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line-2);
  box-shadow:var(--sh-3);font-size:12px;pointer-events:none;display:grid;gap:1px}
/* display:grid acima anularia o [hidden]: a dica ficava como caixa vazia no canto */
.g-dica[hidden]{display:none}
.g-dica b{font-size:13.5px;font-variant-numeric:tabular-nums} .g-dica span{color:var(--dim)}
.g-tabela{margin-top:10px} .g-tabela summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.g-tabela .tbl-wrap{margin-top:8px}
.regra{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.regra svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--dim)}
.page-head .ph-acts .badge{margin-left:0;align-self:center}

/* Resultados: receita com o dobro da largura; no celular volta a uma coluna */
.kpis-res{grid-template-columns:2fr 1fr 1fr 1fr;gap:14px}
.kpis-res .kpi-dinheiro b{font-size:38px;letter-spacing:-.04em;margin-top:2px}
.kpis-res .kpi-dinheiro{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px color-mix(in srgb,var(--t2) 22%,transparent),var(--sh-2)}
@media(max-width:1100px){.kpis-res{grid-template-columns:1fr 1fr}.kpis-res .kpi-dinheiro{grid-column:1/-1}}
@media(max-width:560px){.kpis-res{grid-template-columns:1fr}}
.passos{display:grid;gap:8px}
.passo{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.passo .n{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  color:var(--ac);background:var(--ac-soft)}
.passo.feito .n{color:var(--ok);background:var(--ok-bg)} .passo .n svg{width:14px;height:14px}
.passo-t{flex:1;min-width:0} .passo-t b{display:block;font-size:13.5px} .passo-t small{display:block;font-size:12px;color:var(--dim)}
/* celular: o botao desce pra linha de baixo em vez de espremer o texto */
@media(max-width:560px){.passo{flex-wrap:wrap}.passo-t{flex:1 1 calc(100% - 38px)}.passo > .btn{margin-left:38px}}
/* celular: acoes do cabecalho (filtro, botoes) descem pra baixo do titulo — do
   lado dele, espremiam o titulo ate cortar a palavra */
@media(max-width:640px){.page-head{flex-wrap:wrap}.page-head .ph-txt{flex:1 1 100%}.page-head .ph-acts{margin-left:0}}
.vazio-curto b{display:block;font-size:13.5px} .vazio-curto small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.vazio-acao{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}

/* microajustes da tela de Resultados */
.pill[hidden]{display:none!important}
.pill-sep{width:1px;height:12px;background:var(--line-2);margin:0 2px}
.seg.seg-sm{padding:2px}.seg.seg-sm button{padding:5px 12px;font-size:12px}
.kpis-res .kpi-dinheiro b{font-size:42px}
.kd-linha{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.kd-mini{width:132px;height:40px;flex:none;opacity:.9}
.kd-mini rect{fill:color-mix(in srgb,var(--serie-receita) 45%,transparent)} .kd-mini rect.hoje{fill:var(--serie-receita)}
@media(max-width:560px){.kd-mini{width:96px}}
.camp-fantasma td{padding:16px 12px}
.camp-fantasma thead th{opacity:.7}
.camp-fantasma code{font-size:11.5px}

/* ── Atendimento v1: situacao, filtros, pedido, marcos ── */
/* 2x2: quatro filtros numa linha nao cabem na coluna da lista (o ultimo ia parar
   debaixo da conversa, sem clique). */
.cv-filtros{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:100%;flex:none;border-radius:14px}
