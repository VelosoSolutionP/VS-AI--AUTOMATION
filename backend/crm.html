<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veloso Solution — Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EVS%3C/text%3E%3C/svg%3E">
<style>
/* Paleta monocromática: cinza neutro + tinta. Cor só quando SIGNIFICA algo —
   verde ok, âmbar atenção, vermelho erro. Nada decorativo. */
:root{
  --bg:#fafafa; --panel:#fff; --raised:#f4f4f5; --line:#e4e4e7; --line-2:#d4d4d8;
  --fg:#18181b; --muted:#52525b; --dim:#a1a1aa;
  --ink:#18181b; --ink-fg:#fff;
  --ok:#15803d; --ok-bg:#f0fdf4; --ok-line:#bbf7d0;
  --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --err:#b91c1c; --err-bg:#fef2f2; --err-line:#fecaca;
  --r:10px; --r-sm:7px; --sidebar:248px;
  --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-2:0 1px 3px rgba(0,0,0,.08),0 8px 24px -12px rgba(0,0,0,.12);
  color-scheme:light;
}
/* aninhar @media dentro da regra depende de CSS Nesting; versao plana funciona em todo lugar */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#09090b; --panel:#131316; --raised:#1c1c20; --line:#27272a; --line-2:#3f3f46;
  --fg:#fafafa; --muted:#a1a1aa; --dim:#71717a;
  --ink:#fafafa; --ink-fg:#18181b;
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.1); --ok-line:rgba(34,197,94,.28);
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.1); --warn-line:rgba(245,158,11,.28);
  --err:#f87171; --err-bg:rgba(239,68,68,.1); --err-line:rgba(239,68,68,.28);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 1px 3px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090b; --panel:#131316; --raised:#1c1c20; --line:#27272a; --line-2:#3f3f46;
  --fg:#fafafa; --muted:#a1a1aa; --dim:#71717a;
  --ink:#fafafa; --ink-fg:#18181b;
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.1); --ok-line:rgba(34,197,94,.28);
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.1); --warn-line:rgba(245,158,11,.28);
  --err:#f87171; --err-bg:rgba(239,68,68,.1); --err-line:rgba(239,68,68,.28);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 1px 3px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.shell{display:flex;min-height:100vh}
aside{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line)}
.mark{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:grid;place-items:center;font-weight:700;font-size:12px;
  background:var(--ink);color:var(--ink-fg)}
.brand b{display:block;font-size:13px;line-height:1.3;letter-spacing:-.1px}
.brand span{display:block;font-size:11px;color:var(--dim)}
nav{flex:1;overflow-y:auto;padding:8px}
.sec-label{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);padding:14px 9px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:7.5px 9px;border-radius:var(--r-sm);
  color:var(--muted);font-size:13.5px;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:var(--raised);color:var(--fg)}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.7}
.nav-item.active{background:var(--raised);color:var(--fg);font-weight:600}
.nav-item.active svg{opacity:1}
.chev{margin-left:auto;transition:transform .16s;opacity:.5}
.nav-item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.submenu{overflow:hidden;max-height:0;transition:max-height .2s ease}
.submenu.open{max-height:340px}
.sub-item{display:block;width:100%;padding:6.5px 9px 6.5px 34px;border-radius:var(--r-sm);color:var(--dim);
  font-size:13px;text-align:left;position:relative}
.sub-item::before{content:'';position:absolute;left:18px;top:2px;bottom:2px;width:1px;background:var(--line)}
.sub-item:hover{color:var(--fg);background:var(--raised)}
.sub-item.active{color:var(--fg);font-weight:600}
.sub-item.active::before{background:var(--fg);width:1.5px}
.side-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px}
.env{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);background:var(--raised)}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--dim)}
.dot.on{background:var(--ok)}
.env small{font-size:11px;color:var(--dim);line-height:1.3}
.env b{display:block;color:var(--fg);font-size:11.5px;font-weight:600}
.theme{display:flex;gap:3px;padding:3px;background:var(--raised);border-radius:var(--r-sm)}
.theme button{flex:1;padding:5px;border-radius:5px;font-size:11.5px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px}
.theme button svg{width:13px;height:13px}
.theme button.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.burger{display:none;padding:6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.crumb{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb i{opacity:.5;font-style:normal}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.content{padding:24px;max-width:1440px;width:100%;margin:0 auto;flex:1}
.page-head{margin-bottom:20px}
.page-head h1{font-size:21px;letter-spacing:-.4px;font-weight:650;line-height:1.25}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:72ch}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}
.card h3{font-size:13.5px;font-weight:650;margin-bottom:3px}
.card .hint{color:var(--dim);font-size:12.5px}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:600}
.kpi b{display:block;font-size:25px;font-weight:650;letter-spacing:-.8px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:42px 22px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--panel)}
.empty .ico{width:44px;height:44px;border-radius:12px;margin:0 auto 13px;display:grid;place-items:center;
  background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.empty .ico svg{width:21px;height:21px}
.empty h3{font-size:14.5px;margin-bottom:5px;font-weight:650}
.empty p{color:var(--muted);font-size:13px;max-width:54ch;margin:0 auto 15px}
.steps{text-align:left;max-width:530px;margin:0 auto;display:grid;gap:7px}
.step{display:flex;gap:10px;align-items:flex-start;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.step .n{width:19px;height:19px;flex:0 0 19px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  background:var(--ink);color:var(--ink-fg)}
.step div{font-size:12.5px;color:var(--muted);line-height:1.5}

.stat-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.stat-row .lbl{font-size:13px;min-width:0}
.stat-row .lbl small{display:block;color:var(--dim);font-size:11.5px;margin-top:1px}
.badge{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--raised)}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.b-err{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:262px;flex:1 0 262px;padding:12px;box-shadow:var(--shadow)}
.col-h{display:flex;align-items:baseline;gap:7px;margin-bottom:10px}
.col-h h3{font-size:12.5px;font-weight:650}
.col-h .n{font-size:11px;color:var(--dim);background:var(--raised);border-radius:99px;padding:1px 7px}
.col-h .v{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lead{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;margin-bottom:8px}
.lead:hover{border-color:var(--line-2)}
.lead .nm{font-weight:650;font-size:13.5px}
.lead .meta{color:var(--dim);font-size:12px;margin:2px 0 8px;word-break:break-word}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.t-quente{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.t-morno{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.t-frio{background:var(--raised);color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:7.5px 9px;width:100%;transition:border-color .12s,box-shadow .12s}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--fg);box-shadow:0 0 0 3px var(--raised)}
select{flex:1;min-width:104px;font-size:12.5px;padding:5.5px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7.5px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:opacity .12s,background .12s}
.btn-p{background:var(--ink);color:var(--ink-fg)}
.btn-p:hover{opacity:.85}
.btn-s{border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.btn-s:hover{color:var(--fg);border-color:var(--line-2)}
.btn-xs{padding:4.5px 9px;font-size:11.5px}
.btn-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.btn-no{background:var(--panel);color:var(--dim);border:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;align-items:end}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600}
.msg{padding:10px 13px;border-radius:var(--r-sm);margin-bottom:14px;font-size:13px;display:none}
.msg.err{display:block;background:var(--err-bg);border:1px solid var(--err-line);color:var(--err)}
.msg.ok{display:block;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);padding:0 10px 8px;font-weight:600}
td{padding:11px 10px;border-top:1px solid var(--line)}
.linkbox{display:flex;gap:7px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 5px 5px 11px}
.linkbox span{flex:1;font:12px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl-wrap{overflow-x:auto}

@media(max-width:900px){
  aside{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-2)}
  aside.open{transform:none}
  .overlay.show{display:block}
  .burger{display:grid;place-items:center}
  .content,.topbar{padding-left:16px;padding-right:16px}
  .crumb .pai{display:none}
  .top-right .pill:first-child{display:none}
  .page-head h1{font-size:19px}
}


/* ── Entrada do console ──────────────────────────────────────────────────
   Painel de marca à esquerda, formulário à direita — o padrão que todo mundo
   já reconhece. No celular a marca encolhe e o formulário vem primeiro: quem
   abre no telefone quer entrar, não ler sobre o produto. */
.entrar{display:grid;grid-template-columns:1fr;min-height:100vh}
.entrar-marca{display:none}
.entrar-form{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 18px}
.entrar-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:26px 24px;box-shadow:var(--shadow-2)}
.entrar-box h2{font-size:19px;margin:0;letter-spacing:-.02em}
.entrar-sub{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.entrar .senha-wrap{position:relative}
.entrar .senha-wrap input{width:100%;padding-right:74px;height:46px;font-size:15px}
.entrar .senha-wrap input.erro{border-color:var(--err)}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:6px}
.olho:hover{background:var(--raised);color:var(--fg)}
.campo-erro,.campo-dica{display:none;font-size:12.5px;margin-top:7px;font-weight:500}
.campo-erro.on{display:block;color:var(--err)}
.campo-dica.on{display:block;color:var(--warn)}
.entrar-btn{width:100%;height:46px;font-size:14.5px;margin-top:18px}
.entrar-btn:disabled{opacity:.6;cursor:progress}
.entrar-ajuda{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.entrar-ajuda b{font-size:12.5px;display:block;margin-bottom:4px}
.entrar-ajuda p{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}
.entrar-rodape{margin-top:22px;font-size:12px;color:var(--dim)}
@media (min-width:900px){
  .entrar{grid-template-columns:1.05fr 1fr}
  /* O painel de marca é escuro nos DOIS temas. Usar --ink faria ele inverter no
     modo escuro e virar uma placa branca gigante ao lado do formulário escuro. */
  .entrar-marca{display:flex;flex-direction:column;justify-content:space-between;
    padding:44px 40px;background:#141417;color:#fafafa}
  .entrar-marca h1{font-size:27px;margin:20px 0 10px;letter-spacing:-.03em}
  .entrar-marca p{font-size:14.5px;opacity:.72;max-width:34ch;line-height:1.6;margin:0}
  .entrar-marca small{font-size:12px;opacity:.5}
  .entrar-marca .brand-badge{background:#fafafa;color:#141417;
    width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    font-size:16px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .entrar-lista{list-style:none;padding:0;margin:26px 0 0;font-size:13.5px}
  .entrar-lista li{padding:7px 0 7px 22px;position:relative;opacity:.78}
  .entrar-lista li::before{content:'';position:absolute;left:0;top:14px;width:8px;height:8px;
    border-radius:50%;background:currentColor;opacity:.5}
}



/* ── Vida no painel de entrada ───────────────────────────────────────────
   A versão anterior era texto corrido com bolinha cinza na frente, num
   retângulo preto com um vão enorme no meio. Aqui entram três coisas: um
   fundo que respira, ícone de verdade em cada capacidade (bolinha não diz
   nada) e a tira de produtos embaixo, que é o que ocupa o vazio com
   informação em vez de espaço. */
.entrar-marca{position:relative;overflow:hidden}

/* Duas manchas de luz que derivam devagar. 22s e 28s de propósito: períodos
   diferentes nunca sincronizam, então o movimento não vira um pulso óbvio. */
.entrar-brilho{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.entrar-brilho::before,.entrar-brilho::after{content:'';position:absolute;border-radius:50%;filter:blur(72px)}
.entrar-brilho::before{width:460px;height:460px;top:-140px;left:-120px;
  background:radial-gradient(circle,rgba(99,102,241,.5),transparent 68%);animation:deriva1 22s ease-in-out infinite}
.entrar-brilho::after{width:400px;height:400px;bottom:-130px;right:-90px;
  background:radial-gradient(circle,rgba(13,148,136,.42),transparent 68%);animation:deriva2 28s ease-in-out infinite}
@keyframes deriva1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,70px)}}
@keyframes deriva2{0%,100%{transform:translate(0,0)}50%{transform:translate(-55px,-45px)}}
/* Malha fina por cima: dá textura de console sem competir com o texto. */
.entrar-grade{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(120% 90% at 20% 15%,#000,transparent 72%);
          mask-image:radial-gradient(120% 90% at 20% 15%,#000,transparent 72%)}
/* Só o conteúdo sobe; as camadas de fundo levam aria-hidden e ficam de fora.
   Com `> *` genérico, esta regra vinha depois e trocava o position:absolute
   do brilho por relative — as manchas caíam no fluxo e o painel ficava preto
   chapado, sem nada do fundo aparecer. */
.entrar-marca > div:not([aria-hidden]){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){
  .entrar-brilho::before,.entrar-brilho::after{animation:none}
}

/* ---- capacidades: ícone, título e a linha que explica ---- */
.entrar-caps{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:3px}
.entrar-caps li{display:flex;gap:13px;align-items:flex-start;padding:11px 12px;border-radius:11px;
  transition:background .25s ease}
.entrar-caps li:hover{background:rgba(255,255,255,.055)}
.entrar-caps .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--ct,#a5b4fc)}
.entrar-caps .ic svg{width:16px;height:16px}
.entrar-caps b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.entrar-caps small{display:block;font-size:12px;opacity:.58;line-height:1.45;margin-top:2px}

/* ---- tira de produtos, no rodapé do painel ---- */
.entrar-suite{margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.entrar-suite-t{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.45;
  font-weight:600;margin:0 0 13px}

/* ---------- tema ---------- */
function setTema(t){
  try{localStorage.setItem('vs-tema',t);}catch{}
  document.documentElement.setAttribute('data-theme',t);
  marcarTema(t);
}
function marcarTema(t){
  document.getElementById('thLight')?.classList.toggle('on',t==='light');
  document.getElementById('thDark')?.classList.toggle('on',t==='dark');
}
(function(){
  let t=null; try{t=localStorage.getItem('vs-tema');}catch{}
  if(t){document.documentElement.setAttribute('data-theme',t);}
  addEventListener('DOMContentLoaded',()=>marcarTema(t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')));
})();

MENU.forEach(m=>{TITULO[m.id]=[m.nome];(m.filhos||[]).forEach(f=>TITULO[f.id]=[m.nome,f.nome]);});

let ST={funil:[],leads:[],resumo:{etapas:[],abertos:0,ganhos:0,perdidos:0,conversao:null}},STATUS=null,IND=null,REDES=null,TK=null,EST=null,AUD=null,FIN=null,REL=null,CTA=null,QG=null,TKAPP=null;

const PROVA={}; // ultimo teste real das APIs do TikTok, por familia
let rota=location.hash.slice(1)||'visao';
const abertos=new Set(PAI[rota]?[PAI[rota]]:[]);

const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=(v)=>v==null?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2});
function flash(t,tipo){const m=document.getElementById('msg');m.className='msg '+tipo;m.textContent=t;if(tipo==='ok')setTimeout(()=>m.className='msg',3200);}
// O ?t= da URL continua funcionando (link direto), mas a sessao tem prioridade:
// token em querystring acaba em log de acesso e em historico de navegador.
let TOKEN=sessionStorage.getItem('crm_token')||new URLSearchParams(location.search).get('t')||'';
async function api(r,body){
  const res=await fetch('/crm/api/'+r,{method:body?'POST':'GET',
    headers:{'content-type':'application/json',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  const j=await res.json().catch(()=>({erro:'resposta invalida do servidor'}));
  if(!res.ok||j.erro) throw new Error(j.erro||('HTTP '+res.status));
  return j;
}
function toggleNav(v){document.getElementById('side').classList.toggle('open',v);document.getElementById('ov').classList.toggle('show',v);}

const head=(t,p)=>`<div class="page-head"><h1>${esc(t)}</h1><p>${p}</p></div>`;

/* O TikTok tem três apps separados (login, anúncios e loja), cada um com autorização
   própria — por isso ele aparece como bloco, e não como mais uma linha de credencial. */
const TK_NOME={open:'Login Kit / Display',business:'Business (Ads)',shop:'Shop (produtos)'};
function tiktokCard(){
  if(!TK) return '';
  const app=TKAPP;
  const bloco=(f,nome,campos,ajuda)=>{
    const s=TK.familias[f];
    const badge=!s.appConfigurado?`<span class="badge">falta preencher</span>`
      :!s.autorizado?'<span class="badge b-warn">app pronto · falta autorizar</span>'
      :s.expirado?'<span class="badge b-err">token vencido</span>'
      :`<span class="badge b-ok">conectado${s.venceEmMin!=null?' · vence em '+s.venceEmMin+' min':''}</span>`;
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div><h3>TikTok · ${esc(nome)}</h3><p class="hint">${esc(ajuda)}</p></div>${badge}</div>
      ${s.conta?linha('Conta conectada','',esc(s.conta),'b-ok'):''}
      ${s.token?linha('Token','mascarado',esc(s.token),''):''}
      ${!s.autorizado?`<div class="form-grid">
        ${campos.map(c=>`<div class="field"><label>${esc(c[1])}</label>
          <input id="tk-${esc(f)}-${esc(c[0])}" placeholder="${esc(c[2]||'')}" autocomplete="off"></div>`).join('')}
        <button class="btn btn-s" onclick="salvarAppTiktok('${esc(f)}',${JSON.stringify(campos.map(c=>c[0])).replace(/"/g,'&quot;')})">Salvar credenciais</button>
        ${s.appConfigurado?`<button class="btn btn-p" onclick="autorizarTiktok('${esc(f)}')">Conectar conta</button>`:''}
      </div>`:`<button class="btn btn-s" onclick="autorizarTiktok('${esc(f)}')">Reconectar</button>`}
      ${app?`<p class="hint" style="margin-top:10px">URL de retorno para colar no app:
        <code>${esc(app.redirects[f])}</code></p>`:''}
    </div>`;
  };
  const pronto=Object.entries(TK.pronto).filter(([,v])=>v).map(([k])=>k);
  return `<div class="card" style="margin-bottom:16px"><h3>TikTok</h3>
    <p class="hint">São três apps separados na TikTok — login, anúncios e loja — cada um com autorização própria.</p>
    ${linha('Pronto pra','o que já dá pra fazer pela API',pronto.length?pronto.join(', '):'nada ainda',pronto.length?'b-ok':'b-warn')}
    ${TK.lojaAtiva?linha('Loja ativa','shop_cipher',esc(TK.lojaAtiva),'b-ok'):''}
    ${TK.anuncianteAtivo?linha('Conta de anúncio ativa','advertiser_id',esc(TK.anuncianteAtivo),'b-ok'):''}</div>
  <div class="card" style="margin-bottom:16px;border-style:dashed">
    <h3>Como ligar, em dois passos</h3>
    <p class="hint">1. Crie o app em <b>developers.tiktok.com</b> e cole a URL de retorno que aparece em cada bloco abaixo —
    ela é fixa, não muda mais.<br>2. Cole as credenciais aqui e clique em <b>Conectar conta</b>. O resto é com o painel.</p>
    <p class="hint">Aqui o token <b>fica gravado</b> em <code>~/.qa-gate/vstiktok</code> com arquivo <code>0600</code>, porque
    OAuth só funciona guardando o token para renovar. O que aparece nesta tela é mascarado.</p></div>
  ${bloco('open','Login e conteúdo',[['clientKey','Client key','do app em developers.tiktok.com'],['clientSecret','Client secret','']],'publicar vídeo, ler perfil e métricas')}
  ${bloco('business','Anúncios (Ads)',[['appId','App ID','de business-api.tiktok.com'],['secret','Secret','']],'campanhas, conjuntos e relatórios')}
  ${bloco('shop','Loja (produtos)',[['appKey','App key','de partner.tiktokshop.com'],['appSecret','App secret',''],['serviceId','Service ID','do painel do app']],'catálogo, estoque e preço')}`;
}

async function salvarAppTiktok(familia,campos){
  const cred={};
  campos.forEach(c=>{cred[c]=(document.getElementById(`tk-${familia}-${c}`)||{}).value?.trim()||'';});
  try{
    await api('tiktok/app',{familia,cred});
    flash('Credenciais salvas. Agora clique em "Conectar conta".','ok');
    carregar();
  }catch(e){flash(e.message,'err');}
}

async function autorizarTiktok(familia){
  try{
    const r=await api('tiktok/autorizar',{familia,publicar:familia==='open'});
    // Abre a tela de consentimento da rede. A volta cai no /oauth/callback deste painel.
    window.open(r.url,'_blank','noopener');
    flash('Abri a autorização do TikTok em outra aba. Ao voltar, recarregue esta tela.','ok');
  }catch(e){flash(e.message,'err');}
}
const kpi=(l,v,e)=>`<div class="kpi"><span>${esc(l)}</span><b>${esc(String(v))}</b><em>${esc(e)}</em></div>`;
function vazio(icone,titulo,texto,passos){
  return `<div class="empty"><div class="ico">${ico(icone)}</div><h3>${esc(titulo)}</h3><p>${texto}</p>
   ${passos?`<div class="steps">${passos.map((p,i)=>`<div class="step"><div class="n">${i+1}</div><div>${p}</div></div>`).join('')}</div>`:''}</div>`;
}
const linha=(l,s,b,c)=>`<div class="stat-row"><div class="lbl">${esc(l)}${s?`<small>${s}</small>`:''}</div><span class="badge ${c||''}">${esc(b)}</span></div>`;

/* ---------- telas ---------- */
function telaVisao(){
  const r=ST.resumo,w=STATUS?.whatsapp||{};

    ${kpi('Ganhos',r.ganhos,'fechados no CRM')}

    ${kpi('Bot no ar',w.envia?'sim':'não',w.envia?'Cloud API ativa':'provider = '+(w.provider||'log'))}</div>
  <div class="grid g-2">
    <div class="card"><h3>Integrações</h3><p class="hint" style="margin-bottom:6px">Estado real, lido do ambiente.</p>
      ${linha('WhatsApp Cloud API','provider '+(w.provider||'log'),w.envia?'enviando':'não envia',w.envia?'b-ok':'')}
      ${linha('Token da Meta','WA_TOKEN / WA_PHONE_ID',w.waToken&&w.waPhoneId?'presentes':'ausentes',w.waToken&&w.waPhoneId?'b-ok':'')}
      ${linha('Webhook de entrada','recebe mensagem do cliente','não existe','')}
      ${linha('Notificação do QA-Gate','CallMeBot',STATUS?.notify?.enabled?'ligada':'desligada',STATUS?.notify?.enabled?'b-ok':'')}
      ${linha('CRM','funil de '+(STATUS?.crm?.funilOrigem||'—'),STATUS?.crm?.funil?'ativo':'sem funil',STATUS?.crm?.funil?'b-ok':'b-warn')}
      ${linha('Indicação','regra de comissão',IND?.regra?'definida':'não definida',IND?.regra?'b-ok':'b-warn')}</div>
    <div class="card"><h3>Sem fonte de dado ainda</h3><p class="hint" style="margin-bottom:6px">Telas prontas, esperando de onde puxar.</p>
      ${linha('Estoque','nenhuma fonte conectada','vazio','')}
      ${linha('Financeiro','nenhuma fonte conectada','vazio','')}
      ${linha('Auditor','sem execução registrada','vazio','')}
      ${linha('Redes sociais','sem conta ligada','vazio','')}
      ${linha('Relatórios','dependem das fontes acima','vazio','')}</div></div>`;

function telaCrm(){
  if(!ST.funil.length){
    return head('Integração CRM','O funil vem do seu processo — o CRM não inventa etapas.')+
    `<div class="card"><h3>Defina o funil</h3><p class="hint" style="margin-bottom:11px">Uma etapa por linha, na ordem em que a venda anda.</p>
      <textarea id="funilTxt" rows="6" placeholder="Novo lead&#10;Qualificado&#10;Proposta enviada&#10;Negociação&#10;Fechado"></textarea>
      <div style="margin-top:10px"><button class="btn btn-p" onclick="salvarFunil()">Salvar funil</button></div></div>`;
  }
  const r=ST.resumo;
  return head('Integração CRM','Pipeline de vendas. O bot vai escrever aqui: cada mensagem vira interação, cada qualificação vira score auditável.')+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Abertos',r.abertos,'no funil')}${kpi('Ganhos',r.ganhos,'fechados')}${kpi('Perdidos',r.perdidos,'fechados')}
    ${kpi('Conversão',r.conversao==null?'—':Math.round(r.conversao*100)+'%',r.conversao==null?'sem fechamento ainda':'ganhos ÷ fechados')}</div>
  <div class="card" style="margin-bottom:16px"><h3>Novo lead</h3><p class="hint" style="margin-bottom:11px">Telefone sem DDI recebe o 55 automático.</p>
    <div class="form-grid">
      <div class="field"><label>Nome</label><input id="nome" placeholder="Carla Souza"></div>
      <div class="field"><label>WhatsApp</label><input id="telefone" placeholder="31975127978"></div>
      <div class="field"><label>Interesse</label><input id="interesse" placeholder="Plano médio"></div>
      <div class="field"><label>Valor (R$)</label><input id="valor" type="number" step="any" placeholder="1490"></div>
      <button class="btn btn-p" onclick="criar()">Adicionar lead</button></div></div>
  <div class="board">${ST.funil.map(colHtml).join('')}</div>`;
}
function colHtml(etapa){
  const et=ST.resumo.etapas.find(e=>e.etapa===etapa)||{leads:0,valor:null};
  const g=ST.leads.filter(l=>l.status==='aberto'&&l.etapa===etapa);
  return `<div class="col"><div class="col-h"><h3>${esc(etapa)}</h3><span class="n">${et.leads}</span><span class="v">${brl(et.valor)}</span></div>
   ${g.map(cardLead).join('')||'<div class="hint" style="padding:12px 0;text-align:center">vazio</div>'}</div>`;
}
function cardLead(l){
  const tags=[l.faixa?`<span class="tag t-${esc(l.faixa)}">${esc(l.faixa)}${l.score!=null?' · '+l.score:''}</span>`:'',
   l.telefoneAviso?`<span class="tag t-morno">telefone suspeito</span>`:'',

function trocaModelo(){

function renderNav(){
  document.getElementById('nav').innerHTML=GRUPOS.map(g=>
   `<div class="sec-label">${esc(g.secao)}</div>`+g.itens.map(m=>{
    if(!m.filhos) return `<button class="nav-item${rota===m.id?' active':''}" onclick="ir('${m.id}')">${ico(m.icone)}<span>${esc(m.nome)}</span></button>`;
    const ab=abertos.has(m.id);
    return `<button class="nav-item${m.filhos.some(f=>f.id===rota)&&!ab?' active':''}" aria-expanded="${ab}" onclick="toggleSub('${m.id}')">${ico(m.icone)}<span>${esc(m.nome)}</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="submenu${ab?' open':''}">${m.filhos.map(f=>`<button class="sub-item${rota===f.id?' active':''}" onclick="ir('${f.id}')">${esc(f.nome)}</button>`).join('')}</div>`;
   }).join('')).join('');
}
function render(){
  renderNav();
  const t=TITULO[rota]||['Console'];
  document.getElementById('crumb').innerHTML=t.map((x,i)=>i===t.length-1?`<b>${esc(x)}</b>`:`<span class="pai">${esc(x)} <i>/</i></span>`).join(' ');
  document.getElementById('view').innerHTML=(TELAS[rota]||telaVisao)();
  if(rota==='indicacao') trocaModelo();
  document.getElementById('pillLeads').textContent=ST.resumo.abertos+' lead(s) aberto(s)';
  const w=STATUS?.whatsapp||{};
  document.getElementById('pillWa').innerHTML=`<span class="dot ${w.envia?'on':''}"></span> WhatsApp ${w.envia?'ativo':'inativo'}`;
}
function ir(id){rota=id;if(PAI[id])abertos.add(PAI[id]);location.hash=id;toggleNav(false);render();scrollTo(0,0);}
function toggleSub(id){abertos.has(id)?abertos.delete(id):abertos.add(id);renderNav();}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==rota){rota=h;render();}});

      <div class="entrar-box">
        <h2 id="lgTitulo">Entrar no console</h2>
        <p class="entrar-sub" id="lgSub">Use a senha de acesso do console.</p>

        <div class="field" style="margin-top:20px">
          <label for="lgSenha" id="lgRotulo">Senha de acesso</label>
          <div class="senha-wrap">
            <input id="lgSenha" type="password" autocomplete="current-password"
              placeholder="••••••••" aria-describedby="lgErro" autofocus>
            <button type="button" id="lgOlho" class="olho" aria-label="Mostrar senha">ver</button>
          </div>
          <div id="lgErro" class="campo-erro" role="alert"></div>
          <div id="lgCaps" class="campo-dica">Caps Lock está ligado.</div>
        </div>

        <!-- Confirmação só aparece no primeiro acesso: pedir duas vezes uma
             senha que a pessoa já tem é atrito sem motivo. -->
        <div class="field" id="lgCampo2" style="margin-top:14px;display:none">
          <label for="lgSenha2">Repita a senha</label>
          <div class="senha-wrap">
            <input id="lgSenha2" type="password" autocomplete="new-password" placeholder="••••••••">
          </div>
        </div>

        <button class="btn btn-p entrar-btn" id="lgBtn">Entrar</button>

        <div class="entrar-ajuda" id="lgAjuda">
          <b>Não sabe a senha?</b>
          <p>Quem definiu o acesso deste console sabe qual é. Se for uma instalação
          nova, a primeira tela pede para você criar a sua.</p>
        </div>
      </div>

      <p class="entrar-rodape">Veloso Solution · ${new Date().getFullYear()}</p>
    </div>
  </div>`;

  const campo=document.getElementById('lgSenha');
  const btn=document.getElementById('lgBtn');
  const erro=document.getElementById('lgErro');
  const caps=document.getElementById('lgCaps');

  const mostrarErro=(m)=>{
    erro.textContent=m;
    erro.classList.add('on');
    campo.classList.add('erro');
    campo.focus();
    campo.select();
  };
  const limparErro=()=>{erro.classList.remove('on');campo.classList.remove('erro');};

  document.getElementById('lgOlho').onclick=()=>{
    const ver=campo.type==='password';
    campo.type=ver?'text':'password';
    document.getElementById('lgOlho').textContent=ver?'ocultar':'ver';
    campo.focus();
  };

  // Caps Lock ligado é a causa silenciosa mais comum de "a senha não funciona".
  const verCaps=(e)=>{ caps.classList.toggle('on', e.getModifierState && e.getModifierState('CapsLock')); };
  campo.addEventListener('keyup',verCaps);
  campo.addEventListener('keydown',verCaps);
  campo.addEventListener('input',limparErro);

  const campo2=document.getElementById('lgSenha2');
  campo2.addEventListener('input',limparErro);

  /* Primeiro acesso: o console nunca teve senha. Em vez de pedir uma senha
     que ninguém tem como saber, ele pede para o dono criar a dele. É a
     diferença entre um produto licenciado e um script de linha de comando. */
  let criando=false;
  const virarCriacao=()=>{
    criando=true;
    document.getElementById('lgTitulo').textContent='Criar o acesso';
    document.getElementById('lgSub').textContent=
      'Este console ainda não tem senha. Defina a sua — ela fica só nesta instalação.';
    document.getElementById('lgRotulo').textContent='Nova senha (mínimo 8 caracteres)';
    document.getElementById('lgCampo2').style.display='';
    campo.setAttribute('autocomplete','new-password');
    btn.textContent='Criar e entrar';
    document.getElementById('lgAjuda').innerHTML=
      '<b>Só você define esta senha.</b><p>Ela não é enviada a lugar nenhum: fica guardada '+
      'nesta máquina, com hash. Para trocar depois, use Configurações dentro do console.</p>';
  };

  const abrirPainel=(senha)=>{
    TOKEN=senha;
    sessionStorage.setItem('crm_token',TOKEN);
    document.body.classList.remove('sem-nav');
    carregar();
  };

  const enviar=async()=>{
    if(!campo.value){ return mostrarErro(criando?'Escolha uma senha.':'Digite a senha de acesso.'); }
    if(criando){
      if(campo.value.length<8){ return mostrarErro('A senha precisa de pelo menos 8 caracteres.'); }
      if(campo.value!==campo2.value){
        erro.textContent='As duas senhas não são iguais.';
        erro.classList.add('on');campo2.classList.add('erro');campo2.focus();
        return;
      }
    }
    btn.disabled=true;btn.textContent=criando?'Criando…':'Entrando…';limparErro();
    try{
      if(criando){ await api('criar-acesso',{senha:campo.value}); }
      else{ await api('entrar',{senha:campo.value}); }
      abrirPainel(campo.value);
    }catch(e){
      btn.disabled=false;btn.textContent=criando?'Criar e entrar':'Entrar';
      // O servidor avisa quando a instalação ainda não tem senha; a tela vira
      // criação em vez de repetir "senha incorreta" para sempre.
      if(e.message==='primeiro acesso'){ virarCriacao();btn.disabled=false;return campo.focus(); }
      mostrarErro(e.message==='senha incorreta'
        ? 'Senha incorreta. Se esta instalação é nova, recarregue para criar a sua.'
        : e.message);
    }
  };
  btn.onclick=enviar;
  campo.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  campo2.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  campo.focus();

  // Pergunta o estado antes de mostrar a tela errada por meio segundo.
  fetch('/crm/api/auth').then(r=>r.json()).then(d=>{ if(d && d.precisaCriar){ virarCriacao(); } })
    .catch(()=>{});
}

async function carregar(){
  try{
    // O diagnostico do TikTok nao pode derrubar o painel inteiro se o backend for antigo.
    [ST,STATUS,IND,REDES,TK,EST]=await Promise.all([api('painel'),api('status'),api('indicacao'),api('redes'),
      api('tiktok').catch(()=>null),api('estoque').catch(()=>null)]);
    // O Quebra-Galho é outro processo: se estiver fora do ar, a tela dele avisa —
    // e o resto do painel continua funcionando normalmente.
    QG=await api('quebragalho').catch(()=>null);
    TKAPP=await api('tiktok/app').catch(()=>null);
    if(TKAPP&&TKAPP.diagnostico) TK=TKAPP.diagnostico;
    // Telas novas: carregadas a parte pra uma falha nelas nao derrubar o painel todo.
    [AUD,FIN,REL,CTA]=await Promise.all([api('auditor').catch(()=>null),api('financeiro').catch(()=>null),
      api('relatorios').catch(()=>null),api('conta').catch(()=>null)]);
    document.getElementById('envDot').className='dot on';
    document.getElementById('envName').textContent='Backend online';
    document.getElementById('envSub').textContent=location.host;
  }catch(e){
    document.getElementById('envName').textContent='Backend fora';
    document.getElementById('envSub').textContent=e.message.slice(0,26);
    flash('Não consegui carregar: '+e.message,'err');
  }
  render();
}

async function baixarFeed(canal){
  // O feed é ARQUIVO (XML/CSV), não JSON. Não dá pra usar <a download> porque ele não
  // manda header, e o token do painel só viaja em header de propósito — na querystring
  // ele acabaria gravado no log de acesso do servidor.
  try{
    const res=await fetch('/crm/api/estoque/exportar?canal='+encodeURIComponent(canal),
      {headers:TOKEN?{'x-crm-token':TOKEN}:{}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const nome=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||canal;
    const incl=res.headers.get('x-vs-incluidos'), rec=res.headers.get('x-vs-recusados');
    const url=URL.createObjectURL(await res.blob());
    const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    flash(Number(rec)?`${nome}: ${incl} produto(s). ${rec} ficaram de fora por campo faltando.`
                     :`${nome}: ${incl} produto(s).`, Number(rec)?'err':'ok');
  }catch(e){flash('Não consegui gerar o arquivo: '+e.message,'err');}
}

  render();
}

/** Decide entre criar acesso, login e dashboard antes de qualquer dado. */
(async function porta(){
  let est={exigeSenha:true};
  try{ est=await api('auth'); }catch{ /* backend antigo: pede senha assim mesmo */ }

  /* Instalacao nova: vai para a tela, que se vira em "criar acesso". Antes
     daqui saia direto para o dashboard — a regra velha era "sem CRM_TOKEN,
     painel aberto". Hoje o servidor bloqueia, entao seguir em frente so
     renderizava um painel que responde 403 em tudo. */
  if(est.precisaCriar){ return telaEntrar(); }

  if(!est.exigeSenha){ document.body.classList.remove('sem-nav'); return carregar(); }
  if(TOKEN){
    try{ await api('entrar',{senha:TOKEN}); document.body.classList.remove('sem-nav'); return carregar(); }
    catch{ /* token velho: cai na tela de entrada */ }
  }
  telaEntrar();
})();
</script>
