  try{
    const r=await api('clientes/salvar',f);
    CLIENTES=await api('clientes');
    flash(f.id?'Cliente atualizado.':'Cliente cadastrado. Próximo passo: gerar o contrato.','ok');
    abrirCliente(r.cliente.id);
  }catch(e){ avisoErro('Não consegui salvar o cliente',e.message.includes(';')?'Corrija o que está abaixo:':e.message,e.message.includes(';')?e.message.split('; '):null); }
}

function passo(n,titulo,feito,corpo){
  return `<div class="card" style="margin-bottom:14px${feito?'':';border-style:dashed'}">
    ${cardH(feito?'check':'relogio',`${n}. ${titulo}`,'',feito?2:5,`<span class="badge ${feito?'b-ok':'b-warn'}">${feito?'feito':'pendente'}</span>`)}
    ${corpo}</div>`;
}

function telaClienteDetalhe(c){
  const l=c.liberacoes, k=(c.contratos||[]).at(-1), cob=(c.cobrancas||[]).find(x=>x.estado==='AGUARDANDO');
  const lic=c.licencaVigente;
  const liberado=[`${l.operadores??'∞'} operador(es)`,`${l.campanhasMes??'∞'} campanha(s)/mês`,`banda ${l.bandaGbMes==null?'ilimitada':l.bandaGbMes+' GB/mês'}`,
    l.auditor?'auditor':null,l.botFunil?'bot de funil':null,...(l.redes||[])].filter(Boolean).join(' · ');
  const pagas=(c.cobrancas||[]).filter(x=>x.estado==='PAGA');

  return head(c.nome,`${fmtWa(c.whatsapp)} · ${c.tipoDocumento} ${fmtDoc(c.documento)}`,
      botao({t:'Voltar',ic:'ant',v:'g',on:'voltarClientes()'})+botao({t:'Editar',ic:'editar',v:'s',on:`editarCliente('${c.id}')`}))+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Situação',c.situacao.texto,c.situacao.proximo||'tudo em dia')}
    ${kpi('Produto',c.produtos.map(nomeOferta).join(' + '),c.ciclo==='anual'?'anual':'mensal')}
    ${kpi('Valor do ciclo',k?reais(k.valorCiclo):'—',k?'conforme contrato '+k.numero:'gere o contrato')}
    ${kpi('Chave',lic?lic.codigo:'—',lic?'válida até '+dataBr(lic.validaAte):'ainda não emitida')}
  </div>
  ${(()=>{ const passos=[['Contrato',!!k&&!c.contratoDesatualizado],['Assinatura gov.br',!!k?.assinadoEm],['Pagamento',pagas.length>0||!!lic],['Chave',!!lic]];
    const atualI=passos.findIndex(x=>!x[1]);
    return `<div class="cli-etapas">${passos.map(([nm,ok],i)=>`<div class="cli-etapa ${ok?'ok':i===atualI?'agora':''}"><i>${ok?ico('check'):i+1}</i><span>${nm}</span></div>`).join('<b></b>')}</div>`; })()}
  <div class="cli-lib">${[['Operadores',l.operadores??'∞'],['Campanhas/mês',l.campanhasMes??'∞'],['Banda/mês',l.bandaGbMes==null?'ilimitada':l.bandaGbMes+' GB'],
    ['Auditor',l.auditor?'sim':'não'],['Bot de funil',l.botFunil?'sim':'não'],['Redes',(l.redes||[]).map(x=>({tiktok:'TikTok',instagram:'Instagram'})[x]||x).join(', ')||'—']]
    .map(([t,v])=>`<div><small>${t}</small><b>${esc(String(v))}</b></div>`).join('')}</div>`+

  passo(1,'Contrato',!!k&&!c.contratoDesatualizado,
    (c.contratoDesatualizado?`<p class="hint" style="color:var(--err)">O cadastro mudou depois do contrato ${esc(k.numero)}. Gere o contrato novo — o antigo fica guardado.</p>`:'')+
    (k?linha('Contrato '+k.numero,`gerado em ${dataBr(k.geradoEm)} · ${reais(k.valorCiclo)} por ciclo`,'versão '+k.versao,'b-ok'):'<p class="hint">O contrato sai com os dados, o valor e tudo que foi liberado.</p>')+
    `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center">
      ${botao({t:k?'Gerar nova versão':'Gerar contrato',ic:'gerar',v:k&&!c.contratoDesatualizado?'s':'p',on:`gerarContratoCliente('${c.id}')`,id:'btContrato'})}
      ${k?botao({t:'Baixar PDF',ic:'baixar',v:'s',on:`baixarContrato('${c.id}',${k.versao},false)`}):''}
      ${k?botao({t:'Mandar no WhatsApp',ic:'enviar',v:'s',on:`enviarContratoCliente('${c.id}',${k.versao})`,id:'btEnviarContrato'}):''}
      <label class="sw"><input type="checkbox" id="clEnviarContrato" checked><span class="trilho"></span>ao gerar, já mandar no WhatsApp</label>
    </div>`)+

  passo(2,'Assinatura no gov.br',!!k?.assinadoEm,
    (k?.assinado?linha('PDF assinado recebido',`${k.assinado.assinaturas} assinatura(s)${k.assinado.govbr?' · gov.br':' · não parece gov.br'}${k.assinado.signatarios?.length?' · '+esc(k.assinado.signatarios.join(', ')):''}`,
        dataBr(k.assinado.recebidoEm),k.assinado.govbr?'b-ok':'b-warn'):'')+
    `<p class="hint">A cliente abre <b>assinador.iti.br</b>, entra com a conta gov.br (nível prata ou ouro), assina o PDF e devolve o arquivo assinado.
      Você também assina o mesmo arquivo. Depois envie aqui o PDF final — o sistema confere se é <b>este</b> contrato e se tem assinatura.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input type="file" id="clPdfAss" accept="application/pdf" style="max-width:280px" ${k?'':'disabled'}>
      ${botao({t:'Enviar PDF assinado',ic:'importar',v:'s',on:`enviarAssinado('${c.id}')`,off:!k})}
      ${k?.assinado?botao({t:'Baixar assinado',ic:'baixar',v:'g',on:`baixarContrato('${c.id}',${k.versao},true)`}):''}
    </div>`)+

  passo(3,'Pagamento',!!pagas.length&&!cob,
    (cob?`${linha('Cobrança '+cob.n,`gerada em ${dataBr(cob.criadaEm)} · Pix ou cartão`,reais(cob.valorCentavos),'b-warn')}
      ${cob.link?`<p class="hint" style="word-break:break-all">Link: <a href="${esc(cob.link)}" target="_blank" rel="noopener">${esc(cob.link)}</a></p>`:''}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${botao({t:'Reenviar link no WhatsApp',ic:'enviar',v:'s',on:`acaoCliente('reenviar-cobranca','${c.id}','Link reenviado.')`})}
        ${botao({t:'Cancelar cobrança',ic:'fechar',v:'g',on:`cancelarCobrancaCliente('${c.id}')`})}
      </div>`
    :`<p class="hint">Gera o link do Mercado Pago (Pix ou cartão) no valor do contrato e manda no WhatsApp dela. Quando o pagamento cair, a chave sai sozinha.</p>
      ${botao({t:lic||pagas.length?'Gerar cobrança de renovação':'Gerar cobrança e mandar no WhatsApp',ic:'comprar',v:'p',on:`cobrarCliente('${c.id}')`,off:!k||c.contratoDesatualizado,id:'btCobrar'})}
      ${k&&!k.assinadoEm?'<p class="hint" style="margin-top:8px">O contrato ainda não voltou assinado. Dá pra cobrar assim mesmo, mas o ideal é receber a assinatura antes.</p>':''}`)+
    (pagas.length?`<div style="margin-top:12px">${pagas.map(p=>linha('Cobrança '+p.n+(p.manual?' (liberação manual)':''),`paga em ${dataBr(p.pagaEm)}`,reais(p.valorCentavos),'b-ok')).join('')}</div>`:''))+

  passo(4,'Chave de ativação',!!lic,
    (lic?`${linha(lic.codigo,`válida até ${dataBr(lic.validaAte)}`,lic.entregue?'entregue no WhatsApp':'NÃO entregue',lic.entregue?'b-ok':'b-err')}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        ${botao({t:'Reenviar chave',ic:'enviar',v:'s',on:`acaoCliente('reenviar-chave','${c.id}','Chave reenviada.')`})}
        ${botao({t:'Copiar chave',ic:'copiar',v:'g',on:`navigator.clipboard.writeText('${esc(lic.codigo)}').then(()=>flash('Chave copiada.','ok'))`})}
        ${botao({t:'Revogar',ic:'excluir',v:'dan',on:`revogarCliente('${c.id}')`})}
      </div>`
    :`<p class="hint">A chave é gerada e mandada no WhatsApp <b>${esc(fmtWa(c.whatsapp))}</b> assim que o Mercado Pago confirma o pagamento.
      Se ela pagou por fora (Pix direto na sua conta), libere na mão — o motivo fica registrado.</p>
      ${botao({t:'Liberar sem cobrança (pagou por fora)',ic:'check',v:'s',on:`liberarManualCliente('${c.id}')`,off:!k})}`))+

  `<div class="card">${cardH('relatorios','Histórico','',4)}
    ${(c.historico||[]).slice().reverse().map(h=>linha(h.o,h.erro?esc(h.erro):(h.numero||h.codigo||h.referencia||''),new Date(h.em).toLocaleString('pt-BR').slice(0,17),h.erro?'b-err':'')).join('')}</div>`;
}

async function recarregarClientes(){ CLIENTES=await api('clientes'); render(); }

async function gerarContratoCliente(id){
  const b=document.getElementById('btContrato'); if(b){b.disabled=true;b.querySelector('span').textContent='Gerando PDF…';}
  const enviar=!!document.getElementById('clEnviarContrato')?.checked;
  try{
    const r=await api('clientes/contrato',{id,enviar});
    await recarregarClientes();
    if(enviar&&r.envio&&!r.envio.ok) avisoErro('Contrato gerado, mas NÃO foi pro WhatsApp',`O PDF está pronto — baixe e mande na mão. Motivo: ${esc(r.envio.erro||'?')}`);
    else flash(`Contrato ${r.contrato.numero} gerado${enviar?' e enviado no WhatsApp':''}.`,'ok');
  }catch(e){ avisoErro('Não consegui gerar o contrato',esc(e.message)); render(); }
}

async function enviarContratoCliente(id,versao){
  const b=document.getElementById('btEnviarContrato'); if(b){b.disabled=true;b.querySelector('span').textContent='Enviando…';}
  try{ await api('clientes/enviar-contrato',{id,versao}); await recarregarClientes(); flash('Contrato enviado no WhatsApp.','ok'); }
  catch(e){ await recarregarClientes().catch(()=>{}); avisoErro('O contrato NÃO foi pro WhatsApp',`Baixe o PDF e mande na mão. Motivo: ${esc(e.message)}`); }
}

async function baixarContrato(id,v,assinado){
  try{
    const res=await fetch(`/crm/api/clientes/contrato.pdf?id=${encodeURIComponent(id)}&v=${v}${assinado?'&assinado=1':''}`,{headers:{'x-crm-token':TOKEN}});
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.erro||'HTTP '+res.status); }
    const nome=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||'contrato.pdf';
    const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(await res.blob()),download:nome});
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  }catch(e){ avisoErro('Não consegui baixar o contrato',esc(e.message)); }
}

async function enviarAssinado(id){
  const f=document.getElementById('clPdfAss')?.files?.[0];
  if(!f) return avisoErro('Escolha o arquivo','Selecione o PDF assinado que voltou do gov.br.');
  try{
    const res=await fetch(`/crm/api/clientes/assinado?id=${encodeURIComponent(id)}`,{method:'POST',headers:{'content-type':'application/pdf','x-crm-token':TOKEN},body:f});
    const j=await res.json().catch(()=>({erro:'resposta inválida do servidor'}));
    if(!res.ok||j.erro) throw new Error(j.erro||'HTTP '+res.status);
    await recarregarClientes();
    if(j.avisos?.length) avisoErro('PDF aceito, com ressalvas','O contrato assinado foi guardado. Confira:',j.avisos);
    else flash('Contrato assinado recebido e conferido.','ok');
  }catch(e){ avisoErro('PDF recusado',esc(e.message)); }
}

async function cobrarCliente(id){
  const b=document.getElementById('btCobrar'); if(b){b.disabled=true;b.querySelector('span').textContent='Gerando cobrança…';}
  try{
    const r=await api('clientes/cobrar',{id});
    await recarregarClientes();
    if(r.envio&&!r.envio.ok) avisoErro('Cobrança gerada, mas o link NÃO foi pro WhatsApp',`Copie o link na tela e mande na mão. Motivo: ${esc(r.envio.erro||'?')}`);
    else flash('Cobrança gerada e link enviado no WhatsApp.','ok');
  }catch(e){ avisoErro('Não consegui gerar a cobrança',esc(e.message)); render(); }
}

async function acaoCliente(rota,id,ok){
  try{ const r=await api('clientes/'+rota,{id}); await recarregarClientes(); flash(ok,'ok'); return r; }
  catch(e){ avisoErro('Não consegui concluir',esc(e.message)); }
}

function cancelarCobrancaCliente(id){

function revogarCliente(id){

/* ---- Planos e checkout ----
   Cada serviço é uma chave: ligou, entrou no plano. O preço vem da tabela
   de engine/vsclientes (a mesma do contrato e da cobrança) — a tela não
   calcula preço por conta própria além do resumo, e o valor cobrado é sempre
   o do contrato, decidido no servidor. */
let PL={modulo:'whatsapp',ciclo:'mensal',sel:[]}, CKCFG=null;
let CK={passo:'dados',form:{},metodo:'pix'};
let CK_TIMER=null, CK_BRICK=null;

/* Bronze / Prata / Gold vêm do catálogo (engine/vsplanos) — é dado, não tela. */
const planoOfertas=()=>(CKCFG?.ofertas||[]).filter(o=>o.catalogo&&o.ativo!==false);
const precoCiclo=(o,ciclo)=>ciclo==='semestral'?o.semestralMensal:(ciclo==='anual'?o.anualMensal:o.mensal);
const MESES={mensal:1,semestral:6,anual:12};
const MODULOS_PL=[['whatsapp','WhatsApp'],['telegram','Telegram'],['redes','Redes sociais'],['combo','WhatsApp + Redes']];
function totalPlano(){
  let mensal=0,cheio=0;
  for(const c of PL.sel){ const o=planoOfertas().find(x=>x.code===c); if(!o) continue; mensal+=precoCiclo(o,PL.ciclo); cheio+=o.mensal; }
  const m=MESES[PL.ciclo]||1;
  return {mensal,total:mensal*m,economia:(cheio-mensal)*m};
}
function inclusosPlano(o){
  const l=o.liberacoes, lim=(v,s)=>v==null?`${s} ilimitados`:`${v} ${s}`;
  return [
    o.modulo!=='redes'?`${l.operadores} atendente${l.operadores>1?'s':''} no ${o.modulo==='telegram'?'Telegram':'WhatsApp'}`:null,
    o.modulo!=='redes'?'Bot 24h com funil de vendas':null,
    ['redes','combo'].includes(o.modulo)?`${l.contasRedes||2} contas de rede social (TikTok e Instagram)`:null,
    o.produtosLimite!=null?`${o.produtosLimite} produtos no catálogo`:'Produtos ilimitados',
    lim(l.campanhasMes,'campanhas por mês').replace(/^(\d+) campanhas/,'$1 campanhas'),
    l.bandaGbMes==null?'Banda ilimitada':`${l.bandaGbMes} GB de banda por mês`,
    l.auditor?'Auditor completo':'Auditor básico',
  ].filter(Boolean);
}

function telaPlanos(){
  if(!CKCFG) return head('Planos e preços','Os planos do Bolso Cheio.')+
    vazio('plano','Backend sem a rota de checkout','Reinicie o painel para carregar o módulo novo.',['Reiniciar o painel','Recarregar']);
  const sem=PL.ciclo==='semestral';
  const planos=planoOfertas().filter(o=>o.modulo===PL.modulo).sort((a,b)=>a.mensal-b.mensal);
  const card=(o)=>{
    const preco=precoCiclo(o,PL.ciclo);
    return `<div class="tier${o.destaque?' destaque':''}">
      ${o.destaque?'<span class="tier-selo">Mais escolhido</span>':''}
      <h4>${esc(o.tier)}</h4>
      <div class="tier-preco"><b>${reais(preco)}</b><small>/mês</small></div>
      <p class="tier-sub">${sem?`${reais(preco*6)} no semestre · economiza ${reais((o.mensal-preco)*6)}`:`ou ${reais(o.semestralMensal)}/mês no semestral`}</p>
      ${botao({t:'Assinar '+o.tier,ic:'comprar',v:o.destaque?'p':'s',on:`assinarPlanoCk('${o.code}')`,extra:'tier-bt'})}
      <ul class="tier-lista">${inclusosPlano(o).map(i=>`<li>${ico('check')}<span>${esc(i)}</span></li>`).join('')}</ul>
    </div>`;
  };
  const contato=`https://wa.me/${esc(CKCFG.contato)}?text=${encodeURIComponent('Olá! Preciso de algo além dos planos do Bolso Cheio.')}`;
  return head('Planos e preços','Três planos por módulo. O que for diferente disso entra como adendo.',
    `<div class="seg">
      <button class="${!sem?'on':''}" onclick="PL.ciclo='mensal';render()">Mensal</button>
      <button class="${sem?'on':''}" onclick="PL.ciclo='semestral';render()">Semestral <em>−10%</em></button>
    </div>`)+
  avisoModoTeste()+
  `<div class="seg seg-mod">${MODULOS_PL.map(([k,n])=>`<button class="${PL.modulo===k?'on':''}" onclick="PL.modulo='${k}';render()">${n}</button>`).join('')}</div>
  <div class="tier-grade">${planos.map(card).join('')||'<p class="hint">Nenhum plano ativo neste módulo.</p>'}</div>
  <div class="tier-adendo">
    <span>Precisa de mais atendentes, marketplace ou é uma empresa maior? <b>Isso entra como adendo.</b></span>
    <a class="btn btn-g btn-xs" href="${contato}" target="_blank" rel="noopener">${ico('whats')}<span>Falar com a gente</span></a>
  </div>
`;
}
function assinarPlanoCk(code){ PL.sel=[code]; irCheckout(); }

/* Modo teste: aviso VERMELHO onde houver preço, pra ninguém esquecer ligado. */
function avisoModoTeste(){
  const t=CKCFG?.modoTeste; if(!t?.ativo) return '';
  const ate=new Date(t.ate).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return `<div class="card" style="margin-bottom:16px;border-color:var(--err);background:var(--err-bg)">
    <b style="color:var(--err)">MODO TESTE LIGADO — toda cobrança sai por R$ 0,50</b>
    <p class="hint" style="margin:4px 0 8px">Desliga sozinho às ${ate}. A chave de um pagamento de teste vale só 1 dia.</p>
    ${botao({t:'Desligar agora',ic:'power',v:'dan',sz:'xs',on:'alternarModoTeste(false)'})}</div>`;
}
async function alternarModoTeste(ligar){
  try{
    const r=await api('checkout/modo-teste',{ligar});
    CKCFG={...CKCFG,modoTeste:{ativo:r.ativo,ate:r.ate}}; render();
    flash(r.ativo?'Modo teste ligado: cobranças por R$ 0,50 pelas próximas 2 horas.':'Modo teste desligado: valor cheio de novo.','ok');
  }catch(e){ avisoErro('Não consegui mudar o modo teste',esc(e.message)); render(); }
}

function irCheckout(){
  if(!PL.sel.length) return;
  CK={passo:'dados',form:CK.form||{},metodo:CK.metodo||'pix'};
  pararEspera(); ir('pl-checkout');
}

/* ---------- checkout ---------- */
function pararEspera(){ if(CK_TIMER){clearInterval(CK_TIMER);CK_TIMER=null;} if(CK_BRICK){try{CK_BRICK.unmount();}catch{} CK_BRICK=null;} }

function resumoPedido(){
  const m=MESES[PL.ciclo]||1, t=CK.contrato?{total:CK.contrato.valorCiclo}:totalPlano();
  const nomeCiclo={mensal:'Mensal',semestral:'Semestral — 6 meses',anual:'Anual — 12 meses'}[PL.ciclo];
  return `<div class="card ck-resumo">
    <h3>Resumo</h3>
    ${PL.sel.map(c=>{const o=planoOfertas().find(x=>x.code===c);return o?`<div class="ck-linha"><span>${esc(o.nome)}</span><b>${reais(precoCiclo(o,PL.ciclo)*m)}</b></div>`:'';}).join('')}
    <div class="ck-linha hint"><span>Ciclo</span><span>${nomeCiclo}</span></div>
    ${m>1&&totalPlano().economia?`<div class="ck-linha"><span>Economia</span><span>− ${reais(totalPlano().economia)}</span></div>`:''}
    <div class="ck-total"><span>Total</span><b>${reais(t.total)}</b></div>
    ${CK.cobrar?.teste?`<div class="ck-linha" style="color:var(--err);font-weight:700"><span>Cobrança de TESTE</span><span>${reais(CK.cobrar.valorCentavos)}</span></div>`:''}
    ${CK.contrato?`<p class="hint" style="margin:10px 0 0">Contrato ${esc(CK.contrato.numero)}</p>`:''}
    ${CK.passo==='dados'?botao({t:'Trocar de plano',ic:'ant',v:'g',sz:'xs',on:"pararEspera();ir('pl-planos')"}):''}
  </div>`;
}

function telaCheckout(){
  if(!CKCFG||!PL.sel.length){ setTimeout(()=>ir('pl-planos')); return ''; }
  const passos=['dados','pagar','fim'], at=CK.passo==='dados'?0:CK.passo==='pagar'?1:2;
  const trilha=`<div class="ck-trilha">${['Seus dados','Pagamento','Pronto'].map((n,i)=>
    `<div class="${i<at?'feito':i===at?'agora':''}"><span>${i<at?ico('check'):i+1}</span>${n}</div>`).join('')}</div>`;
  let corpo='';
  if(CK.passo==='dados') corpo=ckDados();
  else if(CK.passo==='pagar') corpo=ckPagar();
  else corpo=ckFim();
  return head('Assinar o Bolso Cheio','Pagamento seguro pelo Mercado Pago — Pix ou cartão.')+avisoModoTeste()+trilha+

async function ckContinuar(){
  const v=(id)=>document.getElementById(id)?.value.trim()||'';
  CK.form={nome:v('ckNome'),documento:v('ckDoc'),whatsapp:v('ckWa'),email:v('ckEmail'),aceite:!!document.getElementById('ckAceite')?.checked};
  if(!CK.form.aceite) return avisoErro('Falta aceitar o contrato','Ligue a chave <b>Li e aceito o contrato</b> para continuar.');
  const b=document.getElementById('ckBtDados'); if(b){b.disabled=true;b.querySelector('span').textContent='Preparando o contrato…';}
  try{
    const r=await api('checkout/iniciar',{...CK.form,produtos:PL.sel,ciclo:PL.ciclo});
    CK={...CK,passo:'pagar',clienteId:r.clienteId,contrato:r.contrato,cobrar:r.cobrar};
    render();
  }catch(e){
    render();
    const lista=e.message.includes(';')?e.message.split('; '):null;
    avisoErro('Confira seus dados',lista?'Corrija o que está abaixo:':esc(e.message),lista);

function ckMetodo(m){ if(CK.metodo===m) return; pararEspera(); CK.metodo=m; render(); if(m==='cartao') montarCartao(); else if(CK.pix) esperarPagamento(); }

async function ckGerarPix(){
  const b=document.getElementById('ckBtPix'); if(b){b.disabled=true;b.querySelector('span').textContent='Gerando o Pix…';}
  try{
    const r=await api('checkout/pix',{id:CK.clienteId});
    CK.pix=r.cobranca; CK.ref=r.cobranca.referencia; render(); esperarPagamento();
  }catch(e){ render(); avisoErro('Não consegui gerar o Pix',esc(e.message)); }
}

function esperarPagamento(){
  pararEspera();
  const inicio=Date.now();
  CK_TIMER=setInterval(async()=>{
    if(rota!=='pl-checkout'||Date.now()-inicio>30*60000){ pararEspera(); return; }
    try{
      const e=await api(`checkout/estado?id=${encodeURIComponent(CK.clienteId)}&ref=${encodeURIComponent(CK.ref)}`);
      if(e.estado==='PAGA'){ pararEspera(); CK={...CK,passo:'fim',resultado:{aprovado:true,codigo:e.codigo,validaAte:e.validaAte,entregue:e.entregue,metodo:'pix'}}; render(); }
    }catch{}
  },4000);
}

async function carregarSdkMp(){
  if(window.MercadoPago) return;
  await new Promise((ok,falha)=>{const s=document.createElement('script');s.src='https://sdk.mercadopago.com/js/v2';s.onload=ok;s.onerror=()=>falha(new Error('não consegui carregar o Mercado Pago — confira a internet'));document.head.appendChild(s);});
}

async function montarCartao(){
  try{
    await carregarSdkMp();
    if(CK.metodo!=='cartao'||!document.getElementById('ckCartao')) return;
    document.getElementById('ckCartao').innerHTML='';
    const mp=new MercadoPago(CKCFG.cartao.publicKey,{locale:'pt-BR'});
    const escuro=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
    CK_BRICK=await mp.bricks().create('cardPayment','ckCartao',{
      initialization:{amount:(CK.cobrar?.valorCentavos??CK.contrato.valorCiclo)/100,payer:{email:CK.form.email}},
      customization:{visual:{style:{theme:escuro?'dark':'default'}},paymentMethods:{maxInstallments:CK.cobrar?.teste?1:(MESES[PL.ciclo]||1)}},
      callbacks:{
        onReady:()=>{},
        onError:(e)=>console.warn('[cartao]',e),
        onSubmit:async(fd)=>{
          try{
            const r=await api('checkout/cartao',{id:CK.clienteId,cartao:{token:fd.token,bandeira:fd.payment_method_id,emissor:fd.issuer_id,
              parcelas:fd.installments,email:fd.payer?.email,documento:fd.payer?.identification?.number}});
            pararEspera();
            CK={...CK,passo:'fim',ref:r.referencia,resultado:{...r,metodo:'cartao'}}; render();
            if(r.emAnalise){ esperarPagamento(); }
          }catch(e){ pararEspera(); CK={...CK,passo:'fim',resultado:{aprovado:false,recusado:true,mensagem:e.message,metodo:'cartao'}}; render(); }
        },
      },
    });
  }catch(e){ const a=document.getElementById('ckCartao'); if(a) a.innerHTML=`<p class="hint" style="color:var(--err)">${esc(e.message)}</p>`; }
}

function ckFim(){
  const r=CK.resultado||{};
  if(r.aprovado) return `<div class="card ck-fim ok">
    <div class="ck-selo">${ico('check')}</div>
    <h2>Pagamento aprovado!</h2>
    <p>${r.metodo==='pix'?'Recebemos o seu Pix.':'O cartão foi aprovado.'} Bem-vindo(a) ao Bolso Cheio.</p>
    <div class="ck-chave"><small>Sua chave de ativação</small><b>${esc(r.codigo||'—')}</b>
      <small>válida até ${dataBr(r.validaAte)}</small></div>
    <p class="hint">${r.entregue===false||r.envio?.ok===false?'<b style="color:var(--err)">Não consegui mandar no WhatsApp agora</b> — guarde a chave acima.':`Mandamos a chave também no WhatsApp <b>${esc(CK.form.whatsapp)}</b>.`}</p>
    <div class="ck-acoes">
      ${botao({t:'Copiar chave',ic:'copiar',v:'s',on:`navigator.clipboard.writeText('${esc(r.codigo||'')}').then(()=>flash('Chave copiada.','ok'))`})}
      ${botao({t:'Baixar o contrato',ic:'baixar',v:'s',on:`baixarContrato('${CK.clienteId}',${CK.contrato.versao},false)`})}
      <a class="btn btn-g" href="/ativar?c=${encodeURIComponent(r.codigo||'')}" target="_blank" rel="noopener">${ico('ver')}<span>Conferir a chave</span></a>
    </div></div>`;
  if(r.emAnalise) return `<div class="card ck-fim warn">
    <div class="ck-selo">${ico('relogio')}</div>
    <h2>Pagamento em análise</h2>
    <p>${esc(r.mensagem||'O Mercado Pago está analisando o pagamento.')}</p>
    <p class="ck-espera"><span class="giro"></span>Assim que aprovar, a chave chega no WhatsApp <b>${esc(CK.form.whatsapp)}</b>.</p></div>`;
  return `<div class="card ck-fim err">
    <div class="ck-selo">${ico('fechar')}</div>
    <h2>Pagamento não aprovado</h2>
    <p><b>${esc(r.mensagem||'O pagamento não foi aprovado.')}</b></p>
    <p class="hint">Nada foi cobrado. Você pode tentar de novo agora.</p>
    <div class="ck-acoes">
      ${botao({t:'Tentar com outro cartão',ic:'atualizar',v:'p',on:"CK.passo='pagar';CK.metodo='cartao';render();montarCartao()"})}
      ${botao({t:'Pagar com Pix',ic:'gerar',v:'s',on:"CK.passo='pagar';CK.metodo='pix';CK.pix=null;render()"})}
    </div></div>`;
}

function telaDesconectar(){
  const c=(CANAIS?.canais||[])[0]||null;

  return head('Desconectar do telefone','Tirar o bot do WhatsApp do aparelho.')+
  `<div class="grid g-kpi" style="margin-bottom:16px">

  </div>
  <div class="card" style="margin-bottom:16px">
    ${cardH('power','Pausar o bot','Fecha a sessão aqui e <b>guarda o login</b>. Para voltar, é só religar — <b>não precisa ler QR</b>. O telefone continua mostrando o Bolso Cheio em Aparelhos conectados.',5)}
    ${no_ar?botao({t:'Pausar o bot',ic:'power',v:'s',on:'desconectarCanal()'})

  <div class="card" style="border-color:var(--err-line)">
    ${cardH('alerta','Desconectar do telefone','Sai da conta de verdade: o aparelho <b>deixa de listar</b> o Bolso Cheio em Aparelhos conectados. Para voltar, o dono do número precisa <b>ler o QR de novo</b> no próprio telefone.',5)}

function despararCanal(){
  const c=(CANAIS?.canais||[])[0]||null;
  confirmar({titulo:'Desconectar do telefone?',
    texto:`O bot sai da conta${c?.numero?` <b>+${esc(c.numero)}</b>`:''} e o aparelho deixa de mostrar a sessão.`,
    consequencia:'Para voltar, o dono do número tem de ler o QR Code de novo. Até lá, ninguém é atendido.',
    rotulo:'Desconectar do telefone',icone:'excluir',perigo:true,
    aoConfirmar:async()=>{
      const r=await api('canais/desparear',{canal:'whatsapp-web'});
      CANAIS=await api('canais'); render();
      flash(r.saiu?'Desconectado do telefone. Para voltar, leia o QR.':'Bot desligado aqui. Confira no telefone, em Aparelhos conectados, se a sessão sumiu.','ok');
    }});
}

 financeiro:()=>{

 bot:()=>{
  const tgBot=BOT_CANAL==='telegram';
  const BOT=botDaTela();
  const tituloBot=tgBot?'Telegram · Bot':'Bot do WhatsApp';
  if(!BOT) return head(tituloBot,'Atendimento automático: regras, respostas e quando chamar gente.')+
    vazio('bot','Backend sem a rota do bot','Atualize o servidor.',['Subir o backend novo','Recarregar']);
  const c=BOT.config;
  /* O subtitulo tambem falava so de regras. Com fluxo no ar, ele descrevia um
     bot que nao e o que esta atendendo — e quem le acha que veio na tela errada. */
  return head(tituloBot,(tgBot?'<b>Bot só do Telegram</b> — nome, mensagens, regras, fluxo e horário próprios; mexer aqui não muda o WhatsApp. ':'')+((BOT.fluxo?.passos||[]).length
      ? 'A árvore de atendimento no ar, o que ela responde e quando chama gente. Teste aqui antes de qualquer cliente ver.'
      : 'Atendimento automático: regras, respostas e quando chamar gente. Funciona aqui antes de ligar em qualquer canal.'))+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${(()=>{
      /* Esta tela nasceu para o bot de REGRAS por palavra e nunca soube do
         FLUXO. Com uma arvore de 40 passos no ar, ela mostrava "Regras 0" e
         "Chamam gente 0" — dizendo que o bot nao faz nada enquanto ele atende
         cliente de verdade. O motor usa um OU outro, nunca os dois: a tela tem
         de contar o que esta valendo. */
      const passos=(BOT.fluxo?.passos||[]).length;
      if(passos) return kpi('Fluxo',passos+' passos','a árvore que conduz a conversa')
        +kpi('Encaminham',contarEncaminhamentos(BOT.fluxo),'passam pro humano');
      return kpi('Regras',BOT.total,`${BOT.ativas} ativa(s)`)
        +kpi('Chamam gente',BOT.comHandoff,'passam pro humano');
    })()}
    ${(()=>{
      /* "Bot ligado" com o canal fora nao atende ninguem — e as duas telas
         diziam a verdade SEPARADAMENTE, o que juntas vira mentira: quem olha
         aqui ve "ligado" e vai embora tranquilo enquanto o cliente fala
         sozinho. Aconteceu em campo. */
      const w=canalDoBot();
      if(c.ativo&&!w.no_ar) return kpi('Estado','ligado, mas MUDO',`o canal está ${esc(w.rotulo)} — ninguém é atendido`);
      return kpi('Estado',c.ativo?'ligado':'desligado',BOT.pronto?'respondendo':'não responde ainda');
    })()}
    ${(()=>{
      /* Estava CRAVADO em "nenhum". A tela dizia que nao havia canal com a
         Micaela pareada e conversando — e quem le o painel confia nele. */
      const w=canalDoBot();
      return kpi('Canal',w.no_ar?(w.via||'no ar'):'nenhum',
        w.no_ar?(w.numero?(w.telegram?esc(w.numero):'+'+esc(w.numero)):'conectado'):esc(w.rotulo));
    })()}
  </div>
  ${BOT.aviso?`<div class="card" style="margin-bottom:16px;border-style:dashed">
    ${cardH('alerta',`Atenção`,``,5)}${linha('Bot ligado sem regra',esc(BOT.aviso),'corrigir','b-err')}</div>`:''}
  ${(()=>{const w=canalDoBot();return c.ativo&&!w.no_ar?`<div class="card" style="margin-bottom:16px;border-style:dashed">
    ${cardH('alerta',`O bot está ligado, mas não tem por onde falar`,
      `O canal de ${w.telegram?'Telegram':'WhatsApp'} está <b>${esc(w.rotulo)}</b>. Enquanto isso, mensagem de cliente não chega aqui e nada é respondido — o bot ligado não muda isso.`,5,
      '<span class="badge b-err">ninguém é atendido</span>')}
    ${botao({t:'Ir para o canal',ic:w.telegram?'telegram':'whats',v:'p',on:w.telegram?"ir('tg-canal')":"ir('canais')"})}</div>`:'';})()}

  <div class="card" style="margin-bottom:16px">
    ${cardH(tgBot?'telegram':'whats',`Testar a conversa`,`Escreva como um cliente escreveria. O bot ${tgBot?'do Telegram':'do WhatsApp'} responde com as regras de verdade e com o seu catálogo real — sem precisar de ${tgBot?'Telegram':'WhatsApp'} nem de token nenhum.`,3)}
    <div class="tbl-bar" style="margin-top:12px">
      <input id="simTxt" placeholder="Ex.: qual o horário de vocês?" onkeydown="if(event.key==='Enter')simular()">
      <button class="btn btn-p" onclick="simular()">${ico('enviar')}Enviar</button>
      <button class="btn btn-s" onclick="SIMULACAO=[];render()">${ico('limpar')}Limpar</button>
    </div>
    <label class="hint" style="display:flex;align-items:center;gap:7px;margin-top:10px;cursor:pointer">
      <input type="checkbox" id="simCobrar" ${SIM_COBRAR?'checked':''} onchange="SIM_COBRAR=this.checked">
      Gerar link de pagamento de verdade quando o fluxo chegar na cobrança
      <span class="badge">ambiente de teste</span>
    </label>
    <div id="simSaida" style="margin-top:14px">${simulacaoHtml()}</div></div>

  ${(()=>{
    /* TOMADA DE CONTA. Vem PRIMEIRO na tela quando existe: e a unica coisa aqui
       que exige acao no celular, agora, e nao no painel. */
    const inv=(CANAIS?.invasoes||[]);
    if(!inv.length) return '';
    const u=inv[0];
    return `<div class="card" style="margin-bottom:16px;border-color:var(--err)">
      ${cardH('alerta',`Alguém pode ter entrado na conta do WhatsApp`,
        `A sessão caiu de um jeito que só acontece quando outro aparelho assume a conta. `+
        `Isto é registro, não suposição — e ficou guardado.`,5,
        `<span class="badge b-err">${inv.length} registro(s)</span>`)}
      ${linha('Quando',esc(String(u.em||'').slice(0,16).replace('T',' ')),esc(u.tipo||''),'b-err')}
      ${linha('O que aconteceu',esc(u.motivo||''),'','')}
      ${u.numeroPareado?linha('Número que estava pareado','o que foi derrubado','+'+esc(u.numeroPareado),''):''}
      ${u.ultimaAtividade?linha('Última atividade antes de cair','',esc(String(u.ultimaAtividade).slice(0,16).replace('T',' ')),''):''}
      <div style="margin-top:12px;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--err-line)">
        <b>O que fazer agora, no celular:</b>
        <ol style="margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.7">
          <li>WhatsApp → <b>Aparelhos conectados</b> → desconecte o que não for seu</li>
          <li>WhatsApp → Configurações → Conta → <b>Verificação em duas etapas</b> → ativar</li>
        </ol>
        <p class="hint" style="margin-top:8px">Não dá para saber daqui <b>quem</b> entrou — o WhatsApp não
          entrega isso para a sessão derrubada. Quem mostra o aparelho é a própria lista no celular.</p>
      </div>
    </div>`;
  })()}

  <div class="card" style="margin-bottom:16px">
    ${cardH('versao',`Fluxo de atendimento`,
      BOT.fluxo
        ? `<b>${BOT.fluxo.passos} passo(s)</b> cadastrados. Enquanto existir fluxo, é ele que conduz a conversa — as regras abaixo ficam de reserva.`
        : `A árvore de conversa: o bot pergunta, oferece opções numeradas e cada escolha leva a um lugar. Monte numa planilha e importe aqui. <b>Sem fluxo, valem só as regras por palavra.</b>`,
      3, BOT.fluxo?`<span class="badge b-ok">no ar</span>`:`<span class="badge">não cadastrado</span>`)}
    <p class="hint" style="margin-bottom:10px">Uma linha por opção. A mensagem do passo vai só na primeira linha dele.
      Ações que encerram: <code>comercial</code> (chama gente), <code>catalogo</code>, <code>confirmar</code>, <code>fim</code>.
      Botão de verdade só existe na API oficial da Meta — por isso o menu é numerado, que funciona em qualquer aparelho.
      <b>Foto no passo:</b> coluna <code>imagem</code> com o nome de uma imagem enviada abaixo (ou um link https) — a foto e o texto
      chegam <b>num balão só</b>. Texto acima de 1.024 caracteres vai num balão logo depois da foto (limite do WhatsApp).</p>
    <div class="tbl-bar">
      <input type="file" id="fxArq" accept=".csv,text/csv" onchange="importarFluxo(this)">
      ${botao({t:'Baixar modelo',ic:'baixar',v:'s',on:'baixarModeloFluxo()'})}
      ${BOT.fluxo?botao({t:'Apagar fluxo',ic:'excluir',v:'no',on:'apagarFluxo()'}):''}
    </div>
    <div class="tbl-bar" style="margin-top:12px">
      <label class="hint" style="margin:0">Imagens do fluxo (JPG, PNG ou WEBP, até 5 MB):</label>
      <input type="file" id="fxImg" accept="image/jpeg,image/png,image/webp" onchange="enviarImagemFluxo(this)">
    </div>
    ${(BOT.midias||[]).length?`<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Nome para a coluna <code>imagem</code></th><th>Tamanho</th><th></th></tr></thead><tbody>
      ${BOT.midias.map(m=>`<tr><td><code>${esc(m.nome)}</code></td><td>${Math.ceil(m.bytes/1024)} KB</td>
        <td>${botao({t:'Apagar',ic:'excluir',v:'no',on:`apagarImagemFluxo('${esc(m.nome)}')`})}</td></tr>`).join('')}
    </tbody></table></div>`:''}
    ${BOT.fluxo?`<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Passo</th><th>Opções</th></tr></thead><tbody>
      ${(BOT.fluxo.passos_lista||[]).map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${x.opcoes}</td></tr>`).join('')}
    </tbody></table></div>`:''}
  </div>

  <div class="card" style="margin-bottom:16px">
    ${cardH('bot',`Regras`,``,6)}<div class="tbl-bar">
      <input id="brBusca" value="${esc(BUSCA.regra||'')}" placeholder="Buscar por termo ou resposta"
        oninput="buscarEm('regra',this.value)">
      <button class="btn btn-p" onclick="novaRegra()">${ico('mais')}Nova regra</button>
    </div>
    ${tabela({
      vazio:'Nenhuma regra ainda — clique em <b>+ Nova regra</b>. Sem regra, o bot só sabe dizer que não entendeu.',
      nenhum:'Nenhuma regra com esse termo.',
      colunas:[
        {t:'Quando o cliente escrever',cel:(r)=>`<b>${esc(r.nome)}</b><br><small class="hint">${esc((r.termos||[]).join(', '))} · ${esc(r.gatilho)}</small>`},
        {t:'O bot responde',cel:(r)=>esc(String(r.resposta).slice(0,90))+(String(r.resposta).length>90?'…':'')},
        {t:'Prioridade',al:'center',cel:(r)=>String(r.prioridade||0)},
        {t:'Situação',al:'center',cel:(r)=>`<span class="badge ${r.ativa!==false?'b-ok':''}">${r.ativa!==false?'ativa':'desligada'}</span>${r.handoff?'<br><span class="badge b-warn" style="margin-top:4px">chama gente</span>':''}`},
      ],
      acoes:(r)=>[
        bi('editar','Editar',`editarRegra('${esc(r.id)}')`),
        bi('excluir','Excluir',`excluirRegra('${esc(r.id)}','${esc(r.nome).replace(/'/g,"\\'")}')`,'dan'),
      ].join(''),
      todos:BOT.regras,
      itens:BOT.regras.filter(r=>casa(BUSCA.regra,[r.nome,r.resposta,(r.termos||[]).join(' ')])),
    })}</div>

  <div class="card">
    ${cardH('bot',`Como ele se comporta`,``,6)}<div class="form-grid">
      <div class="field"><label>Nome do atendente</label><input id="bcNome" value="${esc(c.nome)}"></div>

        <input id="bcFalhas" type="number" min="1" value="${esc(c.falhasAteHumano)}"></div>
      <div class="field" style="grid-column:1/-1"><label>Saudação</label><input id="bcSaud" value="${esc(c.saudacao)}"></div>
      <div class="field" style="grid-column:1/-1"><label>Quando não entende</label>
        <input id="bcFall" value="${esc(c.mensagemFallback)}"></div>
      <div class="field" style="grid-column:1/-1"><label>Ao passar pra uma pessoa</label>
        <input id="bcHand" value="${esc(c.mensagemHandoff)}"></div>
      <div class="field"><label style="display:flex;align-items:center;gap:7px;font-weight:400;cursor:pointer;padding-bottom:9px">
        <input type="checkbox" id="bcAtivo" style="width:auto;margin:0"${c.ativo?' checked':''}> Bot ligado</label></div>
      <div class="field"><label style="display:flex;align-items:center;gap:7px;font-weight:400;cursor:pointer;padding-bottom:9px">
        <input type="checkbox" id="bcCat" style="width:auto;margin:0"${c.usarCatalogo?' checked':''}> Responder com o catálogo</label></div>
      <div class="field" style="grid-column:1/-1"><label style="display:flex;align-items:center;gap:7px;font-weight:400;cursor:pointer;padding-bottom:4px">
        <input type="checkbox" id="bcAssina" style="width:auto;margin:0"${c.assinarMensagens!==false?' checked':''}>
        Assinar as respostas com o nome dela</label>
        <small class="hint">O WhatsApp mostra a foto e o nome <b>da conta</b> em toda mensagem. Enquanto o
        atendimento dividir o número com uma pessoa, assinar é o que deixa claro para o cliente com quem ele
        está falando. Quando o atendimento tiver número próprio, desligue.</small></div>
      <div class="field" style="grid-column:1/-1"><label style="display:flex;align-items:center;gap:7px;font-weight:400;cursor:pointer;padding-bottom:4px">
        <input type="checkbox" id="bcCerebro" style="width:auto;margin:0"${c.cerebro?.ligado?' checked':''}>
        Jogo de cintura: entender o que a pessoa quis com IA local</label>
        <small class="hint">Quando a pessoa escreve do jeito dela (“o sistema tá dando pau”, “qro assinar”) em vez do número,
        uma IA que roda nesta máquina diz qual opção ela quis. Grátis, nada sai do servidor. A resposta continua sendo
        a que você escreveu no fluxo — a IA não fala com o cliente. Leva uns segundos a mais só nesses casos.</small></div>
      <div class="field" style="grid-column:1/-1"><label style="display:flex;align-items:center;gap:7px;font-weight:400;cursor:pointer;padding-bottom:4px">
        <input type="checkbox" id="bcHorOn" style="width:auto;margin:0"${c.horario?' checked':''} onchange="document.getElementById('bcHorBox').style.display=this.checked?'':'none'">
        Horário de funcionamento</label>
        <small class="hint">Fora do horário o bot responde que está fechado e mostra o horário, em vez de anotar um pedido que ninguém vai preparar.
        Quem já está no meio do pedido termina, e quem pede para falar com uma pessoa vai para a fila. Hora de Brasília.</small>
        ${(hrIniciar(c.horario),'')}
        <div id="bcHorBox" style="margin-top:8px${c.horario?'':';display:none'}">
          <div id="bcHorDias" class="hr-cal">${hrHtml()}</div>

            <textarea id="bcFechado" rows="3">${esc(c.mensagemFechado||'')}</textarea>
            <small class="hint"><b>{horario}</b> vira a lista dos dias, horários e das próximas datas especiais.</small></div>
        </div></div>
      <div class="field" style="grid-column:1/-1"><label>Respeito e brincadeira</label>
        <small class="hint">Ofensa: avisa, e depois do último aviso encerra o atendimento com uma pausa. Escolher opção
        errada de propósito, seguidas vezes, também encerra. Encerrado não volta pra fila: passada a pausa, começa do zero.
        Durante a pausa ela responde uma vez só, dizendo a hora de voltar. “URGENTE” sempre chama uma pessoa.</small></div>
      <div class="field"><label>Avisos antes de encerrar</label>
        <input id="bcAvisos" type="number" min="0" value="${esc(c.avisosAntesDePausa??2)}"></div>
      <div class="field"><label>Horas de pausa</label>
        <input id="bcPausa" type="number" min="0.25" max="72" step="0.25" value="${esc(c.horasDePausa??2)}"></div>
      <div class="field"><label>Escolhas erradas seguidas até encerrar</label>
        <input id="bcErros" type="number" min="2" value="${esc(c.errosDeOpcaoAtePausa??4)}"></div>
      <button class="btn btn-p" onclick="salvarBot()">${ico('salvar')}Salvar</button>
    </div>
    <p class="hint" style="margin-top:10px">Use <code>{nome}</code>, <code>{empresa}</code> nas respostas — são trocados
      pelo valor real. Variável sem valor aparece como está, em vez de sumir.</p></div>`;
 },
 auditor:()=>{
  if(!AUD) return head('Auditor','Governança: o que rodou, o que passou no gate.')+
    vazio('auditor','Backend sem a rota de auditoria','Atualize o backend para a versão com o VSpainel.',['Subir o backend novo','Recarregar']);
  const sit={'verde':'b-ok','vencido':'b-warn','nunca rodou':''};
  const cards=AUD.itens.map(i=>{
    if(!i.existe) return `<div class="card" style="margin-bottom:10px">
      ${cardH('alerta',i.nome||i.repo,`✖ ${esc(i.motivo)}<br><code>${esc(i.repo)}</code>`,5)}</div>`;
    const recs=Object.entries(i.recibos).map(([stack,r])=>{
      if(!r.existe) return linha(stack,'nenhum recibo gravado','nunca rodou','');
      return linha(stack, r.valido?`gravado há ${r.idadeMin} min na branch ${esc(r.branch||'—')}`:esc(r.motivo),
        r.valido?'verde':'não vale', r.valido?'b-ok':'b-err');
    }).join('');
    return `<div class="card" style="margin-bottom:10px">
      ${cardH('auditor',i.nome,`branch <b>${esc(i.branch||'—')}</b>`,6,
        `<span class="badge ${sit[i.situacao]||''}">${esc(i.situacao)}</span>`)}
      ${recs}
      ${i.docPendente?linha('Documentação pendente',`push feito na branch ${esc(i.docPendente.branch||'—')}`,'pendente','b-warn'):''}</div>`;
  }).join('');
  const g=AUD.governanca||{};
  return head('Auditor','Recibo do QA-Gate por repositório, com a mesma regra de validade da governança.')+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Repositórios',AUD.total,'auditados agora')}
    ${kpi('Com verde válido',AUD.verdes,`de ${AUD.total}`)}
    ${kpi('Verde vencido',AUD.vencidos,'rodou e perdeu validade')}
    ${kpi('Nunca rodaram',AUD.nuncaRodaram,'sem recibo nenhum')}
  </div>
  <div class="card" style="margin-bottom:16px;border-style:dashed">
    ${cardH('auditor',`O que conta como verde`,`Existir recibo não basta. Vale só se <b>status=green</b>, se a <b>branch for a que está em uso agora</b>, se tiver menos de <b>${AUD.validadeMin} min</b> e se <b>ninguém editou depois</b>. Recibo velho é pior que recibo nenhum: dá sensação de verde pra um código que mudou.`,6)}</div>
  ${cards}
  ${g.eventos?`<div class="card" style="margin-top:16px">
    ${cardH('politica',`Governança`,`${g.eventos} tarefa(s) registrada(s) no período.`,3)}
    ${linha('Commits no padrão','',(g.commitStdPct??'—')+'%',g.commitStdPct>=90?'b-ok':'b-warn')}
    ${linha('Retrabalho de QA',`baseline ${g.reworkBaselinePct}%`,(g.reworkPct??'—')+'%',g.reworkPct<=g.reworkBaselinePct?'b-ok':'b-warn')}
    ${linha('Documentação automática','',(g.docAutoPct??'—')+'%','')}
    ${linha('Tempo economizado','estimado pelo baseline',(g.timeSavedHours??'—')+' h','')}</div>`
   :`<div class="card" style="margin-top:16px"><p class="hint">Nenhuma tarefa registrada em métricas ainda.</p></div>`}`;
 },
 canais:()=>{
  const c=(CANAIS?.canais||[])[0]||null;
  const est=c?.estado||'desconectado';
  const rotulo={desconectado:'Desconectado',aguardando_qr:'Leia o QR Code',conectando:'Conectando…',conectado:'Conectado',caido:'Caiu'}[est]||est;
  const cor={conectado:'b-ok',aguardando_qr:'b-warn',conectando:'b-warn',caido:'b-err'}[est]||'';
  const quando=(x)=>x?String(x).slice(0,16).replace('T',' '):'—';

  return head('Canais de atendimento','Onde o cliente fala com você. A mensagem entra por aqui, vira lead e vai pro bot — o atendente trabalha no painel, não no WhatsApp Web.',
      /* Faltava saida pra quem esta preso em "esperando o QR" ou "caiu": o unico
         botao era "Conectar", que nao reabre a sessao travada. Reconectar
         DERRUBA e sobe de novo — e e o que gera QR novo, ja que o antigo expira
         em segundos. */
      est==='conectado'
        ? botao({t:'Desconectar',ic:'power',v:'s',on:"desconectarCanal()"})
          +botao({t:'Trocar de número',ic:'atualizar',v:'g',on:'trocarNumeroCanal()'})
        : ['aguardando_qr','caido','conectando'].includes(est)
          ? botao({t:'Reconectar (gera QR novo)',ic:'atualizar',v:'p',on:"reconectarCanal()"})
            +botao({t:'Trocar de número',ic:'usuario',v:'g',on:'trocarNumeroCanal()'})
            +botao({t:'Desligar o canal',ic:'power',v:'g',on:"desconectarCanal()"})
          : botao({t:'Conectar WhatsApp',ic:'whats',v:'p',on:"conectarCanal()"}))+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Estado',rotulo,c?.provider||'nenhum canal montado')}
    ${kpi('Número',c?.numero?'+'+esc(c.numero):'—',est==='conectado'?'aparelho pareado':'ninguém pareado ainda')}
    ${kpi('Conectado desde',quando(c?.desde),c?.desde?'sessão em pé':'—')}
    ${kpi('Última atividade',quando(c?.ultimaAtividade),'última mensagem que passou')}
  </div>

  ${est==='aguardando_qr'&&!c?.qr?`<div class="card" style="margin-bottom:16px;border-style:dashed">
    ${cardH('alerta',`Esperando o QR, mas o código já expirou`,
      `O QR do WhatsApp dura poucos segundos. Clique em <b>Reconectar</b> aí em cima para gerar um novo — ele aparece aqui mesmo, sem sair da tela.`,5)}
    ${botao({t:'Gerar QR novo',ic:'atualizar',v:'p',on:'reconectarCanal()'})}</div>`:''}

  ${est==='aguardando_qr'&&c?.qr?`<div class="card" style="margin-bottom:16px;text-align:center">
    ${cardH('whats',`Leia com o seu WhatsApp`,`Abra o WhatsApp no celular → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b> e aponte pro código. Ele expira em segundos: se sumir, é só clicar em Conectar de novo.`,2)}
    <img src="${esc(c.qr)}" alt="QR Code para parear o WhatsApp" style="width:280px;height:280px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:8px">
    <p class="hint" style="margin-top:12px">Esta tela se atualiza sozinha.</p></div>`:''}

  ${est==='caido'?`<div class="card" style="margin-bottom:16px;border-style:dashed">
    ${cardH('alerta',`A sessão caiu`,`${esc(c?.ultimoErro||'o WhatsApp encerrou a sessão')}. O painel tenta reconectar sozinho, com espera crescente. Se não voltar, é só conectar de novo e ler o QR.`,5)}
    ${linha('Tentativas de reconexão','automáticas, com espera crescente',String(c?.tentativas??0),'b-warn')}</div>`:''}

  <div class="card" style="margin-bottom:16px">
    ${cardH('integra',`Como está montado`,``,2,`<span class="badge ${cor}">${esc(rotulo)}</span>`)}
    ${linha('Provider',c?.provider==='whatsapp-web'?'sessão de WhatsApp Web':'—',c?.provider||'—',c?'b-ok':'')}
    ${linha('API oficial da Meta','este canal NÃO é a API oficial',c?(c.oficial?'sim':'não'):'—',c&&!c.oficial?'b-warn':'')}
    ${(CANAIS?.saude||[]).map(x=>linha('Health check',esc(x.detalhe||''),x.ok?'ok':'falha',x.ok?'b-ok':'b-err')).join('')}
  </div>

  <div class="card" style="margin-bottom:16px">
    ${cardH('whats',`O número deste canal`,`Qual telefone atende por aqui. É ele que o cliente vê e para onde ${esc(nomeBot())} responde.`,2,
      c?.numero?`<span class="badge b-ok">+${esc(c.numero)}</span>`:'<span class="badge">nenhum pareado</span>')}
    ${linha('Número pareado agora','lido da sessão, não digitado',c?.numero?'+'+esc(c.numero):'—',c?.numero?'b-ok':'')}
    <div class="form-grid" style="margin-top:12px">
      <div class="field"><label>Número previsto no contrato <small>(confere com o pareado)</small></label>
        <input id="cnNumero" value="${esc(CANAIS?.config?.numero||'')}" placeholder="5531975127978"></div>
      <div class="field"><label>Nome da operação <small>(aparece nos relatórios)</small></label>
        <input id="cnApelido" value="${esc(CANAIS?.config?.apelido||'')}" placeholder="Suporte Veloso"></div>
      ${botao({t:'Salvar',ic:'salvar',v:'s',on:'salvarCanalConfig()'})}
      <div id="cnEco" style="grid-column:1/-1;font-size:13px;min-height:18px"></div>
    </div>
    <p class="hint" style="margin-top:2px">Pode colar com <code>+</code>, espaço ou parênteses — eu guardo só os
      dígitos, que é o formato que o WhatsApp usa. E celular brasileiro aparece pareado <b>sem o 9</b>:
      <code>553175127978</code> e <code>5531975127978</code> são a mesma linha, e o painel sabe disso.</p>
    ${c?.numero&&CANAIS?.config?.numero&&!mesmoNumero(c.numero,CANAIS.config.numero)
      ? `<p class="hint" style="margin-top:10px;color:var(--err)">O número pareado (<b>+${esc(c.numero)}</b>) é diferente do previsto no contrato (<b>${esc(CANAIS.config.numero)}</b>). Confira antes de atender cliente.</p>`:''}
  </div>

  <div class="card" style="margin-bottom:16px">
    ${cardH('crm',`Atendentes e setores`,`Quantas pessoas podem atender e em que setores. O limite vem do contrato — ampliar é adendo, não configuração.`,1,
      `<span class="badge ${(CANAIS?.plano?.atendentes||0)>0?'b-ok':'b-warn'}">${CANAIS?.plano?.atendentes??'—'} atendente(s)</span>`)}
    ${linha('Atendentes contratados','quantas pessoas podem responder',String(CANAIS?.plano?.atendentes??'—'),'b-ok')}
    ${linha('Em uso agora','operadores ativos cadastrados',esc(OPERADORES?.uso?.texto||'—'),
      OPERADORES?.uso?.alerta==='cheio'?'b-err':(OPERADORES?.uso?.alerta?'b-warn':'b-ok'))}
    <div class="form-grid" style="margin-top:12px">
      <div class="field" style="grid-column:1/-1"><label>Setores <small>(um por linha — viram as filas do encaminhamento)</small></label>
        <textarea id="cnSetores" rows="3" placeholder="Suporte&#10;Comercial&#10;Financeiro">${esc((CANAIS?.config?.setores||[]).join('\n'))}</textarea></div>
      ${botao({t:'Salvar setores',ic:'salvar',v:'s',on:'salvarCanalConfig()'})}
      ${botao({t:'Ampliar no contrato',ic:'seta',v:'g',on:"ir('pl-comprar')"})}
    </div>
    <p class="hint" style="margin-top:10px">Os setores aqui são os mesmos que o fluxo usa em <code>encaminhar_&lt;setor&gt;</code>.</p>
  </div>

  ${operadoresHtml()}

  <div class="card" style="margin-bottom:16px">
    ${cardH('perfil',`Perfil do assistente virtual`,`Foto, nome e recado que o cliente vê no topo da conversa. Isto <b>só funciona neste canal</b> — na API oficial da Meta a foto vem do WhatsApp Manager e nenhum código muda.`,3,
      est==='conectado'?'':'<span class="badge b-warn">precisa conectar</span>')}
    <div class="perfil-grid">
      <div class="form-grid" style="align-content:start">
        <div class="field" style="grid-column:1/-1"><label>Nome que aparece</label>
          <input id="pfNome" placeholder="${esc(nomeBot())}" oninput="previewPerfil()"></div>
        <div class="field" style="grid-column:1/-1"><label>Recado <small>(o "status" do perfil)</small></label>
          <input id="pfRecado" placeholder="Assistente virtual — atendo 24h, e chamo gente quando precisa" oninput="previewPerfil()"></div>
        <div class="field" style="grid-column:1/-1"><label>Foto <small>(quadrada, JPG ou PNG, até 5 MB)</small></label>
          <input type="file" id="pfFoto" accept="image/png,image/jpeg" onchange="previewPerfil()"></div>
        <div style="grid-column:1/-1;padding:11px 13px;border-radius:var(--r-sm);
          background:var(--warn-bg,var(--panel));border:1px solid var(--err-line);font-size:13px">
          <b>Isto troca o perfil de verdade.</b> O que está acima é só um preview — ao aplicar, a foto, o nome e o
          recado passam a valer no WhatsApp <b>${esc(c?.numero?('+'+c.numero):'deste número')}</b> e aparecem para
          <b>todos os contatos dele</b>: cliente, amigo, grupo da família. Não existe "aplicar só para testar".
        </div>
        ${botao({t:'Aplicar no número',ic:'salvar',v:'p',on:'personalizarCanal()',off:est!=='conectado'})}
        ${CANAIS?.perfilAnterior?botao({t:'Voltar a cara anterior',ic:'atualizar',v:'g',on:'restaurarPerfil()',
          off:est!=='conectado',tit:`guardada em ${esc(String(CANAIS.perfilAnterior.em||'').slice(0,16).replace('T',' '))}`}):''}
      </div>
      <!-- Preview: e aqui que se descobre que o WhatsApp corta em CIRCULO, antes
           de subir uma arte com texto nos cantos e ver metade sumir. -->
      <div class="celular">
        <div class="cel-topo">
          <div class="cel-foto" id="pvFoto"></div>
          <div class="cel-id"><b id="pvNome">${esc(nomeBot())}</b><small id="pvRecado">online</small></div>
        </div>
        <div class="cel-conversa">
          <div class="cel-bolha">${esc(BOT?.config?.saudacao||`Oi! Eu sou ${nomeBot()}, o atendimento automático.`)}</div>
          <div class="cel-bolha cel-eu">oi</div>
        </div>
        <p class="hint" style="text-align:center;font-size:11px;margin-top:8px">é assim que ele vê no celular</p>
      </div>
    </div>
    <p class="hint" style="margin-top:10px">${est==='conectado'
      ? 'Muda o perfil do número <b>de verdade</b>, como se você tivesse trocado pelo celular. Quem já conversou com você vê a foto nova.'
      : 'Escolha os arquivos agora se quiser, mas <b>conecte o WhatsApp acima</b> antes de aplicar: quem troca a foto é a sessão, e sem sessão não há o que trocar.'}</p>
    <p class="hint" style="margin-top:6px">A foto é cortada em <b>círculo</b> pelo WhatsApp — o que estiver nos cantos some.</p></div>

  <div class="card" style="border-style:dashed">
    ${cardH('alerta',`O que você precisa saber antes de usar com cliente`,`Canal por WhatsApp Web é sessão automatizada, <b>fora dos termos da Meta</b> — o número pode ser bloqueado por eles. Serve pra beta e pra operação pequena. Quando a conta oficial destravar, trocar pro canal oficial não mexe em lead, conversa, bot nem trilha: é trocar o provider.`,5)}
    ${linha('Reconexão','automática, com espera crescente e teto','tratada','b-ok')}
    ${linha('Queda de sessão','a tela avisa e o health check confere','tratada','b-ok')}
    ${linha('Mensagem repetida','a mesma mensagem não vira dois atendimentos','tratada','b-ok')}
    ${linha('Grupo e status','não viram atendimento, de propósito','ignorados','b-ok')}</div>`;
 },
 redes:()=>{
  /* ESTA TELA era uma colcha de retalhos: um card de changelog do VSinfluence,
     dois blocos do TikTok, um tracejado de "teste rapido" e formularios soltos.
     Nao parecia o resto do console, e o pior: o botao ficava habilitado em canal
     que nao tem como conectar — quem clicava concluia que o sistema quebrou.

     Agora e uma GRADE por famila, montada de uma LISTA. Canal novo e uma linha
     aqui embaixo, e o estado de cada um sai do que o backend responde, nunca de
     texto fixo. */
  const w=canalWhatsApp();
  const tkFam=(f)=>TK?.familias?.[f]||null;
  const shop=tkFam('shop'), open=tkFam('open'), ads=tkFam('business');

  const EM_BREVE='em breve';
  const CANAIS_LISTA=[
    {fam:'Atendimento',itens:[
      {id:'whatsapp',nome:'WhatsApp',ic:'whats',oq:`Atende, cobra e responde cliente. É por onde ${nomeBot()} fala.`,
       estado:w.no_ar?'ok':'pendente',rotulo:w.no_ar?(w.numero?'+'+w.numero:'conectado'):w.rotulo,
       acao:{t:w.no_ar?'Gerenciar':'Conectar',on:"ir('canais')",ic:w.no_ar?'config':'power'}},
    ]},
    {fam:'Vendas e marketplaces',itens:[
      {id:'tiktokshop',nome:'TikTok Shop',ic:'vender',oq:'Publica o catálogo e recebe pedido da loja do TikTok.',
       /* `appConfigurado` e o campo que o backend devolve — eu tinha escrito
          `credenciais`, que nao existe, entao dava sempre falso e a tela dizia
          "sem credencial" com as tres chaves gravadas. */
       estado:shop?.autorizado?'ok':(shop?.appConfigurado?'pendente':'falta'),
       rotulo:shop?.autorizado?'autorizado':(shop?.appConfigurado?'falta autorizar a loja':'sem credencial'),
       acao:{t:'Configurar',on:"rolarAteCard('tiktok-shop')",ic:'config'}},
      {id:'mercadolivre',nome:'Mercado Livre',ic:'comprar',oq:'Anúncio, pedido e pergunta do comprador.',
       estado:'breve',rotulo:'credencial validada · módulo em construção'},
      {id:'shopee',nome:'Shopee',ic:'comprar',oq:'Anúncio e pedido.',estado:'breve',rotulo:EM_BREVE},
      {id:'aliexpress',nome:'AliExpress',ic:'comprar',oq:'Anúncio e pedido.',estado:'breve',rotulo:EM_BREVE},
    ]},
    {fam:'Entrega',itens:[
      {id:'99',nome:'99',ic:'seta',oq:'Corrida de entrega, prazo e rastreio.',estado:'breve',rotulo:EM_BREVE},
      {id:'zedelivery',nome:'Zé Delivery',ic:'seta',oq:'Pedido de bebida e entrega.',estado:'breve',rotulo:EM_BREVE},
    ]},
    {fam:'Conteúdo e redes sociais',itens:[
      {id:'tiktok',nome:'TikTok',ic:'publicar',oq:'Publica vídeo pela API, com token renovado sozinho.',
       estado:open?.autorizado?'ok':(open?.appConfigurado?'pendente':'falta'),
       rotulo:open?.autorizado?'autorizado':(open?.appConfigurado?'falta autorizar':'sem credencial'),
       acao:{t:'Configurar',on:"rolarAteCard('tiktok-open')",ic:'config'}},
      {id:'tiktokads',nome:'TikTok Ads',ic:'indicacao',oq:'Campanha paga e métrica de anúncio.',
       estado:ads?.autorizado?'ok':(ads?.appConfigurado?'pendente':'falta'),
       rotulo:ads?.autorizado?'autorizado':(ads?.appConfigurado?'falta autorizar':'sem credencial'),
       acao:{t:'Configurar',on:"rolarAteCard('tiktok-open')",ic:'config'}},
      {id:'instagram',nome:'Instagram',ic:'publicar',oq:'Métrica de post. Publicação ainda não.',estado:'parcial',rotulo:'só leitura'},
      {id:'youtube',nome:'YouTube',ic:'publicar',oq:'Métrica de vídeo. Publicação ainda não.',estado:'parcial',rotulo:'só leitura'},
      {id:'facebook',nome:'Facebook',ic:'publicar',oq:'Métrica de página. Publicação ainda não.',estado:'parcial',rotulo:'só leitura'},
      {id:'kwai',nome:'Kwai',ic:'publicar',oq:'Corte e agenda já preveem o formato.',estado:'breve',rotulo:EM_BREVE},
    ]},
  ];

  const TOM={ok:'b-ok',pendente:'b-warn',parcial:'b-warn',falta:'',breve:''};
  const tile=(c)=>{
    /* BOTAO SO EXISTE SE HA O QUE FAZER. Canal "em breve" com botao habilitado
       foi o que fez o dono clicar e achar que o sistema tinha quebrado. */
    const acao=c.acao
      ? botao({...c.acao,v:c.estado==='ok'?'s':'p',sz:'s'})
      : botao({t:'Em breve',ic:'relogio',v:'s',sz:'s',off:true,tit:'ainda não construímos este canal'});
    return `<div class="canal${c.estado==='breve'?' canal-breve':''}">
      <div class="canal-h"><span class="canal-ic">${ico(c.ic)}</span>
        <b>${esc(c.nome)}</b><span class="badge ${TOM[c.estado]||''}">${esc(c.rotulo)}</span></div>
      <p class="hint">${esc(c.oq)}</p>
      <div class="canal-a">${acao}</div></div>`;
  };

  const grades=CANAIS_LISTA.map(g=>`<div class="card" style="margin-bottom:16px">
    ${cardH('integra',g.fam,'',2)}
    <div class="grid g-canais">${g.itens.map(tile).join('')}</div></div>`).join('');

  const ligados=CANAIS_LISTA.flatMap(g=>g.itens).filter(c=>c.estado==='ok').length;
  const total=CANAIS_LISTA.flatMap(g=>g.itens).length;

  return head('Conexões','Cada canal por onde a empresa vende, atende ou publica. O estado vem do backend — o que aparece aqui é o que está valendo agora.')+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Canais ligados',`${ligados}/${total}`,'respondendo agora')}
    ${kpi('Atendimento',w.no_ar?'no ar':'parado',w.no_ar?(w.numero?'+'+esc(w.numero):esc(w.rotulo)):esc(w.rotulo))}
    ${kpi('Em construção',String(CANAIS_LISTA.flatMap(g=>g.itens).filter(c=>c.estado==='breve').length),'entram por aqui quando prontos')}
  </div>
  ${grades}
  <div id="tiktok-shop">${tiktokShopCard()}</div>
  <div id="tiktok-open">${tiktokCard()}</div>
  ${(()=>{
    const c=REDES?.credenciais||{};
    if(!Object.keys(c).length) return '';
    const linhas=Object.keys(c).map(r=>{
      const res=TESTE[r];
      const campos=c[r].campos.map(f=>`<div class="field"><label>${esc(f)}</label><input id="rc-${esc(r)}-${esc(f)}" placeholder="${esc(c[r].ajuda)}" autocomplete="off"></div>`).join('');
      const badge=!res?'<span class="badge">não testado</span>'
        :res.ok?`<span class="badge b-ok">conectado${res.conta?' · '+esc(res.conta):''}</span>`
        :`<span class="badge b-err">${esc(res.motivo)}</span>`;
      return `<div class="card" style="margin-bottom:12px">
        ${cardH('testar',c[r].nome,esc(c[r].ajuda),4,badge)}
        <div class="form-grid">${campos}
          <button class="btn btn-p" onclick="testarRede('${esc(r)}')">${ico('testar')}Testar conexão</button></div></div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:12px;border-style:dashed">
      ${cardH('testar','Teste rápido de credencial','A credencial abaixo <b>não fica gravada</b>: vai até o servidor, é usada na chamada e descartada. Serve para conferir se funciona — não para deixar a integração ligada.',4)}</div>${linhas}`;
  })()}`;
 },

    ${QG.categorias!=null?linha('Categorias','cadastráveis',String(QG.categorias),''):''}
  </div>

/* ── Consumo (banda) ─────────────────────────────────────────────────────────
   A banda é GERAL da instalação: todos os canais, o painel, a loja, as
   integrações e a mídia guardada somam no mesmo limite do mês (plano +
   adendos). A tela de cada canal mostra o total e o recorte dele. Medido em
   bytes pelo servidor, na hora que passa — não é estimativa. */
let CONS={}, CONS_EST=null;
const fmtBytes=(b)=>{ if(b==null) return '—'; const u=['B','KB','MB','GB','TB']; let i=0,x=b; while(x>=1024&&i<u.length-1){x/=1024;i++;} return `${String(i?(x>=100?Math.round(x):Math.round(x*10)/10):x).replace('.',',')} ${u[i]}`; };
async function carregarConsumo(canal){
  try{ CONS[canal]=await apiCru('consumo?canal='+canal); CONS_EST=CONS[canal]; }catch(e){ CONS[canal]={erro:e.message}; }
  if(rota===(canal==='telegram'?'tg-consumo':'wa-consumo')) render();
}
/* Estado leve para a faixa de aviso em todas as telas. */
async function checarConsumo(){
  try{ const e=await apiCru('consumo/estado'); const mudou=!CONS_EST||CONS_EST.faixa!==e.faixa; CONS_EST={...(CONS_EST||{}),...e}; if(mudou) render(); }catch{ /* sem sessão ainda */ }
}
/* ── Configurações: central de integrações do Bolso Cheio ──────────────────
   Uma pergunta: o que do sistema funciona e o que falta pra funcionar. O
   estado vem do módulo de cada integração (servidor); aqui só se mostra e se
   testa. Os itens do QA-Gate saíram desta tela (o company.json segue no disco). */
let INTEG=null, INTEG_TESTE={}, INTEG_CAIDAS=[];
async function carregarIntegracoes(forcar){
  try{ INTEG=await apiCru('integracoes'+(forcar?'?forcar=1':'')); INTEG_CAIDAS=INTEG.caidas||[]; }catch(e){ INTEG={erro:e.message}; }
  if(rota==='config') render();
}
async function checarIntegracoes(){
  try{ const a=await apiCru('integracoes/alerta'); const mudou=JSON.stringify(a.caidas.map(c=>c.id))!==JSON.stringify(INTEG_CAIDAS.map(c=>c.id)); INTEG_CAIDAS=a.caidas||[]; if(mudou) render(); }catch{ /* sem sessão */ }
}
function faixaIntegracoes(){
  if(!INTEG_CAIDAS.length||rota==='config') return '';
  return `<div class="cons-faixa consulta" role="alert"><b>${INTEG_CAIDAS.length===1?'Uma integração parou':'Integrações pararam'}</b> — ${INTEG_CAIDAS.map(c=>`${esc(c.nome)} (${esc(c.detalhe)})`).join(' · ')}. <button class="btn btn-s btn-xs" onclick="ir('config')">Ver integrações</button></div>`;
}
async function testarIntegracao(id){
  INTEG_TESTE[id]={rodando:true}; render();
  try{ const r=await api('integracoes/testar',{id}); INTEG_TESTE[id]=r.teste; }catch(e){ INTEG_TESTE[id]={ok:false,detalhe:e.message}; }
  await carregarIntegracoes(); render();
}
async function testarTudo(){
  const ids=(INTEG?.itens||[]).filter(i=>i.testavel).map(i=>i.id);
  for(const id of ids){ INTEG_TESTE[id]={rodando:true}; } render();
  await Promise.all(ids.map(async id=>{ try{ const r=await api('integracoes/testar',{id}); INTEG_TESTE[id]=r.teste; }catch(e){ INTEG_TESTE[id]={ok:false,detalhe:e.message}; } }));
  await carregarIntegracoes(true);
  const falhas=ids.filter(id=>!INTEG_TESTE[id]?.ok).length;
  flash(falhas?`${falhas} de ${ids.length} teste(s) falharam — veja o motivo em cada linha.`:`Todos os ${ids.length} testes passaram.`,falhas?'warn':'ok');
}
async function dispensarIntegracao(id){ try{ await api('integracoes/dispensar',{id}); await carregarIntegracoes(true); checarIntegracoes(); }catch(e){ avisoErro(e); } }
function telaIntegracoes(){
  if(!INTEG){ setTimeout(()=>carregarIntegracoes(),0); }
  const cab=head('Configurações','As integrações do Bolso Cheio — o que está funcionando e o que falta pra funcionar.',
    INTEG&&!INTEG.erro?botao({t:'Testar tudo',ic:'testar',v:'p',on:'testarTudo()',tit:'Pergunta a cada serviço se ele responde agora'})+botao({t:'Atualizar',ic:'atualizar',v:'g',on:'carregarIntegracoes(true)'}):'');
  if(!INTEG) return cab+'<div class="card"><p class="hint">Conferindo cada integração…</p></div>';
  if(INTEG.erro) return cab+`<div class="card"><p class="hint">Não consegui carregar: ${esc(INTEG.erro)}</p></div>`;
  const R=INTEG.resumo;
  const resumo=`<div class="int-resumo">
    <div class="int-r ok"><b>${R.ok}</b><span>funcionando</span></div>
    <div class="int-r inc"><b>${R.incompletas}</b><span>incompleta(s)</span></div>
    <div class="int-r off"><b>${R.desligadas}</b><span>desligada(s)</span></div></div>`;
  const ROT={ok:'funcionando',incompleta:'incompleta',desligada:'desligada'};
  const linhaI=(i)=>{ const t=INTEG_TESTE[i.id];
    const teste=t?.rodando?'<small class="int-t">testando…</small>':t&&!(t.ok===false&&i.detalhe&&String(i.detalhe).startsWith(String(t.detalhe||'').slice(0,40)))?`<small class="int-t ${t.ok?'ok':'ruim'}">${t.ok?'✔':'✖'} ${esc(t.detalhe||'')}</small>`:'';
    return `<div class="int-l ${i.estado}${i.caiu?' caiu':''}" data-int="${esc(i.id)}">
      <i class="int-dot" aria-hidden="true"></i>
      <div class="int-txt"><b>${esc(i.nome)}</b> <span class="badge ${i.estado==='ok'?'b-ok':i.estado==='incompleta'?'b-warn':''}">${ROT[i.estado]}</span>${i.caiu?' <span class="badge b-err">parou</span>':''}${i.emTeste?' <span class="badge b-warn">modo teste</span>':''}
        <p>${esc(i.detalhe||'')}</p>${teste}</div>
      <div class="int-acts">${i.testavel?botao({t:'Testar',ic:'testar',v:'g',sz:'xs',on:`testarIntegracao('${i.id}')`}):''}${i.caiu?botao({t:'Dispensar aviso',v:'g',sz:'xs',on:`dispensarIntegracao('${i.id}')`,tit:'Para de avisar até ela voltar a funcionar'}):''}${i.tela&&i.acao?botao({t:i.acao,ic:i.estado==='ok'?'config':'seta',v:i.estado==='ok'?'s':'p',sz:'xs',on:`ir('${i.tela}')`}):''}</div></div>`; };
  const grupos=INTEG.grupos.map(([g,nome])=>{ const its=INTEG.itens.filter(i=>i.grupo===g); if(!its.length) return '';
    return `<div class="card" style="margin-bottom:14px">${cardH(g==='canais'?'whats':g==='pagamentos'?'financeiro':g==='redes'?'redes':'enviar',nome,'',g==='canais'?2:g==='pagamentos'?1:g==='redes'?3:4)}${its.map(linhaI).join('')}</div>`; }).join('');
  return cab+resumo+grupos+`<p class="hint">Jira, Redmine, Azure DevOps, Slack e a governança de commit eram do QA-Gate (ferramenta de desenvolvimento) e saíram desta tela — a configuração dele continua guardada.</p>`;
}

function faixaConsumo(){
  const e=CONS_EST; if(!e||e.faixa==='normal'||/-consumo$/.test(rota)) return '';
  const ir=`ir('${rota.startsWith('tg')?'tg':'wa'}-consumo')`;
  if(e.faixa==='consulta') return `<div class="cons-faixa consulta" role="alert"><b>Modo consulta</b> — a banda do mês acabou (${fmtBytes(e.usadoBytes)} de ${fmtBytes(e.limiteBytes)}). Dá para ver tudo; enviar, publicar e editar ficam parados até ${new Date(e.renovaEm).toLocaleDateString('pt-BR')} ou até entrar banda adicional. <button class="btn btn-s btn-xs" onclick="${ir}">Ver consumo e contratar banda</button></div>`;
  return `<div class="cons-faixa atencao"><b>${Math.round(e.pct*100)}% da banda do mês</b> já foi usada (${fmtBytes(e.usadoBytes)} de ${fmtBytes(e.limiteBytes)}). Ao chegar em 100%, o sistema entra em modo consulta. <button class="btn btn-g btn-xs" onclick="${ir}">Ver consumo</button></div>`;
}
async function pedirBanda(canal){

function liberarBanda(canal){

async function tirarBanda(canal,id){
  if(!confirm('Tirar esta banda adicional do limite?')) return;

function consBarrasDia(porDia,canal,mes){
  const [a,m]=mes.split('-').map(Number), nDias=new Date(a,m,0).getDate();
  const dias=Array.from({length:nDias},(_,i)=>{ const d=`${mes}-${String(i+1).padStart(2,'0')}`; const x=porDia.find(p=>p.dia===d)||{}; const c=x[canal]||0; return {d,c,r:(x.total||0)-c}; });
  const W=720,H=180,PB=22,PL=62, max=Math.max(1,...dias.map(x=>x.c+x.r)), passo=(W-PL)/nDias, bw=Math.min(18,Math.max(3,passo-3)), off=(passo-bw)/2;
  const y=(v)=>H-PB-(v/max)*(H-PB-10), nome=canal==='telegram'?'Telegram':'WhatsApp';
  return `<svg viewBox="0 0 ${W} ${H}" class="aud-svg" role="img" aria-label="Banda por dia: ${nome} e o resto do sistema">
    ${[0,max/2,max].map(t=>`<line x1="${PL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="aud-grade"/><text x="${PL-6}" y="${y(t)+4}" class="aud-eixo" text-anchor="end">${fmtBytes(t)}</text>`).join('')}
    ${dias.map((x,i)=>{ const X=PL+i*passo+off, yc=y(x.c), yr=y(x.c+x.r);
      return `<g class="aud-hit" data-tip="${esc(`${x.d.slice(8)}/${x.d.slice(5,7)} — ${nome} ${fmtBytes(x.c)} · resto do sistema ${fmtBytes(x.r)}`)}"><rect x="${X-1}" y="0" width="${bw+2}" height="${H-PB}" fill="transparent"/>
      ${x.c?`<rect x="${X}" y="${yc}" width="${bw}" height="${H-PB-yc}" rx="2" fill="var(--s1)"/>`:''}${x.r?`<rect x="${X}" y="${yr}" width="${bw}" height="${Math.max(0,yc-yr-2)}" rx="2" fill="var(--s2)"/>`:''}</g>`; }).join('')}
    ${dias.map((x,i)=>i%5===0?`<text x="${PL+i*passo+passo/2}" y="${H-6}" class="aud-eixo" text-anchor="middle">${x.d.slice(8)}/${x.d.slice(5,7)}</text>`:'').join('')}</svg>`;
}
function telaConsumoCanal(canal){
  const c=CONS[canal]; if(!c) setTimeout(()=>carregarConsumo(canal),0);
  const nome=canal==='telegram'?'Telegram':'WhatsApp';
  const cab=head(`${nome} · Consumo`,`Banda do mês — geral do sistema (todos os canais, painel, loja e mídia) — e quanto o ${nome} usou. Medido em bytes, na hora que passa pelo servidor.`,
    botao({t:'Atualizar',ic:'atualizar',v:'g',on:`carregarConsumo('${canal}')`})+botao({t:'Ver resultados',ic:'financeiro',v:'s',on:`ir('${canal==='telegram'?'tg':'wa'}-resultados')`}));
  if(!c) return cab+'<div class="card"><p class="hint">Carregando…</p></div>';
  if(c.erro) return cab+`<div class="card"><p class="hint">Não consegui carregar: ${esc(c.erro)}</p></div>`;
  const pct=c.pct==null?null:Math.min(1,c.pct), cats=c.porCategoria, doCanal=cats[canal]?.total||0, M=c.mensagens;
  const rotC={telegram:'Telegram',whatsapp:'WhatsApp',painel:'Painel (uso da equipe)',loja:'Loja e páginas públicas',integracoes:'Outras integrações',midia:'Mídia guardada no mês'};

      <span class="cons-selo ${c.faixa}">${c.faixa==='consulta'?'Modo consulta':c.faixa==='atencao'?'Atenção':'Normal'}</span></div>

      :`<div class="cons-barra" role="img" aria-label="${Math.round(c.pct*100)}% da banda usada"><i style="width:${Math.max(pct?1:0,pct*100)}%"></i><em style="left:80%" title="aviso em 80%"></em></div>

      <span class="${estouraProj?'ruim':''}">no ritmo atual: <b>${fmtBytes(c.projecaoBytes)}</b> até o fim do mês${estouraProj?' — passa do limite':''}</span></div>`}
    <p class="hint" style="margin:8px 0 0">Limite: plano ${esc(b.plano||'—')} = ${b.planoGb==null?'sem limite':b.planoGb+' GB'}${b.extraGb?` + ${b.extraGb} GB de banda adicional`:''}.</p>
    ${c.faixa==='consulta'?`<div class="cons-consulta"><b>O sistema está em modo consulta.</b> Dá para ver tudo, mas nada é enviado (nem pelo bot), publicado ou editado até ${renova} — ou até contratar banda adicional.
      <div class="cons-acts">${c.adendo?botao({t:`Contratar ${(c.adendo.name||'Banda adicional').replace(/^B/,'b')}`,ic:'mais',v:'p',on:`pedirBanda('${canal}')`}):''}${c.podeLiberar?botao({t:'Liberar banda adicional',ic:'check',v:'s',on:`liberarBanda('${canal}')`}):''}</div></div>`
      :c.podeLiberar&&c.limiteBytes?`<div class="cons-acts">${botao({t:'Liberar banda adicional',ic:'mais',v:'g',sz:'xs',on:`liberarBanda('${canal}')`})}</div>`:''}
  </div>`;
  const kpis=`<div class="aud-kpis">
    ${audKpi(`Banda do ${nome}`,fmtBytes(doCanal),c.usadoBytes?`${Math.round(100*doCanal/c.usadoBytes)}% do total do mês`:'nada ainda','','Bytes que o '+nome+' trocou com o servidor neste mês')}
    ${audKpi('Conversas no mês',M.conversas,`${M.recebidas} mensagem(ns) recebida(s)`)}
    ${audKpi('Respostas do bot',M.peloBot,M.peloBot+M.pelaEquipe?`${Math.round(100*M.peloBot/(M.peloBot+M.pelaEquipe))}% das respostas`:'—')}
    ${audKpi('Respostas da equipe',M.pelaEquipe,'enviadas pelo painel')}
    ${canal==='telegram'?audKpi('Publicações',M.publicacoes,'campanhas publicadas no mês'):audKpi('Via',`<span style="font-size:18px">${esc(c.via)}</span>`,'como o canal está ligado')}
    ${audKpi('Custo por mensagem','R$ 0',esc(c.custoPorMensagem))}
  </div>`;
  const maxC=Math.max(...Object.values(cats).map(x=>x.total));
  const onde=audBarrasH(Object.entries(cats).sort((a,b2)=>b2[1].total-a[1].total).map(([k,v])=>({rot:rotC[k]||k,n:v.total,cor:k===canal?'--s1':'--s2'})),maxC,fmtBytes);
  const leg=`<div class="aud-leg"><span><i style="background:var(--s1)"></i>${nome}</span><span><i style="background:var(--s2)"></i>Resto do sistema</span></div>`;
  const hist=(b.historico||[]);
  const extra=c.podeLiberar?`<div class="card aud-card"><div class="aud-ct"><h3>Banda adicional e pedidos</h3></div>

    ${hist.length?`<div class="tbl-wrap"><table><thead><tr><th>Quando</th><th class="num">GB</th><th>Motivo</th><th>Quem</th><th></th></tr></thead><tbody>${hist.slice().reverse().map(h=>`<tr${h.ativa===false?' style="opacity:.55"':''}><td>${new Date(h.em).toLocaleDateString('pt-BR')}</td><td class="num">+${h.gb}</td><td>${esc(h.motivo)}</td><td>${esc(h.por||'—')}</td><td>${h.ativa===false?'<small>retirada</small>':botao({t:'Tirar',v:'g',sz:'xs',on:`tirarBanda('${canal}','${h.id}')`})}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">Nenhuma banda adicional liberada até agora.</p>'}</div>`:'';
  return cab+`<div class="viz aud">${medidor}${kpis}
    <div class="aud-grade2">
      <div class="card aud-card"><div class="aud-ct"><h3>Banda por dia</h3>${leg}</div>${consBarrasDia(c.porDia||[],canal,c.mes)}</div>
      <div class="card aud-card"><div class="aud-ct"><h3>Para onde foi a banda</h3><small class="hint">mês inteiro, sistema todo</small></div>${onde}</div>
      ${extra}
      <details class="card aud-card aud-acc"><summary class="aud-ct"><h3>Como é medido</h3><span class="aud-acc-s"></span></summary>
        <ul class="cons-como"><li><b>Canais:</b> bytes reais trocados com a API do Telegram e, no WhatsApp Web, os bytes do navegador da sessão (conexão, mensagens e mídia).</li>

}

function consumoDoCanal(canal){

  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Mensagens',inter.length,`${saida} enviada(s) · ${inter.length-saida} recebida(s)`)}

      ||'<p class="hint">Sem funil cadastrado.</p>'}</div>
  <div class="card" style="margin-bottom:16px">

    ${(()=>{const c=canalWhatsApp();return linha('Canal de saída',c.via||'nenhum',c.no_ar?'enviando':'não envia',c.no_ar?'b-ok':'b-warn')
