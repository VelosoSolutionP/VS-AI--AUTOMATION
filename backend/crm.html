  const erro=document.getElementById('lgErro');
  const caps=document.getElementById('lgCaps');

  const mostrarErro=(m)=>{
    erro.textContent=m;
    erro.classList.add('on');
    campo.classList.add('erro');
    campo.focus();
    campo.select();
  };
  const limparErro=()=>{erro.classList.remove('on');campo.classList.remove('erro');};

  document.getElementById('lgOlho').onclick=()=>{
    const ver=campo.type==='password';
    campo.type=ver?'text':'password';
    document.getElementById('lgOlho').textContent=ver?'ocultar':'ver';
    campo.focus();
  };

  // Caps Lock ligado é a causa silenciosa mais comum de "a senha não funciona".
  const verCaps=(e)=>{ caps.classList.toggle('on', e.getModifierState && e.getModifierState('CapsLock')); };
  campo.addEventListener('keyup',verCaps);
  campo.addEventListener('keydown',verCaps);
  campo.addEventListener('input',limparErro);

  const campo2=document.getElementById('lgSenha2');
  campo2.addEventListener('input',limparErro);

  /* Primeiro acesso: o console nunca teve senha. Em vez de pedir uma senha
     que ninguém tem como saber, ele pede para o dono criar a dele. É a
     diferença entre um produto licenciado e um script de linha de comando. */
  let criando=false;
  const virarCriacao=()=>{
    criando=true;
    document.getElementById('lgTitulo').textContent='Criar o acesso';
    document.getElementById('lgSub').textContent=
      'Este console ainda não tem senha. Defina a sua — ela fica só nesta instalação.';
    document.getElementById('lgRotulo').textContent='Nova senha (mínimo 8 caracteres)';
    document.getElementById('lgCampo2').style.display='';
    campo.setAttribute('autocomplete','new-password');
    btn.textContent='Criar e entrar';
    document.getElementById('lgAjuda').innerHTML=
      '<b>Só você define esta senha.</b><p>Ela não é enviada a lugar nenhum: fica guardada '+
      'nesta máquina, com hash. Para trocar depois, use Configurações dentro do console.</p>';
  };

  const abrirPainel=(senha)=>{
    TOKEN=senha;
    sessionStorage.setItem('crm_token',TOKEN);
    document.body.classList.remove('sem-nav');
    carregar();
  };

  const enviar=async()=>{
    if(!campo.value){ return mostrarErro(criando?'Escolha uma senha.':'Digite a senha de acesso.'); }
    if(criando){
      if(campo.value.length<8){ return mostrarErro('A senha precisa de pelo menos 8 caracteres.'); }
      if(campo.value!==campo2.value){
        erro.textContent='As duas senhas não são iguais.';
        erro.classList.add('on');campo2.classList.add('erro');campo2.focus();
        return;
      }
    }
    btn.disabled=true;btn.textContent=criando?'Criando…':'Entrando…';limparErro();
    try{
      if(criando){ await api('criar-acesso',{senha:campo.value}); }
      else{ await api('entrar',{senha:campo.value}); }
      abrirPainel(campo.value);
    }catch(e){
      btn.disabled=false;btn.textContent=criando?'Criar e entrar':'Entrar';
      // O servidor avisa quando a instalação ainda não tem senha; a tela vira
      // criação em vez de repetir "senha incorreta" para sempre.
      if(e.message==='primeiro acesso'){ virarCriacao();btn.disabled=false;return campo.focus(); }
      mostrarErro(e.message==='senha incorreta'
        ? 'Senha incorreta. Se esta instalação é nova, recarregue para criar a sua.'
        : e.message);
    }
  };
  btn.onclick=enviar;
  campo.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  campo2.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  campo.focus();

  // Pergunta o estado antes de mostrar a tela errada por meio segundo.
  fetch('/crm/api/auth').then(r=>r.json()).then(d=>{ if(d && d.precisaCriar){ virarCriacao(); } })
    .catch(()=>{});
}

async function carregar(){
  try{
    // O diagnostico do TikTok nao pode derrubar o painel inteiro se o backend for antigo.
    [ST,STATUS,IND,REDES,TK,EST]=await Promise.all([api('painel'),api('status'),api('indicacao'),api('redes'),
      api('tiktok').catch(()=>null),api('estoque').catch(()=>null)]);
    // O Quebra-Galho é outro processo: se estiver fora do ar, a tela dele avisa —
    // e o resto do painel continua funcionando normalmente.
    QG=await api('quebragalho').catch(()=>null);
    TKAPP=await api('tiktok/app').catch(()=>null);
    PAG=await api('pagamentos').catch(()=>null);
    LOTES=await api('estoque/lotes').catch(()=>null);
    PUB=await api('estoque/publicados').catch(()=>null);
    BOT=await api('bot').catch(()=>null);
    CANAIS=await api('canais').catch(()=>null);
    ATEND=await api('atendimentos').catch(()=>null);
    DOCS=await api('documentos').catch(()=>null);
    CAIXA=await api('caixa'+(PERIODO.de||PERIODO.ate?`?de=${PERIODO.de}&ate=${PERIODO.ate}`:'')).catch(()=>null);
    if(TKAPP&&TKAPP.diagnostico) TK=TKAPP.diagnostico;
    // Telas novas: carregadas a parte pra uma falha nelas nao derrubar o painel todo.
    [AUD,FIN,REL,CTA]=await Promise.all([api('auditor').catch(()=>null),api('financeiro').catch(()=>null),
      api('relatorios').catch(()=>null),api('conta').catch(()=>null)]);
    document.getElementById('envDot').className='dot on';
    document.getElementById('envName').textContent='Backend online';
    document.getElementById('envSub').textContent=location.host;
  }catch(e){
    document.getElementById('envName').textContent='Backend fora';
    document.getElementById('envSub').textContent=e.message.slice(0,26);
    flash('Não consegui carregar: '+e.message,'err');
  }
  render();
}

async function baixarFeed(canal){
  // O feed é ARQUIVO (XML/CSV), não JSON. Não dá pra usar <a download> porque ele não
  // manda header, e o token do painel só viaja em header de propósito — na querystring
  // ele acabaria gravado no log de acesso do servidor.
  try{
    const res=await fetch('/crm/api/estoque/exportar?canal='+encodeURIComponent(canal),
      {headers:TOKEN?{'x-crm-token':TOKEN}:{}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const nome=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||canal;
    const incl=res.headers.get('x-vs-incluidos'), rec=res.headers.get('x-vs-recusados');
    const url=URL.createObjectURL(await res.blob());
    const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    flash(Number(rec)?`${nome}: ${incl} produto(s). ${rec} ficaram de fora por campo faltando.`
                     :`${nome}: ${incl} produto(s).`, Number(rec)?'err':'ok');
  }catch(e){flash('Não consegui gerar o arquivo: '+e.message,'err');}
}

/* ── Padrão de salvar ──────────────────────────────────────────────────────
   Clicar em salvar e nao acontecer nada e o pior tipo de defeito: a pessoa nao
   sabe se deu certo, se travou ou se ela errou alguma coisa — e clica de novo.
   Daqui pra frente todo salvar passa por aqui e SEMPRE termina em uma das tres:
   confirmacao cordial, erro no campo (vermelho, do lado do campo) ou modal
   explicando o que o servidor recusou.

   Por que erro em MODAL e sucesso em aviso flutuante: erro precisa parar a
   pessoa e ser lido; sucesso so precisa confirmar e sair da frente. Modal a cada
   salvo bem-sucedido vira um clique a mais pra sempre. */

function limparErros(){
  document.querySelectorAll('.campo-erro.on').forEach(e=>{e.classList.remove('on');e.textContent='';});
  document.querySelectorAll('.erro-campo').forEach(e=>e.classList.remove('erro-campo'));
}

/** Pinta o campo de vermelho e escreve o motivo embaixo dele. */
function marcarCampo(id,msg){
  const campo=document.getElementById(id);
  if(!campo) return false;
  campo.classList.add('erro-campo');
  let aviso=document.getElementById(id+'-erro');
  if(!aviso){
    aviso=document.createElement('div');
    aviso.id=id+'-erro'; aviso.className='campo-erro'; aviso.setAttribute('role','alert');
    campo.parentNode.insertBefore(aviso,campo.nextSibling);
  }
  aviso.textContent=msg; aviso.classList.add('on');
  return true;
}

/**
 * O padrão. `campos` diz o que é obrigatório e como se chama na tela —
 * o nome amigável é o que entra na mensagem, nunca o id do input.
 *
 *   salvar({
 *     titulo:'Salvar a regra de comissão',
 *     campos:[{id:'iPct', rotulo:'Percentual', obrigatorio:true, numero:true}],
 *     rota:'indicacao',
 *     corpo:()=>({percentual:val('iPct')}),
 *     sucesso:'Regra de comissão salva.',
 *   })
 */
async function salvar({titulo,campos=[],rota,corpo,sucesso,depois,botao}){
  limparErros();
  const val=(id)=>(document.getElementById(id)||{}).value?.trim()||'';

  const faltando=[];
  for(const c of campos){
    const v=val(c.id);
    if(c.obrigatorio&&!v){ faltando.push({...c,msg:`${c.rotulo} é obrigatório.`}); continue; }
    if(v&&c.numero&&isNaN(Number(String(v).replace(',','.')))){ faltando.push({...c,msg:`${c.rotulo} precisa ser um número.`}); continue; }
    if(v&&c.min!=null&&Number(String(v).replace(',','.'))<c.min){ faltando.push({...c,msg:`${c.rotulo} não pode ser menor que ${c.min}.`}); continue; }
    if(v&&c.regra&&!c.regra(v)){ faltando.push({...c,msg:c.mensagem||`${c.rotulo} está em formato inválido.`}); }
  }
  if(faltando.length){
    faltando.forEach(f=>marcarCampo(f.id,f.msg));
    document.getElementById(faltando[0].id)?.focus();
    abrirModal(titulo||'Confira antes de salvar',
      `<p class="hint" style="margin-bottom:12px">Faltou pouco — estes campos precisam de ajuste:</p>
       <ul class="notas">${faltando.map(f=>`<li>${esc(f.msg)}</li>`).join('')}</ul>`,
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
    return {ok:false,validacao:true};
  }

  const bt=botao?document.getElementById(botao):null;
  const antes=bt?bt.innerHTML:null;
  if(bt){ bt.disabled=true; bt.innerHTML=ico('relogio')+'<span>Salvando…</span>'; }
  try{
    const r=await api(rota,typeof corpo==='function'?corpo():corpo);
    flash(sucesso||'Pronto, salvo.','ok');
    if(depois) depois(r); else carregar();
    return {ok:true,r};
  }catch(e){
    /* O servidor recusou. Pode vir uma lista de motivos: mostra todos, e joga
       no campo o que der pra casar pelo rótulo. */
    const motivos=String(e.message||'').split(';').map(x=>x.trim()).filter(Boolean);
    let casou=false;
    for(const m of motivos){
      const alvo=campos.find(c=>m.toLowerCase().includes(String(c.rotulo).toLowerCase()));
      if(alvo&&marcarCampo(alvo.id,m)) casou=true;
    }
    abrirModal(titulo||'Não consegui salvar',
      `<p class="hint" style="margin-bottom:12px">O servidor recusou${casou?' — marquei os campos na tela':''}:</p>
       <ul class="notas">${motivos.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`,
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
    return {ok:false,erro:e.message};
  }finally{
    if(bt){ bt.disabled=false; bt.innerHTML=antes; }
  }
}

async function responderCliente(tel){
  const campo=document.getElementById('respTexto');
  const texto=(campo?.value||'').trim();

  const bt=document.getElementById('btResponder');
  const antes=bt?bt.innerHTML:null;
  if(bt){ bt.disabled=true; bt.innerHTML=ico('relogio')+'<span>Enviando…</span>'; }
  try{
    await api('atendimentos/responder',{telefone:tel,texto});
    if(campo) campo.value='';
    CONVERSA=tel;
    flash('Mensagem enviada.','ok');
    await carregar();
  }catch(e){
    /* Falha de envio precisa de modal: a pessoa do outro lado esta esperando, e
       um aviso que some em 4s deixaria o atendente achando que respondeu. */
    abrirModal('Não consegui enviar',
      `<p class="hint" style="margin-bottom:10px">A mensagem NÃO saiu. O texto continua no campo — pode tentar de novo.</p>
       <ul class="notas"><li>${esc(e.message)}</li></ul>`,
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
  }finally{ if(bt){ bt.disabled=false; bt.innerHTML=antes; } }
}

async function personalizarCanal(){
  limparErros();
  const nome=(document.getElementById('pfNome')||{}).value?.trim()||'';
  const recado=(document.getElementById('pfRecado')||{}).value?.trim()||'';
  const arq=(document.getElementById('pfFoto')||{}).files?.[0];
  if(!nome&&!recado&&!arq){
    marcarCampo('pfNome','Preencha ao menos um destes: nome, recado ou foto.');
    abrirModal('Nada para aplicar',
      '<p class="hint">Preencha ao menos um campo — nome, recado ou foto — antes de aplicar no número.</p>',
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
    return;
  }
  try{
    let foto=null;
    if(arq){
      if(arq.size>5*1024*1024){ flash('A foto passa de 5 MB — o WhatsApp recusa.','err'); return; }
      foto=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(arq); });
    }
    const r=await api('canais/personalizar',{canal:'whatsapp-web',foto,nome,recado});
    /* Sucesso PARCIAL e o caso comum: o WhatsApp recusa foto fora do formato e
       aceita o nome na mesma chamada. Dizer so "pronto" esconderia metade. */
    const ok=(r.feito||[]).join(', ');
    if(r.falhas&&r.falhas.length){
      flash(`Aplicado: ${ok||'nada'}.\nNão deu certo:\n• ${r.falhas.join('\n• ')}`,'err',12);
    }else{
      flash(`Perfil atualizado no número: ${ok}.`,'ok');
    }
    carregar();
  }catch(e){ flash(e.message,'err'); }
}

/** Decide entre criar acesso, login e dashboard antes de qualquer dado. */
(async function porta(){
  let est={exigeSenha:true};
  try{ est=await api('auth'); }catch{ /* backend antigo: pede senha assim mesmo */ }

  /* Instalacao nova: vai para a tela, que se vira em "criar acesso". Antes
     daqui saia direto para o dashboard — a regra velha era "sem CRM_TOKEN,
     painel aberto". Hoje o servidor bloqueia, entao seguir em frente so
     renderizava um painel que responde 403 em tudo. */
  if(est.precisaCriar){ return telaEntrar(); }

  if(!est.exigeSenha){ document.body.classList.remove('sem-nav'); return carregar(); }
  if(TOKEN){
    try{ await api('entrar',{senha:TOKEN}); document.body.classList.remove('sem-nav'); return carregar(); }
    catch{ /* token velho: cai na tela de entrada */ }
  }
  telaEntrar();
})();
