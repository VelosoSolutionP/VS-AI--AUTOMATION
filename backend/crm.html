      const em=emailCampo.value.trim();
      const r=await api('entrar',criando||!em?{senha:campo.value}:{email:em,senha:campo.value});
      abrirPainel(r.token);
    }catch(e){
      btn.disabled=false;btn.textContent=criando?'Criar e entrar':'Entrar';
      // O servidor avisa quando a instalação ainda não tem senha; a tela vira
      // criação em vez de repetir "senha incorreta" para sempre.
      if(e.message==='primeiro acesso'){ virarCriacao();btn.disabled=false;return campo.focus(); }
      mostrarErro(/incorret/.test(e.message)
        ? 'E-mail ou senha incorretos.'
        : e.message);
    }
  };
  btn.onclick=enviar;
  campo.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  emailCampo.onkeydown=(e)=>{if(e.key==='Enter')campo.focus();};
  campo2.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  campo.focus();

  // Pergunta o estado antes de mostrar a tela errada por meio segundo.
  fetch('/crm/api/auth').then(r=>r.json()).then(d=>{ if(d && d.precisaCriar){ virarCriacao(); } })
    .catch(()=>{});
}

async function carregar(){
  /* Cliente (quem assinou) NÃO vê o console do dono: vai pra própria conta. */
  try{
    const eu=await api('minha-conta');
    if(eu.papel==='cliente'){ return telaMinhaConta(eu); }
    /* Vendedor: so o Atendimento (o servidor recusa o resto de qualquer jeito). */
    if(eu.papel==='vendedor'){ return carregarVendedor(eu); }
    EU=eu;
    checarConsumo(); checarIntegracoes(); if(!window.__consTimer) window.__consTimer=setInterval(()=>{checarConsumo();checarIntegracoes();},60000);
  }catch(e){ if(/sessão expirada|senha ausente|403/.test(e.message)){ TOKEN='';sessionStorage.removeItem('crm_token');return telaEntrar(); } }
  try{
    // O diagnostico do TikTok nao pode derrubar o painel inteiro se o backend for antigo.
    [ST,STATUS,IND,REDES,TK,EST]=await Promise.all([api('painel'),api('status'),api('indicacao'),api('redes'),
      api('tiktok').catch(()=>null),api('estoque').catch(()=>null)]);
    // O Quebra-Galho é outro processo: se estiver fora do ar, a tela dele avisa —
    // e o resto do painel continua funcionando normalmente.
    QG=await api('quebragalho').catch(()=>null);
    TKAPP=await api('tiktok/app').catch(()=>null);
    TKSHOP=await api('tiktok/shop').catch(()=>null);
    /* So busca Shop e Ads se a familia correspondente estiver autorizada: bater
       na API sem token devolve erro e encheria a tela de vermelho por algo que
       ainda nem foi configurado. */
    if(TK?.familias?.shop?.autorizado) TKLOJA=await api('tiktok/loja').catch(()=>null);
    if(TK?.familias?.business?.autorizado) TKADS=await api('tiktok/campanhas').catch(()=>null);
    PAG=await api('pagamentos').catch(()=>null);
    LOTES=await api('estoque/lotes').catch(()=>null);
    PUB=await api('estoque/publicados').catch(()=>null);
    BOT=await api('bot').catch(()=>null);
    BOT_TG=await api('bot?canal=telegram').catch(()=>null);
    CANAIS=await api('canais').catch(()=>null);
    TG=await api('canais/telegram').catch(()=>null);
    OPERADORES=await api('operadores').catch(()=>null);
    ATEND=await api('atendimentos').catch(()=>null);
    PLANOS_CAT=await api('planos').catch(()=>null);
    DOCS=await api('documentos').catch(()=>null);
    CLIENTES=await api('clientes').catch(()=>null);
    CKCFG=await api('checkout/config').catch(()=>null);
    CAIXA=await api('caixa'+(PERIODO.de||PERIODO.ate?`?de=${PERIODO.de}&ate=${PERIODO.ate}`:'')).catch(()=>null);
    if(TKAPP&&TKAPP.diagnostico) TK=TKAPP.diagnostico;
    // Telas novas: carregadas a parte pra uma falha nelas nao derrubar o painel todo.
    [AUD,FIN,REL,CTA]=await Promise.all([api('auditor').catch(()=>null),api('financeiro').catch(()=>null),
      api('relatorios').catch(()=>null),api('conta').catch(()=>null)]);
    document.getElementById('envDot').className='dot on';
    document.getElementById('envName').textContent='Backend online';
    document.getElementById('envSub').textContent=location.host;
  }catch(e){

async function baixarFeed(canal){
  // O feed é ARQUIVO (XML/CSV), não JSON. Não dá pra usar <a download> porque ele não
  // manda header, e o token do painel só viaja em header de propósito — na querystring
  // ele acabaria gravado no log de acesso do servidor.
  try{
    const res=await fetch('/crm/api/estoque/exportar?canal='+encodeURIComponent(canal),
      {headers:TOKEN?{'x-crm-token':TOKEN}:{}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const nome=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||canal;
    const incl=res.headers.get('x-vs-incluidos'), rec=res.headers.get('x-vs-recusados');
    const url=URL.createObjectURL(await res.blob());
    const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    flash(Number(rec)?`${nome}: ${incl} produto(s). ${rec} ficaram de fora por campo faltando.`
                     :`${nome}: ${incl} produto(s).`, Number(rec)?'err':'ok');
  }catch(e){avisoErro('Não consegui concluir','Não consegui gerar o arquivo: '+e.message);}
}

/* ── Padrão de salvar ──────────────────────────────────────────────────────
   Clicar em salvar e nao acontecer nada e o pior tipo de defeito: a pessoa nao
   sabe se deu certo, se travou ou se ela errou alguma coisa — e clica de novo.
   Daqui pra frente todo salvar passa por aqui e SEMPRE termina em uma das tres:
   confirmacao cordial, erro no campo (vermelho, do lado do campo) ou modal
   explicando o que o servidor recusou.

   Por que erro em MODAL e sucesso em aviso flutuante: erro precisa parar a
   pessoa e ser lido; sucesso so precisa confirmar e sair da frente. Modal a cada
   salvo bem-sucedido vira um clique a mais pra sempre. */

function limparErros(){
  document.querySelectorAll('.campo-erro.on').forEach(e=>{e.classList.remove('on');e.textContent='';});
  document.querySelectorAll('.erro-campo').forEach(e=>e.classList.remove('erro-campo'));
}

/** Pinta o campo de vermelho e escreve o motivo embaixo dele. */
function marcarCampo(id,msg){
  const campo=document.getElementById(id);
  if(!campo) return false;
  campo.classList.add('erro-campo');
  let aviso=document.getElementById(id+'-erro');
  if(!aviso){
    aviso=document.createElement('div');
    aviso.id=id+'-erro'; aviso.className='campo-erro'; aviso.setAttribute('role','alert');
    campo.parentNode.insertBefore(aviso,campo.nextSibling);
  }
  aviso.textContent=msg; aviso.classList.add('on');
  return true;
}

/**
 * O padrão. `campos` diz o que é obrigatório e como se chama na tela —
 * o nome amigável é o que entra na mensagem, nunca o id do input.
 *
 *   salvar({
 *     titulo:'Salvar a regra de comissão',
 *     campos:[{id:'iPct', rotulo:'Percentual', obrigatorio:true, numero:true}],
 *     rota:'indicacao',
 *     corpo:()=>({percentual:val('iPct')}),
 *     sucesso:'Regra de comissão salva.',
 *   })
 */
async function salvar({titulo,campos=[],rota,corpo,sucesso,depois,botao}){
  limparErros();
  const val=(id)=>(document.getElementById(id)||{}).value?.trim()||'';

  const faltando=[];
  for(const c of campos){
    const v=val(c.id);
    if(c.obrigatorio&&!v){ faltando.push({...c,msg:`${c.rotulo} é obrigatório.`}); continue; }
    if(v&&c.numero&&isNaN(Number(String(v).replace(',','.')))){ faltando.push({...c,msg:`${c.rotulo} precisa ser um número.`}); continue; }
    if(v&&c.min!=null&&Number(String(v).replace(',','.'))<c.min){ faltando.push({...c,msg:`${c.rotulo} não pode ser menor que ${c.min}.`}); continue; }
    if(v&&c.regra&&!c.regra(v)){ faltando.push({...c,msg:c.mensagem||`${c.rotulo} está em formato inválido.`}); }
  }
  if(faltando.length){
    faltando.forEach(f=>marcarCampo(f.id,f.msg));
    document.getElementById(faltando[0].id)?.focus();
    abrirModal(titulo||'Confira antes de salvar',
      `<p class="hint" style="margin-bottom:12px">Faltou pouco — estes campos precisam de ajuste:</p>
       <ul class="notas">${faltando.map(f=>`<li>${esc(f.msg)}</li>`).join('')}</ul>`,
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
    return {ok:false,validacao:true};
  }

  const bt=botao?document.getElementById(botao):null;
  const antes=bt?bt.innerHTML:null;
  if(bt){ bt.disabled=true; bt.innerHTML=ico('relogio')+'<span>Salvando…</span>'; }
  try{
    const r=await api(rota,typeof corpo==='function'?corpo():corpo);
    /* Sucesso em MODAL, nao em toast de canto. Foi pedido depois de "clico em
       salvar e nao da mensagem nenhuma": o toast nasce longe do olho de quem
       acabou de clicar e some em quatro segundos. O modal custa um clique a
       mais e elimina a duvida — que e o que faz a pessoa salvar duas vezes. */
    avisoOk('Pronto', sucesso||'Alteração salva.');
    if(depois) depois(r); else carregar();
    return {ok:true,r};
  }catch(e){
    /* O servidor recusou. Pode vir uma lista de motivos: mostra todos, e joga
       no campo o que der pra casar pelo rótulo. */
    const motivos=String(e.message||'').split(';').map(x=>x.trim()).filter(Boolean);
    let casou=false;
    for(const m of motivos){
      const alvo=campos.find(c=>m.toLowerCase().includes(String(c.rotulo).toLowerCase()));
      if(alvo&&marcarCampo(alvo.id,m)) casou=true;
    }
    avisoErro(titulo||'Não consegui salvar',
      `O servidor recusou${casou?' — marquei os campos na tela':''}:`, motivos);
    return {ok:false,erro:e.message};
  }finally{
    if(bt){ bt.disabled=false; bt.innerHTML=antes; }
  }
}

/* Avatar com as iniciais e uma cor fixa por telefone: a mesma pessoa tem sempre
   a mesma cor, e da pra achar alguem na lista sem ler nome por nome. */
function avatar(nome,tel,tam){
  const n=String(nome||'').trim();
  const ini=(n?n.split(/\s+/).slice(0,2).map(p=>p[0]).join(''):String(tel||'').slice(-2)).toUpperCase();
  /* FNV-1a + passo aureo: ids do Telegram diferem so no fim (999000…011, …012)
     e o hash antigo dava a mesma cor pra todo mundo. */
  let h=2166136261; for(const ch of String(tel||n)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; }
  return `<span class="av${tam?' av-'+tam:''}" style="--h:${Math.round(((h*0.6180339887)%1)*360)}" aria-hidden="true">${esc(ini)}</span>`;
}

/* Receita por dia, em colunas. Um so indicador, entao sem legenda — o titulo diz
   o que e. Dia sem venda nao tem coluna, mas tem area de passar o mouse: o zero
   tambem e informacao. */
/* Tendencia de 14 dias dentro do cartao principal: so a forma, sem eixo. Sem
   receita nenhuma, some — uma linha reta no zero nao conta nada. */
function miniReceita(serie){
  const u=(serie||[]).slice(-14); const max=Math.max(...u.map(x=>x.centavos),0);
  if(!max) return '';
  const W=132,H=40,f=W/u.length,l=Math.max(3,f*0.55);
  return `<svg class="kd-mini" viewBox="0 0 ${W} ${H}" aria-hidden="true">${u.map((x,i)=>{ const h=x.centavos?Math.max(2,(H-2)*x.centavos/max):0;
    return h?`<rect x="${i*f+(f-l)/2}" y="${H-h}" width="${l}" height="${h}" rx="1.5" class="${i===u.length-1?'hoje':''}"/>`:''; }).join('')}</svg>`;
}
function graficoReceita(serie){
  const W=720,H=220,E=52,D=12,T=14,B=28;
  const max=Math.max(...serie.map(x=>x.centavos),0);
  const passo=(()=>{ const bruto=max/100/4||1; const p=10**Math.floor(Math.log10(bruto)); return [1,2,2.5,5,10].map(m=>m*p).find(v=>v>=bruto)*100; })();
  const teto=passo*4||400;
  const n=serie.length, faixa=(W-E-D)/n, larg=Math.min(24,Math.max(3,faixa*0.62));
  const y=(c)=>T+(H-T-B)*(1-c/teto);
  const ticks=[0,1,2,3,4].map(i=>i*passo);
  const cadaX=Math.ceil(n/6);
  return `<div class="grafico" onpointerleave="document.getElementById('gDica').hidden=true">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita confirmada por dia">
      ${ticks.map(t=>`<line x1="${E}" x2="${W-D}" y1="${y(t)}" y2="${y(t)}" class="g-grade"/>
        <text x="${E-8}" y="${y(t)+4}" text-anchor="end" class="g-eixo">${t?reais(t).replace(',00',''):'R$ 0'}</text>`).join('')}
      ${serie.map((p,i)=>{ const cx=E+faixa*i+faixa/2; const h=p.centavos?Math.max(2,y(0)-y(p.centavos)):0;
        return `${h?`<path class="g-barra" d="M${cx-larg/2},${y(0)} v${-(h-4)} q0,-4 4,-4 h${larg-8} q4,0 4,4 v${h-4} z"/>`:''}
          <rect class="g-alvo" x="${E+faixa*i}" y="${T}" width="${faixa}" height="${H-T-B}" data-i="${i}"
            onpointerenter="dicaReceita(this,'${p.dia}',${p.centavos})"/>
          ${i%cadaX===0?`<text x="${cx}" y="${H-8}" text-anchor="middle" class="g-eixo">${p.dia.slice(8,10)}/${p.dia.slice(5,7)}</text>`:''}`; }).join('')}
    </svg>
    <div class="g-dica" id="gDica" hidden></div>
  </div>`;
}
function dicaReceita(el,dia,centavos){
  const d=document.getElementById('gDica'); if(!d) return;
  d.replaceChildren();
  const v=document.createElement('b'); v.textContent=reais(centavos);
  const l=document.createElement('span'); l.textContent=dia.split('-').reverse().join('/');
  d.append(v,l); d.hidden=false;
  const g=el.closest('.grafico').getBoundingClientRect(), r=el.getBoundingClientRect();
  d.style.left=Math.min(g.width-120,Math.max(0,r.left-g.left+r.width/2-60))+'px';
}

/* Mede a imagem num canvas pequeno: variação de cor (lisa = sem conteúdo) e brilho. */
async function cpAnalisar(url){
  try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const c=document.createElement('canvas'); c.width=48; c.height=48; const g=c.getContext('2d'); g.drawImage(img,0,0,48,48);
    const px=g.getImageData(0,0,48,48).data; const lum=[];
    for(let i=0;i<px.length;i+=4) lum.push(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]);
    const m=lum.reduce((a,b)=>a+b,0)/lum.length, dp=Math.sqrt(lum.reduce((a,b)=>a+(b-m)**2,0)/lum.length);
    return {variacao:Math.round(dp),brilho:Math.round(m)};
  }catch{ return null; }
}
async function cpDefinirImagem(img){ CP_ED.d.imagem=img; cpSujo(); render(); if(img?.url&&!img.analise){ const a=await cpAnalisar(img.url); if(a&&CP_ED?.d.imagem===img){ img.analise=a; render(); } } }

/* A ARTE: 1080×1080, cores do painel, foto do produto (se houver), título,
   preço/data e a chamada. Texto grande: no celular é o que se lê. */
function cpQuebrar(g,txt,larg,maxLin){ const pal=String(txt).split(/\s+/); const lin=[]; let l='';
  for(const w of pal){ const t=l?l+' '+w:w; if(g.measureText(t).width>larg&&l){ lin.push(l); l=w; } else l=t; }
  if(l) lin.push(l); if(lin.length>maxLin){ lin.length=maxLin; lin[maxLin-1]=lin[maxLin-1].replace(/\s*\S*$/,'')+'…'; } return lin; }
async function cpDesenharArte(){
  const d=CP_ED.d, p=cpProduto(), R=(c)=>'R$ '+cpReaisTxt(c);
  const c=document.createElement('canvas'); c.width=1080; c.height=1080; const g=c.getContext('2d');
  const fundo=g.createLinearGradient(0,0,1080,1080); fundo.addColorStop(0,'#1e1b4b'); fundo.addColorStop(1,'#4f46e5'); g.fillStyle=fundo; g.fillRect(0,0,1080,1080);
  g.fillStyle='rgba(255,255,255,.06)'; for(let i=0;i<6;i++){ g.beginPath(); g.arc(980-i*40,120+i*30,160-i*18,0,7); g.fill(); }
  let topoTexto=180;
  const fotoUrl=(d.imagem?.doCatalogo||!d.imagem?.gerada)&&p?.imagem?p.imagem:null;
  if(fotoUrl){ try{ const img=await new Promise((ok,no)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>ok(i); i.onerror=no; i.src=fotoUrl; });
      const x=90,y=90,w=900,h=560, r=Math.max(w/img.width,h/img.height), sw=w/r, sh=h/r;
      g.save(); g.beginPath(); g.roundRect(x,y,w,h,36); g.clip(); g.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h); g.restore(); topoTexto=720;
    }catch{ /* foto indisponível: arte só com texto */ } }
  /* A arte usa SÓ o que foi informado (catálogo ou campos) — nada inventado. */
  const cap=d.captar||{}, sol=cap.solucao||cpSolucaoCat()?.nome||'';
  const titulo=d.objetivo==='produto'||d.objetivo==='promocao'?(p?.nome||d.nome):d.objetivo==='captar'?(sol||d.nome):d.nome;
  const sub=d.objetivo==='promocao'&&p?`De ${R(p.precoDeCentavos??p.precoCentavos)} por ${d.promo.precoCentavos?R(d.promo.precoCentavos):'—'}`
    :d.objetivo==='produto'&&p?`Por ${R(p.precoCentavos)}`
    :d.objetivo==='evento'?[d.evento.data?d.evento.data.split('-').reverse().join('/'):null,d.evento.hora||null,d.evento.local||(d.evento.link?'on-line':null)].filter(Boolean).join(' · ')
    :(cap.beneficio||'').replace(/\.$/,'');
  g.fillStyle='#fff'; g.textBaseline='top';
  const tamT=topoTexto>600?68:96; g.font=`800 ${tamT}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;
  const lin=cpQuebrar(g,titulo,900,topoTexto>600?2:3); lin.forEach((l,i)=>g.fillText(l,90,topoTexto+i*(tamT*1.1)));
  let y=topoTexto+lin.length*(tamT*1.1)+18;
  g.font=`700 ${topoTexto>600?48:60}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`; g.fillStyle=d.objetivo==='promocao'||d.objetivo==='produto'?'#4ade80':'#c7d2fe';
  const linSub=cpQuebrar(g,sub,900,d.objetivo==='captar'?3:1); linSub.forEach((l,i)=>g.fillText(l,90,y+i*62)); y+=18+linSub.length*62;
  const cta=({conhecer:'Toque e conheça 👇',demonstracao:'Peça uma demonstração 👇',vendedor:'Converse com nossa equipe 👇',lista:'Toque e entre na lista 👇'})[d.objetivo==='captar'?cap.acao:'']||'Toque no botão abaixo 👇'; g.font='700 40px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  const wc=g.measureText(cta).width+80, yc=Math.min(Math.max(y,860),960);
  g.fillStyle='#fff'; g.beginPath(); g.roundRect(90,yc,wc,84,42); g.fill(); g.fillStyle='#1e1b4b'; g.fillText(cta,130,yc+20);
  g.font='600 30px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; g.fillStyle='rgba(255,255,255,.75)'; g.textAlign='right'; g.fillText(cpLoja(),990,1015); g.textAlign='left';
  const px=g.getImageData(0,0,1080,1080).data; let s=0,s2=0,n=0; for(let i=0;i<px.length;i+=4*97){ const l=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]; s+=l; s2+=l*l; n++; }
  const m=s/n; return {canvas:c,analise:{variacao:Math.round(Math.sqrt(Math.max(0,s2/n-m*m))),brilho:Math.round(m)}};
}
async function cpGerarImagem(silencioso){
  try{
    const {canvas,analise}=await cpDesenharArte();
    const blob=await new Promise((ok)=>canvas.toBlob(ok,'image/png'));
    const r=await fetch('/crm/api/midia?tipo=imagem&nome=campanha.png',{method:'POST',headers:{'content-type':'image/png',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:blob});
    const j=await r.json().catch(()=>({erro:'resposta inválida do servidor'}));
    if(!r.ok||j.erro) throw new Error(j.erro||('HTTP '+r.status));
    CP_ED.d.imagem={arquivo:j.arquivo,url:j.url,gerada:true,analise}; cpSujo();
    if(!silencioso){ render(); flash('Arte da campanha gerada — veja na prévia.','ok'); }
    return true;
  }catch(e){ avisoErro('Não consegui gerar a imagem',esc(e.message)); return false; }
}

/* ── Assistente de preparação (sem IA): consulta o que já existe, pergunta só o
   que falta para o objetivo e monta a sugestão a partir de um modelo aprovado.
   Não inventa oferta — o texto usa apenas o que veio do catálogo ou do cliente. */
const CP_ACOES={conhecer:'Conhecer a solução',demonstracao:'Pedir uma demonstração',vendedor:'Conversar com um vendedor',lista:'Entrar na lista de novidades'};
const CP_BOTAO_ACAO={conhecer:'Quero conhecer',demonstracao:'Quero uma demonstração',vendedor:'Falar com um vendedor',lista:'Quero entrar'};
/* 10% abaixo do preço normal, terminando em ,90 (R$ 49,90 → R$ 44,90). */
function cpPrecoSugerido(p){ const alvo=(p.precoDeCentavos??p.precoCentavos)*0.9; let v=Math.floor(alvo/100)*100+90; if(v>alvo) v-=100; return Math.max(90,v); }
const cpSolucaoCat=()=>(CP[RES_DIAS]?.catalogo||[]).find(p=>p.sku===CP_ED?.d.captar?.sku)||null;
const AJUDA_RE=[/\b(monta|montar|faz|fazer|faca|cria|criar|escreve|escrever|gera|gerar|prepara)\b.{0,15}\b(pra|para|por)\s*(mim|nos|a gente)\b/,/\bme ajud/,/\b(nao sei|sei la|qualquer coisa|tanto faz)\b/,/^\s*(teste|testando|test|xxx+|aaa+|\.+|-+)\s*$/];
const cpEhAjuda=(t)=>AJUDA_RE.some(re=>re.test(String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()));
/* O que o objetivo exige e ainda falta (espelho do auditor, sem o que depende do texto). */
function cpFaltando(){
  const d=CP_ED.d, p=cpProduto(), f=[];
  if(d.objetivo==='produto'){ if(!d.sku) f.push('produto'); if(p&&!p.descricao) f.push('descricao'); }
  if(d.objetivo==='promocao'){ if(!d.sku) f.push('produto'); if(!(d.promo.precoCentavos>0)) f.push('precoPromo'); if(!d.promo.ate) f.push('validade'); if(!d.promo.comoAproveitar) f.push('condicoes'); }
  if(d.objetivo==='evento'){ if(!d.nome.trim()) f.push('nome'); if(!d.evento.descricao) f.push('evDescricao'); if(!d.evento.data) f.push('data'); if(!d.evento.hora) f.push('hora'); if(!d.evento.local&&!d.evento.link) f.push('local'); }
  if(d.objetivo==='captar'){ const c=d.captar; if(!c.solucao&&!c.sku) f.push('solucao'); if(!c.publico) f.push('publico'); if(!c.beneficio) f.push('beneficio'); if(!c.acao) f.push('acao'); }
  if((d.divulgacao||[]).length<(CP_ALCANCE[d.objetivo]||1)) f.push('divulgacao');
  return f;
}
const CP_PERGUNTA={produto:'Qual produto do catálogo?',descricao:'Descreva o produto em uma frase (o catálogo não tem descrição).',precoPromo:'Qual o preço promocional?',validade:'Até quando vale a promoção?',
  condicoes:'Quais as condições? (como aproveitar)',nome:'Qual o nome do evento?',evDescricao:'O que vai ter no evento? (uma frase)',data:'Qual a data?',hora:'Que horas?',local:'Onde? (endereço — ou o link, se for on-line)',
  solucao:'Qual solução você quer anunciar?',publico:'Para quem é? (público-alvo)',beneficio:'Qual benefício real a pessoa ganha?',acao:'Depois de clicar, a pessoa vai…',divulgacao:'Onde o link vai aparecer?'};
function cpBeneficiosDoCatalogo(){ const s=cpSolucaoCat(); return s?.descricao?String(s.descricao).split(/[.;\n]+/).map(x=>x.trim()).filter(x=>x.length>8).slice(0,5):[]; }
function cpAjudaHtml(){
  const d=CP_ED.d, p=cpProduto(), s=cpSolucaoCat(), falta=cpFaltando(), R=(c)=>reais(c);
  const sei=[]; // o que já está cadastrado — não perguntar de novo
  if(p){ sei.push(`Produto: <b>${esc(p.nome)}</b>`); sei.push(`Preço: <b>${R(p.precoCentavos)}</b>${p.precoDeCentavos?` (de ${R(p.precoDeCentavos)})`:''}`); if(p.descricao) sei.push(`Descrição: “${esc(String(p.descricao).slice(0,80))}”`); if(p.imagem) sei.push('Foto do produto'); }
  if(s){ sei.push(`Solução: <b>${esc(s.nome)}</b> (catálogo)`); if(s.descricao) sei.push(`Benefícios cadastrados: “${esc(String(s.descricao).slice(0,80))}”`); }
  const campo={produto:()=>'<p class="hint">Escolha o produto no campo acima.</p>',
    descricao:()=>`<input id="ajDesc" maxlength="200" placeholder="Ex.: algodão 100%, do P ao GG" value="${esc(d.ajudaDescricao||'')}" oninput="CP_ED.d.ajudaDescricao=this.value">`,
    precoPromo:()=>`<input inputmode="decimal" placeholder="${p?cpReaisTxt(cpPrecoSugerido(p)):'39,90'}" value="${esc(cpReaisTxt(d.promo.precoCentavos))}" oninput="cpSet('promo.precoCentavos',cpCentavos(this.value))">`,
    validade:()=>`<input type="date" value="${esc(d.promo.ate||'')}" oninput="cpSet('promo.ate',this.value)">`,
    condicoes:()=>`<input maxlength="160" placeholder="Ex.: diga PROMO no botão · 1 por cliente" value="${esc(d.promo.comoAproveitar||'')}" oninput="cpSet('promo.comoAproveitar',this.value)">`,
    nome:()=>`<input maxlength="80" placeholder="Ex.: Bazar de primavera" value="${esc(d.nome)}" oninput="cpSet('nome',this.value)">`,
    evDescricao:()=>`<input maxlength="200" placeholder="Ex.: peças a partir de R$ 10 e café para quem vier" value="${esc(d.evento.descricao||'')}" oninput="cpSet('evento.descricao',this.value)">`,
    data:()=>`<input type="date" value="${esc(d.evento.data||'')}" oninput="cpSet('evento.data',this.value)">`,
    hora:()=>`<input type="time" value="${esc(d.evento.hora||'')}" oninput="cpSet('evento.hora',this.value)">`,
    local:()=>`<input maxlength="160" placeholder="Endereço, ou https://… se for on-line" value="${esc(d.evento.local||d.evento.link||'')}" oninput="/^https?:/.test(this.value)?(cpSet('evento.link',this.value),cpSet('evento.local','')):(cpSet('evento.local',this.value),cpSet('evento.link',''))">`,
    solucao:()=>`${cpSolucaoSelect()}<input maxlength="120" placeholder="…ou descreva: ex.: CRM para pequenas empresas" value="${esc(d.captar.solucao||'')}" oninput="cpSet('captar.solucao',this.value)" style="margin-top:6px">`,
    publico:()=>`<input maxlength="160" placeholder="Ex.: pequenas lojas que vendem pelo WhatsApp" value="${esc(d.captar.publico||'')}" oninput="cpSet('captar.publico',this.value)">`,
    beneficio:()=>`${cpBeneficiosDoCatalogo().map(b=>`<button class="cp-sug" onclick="cpSetRender('captar.beneficio',${esc(JSON.stringify(b))})">${esc(b)}</button>`).join('')}
      <input maxlength="300" placeholder="Ex.: reúne atendimento e pedidos num lugar só" value="${esc(d.captar.beneficio||'')}" oninput="cpSet('captar.beneficio',this.value)" style="margin-top:6px">`,
    acao:()=>`<div class="cp-lugares">${Object.entries(CP_ACOES).map(([k,v])=>`<label class="cp-lugar${d.captar.acao===k?' on':''}"><input type="radio" name="ajAcao" ${d.captar.acao===k?'checked':''} onchange="cpAcao('${k}')">${esc(v)}</label>`).join('')}</div>`,
    divulgacao:()=>'<p class="hint">Marque em <b>Onde vai divulgar</b>, mais abaixo.</p>'};
  return `<div class="cp-ajuda"><div class="cp-ajuda-h">${ico('gerar')}<div><b>Assistente de campanha</b><small>Uso o que já está cadastrado e pergunto só o que falta para “${esc(CP_OBJ[d.objetivo].t)}”.</small></div>${bi('fechar','Fechar o assistente','CP_ED.ajuda=false;render()')}</div>
    ${sei.length?`<div class="cp-ajuda-sei"><small>Já sei</small>${sei.map(x=>`<span>${ico('check')}${x}</span>`).join('')}</div>`:''}
    ${falta.length?falta.map(k=>`<div class="cp-ajuda-q"><label>${esc(CP_PERGUNTA[k])}</label>${campo[k]()}</div>`).join(''):'<p class="hint" style="margin:6px 0">Tenho tudo o que preciso.</p>'}
    <div style="margin-top:10px">${botao({t:'Criar texto e imagem',ic:'gerar',v:'p',sz:'xs',on:'cpMontarComAjuda()',id:'btCpMontar'})}<small class="hint" style="margin-left:8px">Você revisa e edita antes de auditar.</small></div></div>`;
}
function cpSolucaoSelect(){ const cat=CP[RES_DIAS]?.catalogo||[], d=CP_ED.d; if(!cat.length) return '';
  return `<select onchange="CP_ED.d.captar.sku=this.value;if(this.value){CP_ED.d.captar.solucao=(cpSolucaoCat()?.nome||'');}cpSujo();render()"><option value="">Escolha do catálogo…</option>${cat.map(x=>`<option value="${esc(x.sku)}" ${x.sku===d.captar.sku?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>`; }
function cpAcao(k){ const d=CP_ED.d; d.captar.acao=k; if(!d.botao||[...Object.values(CP_BOTAO),...Object.values(CP_BOTAO_ACAO)].includes(d.botao)) d.botao=CP_BOTAO_ACAO[k]; cpSujo(); render(); }
function cpAbrirAjuda(){ CP_ED.ajuda=true; if(CP_ED.passo!==1) CP_ED.passo=1; render(); setTimeout(()=>document.querySelector('.cp-ajuda')?.scrollIntoView({behavior:'smooth',block:'center'}),50); }
async function cpMontarComAjuda(){
  const d=CP_ED.d, p=cpProduto();
  if(d.ajudaDescricao&&p&&!p.descricao) d.descricaoExtra=d.ajudaDescricao;
  const falta=cpFaltando().filter(k=>!(k==='descricao'&&d.descricaoExtra));
  if(falta.length) return avisoErro('Ainda falta',falta.map(k=>esc(CP_PERGUNTA[k])).join('<br>'));
  if(!d.nome.trim()) d.nome=(d.objetivo==='promocao'?'Promo ':'')+(p?.nome||d.captar?.solucao||'Campanha');
  CP_ED.variacao=0; d.texto=cpTextoModelo();
  if(d.objetivo==='captar'&&d.captar.acao) d.botao=CP_BOTAO_ACAO[d.captar.acao]; else if(!d.botao||Object.values(CP_BOTAO).includes(d.botao)) d.botao=CP_BOTAO[d.objetivo];
  /* Montar é TEXTO E IMAGEM: a arte sai com os mesmos dados (e a foto do
     produto, quando houver). Montar só o texto deixava a campanha pela metade. */
  CP_ED.ajuda=false; cpSujo(); render();
  const img=await cpGerarImagem(true);
  render();
  flash(img?'Texto e imagem prontos — revise, edite à vontade e audite.':'Texto pronto; a imagem não saiu — tente “Gerar imagem”.',img?'ok':'err');
}

async function cpSubirImagem(input){
  const f=input.files?.[0]; if(!f) return;
  try{
    const r=await fetch('/crm/api/midia?tipo=imagem&nome='+encodeURIComponent(f.name),
      {method:'POST',headers:{'content-type':f.type||'image/jpeg',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:f});
    const j=await r.json().catch(()=>({erro:'resposta inválida do servidor'}));
    if(!r.ok||j.erro) throw new Error(j.erro||('HTTP '+r.status));
    await cpDefinirImagem({arquivo:j.arquivo,url:j.url});
  }catch(e){ avisoErro('A imagem não subiu',esc(e.message)); }
  input.value='';
}

function cpPassos(){
  const c=CP_ED.c, a=c?.auditoria, p=CP_ED.passo;
  const pode=[true,!!c,!!a&&!CP_ED.sujo&&!['bloquear','corrigir'].includes(a.resultado),c?.estado==='ativa'];
  const nomes=['Conteúdo','Auditoria','Aprovação','Divulgação'];
  return `<div class="cp-passos">${nomes.map((n,i)=>{ const k=i+1;
    const cls=k===Math.max(p,1)?'on':k<p||(k===4&&c?.estado==='ativa')?'feito':'';
    const clicavel=pode[i]&&c?.estado!=='ativa'&&k<4||k===p;
    return `<button class="cp-passo ${cls}" ${clicavel?`onclick="cpIr(${k})"`:'disabled'}><span class="n">${cls==='feito'&&k!==p?ico('check'):k}</span>${n}</button>`; }).join('<span class="cp-sep"></span>')}</div>`;
}
async function cpIr(k){ if(k===2&&(!CP_ED.c||CP_ED.sujo||CP_ED.c.estado==='rascunho')) return cpAuditar(); CP_ED.passo=k; render(); }

function cpAssistente(r){
  if(!r) return '<div class="card"><p class="hint">Carregando…</p></div>';
  const p=CP_ED.passo;
  const corpo=p===1?cpFormConteudo(r):p===2?cpTelaAuditoria():p===3?cpTelaAprovacao():cpTelaDivulgacao();
  return `<div class="card" style="margin-bottom:16px">${cpPassos()}
    <div class="cp-grade"><div class="cp-form">${corpo}</div>
    <div class="cp-lado"><div class="cp-lado-t">Prévia no Telegram</div><div id="cpPrevia">${cpPreviaHtml()}</div></div></div></div>`;
}
function cpPrevia(){ const el=document.getElementById('cpPrevia'); if(el) el.innerHTML=cpPreviaHtml();
  const ct=document.getElementById('cpConta'); if(ct){ const lim=CP_ED.d.imagem?1024:4096, n=CP_ED.d.texto.length; ct.textContent=`${n} / ${lim}`; ct.className='cp-conta'+(n>lim?' estourou':''); } }
function cpPreviaHtml(d=CP_ED.d,bot){
  const nome=(bot||CP[RES_DIAS]?.linkBot||'').replace('https://t.me/','')||'seu_bot';
  const img=d.imagem?.url?`<img src="${esc(d.imagem.url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'tgp-semimg',textContent:'imagem não carregou'}))">`:'';
  const texto=d.texto?esc(d.texto).replace(/\n/g,'<br>'):'<span style="color:var(--dim)">O texto da publicação aparece aqui.</span>';
  return `<div class="tgp"><div class="tgp-top"><span class="tgp-av">${esc(nome[0]||'b').toUpperCase()}</span><div><b>@${esc(nome)}</b><small>bot</small></div></div>
    <div class="tgp-chat"><div class="tgp-msg">${img}<div class="tgp-txt">${texto}<span class="tgp-hora">12:00</span></div></div>
    <div class="tgp-bt">${esc(d.botao||'Falar com a loja')} ↗</div></div></div>
    <p class="hint" style="margin-top:8px">O botão abre o bot com o link da campanha${d.codigo?` (<code>?start=${esc(d.codigo)}</code>)`:''}.</p>`;
}

function cpFormConteudo(r){
  const d=CP_ED.d, p=cpProduto(), ed=!CP_ED.c||['rascunho','em-revisao','aguardando-aprovacao'].includes(CP_ED.c.estado);
  const cat=r.catalogo||[];
  const f=(rot,html,dica)=>`<div class="field"><label>${rot}</label>${html}${dica?`<p class="hint" style="margin-top:5px">${dica}</p>`:''}</div>`;
  const obj=`<div class="cp-objs">${Object.entries(CP_OBJ).map(([k,o])=>`<button class="cp-obj ${d.objetivo===k?'on':''}" onclick="cpObjetivo('${k}')">${ico(o.ic)}<b>${o.t}</b><small>${o.d}</small></button>`).join('')}</div>`;
  const prod=cpUsaProduto()?f('Produto do catálogo',cat.length?`<select id="cpSku" onchange="cpEscolherProduto(this.value)"><option value="">Escolha…</option>${cat.map(x=>`<option value="${esc(x.sku)}" ${x.sku===d.sku?'selected':''}>${esc(x.nome)} — ${reais(x.precoCentavos)}${x.esgotado?' (sem estoque)':''}</option>`).join('')}</select>`
      :`<p class="hint">Nenhum produto ativo no catálogo. <a href="#estoque" onclick="ir('estoque');return false">Cadastre um</a> ou escolha “Captar clientes”.</p>`,
      p?`Nome, preço e foto vêm do catálogo: ${reais(p.precoCentavos)}${p.precoDeCentavos?` (de ${reais(p.precoDeCentavos)})`:''}.`:''):'';
  const promo=d.objetivo==='promocao'?`<div class="form-grid">
      ${f('Preço promocional (R$)',`<input id="cpPromoPreco" inputmode="decimal" placeholder="39,90" value="${esc(cpReaisTxt(d.promo.precoCentavos))}" oninput="cpSet('promo.precoCentavos',cpCentavos(this.value))">`)}
      ${f('Válida até',`<input id="cpPromoAte" type="date" value="${esc(d.promo.ate||'')}" oninput="cpSet('promo.ate',this.value)">`)}</div>
      ${f('Condições (como aproveitar) *',`<input id="cpComo" maxlength="160" placeholder="Ex.: diga PROMO no botão · 1 por cliente" value="${esc(d.promo.comoAproveitar||'')}" oninput="cpSet('promo.comoAproveitar',this.value)">`)}`:'';
  const captar=d.objetivo==='captar'?`<div class="form-grid">
      ${f('Solução oferecida *',`${cpSolucaoSelect()}<input id="cpCapSol" maxlength="120" placeholder="${(r.catalogo||[]).length?'…ou descreva':'Ex.: CRM para pequenas empresas'}" value="${esc(d.captar.solucao||'')}" oninput="cpSet('captar.solucao',this.value)" style="margin-top:${(r.catalogo||[]).length?'6px':'0'}">`)}
      ${f('Público-alvo *',`<input id="cpCapPub" maxlength="160" placeholder="Ex.: pequenas lojas que vendem pelo WhatsApp" value="${esc(d.captar.publico||'')}" oninput="cpSet('captar.publico',this.value)">`)}</div>
      ${f('Benefício real *',`<input id="cpCapBen" maxlength="300" placeholder="Ex.: reúne atendimento e pedidos num lugar só" value="${esc(d.captar.beneficio||'')}" oninput="cpSet('captar.beneficio',this.value)">`,'O que a pessoa ganha de verdade — o auditor não aceita promessa que não foi dita.')}
      ${f('Depois de clicar, a pessoa vai… *',`<div class="cp-lugares">${Object.entries(CP_ACOES).map(([k,v])=>`<label class="cp-lugar${d.captar.acao===k?' on':''}"><input type="radio" name="cpAcaoF" ${d.captar.acao===k?'checked':''} onchange="cpAcao('${k}')">${esc(v)}</label>`).join('')}</div>`)}`:'';
  const evento=d.objetivo==='evento'?`${f('O que vai ter *',`<input id="cpEvDesc" maxlength="200" placeholder="Ex.: peças a partir de R$ 10 e café para quem vier" value="${esc(d.evento.descricao||'')}" oninput="cpSet('evento.descricao',this.value)">`)}
    <div class="form-grid">
      ${f('Data *',`<input id="cpEvData" type="date" value="${esc(d.evento.data||'')}" oninput="cpSet('evento.data',this.value)">`)}
      ${f('Horário *',`<input id="cpEvHora" type="time" value="${esc(d.evento.hora||'')}" oninput="cpSet('evento.hora',this.value)">`)}
      ${f('Local',`<input id="cpEvLocal" maxlength="120" placeholder="Endereço" value="${esc(d.evento.local||'')}" oninput="cpSet('evento.local',this.value)">`)}
      ${f('…ou link de participação',`<input id="cpEvLink" maxlength="300" placeholder="https://" value="${esc(d.evento.link||'')}" oninput="cpSet('evento.link',this.value)">`)}</div>`:'';
  const img=d.imagem?`<div class="cp-img"><img src="${esc(d.imagem.url||'')}" alt=""><div><b>${d.imagem.gerada?'Arte gerada':d.imagem.doCatalogo?'Foto do catálogo':'Imagem enviada'}</b>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><label class="btn btn-s btn-xs">${ico('importar')}<span>Trocar</span><input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="cpSubirImagem(this)"></label>
      ${botao({t:'Gerar imagem',ic:'gerar',v:'s',sz:'xs',on:'cpGerarImagem()',tit:'Monta a arte da campanha: foto do produto, título, preço e chamada'})}
      ${botao({t:'Tirar imagem',ic:'excluir',v:'g',sz:'xs',on:"cpSetRender('imagem',null)"})}</div></div></div>`
    :`<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn btn-s">${ico('importar')}<span>Enviar imagem</span><input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="cpSubirImagem(this)"></label>
      ${p?.imagem?botao({t:'Usar foto do catálogo',ic:'estoque',v:'g',on:`cpDefinirImagem({url:'${esc(p.imagem)}',doCatalogo:true})`}):''}
      ${botao({t:'Gerar imagem',ic:'gerar',v:'s',on:'cpGerarImagem()',tit:'Monta a arte da campanha: foto do produto, título, preço e chamada'})}</div>`;
  return `${ed?'':'<p class="hint">Esta campanha já foi aprovada — o conteúdo não muda mais.</p>'}
    <h4 class="cp-h">Objetivo</h4>${obj}
    ${CP_ED.ajuda&&ed?cpAjudaHtml():''}
    ${prod}${CP_ED.ajuda&&ed?'':promo+evento+captar}
    ${f('Nome da campanha',`<input id="cpNome" maxlength="80" placeholder="Ex.: Promo de sexta" value="${esc(d.nome)}" oninput="cpSet('nome',this.value)">`,'Só pra você achar ela depois — o cliente não vê.')}
    <div class="field"><label style="display:flex;align-items:center">Texto da publicação <span id="cpConta" class="cp-conta${d.texto.length>(d.imagem?1024:4096)?' estourou':''}" style="margin-left:auto">${d.texto.length} / ${d.imagem?1024:4096}</span></label>
      <textarea id="cpTexto" rows="7" oninput="cpSet('texto',this.value)">${esc(d.texto)}</textarea>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${botao({t:'Me ajude a montar a campanha',ic:'gerar',v:'s',sz:'xs',on:'cpAbrirAjuda()',id:'btCpAjuda',tit:'Vejo o que já está cadastrado, pergunto só o que falta e monto uma sugestão'})}
        ${d.texto&&!cpFaltando().length&&!cpEhAjuda(d.texto)?botao({t:'Outra versão',ic:'atualizar',v:'g',sz:'xs',on:'cpRefazerTexto()',id:'btCpTexto'}):''}</div></div>
    <div class="field"><label>Imagem</label>${img}<p class="hint" style="margin-top:5px">JPG, PNG ou WebP, até 10 MB. A partir de 600 px no menor lado sai nítida.</p></div>
    ${cpLugaresHtml()}
    <div class="form-grid">
      ${f('Texto do botão',`<input id="cpBotao" maxlength="40" value="${esc(d.botao)}" oninput="cpSet('botao',this.value)">`)}

async function cpPublicar(id){

  const em=document.getElementById('cpQuandoEm')?.value;
  if(agendar&&!em) return avisoErro('Escolha a data e a hora','Ou marque “Agora”.');
  try{

    const ok=(r.resultados||[]).filter(x=>x.ok).length, falha=(r.resultados||[]).filter(x=>!x.ok);
    if(CP_ED?.c?.id===id&&r.campanha) CP_ED.c=r.campanha;

    if(falha.length) avisoErro(`${ok} ${agendar?'agendada(s)':'enviada(s)'}, ${falha.length} não`,falha.map(x=>esc(x.erro)).join('<br>'));

        ${c.aprovacao?`<p class="hint">Aprovada em ${cpData(c.aprovacao.em)}${c.aprovacao.por?` por ${esc(c.aprovacao.por)}`:''}${c.aprovacao.ressalvas?.length?` — com ressalva: ${c.aprovacao.ressalvas.map(esc).join(' ')}`:''}.</p>`:''}

async function conectarTelegram(soReconectar){
  const campo=document.getElementById('tgToken');
  const token=soReconectar?'':(campo?.value||'').trim();
  const err=document.getElementById('tgErro');
  if(err){ err.classList.remove('on'); err.textContent=''; }
  if(!token&&!TG?.temToken){ if(err){err.textContent='Cole o token que o @BotFather entregou.';err.classList.add('on');} campo?.focus(); return; }
  if(token&&!/^\d{5,}:[A-Za-z0-9_-]{30,}$/.test(token)){
    if(err){err.textContent='Isso não parece um token do @BotFather — ele tem números, dois-pontos e um código longo.';err.classList.add('on');}
    campo?.focus(); return;
  }
  try{
    const r=await api('canais/conectar',{canal:'telegram',token});
    if(!r.ok){ if(err){err.textContent=r.erro||'O Telegram não aceitou.';err.classList.add('on');} return avisoErro('O Telegram não aceitou',esc(r.erro||'motivo não informado')); }
    TG_TROCAR=false;
    TG=await api('canais/telegram').catch(()=>TG);
    render();
    avisoOk('Telegram conectado',`O bot <b>${esc(r.numero||'')}</b> já está atendendo. Mande um "oi" pra ele e veja a conversa chegar em <b>Telegram → Atendimento</b>.`);
  }catch(e){ if(err){err.textContent=e.message;err.classList.add('on');} avisoErro('Não consegui conectar o Telegram',esc(e.message)); }
}

/* FINALIZAR x ENCERRAR — os dois so para quem esta ATENDENDO (conversa
   assumida). Finalizar = desfecho normal: pergunta "posso ajudar em algo
   mais?" e, se o cliente disser que nao, finaliza e pede a nota. Encerrar = a
   forca, com motivo, sem nota. E essa diferenca que a auditoria le depois. */
function botoesFechamento(c,sit){
  const assumida=sit==='com-vendedor';
  const dica='Assuma o atendimento primeiro — só quem está atendendo pode finalizar ou encerrar';

    botao({t:'Encerrar',ic:'fechar',v:'g',sz:'xs',on:`encerrarAtendimento('${esc(c.telefone)}','${num}')`,tit:'Encerrar à força, com motivo (sem nota)'});
  return botao({t:'Finalizar',ic:'check',v:'s',sz:'xs',off:!assumida,on:`finalizarAtendimento('${esc(c.telefone)}')`,tit:assumida?'Pergunta “Posso ajudar em algo mais?” — se o cliente disser que não, finaliza e pede a nota':dica})+
    botao({t:'Encerrar',ic:'fechar',v:'g',sz:'xs',off:!assumida,on:`encerrarAtendimento('${esc(c.telefone)}','${num}')`,tit:assumida?'Encerrar à força, com motivo (sem nota)':dica});

async function confirmarEncerramento(tel){
  const sel=document.getElementById('encMotivo')?.value||'';
  const motivo=sel==='outro'?(document.getElementById('encTexto')?.value||'').trim():sel;
  if(!motivo) return avisoErro('Diga o motivo','O motivo fica no histórico — é o que permite auditar o encerramento depois.');

  try{
    const r=await api('atendimentos/encerrar',{telefone:tel,motivo});
    /* "Encerrei mas nao avisei" e diferente de "encerrei": diz o PORQUE, pra
       quem atende saber se passa por outro caminho. */
    if(r.avisado) flash(`Atendimento ${r.protocolo} encerrado — o cliente recebeu o protocolo.`,'ok');
    else avisoErro(`Atendimento ${r.protocolo} encerrado`,`Mas o aviso não chegou ao cliente: ${esc(r.erroAviso||'motivo não informado')}.`);
    CONVERSA=null; TG_GAVETA=false; HIST={};

async function responderCliente(tel){
  const campo=document.getElementById('respTexto');
  const texto=(campo?.value||'').trim();
  if(!texto){ marcarCampo('respTexto','Escreva a mensagem antes de enviar.'); campo?.focus(); return; }
  const bt=document.getElementById('btResponder');
  const antes=bt?bt.innerHTML:null;
  if(bt){ bt.disabled=true; bt.innerHTML=ico('relogio')+'<span>Enviando…</span>'; }
  try{
    await api('atendimentos/responder',{telefone:tel,texto});
    if(campo) campo.value='';
    CONVERSA=tel;
    flash('Mensagem enviada.','ok');
    await carregar();
  }catch(e){
    /* Falha de envio FICA na tela ate fechar: a pessoa do outro lado esta
       esperando, e um aviso que some sozinho deixaria o atendente achando que respondeu. */
    avisoErro('A mensagem NÃO saiu','O texto continua no campo — pode tentar de novo.',[e.message]);
  }finally{ if(bt){ bt.disabled=false; bt.innerHTML=antes; } }
}

let PERFIL_NO_NUMERO=null;

function previewPerfil(){
  const v=(id)=>(document.getElementById(id)||{}).value?.trim()||'';
  const nome=document.getElementById('pvNome');
  const recado=document.getElementById('pvRecado');
  /* Campo vazio mostra O QUE ESTA VALENDO, nao um texto de exemplo: o preview
     responde "como esta hoje", e so muda quando voce digita. */
  if(nome) nome.textContent=v('pfNome')||PERFIL_NO_NUMERO?.nome||'sem nome';
  if(recado) recado.textContent=v('pfRecado')||PERFIL_NO_NUMERO?.recado||'sem recado';
  const arq=(document.getElementById('pfFoto')||{}).files?.[0];
  const foto=document.getElementById('pvFoto');
  if(!foto) return;
  if(arq){
    const r=new FileReader();
    r.onload=()=>{ foto.style.backgroundImage=`url(${r.result})`; };
    r.readAsDataURL(arq);
  }else if(PERFIL_NO_NUMERO?.foto){
    foto.style.backgroundImage=`url(${PERFIL_NO_NUMERO.foto})`;
  }
}

/* Busca o perfil e PREENCHE os campos. Em rota propria porque ler isso baixa a
   foto do servidor da Meta — pendurar no carregamento da tela faria tudo
   esperar por uma imagem. */

  const alvo=document.getElementById('pfNome');

/**
 * Deixa a foto no tamanho que o WhatsApp usa, ANTES de mandar.
 *
 * A foto de perfil do WhatsApp e um quadrado pequeno. Mandar o arquivo original
 * era o que dava HTTP 413: uma imagem de 600 KB vira 800 KB em base64 e estoura
 * o teto de 256 KB da requisicao — e foto tirada no celular tem 3 a 5 MB.
 *
 * Corta pelo CENTRO em vez de espremer: rosto espremido fica grotesco, e a foto
 * de perfil e redonda no WhatsApp — o que sobra nas pontas ia sumir de qualquer
 * jeito.
 */
async function prepararFoto(arquivo, lado=640, qualidade=0.86){
  const bitmap=await createImageBitmap(arquivo);
  const corte=Math.min(bitmap.width,bitmap.height);
  const cv=document.createElement('canvas');
  cv.width=lado; cv.height=lado;
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(bitmap,(bitmap.width-corte)/2,(bitmap.height-corte)/2,corte,corte,0,0,lado,lado);
  bitmap.close?.();
  let url=cv.toDataURL('image/jpeg',qualidade);
  /* Cinto e suspensorio: se ainda assim ficar perto do teto, baixa a qualidade
     em vez de deixar o servidor recusar na cara da pessoa. */
  let q=qualidade;
  while(url.length>180*1024&&q>0.5){ q-=0.12; url=cv.toDataURL('image/jpeg',q); }
  return url;
}

/* O WhatsApp devolve erro de programador quando recusa. "setPushname is not a
   function" nao diz nada pra quem so queria trocar o nome — e a pessoa fica
   achando que fez algo errado, quando a limitacao e da versao do WhatsApp Web. */
function traduzirFalhaPerfil(f){
  const t=String(f||'');
  if(/setPushname|setProfileName|is not a function/i.test(t))
    return 'nome: esta versão do WhatsApp Web não permite trocar o nome de exibição por aqui — mude direto no celular, em Configurações → Perfil.';
  if(/pic|photo|image|foto/i.test(t)&&/invalid|format|size/i.test(t))
    return 'foto: o WhatsApp recusou a imagem. Ela precisa ser quadrada — tente outra.';
  if(/status/i.test(t)&&/length|long/i.test(t))
    return 'recado: passou do tamanho que o WhatsApp aceita.';
  return t;
}

async function personalizarCanal(){
  limparErros();
  const nome=(document.getElementById('pfNome')||{}).value?.trim()||'';
  const recado=(document.getElementById('pfRecado')||{}).value?.trim()||'';
  const arq=(document.getElementById('pfFoto')||{}).files?.[0];
  if(!nome&&!recado&&!arq){
    marcarCampo('pfNome','Preencha ao menos um destes: nome, recado ou foto.');
    avisoErro('Nada para aplicar','Preencha ao menos um campo — nome, recado ou foto — antes de aplicar no número.');
    return;
  }
  try{
    let foto=null;
    if(arq){
      if(arq.size>15*1024*1024){ avisoErro('Foto grande demais','Essa imagem passa de 15 MB. Escolha outra, ou tire um print dela.'); return; }
      foto=await prepararFoto(arq);
    }
    const r=await api('canais/personalizar',{canal:'whatsapp-web',foto,nome,recado});
    /* Sucesso PARCIAL e o caso comum: o WhatsApp recusa foto fora do formato e
       aceita o nome na mesma chamada. Dizer so "pronto" esconderia metade. */
    const ok=(r.feito||[]).join(', ');
    if((r.falhas||[]).length){
      /* Deu certo em parte NAO e "nao consegui". Em campo isso apareceu como
         "Nao consegui concluir" depois de a foto TER SIDO aplicada — e o dono
         foi olhar o celular achando que nada tinha acontecido. O titulo conta o
         que entrou; a lista conta o que faltou. */
      abrirModal(ok?`Aplicado: ${esc(ok)}`:'Não consegui aplicar nada',
        `<p class="hint" style="margin-bottom:12px">${ok
          ? 'Isso já está valendo no seu número. O que não entrou:'
          : 'O WhatsApp recusou tudo:'}</p>
         <ul class="notas">${r.falhas.map(f=>`<li>${esc(traduzirFalhaPerfil(f))}</li>`).join('')}</ul>`,
        BT.fechar());
    }else{
      avisoOk('Perfil atualizado',`Já está valendo no seu número: ${esc(ok)}. Pode levar alguns minutos para aparecer em todos os contatos.`);
    }
    carregar();
  }catch(e){ avisoErro('Não consegui concluir',e.message); }
}
/* Reconectar e derrubar e subir: sessao travada em "esperando o QR" nao se
   conserta mandando conectar de novo — o provider ja se acha conectando. */
/* Trocar de numero NAO e reconectar. Reconectar volta pro mesmo aparelho;
   trocar esquece o pareamento e pede QR do novo. Eram a mesma coisa na tela, e
   por isso parecia que o painel "nao aceitava numero novo". */
function trocarNumeroCanal(){
  const c=(CANAIS?.canais||[])[0]||null;
  confirmar({
    titulo:'Trocar o número que atende?',
    texto:`Vou esquecer o aparelho pareado${c?.numero?` (<b>+${esc(c.numero)}</b>)`:''} e pedir o QR Code do número novo.`,
    consequencia:'Até alguém ler o novo QR, o canal fica fora do ar e ninguém é atendido.',
    rotulo:'Esquecer e pedir QR', icone:'atualizar', perigo:false,
    aoConfirmar:async()=>{
      flash('Esquecendo o aparelho e subindo sessão nova…','ok');
      const r=await api('canais/trocar-numero',{canal:'whatsapp-web'});
      await carregar();
      if(r.qr||r.estado==='aguardando_qr'){
        avisoOk('Pronto para parear',
          'O QR Code aparece aqui nesta tela. Abra o WhatsApp do número novo → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b>.'
          +(r.anterior?'<br><br><small>A sessão anterior foi guardada, não apagada.</small>':''));
      }else{
        avisoErro('A sessão nova não chegou a pedir QR',`Estado atual: <b>${esc(r.estado||'?')}</b>. Tente "Reconectar (gera QR novo)".`);
      }
      /* Numero novo costuma ser CLIENTE NOVO. Perguntar aqui poupa a descoberta
         ruim: parear o chip do escritorio de advocacia e a Micaela receber os
         clientes dele pelo nome da lanchonete. */
      perguntarNomeDoAssistente();
    },
  });
}

/**
 * Depois de trocar o número, oferece trocar o nome do assistente.
 *
 * Não força: quem só mudou de chip mantém o mesmo atendimento. Mas quem trocou
 * de número porque trocou de cliente quase sempre quer trocar o nome junto — e
 * descobrir isso pela primeira conversa é tarde.
 */
function perguntarNomeDoAssistente(){
  const atual=String(BOT?.config?.nome||'').trim();
  const id='nq'+Math.random().toString(36).slice(2,9);
  window[id]=(ir)=>{
    fecharModal(); delete window[id];
    if(ir) location.hash='#wa-personalizar';
  };
  abrirModal('Quer trocar o nome do assistente?',
    `<p class="hint">O número mudou, mas o atendimento continua se chamando <b>${esc(atual||'sem nome')}</b>.</p>`
    +`<p class="hint" style="margin-top:8px">Se este número é de outro cliente ou de outra operação, vale trocar o nome, `
    +`a saudação e o perfil — é o que o cliente vê na primeira mensagem.</p>`,
    `<button class="btn btn-s" onclick="window['${id}'](false)">${ico('fechar')}<span>Manter ${esc(atual||'como está')}</span></button>`
    +`<button class="btn btn-p" onclick="window['${id}'](true)">${ico('person')}<span>Trocar o nome</span></button>`);
}

async function reconectarCanal(){
  try{
    flash('Derrubando a sessão para subir uma nova…','ok');
    await api('canais/desconectar',{canal:'whatsapp-web'}).catch(()=>null);
    await new Promise(r=>setTimeout(r,1200));
    await api('canais/conectar',{canal:'whatsapp-web'});
    await carregar();
    flash('Pronto. Se pedir QR, ele aparece aqui nesta tela.','ok');
  }catch(e){
    avisoErro('Não consegui reconectar',esc(e.message));
  }
}

async function desconectarCanal(){
  return confirmar({
    titulo:'Desconectar o WhatsApp?',
    texto:'O canal sai do ar e ninguém é atendido até você parear de novo.',
    consequencia:'Mensagem que chegar enquanto estiver fora não é respondida.',
    rotulo:'Desconectar', icone:'power', perigo:true,
    aoConfirmar:async()=>{
      try{
        await api('canais/desconectar',{canal:'whatsapp-web'});
        CANAIS=await api('canais'); render(); flash('Canal desconectado.','ok');
      }catch(e){ avisoErro('Não consegui concluir',e.message); }
    },
  });
}
function copiar(t){navigator.clipboard?.writeText(t).then(()=>flash('Link copiado.','ok'),()=>flash('Copie manualmente: '+t,'err'));}

/* Leva a tela ate o bloco de configuracao daquele canal. A grade e um indice:
   clicar em "Configurar" tem de ir pro lugar, nao abrir outra pagina. */
function rolarAteCard(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.add('piscou');
  setTimeout(()=>el.classList.remove('piscou'),1400);
}

function sairDoPainel(){
  api('sair',{}).catch(()=>{});
  TOKEN='';sessionStorage.removeItem('crm_token');telaEntrar();
}

/** Decide entre criar acesso, login e dashboard antes de qualquer dado. */
(async function porta(){
  let est={exigeSenha:true};
  try{ est=await api('auth'); }catch{ /* backend antigo: pede senha assim mesmo */ }

  /* Instalacao nova: vai para a tela, que se vira em "criar acesso". Antes
     daqui saia direto para o dashboard — a regra velha era "sem CRM_TOKEN,
     painel aberto". Hoje o servidor bloqueia, entao seguir em frente so
     renderizava um painel que responde 403 em tudo. */
  if(est.precisaCriar){ return telaEntrar(); }

  if(!est.exigeSenha){ document.body.classList.remove('sem-nav'); return carregar(); }
  if(TOKEN){
    /* O que fica na aba é a SESSÃO, não a senha: confere por ela. Sessão
       vencida (ou senha antiga) cai no login dentro do próprio carregar(). */
    try{ await api('minha-conta'); document.body.classList.remove('sem-nav'); return carregar(); }
    catch{ /* token velho: cai na tela de entrada */ }
  }
  telaEntrar();
})();
</script>
