      colunas:[
        {t:'Quando',cel:(e)=>esc(String(e.quando||'').slice(0,16).replace('T',' '))},
        {t:'Lead',cel:(e)=>`<b>${esc(e.lead)}</b>`},

}

function telaVisao(){
  const r=ST.resumo,w=STATUS?.whatsapp||{};
  const wpp=canalWhatsApp();
  const estados=[wpp.no_ar,!!(w.waToken&&w.waPhoneId),!!STATUS?.bot?.webhook,

/* Barra de distribuição: quanto de cada etapa no total em aberto. Os tons giram
   na régua --t1..--t6 pra duas etapas vizinhas nunca saírem da mesma cor. */
function funilBarra(){
  const et=ST.resumo.etapas.filter(e=>e.leads>0);
  const total=et.reduce((s,e)=>s+e.leads,0);
  if(!total) return '';
  const tom=(i)=>`var(--t${(i%6)+1})`;
  return `<div class="card" style="margin-bottom:16px">
    ${cardH('visao','Onde os leads estão','Distribuição do que está em aberto, por etapa.',1,
      `<span class="badge b-ac">${total} em aberto</span>`)}
    <div class="funil-barra">${et.map((e,i)=>
      `<i style="width:${(e.leads/total*100).toFixed(1)}%;background:${tom(i)}" title="${esc(e.etapa)}: ${e.leads}"></i>`).join('')}</div>
    <div class="funil-leg">${et.map((e,i)=>
      `<div><span class="pt" style="background:${tom(i)}"></span>${esc(e.etapa)} <b>${e.leads}</b>
        <small>${Math.round(e.leads/total*100)}%${e.valor?' · '+brl(e.valor):''}</small></div>`).join('')}</div></div>`;
}

function colHtml(etapa){
  const et=ST.resumo.etapas.find(e=>e.etapa===etapa)||{leads:0,valor:null};
  const g=ST.leads.filter(l=>l.status==='aberto'&&l.etapa===etapa);
  return `<div class="col"><div class="col-h"><h3>${esc(etapa)}</h3><span class="n">${et.leads}</span><span class="v">${brl(et.valor)}</span></div>
   ${g.map(cardLead).join('')||'<div class="hint" style="padding:12px 0;text-align:center">vazio</div>'}</div>`;
}
function cardLead(l){
  const tags=[l.faixa?`<span class="tag t-${esc(l.faixa)}">${esc(l.faixa)}${l.score!=null?' · '+l.score:''}</span>`:'',
   l.telefoneAviso?`<span class="tag t-morno">telefone suspeito</span>`:'',
   l.origem&&l.origem!=='manual'?`<span class="tag">${esc(l.origem)}</span>`:''].join('');
  return `<div class="lead"><div class="nm">${esc(l.nome||'sem nome')}</div>
   <div class="meta">+${esc(l.telefone)}${l.interesse?' · '+esc(l.interesse):''} · ${brl(l.valor)}</div>
   ${tags?`<div class="tags">${tags}</div>`:''}
   <div class="acts"><select onchange="mover('${esc(l.id)}',this.value)">${ST.funil.map(e=>`<option${e===l.etapa?' selected':''}>${esc(e)}</option>`).join('')}</select>

}

 bot:()=>{

    vazio('bot','Backend sem a rota do bot','Atualize o servidor.',['Subir o backend novo','Recarregar']);
  const c=BOT.config;
  /* O subtitulo tambem falava so de regras. Com fluxo no ar, ele descrevia um
     bot que nao e o que esta atendendo — e quem le acha que veio na tela errada. */
  return head('Bot',(BOT.fluxo?.passos||[]).length
      ? 'A árvore de atendimento no ar, o que ela responde e quando chama gente. Teste aqui antes de qualquer cliente ver.'

  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${(()=>{
      /* Esta tela nasceu para o bot de REGRAS por palavra e nunca soube do
         FLUXO. Com uma arvore de 40 passos no ar, ela mostrava "Regras 0" e
         "Chamam gente 0" — dizendo que o bot nao faz nada enquanto ele atende
         cliente de verdade. O motor usa um OU outro, nunca os dois: a tela tem
         de contar o que esta valendo. */
      const passos=(BOT.fluxo?.passos||[]).length;
      if(passos) return kpi('Fluxo',passos+' passos','a árvore que conduz a conversa')
        +kpi('Encaminham',contarEncaminhamentos(BOT.fluxo),'passam pro humano');
      return kpi('Regras',BOT.total,`${BOT.ativas} ativa(s)`)
        +kpi('Chamam gente',BOT.comHandoff,'passam pro humano');

    ${(()=>{
      /* "Bot ligado" com o canal fora nao atende ninguem — e as duas telas
         diziam a verdade SEPARADAMENTE, o que juntas vira mentira: quem olha
         aqui ve "ligado" e vai embora tranquilo enquanto o cliente fala
         sozinho. Aconteceu em campo. */
      const w=canalWhatsApp();
      if(c.ativo&&!w.no_ar) return kpi('Estado','ligado, mas MUDO',`o canal está ${esc(w.rotulo)} — ninguém é atendido`);
      return kpi('Estado',c.ativo?'ligado':'desligado',BOT.pronto?'respondendo':'não responde ainda');
    })()}
    ${(()=>{
      /* Estava CRAVADO em "nenhum". A tela dizia que nao havia canal com a
         Micaela pareada e conversando — e quem le o painel confia nele. */
      const w=canalWhatsApp();
      return kpi('Canal',w.no_ar?(w.via||'no ar'):'nenhum',

  ${(()=>{const w=canalWhatsApp();return c.ativo&&!w.no_ar?`<div class="card" style="margin-bottom:16px;border-style:dashed">
    ${cardH('alerta',`O bot está ligado, mas não tem por onde falar`,
      `O canal de WhatsApp está <b>${esc(w.rotulo)}</b>. Enquanto isso, mensagem de cliente não chega aqui e nada é respondido — o bot ligado não muda isso.`,5,

  <div class="card" style="margin-bottom:16px">

      </div>

  <!-- SEGURANCA. Fica VISIVEL porque e o tipo de protecao que ninguem sabe que

    ${linha('Violência doméstica','Manda 180, não 190 — ligar para a polícia com o agressor ao lado nem sempre é seguro','180','b-ok')}

 auditor:()=>{

    const recs=Object.entries(i.recibos).map(([stack,r])=>{
      if(!r.existe) return linha(stack,'nenhum recibo gravado','nunca rodou','');
      return linha(stack, r.valido?`gravado há ${r.idadeMin} min na branch ${esc(r.branch||'—')}`:esc(r.motivo),
        r.valido?'verde':'não vale', r.valido?'b-ok':'b-err');

   :`<div class="card" style="margin-top:16px"><p class="hint">Nenhuma tarefa registrada em métricas ainda.</p></div>`}`;

    ${linha('Tentativas de reconexão','automáticas, com espera crescente',String(c?.tentativas??0),'b-warn')}</div>`:''}

  <div class="card" style="margin-bottom:16px">

 redes:()=>{
  /* ESTA TELA era uma colcha de retalhos: um card de changelog do VSinfluence,
     dois blocos do TikTok, um tracejado de "teste rapido" e formularios soltos.
     Nao parecia o resto do console, e o pior: o botao ficava habilitado em canal
     que nao tem como conectar — quem clicava concluia que o sistema quebrou.

     Agora e uma GRADE por famila, montada de uma LISTA. Canal novo e uma linha
     aqui embaixo, e o estado de cada um sai do que o backend responde, nunca de
     texto fixo. */
  const w=canalWhatsApp();
  const tkFam=(f)=>TK?.familias?.[f]||null;
  const shop=tkFam('shop'), open=tkFam('open'), ads=tkFam('business');

  const EM_BREVE='em breve';
  const CANAIS_LISTA=[
    {fam:'Atendimento',itens:[
      {id:'whatsapp',nome:'WhatsApp',ic:'whats',oq:`Atende, cobra e responde cliente. É por onde ${nomeBot()} fala.`,
       estado:w.no_ar?'ok':'pendente',rotulo:w.no_ar?(w.numero?'+'+w.numero:'conectado'):w.rotulo,
       acao:{t:w.no_ar?'Gerenciar':'Conectar',on:"ir('canais')",ic:w.no_ar?'config':'power'}},
    ]},
    {fam:'Vendas e marketplaces',itens:[
      {id:'tiktokshop',nome:'TikTok Shop',ic:'vender',oq:'Publica o catálogo e recebe pedido da loja do TikTok.',
       /* `appConfigurado` e o campo que o backend devolve — eu tinha escrito
          `credenciais`, que nao existe, entao dava sempre falso e a tela dizia
          "sem credencial" com as tres chaves gravadas. */
       estado:shop?.autorizado?'ok':(shop?.appConfigurado?'pendente':'falta'),
       rotulo:shop?.autorizado?'autorizado':(shop?.appConfigurado?'falta autorizar a loja':'sem credencial'),
       acao:{t:'Configurar',on:"rolarAteCard('tiktok-shop')",ic:'config'}},
      {id:'mercadolivre',nome:'Mercado Livre',ic:'comprar',oq:'Anúncio, pedido e pergunta do comprador.',
       estado:'breve',rotulo:'credencial validada · módulo em construção'},
      {id:'shopee',nome:'Shopee',ic:'comprar',oq:'Anúncio e pedido.',estado:'breve',rotulo:EM_BREVE},
      {id:'aliexpress',nome:'AliExpress',ic:'comprar',oq:'Anúncio e pedido.',estado:'breve',rotulo:EM_BREVE},
    ]},
    {fam:'Entrega',itens:[
      {id:'99',nome:'99',ic:'seta',oq:'Corrida de entrega, prazo e rastreio.',estado:'breve',rotulo:EM_BREVE},
      {id:'zedelivery',nome:'Zé Delivery',ic:'seta',oq:'Pedido de bebida e entrega.',estado:'breve',rotulo:EM_BREVE},
    ]},
    {fam:'Conteúdo e redes sociais',itens:[
      {id:'tiktok',nome:'TikTok',ic:'publicar',oq:'Publica vídeo pela API, com token renovado sozinho.',
       estado:open?.autorizado?'ok':(open?.appConfigurado?'pendente':'falta'),
       rotulo:open?.autorizado?'autorizado':(open?.appConfigurado?'falta autorizar':'sem credencial'),
       acao:{t:'Configurar',on:"rolarAteCard('tiktok-open')",ic:'config'}},
      {id:'tiktokads',nome:'TikTok Ads',ic:'indicacao',oq:'Campanha paga e métrica de anúncio.',
       estado:ads?.autorizado?'ok':(ads?.appConfigurado?'pendente':'falta'),
       rotulo:ads?.autorizado?'autorizado':(ads?.appConfigurado?'falta autorizar':'sem credencial'),
       acao:{t:'Configurar',on:"rolarAteCard('tiktok-open')",ic:'config'}},
      {id:'instagram',nome:'Instagram',ic:'publicar',oq:'Métrica de post. Publicação ainda não.',estado:'parcial',rotulo:'só leitura'},
      {id:'youtube',nome:'YouTube',ic:'publicar',oq:'Métrica de vídeo. Publicação ainda não.',estado:'parcial',rotulo:'só leitura'},
      {id:'facebook',nome:'Facebook',ic:'publicar',oq:'Métrica de página. Publicação ainda não.',estado:'parcial',rotulo:'só leitura'},
      {id:'kwai',nome:'Kwai',ic:'publicar',oq:'Corte e agenda já preveem o formato.',estado:'breve',rotulo:EM_BREVE},
    ]},
  ];

  const TOM={ok:'b-ok',pendente:'b-warn',parcial:'b-warn',falta:'',breve:''};
  const tile=(c)=>{
    /* BOTAO SO EXISTE SE HA O QUE FAZER. Canal "em breve" com botao habilitado
       foi o que fez o dono clicar e achar que o sistema tinha quebrado. */
    const acao=c.acao
      ? botao({...c.acao,v:c.estado==='ok'?'s':'p',sz:'s'})
      : botao({t:'Em breve',ic:'relogio',v:'s',sz:'s',off:true,tit:'ainda não construímos este canal'});
    return `<div class="canal${c.estado==='breve'?' canal-breve':''}">
      <div class="canal-h"><span class="canal-ic">${ico(c.ic)}</span>
        <b>${esc(c.nome)}</b><span class="badge ${TOM[c.estado]||''}">${esc(c.rotulo)}</span></div>
      <p class="hint">${esc(c.oq)}</p>
      <div class="canal-a">${acao}</div></div>`;
  };

  const grades=CANAIS_LISTA.map(g=>`<div class="card" style="margin-bottom:16px">
    ${cardH('integra',g.fam,'',2)}
    <div class="grid g-canais">${g.itens.map(tile).join('')}</div></div>`).join('');

  const ligados=CANAIS_LISTA.flatMap(g=>g.itens).filter(c=>c.estado==='ok').length;
  const total=CANAIS_LISTA.flatMap(g=>g.itens).length;

  return head('Conexões','Cada canal por onde a empresa vende, atende ou publica. O estado vem do backend — o que aparece aqui é o que está valendo agora.')+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Canais ligados',`${ligados}/${total}`,'respondendo agora')}
    ${kpi('Atendimento',w.no_ar?'no ar':'parado',w.no_ar?(w.numero?'+'+esc(w.numero):esc(w.rotulo)):esc(w.rotulo))}
    ${kpi('Em construção',String(CANAIS_LISTA.flatMap(g=>g.itens).filter(c=>c.estado==='breve').length),'entram por aqui quando prontos')}
  </div>
  ${grades}
  <div id="tiktok-shop">${tiktokShopCard()}</div>
  <div id="tiktok-open">${tiktokCard()}</div>
  ${(()=>{
    const c=REDES?.credenciais||{};
    if(!Object.keys(c).length) return '';
    const linhas=Object.keys(c).map(r=>{
      const res=TESTE[r];
      const campos=c[r].campos.map(f=>`<div class="field"><label>${esc(f)}</label><input id="rc-${esc(r)}-${esc(f)}" placeholder="${esc(c[r].ajuda)}" autocomplete="off"></div>`).join('');
      const badge=!res?'<span class="badge">não testado</span>'
        :res.ok?`<span class="badge b-ok">conectado${res.conta?' · '+esc(res.conta):''}</span>`
        :`<span class="badge b-err">${esc(res.motivo)}</span>`;
      return `<div class="card" style="margin-bottom:12px">
        ${cardH('testar',c[r].nome,esc(c[r].ajuda),4,badge)}
        <div class="form-grid">${campos}
          <button class="btn btn-p" onclick="testarRede('${esc(r)}')">${ico('testar')}Testar conexão</button></div></div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:12px;border-style:dashed">
      ${cardH('testar','Teste rápido de credencial','A credencial abaixo <b>não fica gravada</b>: vai até o servidor, é usada na chamada e descartada. Serve para conferir se funciona — não para deixar a integração ligada.',4)}</div>${linhas}`;
  })()}`;
 },

 'wa-consumo':()=>{
  const inter=trilhaDeLeads().filter(e=>e.tipo==='interacao');
  const saida=inter.filter(e=>e.direcao==='saida').length;
  const w=STATUS?.whatsapp||{};
  const porMes={};
  inter.forEach(e=>{const m=String(e.quando||'').slice(0,7);if(m)porMes[m]=(porMes[m]||0)+1;});
  const meses=Object.entries(porMes).sort((a,b)=>b[0].localeCompare(a[0]));
  /* Absorveu os numeros que viviam em "WhatsApp > Relatorios": era outro item de
     menu com o mesmo nome do Relatorios de cima, e volume de conversa so faz
     sentido lido junto com o que ele virou em venda. */
  const comConversa=new Set(inter.map(e=>e.lead));
  const ganhosComConversa=ST.leads.filter(l=>l.status==='ganho'&&comConversa.has(l.nome||l.telefone)).length;
  const fechados=ST.leads.filter(l=>l.status!=='aberto').length;
  return head('WhatsApp · Consumo','Quanta conversa passou por aqui, o que ela virou no funil — e o que só a fatura da Meta responde.')+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Mensagens',inter.length,`${saida} enviada(s) · ${inter.length-saida} recebida(s)`)}
    ${kpi('Leads com conversa',comConversa.size,ST.leads.length?`de ${ST.leads.length} lead(s)`:'sem lead ainda')}
    ${kpi('Viraram venda',ganhosComConversa,comConversa.size?`de ${comConversa.size} com conversa`:'nenhuma conversa ainda')}
    ${kpi('Custo','—','só a fatura da Meta responde')}

  <div class="card" style="margin-bottom:16px">
    ${cardH('crm',`Por etapa do funil`,``,1)}${ST.resumo.etapas.map(e=>linha(e.etapa,`${e.leads} lead(s) aberto(s)`,e.valor==null?'—':brl(e.valor),e.leads?'b-ok':'')).join('')
      ||'<p class="hint">Sem funil cadastrado.</p>'}</div>
  <div class="card" style="margin-bottom:16px">
    ${cardH('financeiro',`Por mês`,``,2)}${meses.length?meses.map(([m,n])=>linha(m.split('-').reverse().join('/'),'mensagens',String(n),'b-ok')).join('')
      :'<p class="hint">Nenhuma mensagem registrada ainda. O contador enche sozinho conforme as conversas acontecem.</p>'}</div>
  <div class="card" style="border-style:dashed">
    ${cardH('politica',`Por que o custo aparece como “—”`,`A Meta cobra por <b>conversa</b>, não por mensagem, e o preço muda com a categoria (atendimento, marketing, utilidade) e com o país. Estimar isso aqui seria inventar número: o valor real está na fatura deles.`,3)}
    ${(()=>{const c=canalWhatsApp();return linha('Canal de saída',c.via||'nenhum',c.no_ar?'enviando':'não envia',c.no_ar?'b-ok':'b-warn')
      +linha('Canal de entrada',c.oficial?'webhook da Meta':'sessão de WhatsApp Web',c.no_ar?'recebendo':'não recebe',c.no_ar?'b-ok':'b-warn');})()}</div>`;
 },
 /* Caixa de entrada. Aqui e chat: lista de quem esta esperando a esquerda,
    conversa a direita, e SO ISSO.

    A primeira versao tinha tres indicadores no topo, o cartao de contexto embaixo
    da conversa e a trilha inteira do CRM no rodape. Virou um relatorio com um
    chat no meio — quem atende precisa ler a conversa e responder, nao estudar
    metricas. Indicador foi pro Consumo, trilha voltou pro Auditor. */
 'wa-atendimento':()=>{
  const dados=ATEND||{conversas:[],esperando:0};
  const lista=dados.conversas||[];
  const sel=lista.find(c=>c.telefone===CONVERSA)||lista[0]||null;
  const canal=(CANAIS?.canais||[])[0];
  const online=canal?.estado==='conectado';
  const hora=(x)=>x?String(x).slice(11,16):'';
  const dia=(x)=>{ if(!x) return ''; const h=new Date(); const d=new Date(x);
    return d.toDateString()===h.toDateString()?'hoje':String(x).slice(8,10)+'/'+String(x).slice(5,7); };

  const item=(c)=>`<button class="conversa${c.telefone===sel?.telefone?' ativa':''}${c.esperandoGente?' espera':''}" onclick="abrirConversa('${esc(c.telefone)}')">
    <div class="cv-top"><b>${esc(c.nome||'+'+c.telefone)}</b><small>${dia(c.ultima?.quando)} ${hora(c.ultima?.quando)}</small></div>
    <div class="cv-msg">${c.ultima?.direcao==='saida'?'<span class="cv-eu">você: </span>':''}${esc(String(c.ultima?.texto||'').replace(/\n/g,' ').slice(0,58))}</div>
    ${c.esperandoGente?`<div class="cv-espera">${ico('relogio')}esperando${c.departamento?' · '+esc(c.departamento):''}</div>`:''}
    ${c.protocolo?`<div class="cv-espera" style="font-family:ui-monospace,monospace;opacity:.7">${esc(c.protocolo)}</div>`:''}
  </button>`;

  const bolha=(h)=>`<div class="bolha ${h.direcao==='saida'?'b-nossa':'b-cliente'}">
    <div>${esc(h.texto||'').replace(/\n/g,'<br>')}</div><small>${hora(h.quando)}</small></div>`;

  /* O contexto vai no TOPO da conversa, discreto: e a primeira coisa que quem
     atende precisa ler, e nao cabe depois da caixa de resposta. */
  const ctx=sel&&Object.keys(sel.contexto||{}).length
    ? `<div class="ctx-micaela">${ico('registrar')}<div><b>${esc(nomeBot())} já apurou</b>
        ${Object.entries(sel.contexto).map(([k,v])=>`<span>${esc(k.replace(/_/g,' '))}: <i>${esc(String(v).slice(0,90))}</i></span>`).join('')}
       </div></div>`:'';

  if(!lista.length){
    return head('Atendimento','Quem escreve no WhatsApp aparece aqui.',
      online?'':botao({t:'Conectar o WhatsApp',ic:'whats',v:'p',on:"ir('canais')"}))+
      vazio('whats','Nenhuma conversa ainda',`Quando alguém escrever, a conversa abre aqui — com o que ${nomeBot()} já perguntou.`,
        ['Conectar o WhatsApp em Canais','Mandar uma mensagem de outro número','Voltar aqui pra responder']);
  }

  return head('Atendimento',
      dados.esperando?`<b>${dados.esperando}</b> pessoa(s) esperando você.`:`Ninguém esperando — ${nomeBot()} está dando conta.`,
      online?botao({t:'Atualizar',ic:'atualizar',v:'s',on:'carregar()'})
            :botao({t:'Conectar o WhatsApp',ic:'whats',v:'p',on:"ir('canais')"}))+
  `<div class="inbox">
    <div class="inbox-lista">${lista.map(item).join('')}</div>
    <div class="inbox-conversa">${sel?`
      <div class="cv-cab">
        <div class="chip" style="--ct:var(--t1);--ct-bg:var(--t1-bg)">${ico('crm')}</div>
        <div class="cv-cab-t"><b>${esc(sel.nome||('+'+sel.telefone))}</b><small>+${esc(sel.telefone)} · ${esc(sel.etapa||'sem etapa')}</small></div>
        ${sel.protocolo?`<span class="badge" title="Protocolo deste atendimento — é este número que o cliente tem"
          style="font-family:ui-monospace,monospace">${esc(sel.protocolo)}</span>`:''}
        ${sel.esperandoGente
          ? `<span class="badge b-err">esperando desde ${hora(sel.desde)}</span>`
          : `<span class="badge b-ok">com ${esc(nomeBot())}</span>`}
      </div>
      ${ctx}
      <div class="conversa-fluxo">${(sel.historico||[]).filter(h=>h.tipo==='interacao').map(bolha).join('')}</div>
      <div class="responder">
        <textarea id="respTexto" rows="2" placeholder="${online?'Escreva a resposta…':'Conecte o WhatsApp para responder'}" ${online?'':'disabled'}></textarea>
        <div class="responder-acoes">
          ${botao({t:'Enviar',ic:'enviar',v:'p',on:`responderCliente('${esc(sel.telefone)}')`,off:!online,id:'btResponder'})}
          ${sel.esperandoGente?botao({t:`Devolver pra ${nomeBot()}`,ic:'bot',v:'g',on:`devolverAoBot('${esc(sel.telefone)}')`}):''}
          ${sel.protocoloEstado&&sel.protocoloEstado!=='encerrado'
            ?botao({t:'Encerrar atendimento',ic:'check',v:'g',on:`encerrarAtendimento('${esc(sel.telefone)}','${esc(sel.protocolo||'')}')`,
              tit:'Fecha o caso e manda o protocolo pro cliente'}):''}
        </div>
      </div>`:''}
    </div>
  </div>`;
 },

 /* A tabela comercial. Ela NAO mora aqui: vem de engine/vsplanos, que grava em

 'pl-planos':()=>{

    vazio('plano','Backend sem a rota de planos','Atualize o servidor.',['Subir o backend novo','Recarregar']);

  const lim=(v,suf='')=>v==null?'ilimitado':`${v}${suf}`;
  const gb=(mb)=>mb==null?'ilimitado':(mb>=1024?`${Math.round(mb/1024)} GB`:`${mb} MB`);

  const cartao=(p)=>{
    const pr=CICLO==='semestral'?Math.round(p.monthly_price*0.9):p.monthly_price;
    const meu=ass.plano===p.code;
    return `<div class="plano-card${p.destaque?' destaque':''}${meu?' meu':''}">
      ${/* um selo so: ser o SEU plano ganha de "mais escolhido" — os dois juntos
            se sobrepunham e viravam "SEU PLANO...IDO" */''}
      ${meu?'<span class="plano-selo selo-meu">Seu plano</span>'
           :(p.destaque?'<span class="plano-selo">Mais escolhido</span>':'')}
      <h4>${esc(p.nome)}</h4>
      <div class="plano-preco"><b>${brlc(pr)}</b><small>/mês</small></div>
      ${CICLO==='semestral'?`<p class="hint" style="margin:0 0 10px">${brlc(p.monthly_price)} no mensal · economiza ${brlc((p.monthly_price-pr)*6)} em 6 meses</p>`:''}
      <ul class="plano-lista">
        ${p.social_accounts!=null?`<li>${lim(p.social_accounts)} conta(s) de rede social</li>`:''}
        ${p.attendants!=null?`<li>${lim(p.attendants)} atendente(s)</li>`:''}
        <li>${lim(p.products_limit)} produtos</li>
        <li>${lim(p.campaigns_limit)} campanhas/mês</li>
        <li>${gb(p.storage_limit_mb)} de dados</li>
        <li>${p.ai_enabled?'Bot e IA inclusos':'sem IA'}</li>
        <li>${p.auditor_enabled?'Auditor completo':'Auditor básico'}</li>
      </ul>
      ${meu?botao({t:'É o seu plano',ic:'check',v:'s',sz:'xs',off:true})
           :botao({t:'Assinar',ic:'comprar',v:p.destaque?'p':'s',sz:'xs',on:`assinarPlano('${esc(p.code)}')`})}
    </div>`;
  };

  const grupo=(titulo,sub,ps)=>!ps?.length?'':`<div class="card" style="margin-bottom:16px">
    ${cardH('plano',titulo,sub,3)}
    <div class="planos-grade">${ps.map(cartao).join('')}</div></div>`;

  return head('Planos e preços','Preço de lançamento. Os limites são gravados como dado — trocar a tabela não mexe em uma linha de código.',
      `<div class="theme" style="width:auto">
        <button class="${CICLO==='mensal'?'on':''}" onclick="CICLO='mensal';render()">Mensal</button>
        <button class="${CICLO==='semestral'?'on':''}" onclick="CICLO='semestral';render()">Semestral −10%</button>
      </div>`)+
  (ass.orfa?`<div class="card" style="margin-bottom:16px;border-style:dashed">
    ${cardH('alerta','Sua assinatura aponta pra um plano que não existe mais',`O contrato continua valendo — mas alguém precisa olhar isso.`,5)}</div>`:'')+
  grupo('Combo A + B','Os dois módulos juntos. É onde o desconto aparece sem destruir o preço de cada um.',cat.modulos?.combo)+
  grupo('Módulo A — Redes sociais','Instagram e TikTok, catálogo, campanhas e agendamento.',cat.modulos?.redes)+
  grupo('Módulo B — WhatsApp','Bot 24h, CRM, atendimento e auditoria.',cat.modulos?.whatsapp)+
  `<div class="card">
    ${cardH('financeiro','Adicionais','Cobrados à parte do plano.',4)}

function renderNav(){
  document.getElementById('nav').innerHTML=GRUPOS.map(g=>
   `<div class="sec-label">${esc(g.secao)}</div>`+g.itens.map(m=>{
    if(!m.filhos) return `<button class="nav-item${rota===m.id?' active':''}" onclick="ir('${m.id}')">${ico(m.icone)}<span>${esc(m.nome)}</span></button>`;
    const ab=abertos.has(m.id);
    return `<button class="nav-item${m.filhos.some(f=>f.id===rota)&&!ab?' active':''}" aria-expanded="${ab}" onclick="toggleSub('${m.id}')">${ico(m.icone)}<span>${esc(m.nome)}</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="submenu${ab?' open':''}">${m.filhos.map(f=>`<button class="sub-item${rota===f.id?' active':''}" onclick="ir('${f.id}')">${esc(f.nome)}</button>`).join('')}</div>`;
   }).join('')).join('');
}
function render(){
  renderNav();
  const t=TITULO[rota]||['Console'];
  document.getElementById('crumb').innerHTML=t.map((x,i)=>i===t.length-1?`<b>${esc(x)}</b>`:`<span class="pai">${esc(x)} <i>/</i></span>`).join(' ');
  document.getElementById('view').innerHTML=(TELAS[rota]||telaVisao)();
  if(rota==='indicacao') trocaModelo();
  /* O perfil do assistente e buscado DEPOIS de desenhar: ele baixa a foto do
     servidor da Meta, e segurar a tela por causa de uma imagem faria o console
     parecer travado. Os campos nascem vazios e se preenchem em seguida. */
  if(rota==='canais'){ previewPerfil(); carregarPerfilDoNumero(); }
  /* Chat abre na ULTIMA mensagem, como qualquer app de conversa. Abrir no topo
     obrigaria a rolar ate embaixo toda vez so pra ver o que acabou de chegar. */
  const fluxo=document.querySelector('.conversa-fluxo');
  if(fluxo) fluxo.scrollTop=fluxo.scrollHeight;
  document.getElementById('pillLeads').textContent=ST.resumo.abertos+' lead(s) aberto(s)';
  const w=STATUS?.whatsapp||{};
  /* O canal pode ser a API oficial da Meta OU a sessao de WhatsApp Web. Ler so
     `w.envia` (que e a Meta) fazia a tarja dizer "inativo" com o WhatsApp Web
     conectado e conversando — o pior tipo de mentira: a que desmente o que a
     pessoa esta vendo acontecer. */
  const wpp=canalWhatsApp();
  document.getElementById('pillWa').innerHTML=`<span class="dot ${wpp.no_ar?'on':''}"></span> WhatsApp ${wpp.rotulo}`;
}
function ir(id){rota=id;if(PAI[id])abertos.add(PAI[id]);location.hash=id;toggleNav(false);render();scrollTo(0,0);}
function toggleSub(id){abertos.has(id)?abertos.delete(id):abertos.add(id);renderNav();}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==rota){rota=h;render();}});

  const erro=document.getElementById('lgErro');
  const caps=document.getElementById('lgCaps');

  const mostrarErro=(m)=>{
    erro.textContent=m;
    erro.classList.add('on');
    campo.classList.add('erro');
    campo.focus();
    campo.select();
  };
  const limparErro=()=>{erro.classList.remove('on');campo.classList.remove('erro');};

  document.getElementById('lgOlho').onclick=()=>{
    const ver=campo.type==='password';
    campo.type=ver?'text':'password';
    document.getElementById('lgOlho').textContent=ver?'ocultar':'ver';
    campo.focus();
  };

  // Caps Lock ligado é a causa silenciosa mais comum de "a senha não funciona".
  const verCaps=(e)=>{ caps.classList.toggle('on', e.getModifierState && e.getModifierState('CapsLock')); };
  campo.addEventListener('keyup',verCaps);
  campo.addEventListener('keydown',verCaps);
  campo.addEventListener('input',limparErro);

  const campo2=document.getElementById('lgSenha2');
  campo2.addEventListener('input',limparErro);

  /* Primeiro acesso: o console nunca teve senha. Em vez de pedir uma senha
     que ninguém tem como saber, ele pede para o dono criar a dele. É a
     diferença entre um produto licenciado e um script de linha de comando. */
  let criando=false;
  const virarCriacao=()=>{
    criando=true;
    document.getElementById('lgTitulo').textContent='Criar o acesso';
    document.getElementById('lgSub').textContent=
      'Este console ainda não tem senha. Defina a sua — ela fica só nesta instalação.';
    document.getElementById('lgRotulo').textContent='Nova senha (mínimo 8 caracteres)';
    document.getElementById('lgCampo2').style.display='';
    campo.setAttribute('autocomplete','new-password');
    btn.textContent='Criar e entrar';
    document.getElementById('lgAjuda').innerHTML=
      '<b>Só você define esta senha.</b><p>Ela não é enviada a lugar nenhum: fica guardada '+
      'nesta máquina, com hash. Para trocar depois, use Configurações dentro do console.</p>';
  };

  const abrirPainel=(senha)=>{
    TOKEN=senha;
    sessionStorage.setItem('crm_token',TOKEN);
    document.body.classList.remove('sem-nav');
    carregar();
  };

  const enviar=async()=>{
    if(!campo.value){ return mostrarErro(criando?'Escolha uma senha.':'Digite a senha de acesso.'); }
    if(criando){
      if(campo.value.length<8){ return mostrarErro('A senha precisa de pelo menos 8 caracteres.'); }
      if(campo.value!==campo2.value){
        erro.textContent='As duas senhas não são iguais.';
        erro.classList.add('on');campo2.classList.add('erro');campo2.focus();
        return;
      }
    }
    btn.disabled=true;btn.textContent=criando?'Criando…':'Entrando…';limparErro();
    try{
      if(criando){ await api('criar-acesso',{senha:campo.value}); }
      else{ await api('entrar',{senha:campo.value}); }
      abrirPainel(campo.value);
    }catch(e){
      btn.disabled=false;btn.textContent=criando?'Criar e entrar':'Entrar';
      // O servidor avisa quando a instalação ainda não tem senha; a tela vira
      // criação em vez de repetir "senha incorreta" para sempre.
      if(e.message==='primeiro acesso'){ virarCriacao();btn.disabled=false;return campo.focus(); }
      mostrarErro(e.message==='senha incorreta'
        ? 'Senha incorreta. Se esta instalação é nova, recarregue para criar a sua.'
        : e.message);
    }
  };
  btn.onclick=enviar;
  campo.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  campo2.onkeydown=(e)=>{if(e.key==='Enter')enviar();};
  campo.focus();

  // Pergunta o estado antes de mostrar a tela errada por meio segundo.
  fetch('/crm/api/auth').then(r=>r.json()).then(d=>{ if(d && d.precisaCriar){ virarCriacao(); } })
    .catch(()=>{});
}

async function carregar(){
  try{
    // O diagnostico do TikTok nao pode derrubar o painel inteiro se o backend for antigo.
    [ST,STATUS,IND,REDES,TK,EST]=await Promise.all([api('painel'),api('status'),api('indicacao'),api('redes'),
      api('tiktok').catch(()=>null),api('estoque').catch(()=>null)]);
    // O Quebra-Galho é outro processo: se estiver fora do ar, a tela dele avisa —
    // e o resto do painel continua funcionando normalmente.
    QG=await api('quebragalho').catch(()=>null);
    TKAPP=await api('tiktok/app').catch(()=>null);
    TKSHOP=await api('tiktok/shop').catch(()=>null);
    /* So busca Shop e Ads se a familia correspondente estiver autorizada: bater
       na API sem token devolve erro e encheria a tela de vermelho por algo que
       ainda nem foi configurado. */
    if(TK?.familias?.shop?.autorizado) TKLOJA=await api('tiktok/loja').catch(()=>null);
    if(TK?.familias?.business?.autorizado) TKADS=await api('tiktok/campanhas').catch(()=>null);
    PAG=await api('pagamentos').catch(()=>null);
    LOTES=await api('estoque/lotes').catch(()=>null);
    PUB=await api('estoque/publicados').catch(()=>null);
    BOT=await api('bot').catch(()=>null);
    CANAIS=await api('canais').catch(()=>null);
    OPERADORES=await api('operadores').catch(()=>null);
    ATEND=await api('atendimentos').catch(()=>null);
    PLANOS_CAT=await api('planos').catch(()=>null);
    DOCS=await api('documentos').catch(()=>null);
    CAIXA=await api('caixa'+(PERIODO.de||PERIODO.ate?`?de=${PERIODO.de}&ate=${PERIODO.ate}`:'')).catch(()=>null);
    if(TKAPP&&TKAPP.diagnostico) TK=TKAPP.diagnostico;
    // Telas novas: carregadas a parte pra uma falha nelas nao derrubar o painel todo.
    [AUD,FIN,REL,CTA]=await Promise.all([api('auditor').catch(()=>null),api('financeiro').catch(()=>null),
      api('relatorios').catch(()=>null),api('conta').catch(()=>null)]);
    document.getElementById('envDot').className='dot on';
    document.getElementById('envName').textContent='Backend online';
    document.getElementById('envSub').textContent=location.host;
  }catch(e){
    document.getElementById('envName').textContent='Backend fora';
    document.getElementById('envSub').textContent=e.message.slice(0,26);
    avisoErro('Não consegui concluir','Não consegui carregar: '+e.message);
  }
  render();
}

async function baixarFeed(canal){
  // O feed é ARQUIVO (XML/CSV), não JSON. Não dá pra usar <a download> porque ele não
  // manda header, e o token do painel só viaja em header de propósito — na querystring
  // ele acabaria gravado no log de acesso do servidor.
  try{
    const res=await fetch('/crm/api/estoque/exportar?canal='+encodeURIComponent(canal),
      {headers:TOKEN?{'x-crm-token':TOKEN}:{}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const nome=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||canal;
    const incl=res.headers.get('x-vs-incluidos'), rec=res.headers.get('x-vs-recusados');
    const url=URL.createObjectURL(await res.blob());
    const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    flash(Number(rec)?`${nome}: ${incl} produto(s). ${rec} ficaram de fora por campo faltando.`
                     :`${nome}: ${incl} produto(s).`, Number(rec)?'err':'ok');
  }catch(e){avisoErro('Não consegui concluir','Não consegui gerar o arquivo: '+e.message);}
}

/* ── Padrão de salvar ──────────────────────────────────────────────────────
   Clicar em salvar e nao acontecer nada e o pior tipo de defeito: a pessoa nao
   sabe se deu certo, se travou ou se ela errou alguma coisa — e clica de novo.
   Daqui pra frente todo salvar passa por aqui e SEMPRE termina em uma das tres:
   confirmacao cordial, erro no campo (vermelho, do lado do campo) ou modal
   explicando o que o servidor recusou.

   Por que erro em MODAL e sucesso em aviso flutuante: erro precisa parar a
   pessoa e ser lido; sucesso so precisa confirmar e sair da frente. Modal a cada
   salvo bem-sucedido vira um clique a mais pra sempre. */

function limparErros(){
  document.querySelectorAll('.campo-erro.on').forEach(e=>{e.classList.remove('on');e.textContent='';});
  document.querySelectorAll('.erro-campo').forEach(e=>e.classList.remove('erro-campo'));
}

/** Pinta o campo de vermelho e escreve o motivo embaixo dele. */
function marcarCampo(id,msg){
  const campo=document.getElementById(id);
  if(!campo) return false;
  campo.classList.add('erro-campo');
  let aviso=document.getElementById(id+'-erro');
  if(!aviso){
    aviso=document.createElement('div');
    aviso.id=id+'-erro'; aviso.className='campo-erro'; aviso.setAttribute('role','alert');
    campo.parentNode.insertBefore(aviso,campo.nextSibling);
  }
  aviso.textContent=msg; aviso.classList.add('on');
  return true;
}

/**
 * O padrão. `campos` diz o que é obrigatório e como se chama na tela —
 * o nome amigável é o que entra na mensagem, nunca o id do input.
 *
 *   salvar({
 *     titulo:'Salvar a regra de comissão',
 *     campos:[{id:'iPct', rotulo:'Percentual', obrigatorio:true, numero:true}],
 *     rota:'indicacao',
 *     corpo:()=>({percentual:val('iPct')}),
 *     sucesso:'Regra de comissão salva.',
 *   })
 */
async function salvar({titulo,campos=[],rota,corpo,sucesso,depois,botao}){
  limparErros();
  const val=(id)=>(document.getElementById(id)||{}).value?.trim()||'';

  const faltando=[];
  for(const c of campos){
    const v=val(c.id);
    if(c.obrigatorio&&!v){ faltando.push({...c,msg:`${c.rotulo} é obrigatório.`}); continue; }
    if(v&&c.numero&&isNaN(Number(String(v).replace(',','.')))){ faltando.push({...c,msg:`${c.rotulo} precisa ser um número.`}); continue; }
    if(v&&c.min!=null&&Number(String(v).replace(',','.'))<c.min){ faltando.push({...c,msg:`${c.rotulo} não pode ser menor que ${c.min}.`}); continue; }
    if(v&&c.regra&&!c.regra(v)){ faltando.push({...c,msg:c.mensagem||`${c.rotulo} está em formato inválido.`}); }
  }
  if(faltando.length){
    faltando.forEach(f=>marcarCampo(f.id,f.msg));
    document.getElementById(faltando[0].id)?.focus();
    abrirModal(titulo||'Confira antes de salvar',
      `<p class="hint" style="margin-bottom:12px">Faltou pouco — estes campos precisam de ajuste:</p>
       <ul class="notas">${faltando.map(f=>`<li>${esc(f.msg)}</li>`).join('')}</ul>`,
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
    return {ok:false,validacao:true};
  }

  const bt=botao?document.getElementById(botao):null;
  const antes=bt?bt.innerHTML:null;
  if(bt){ bt.disabled=true; bt.innerHTML=ico('relogio')+'<span>Salvando…</span>'; }
  try{
    const r=await api(rota,typeof corpo==='function'?corpo():corpo);
    /* Sucesso em MODAL, nao em toast de canto. Foi pedido depois de "clico em
       salvar e nao da mensagem nenhuma": o toast nasce longe do olho de quem
       acabou de clicar e some em quatro segundos. O modal custa um clique a
       mais e elimina a duvida — que e o que faz a pessoa salvar duas vezes. */
    avisoOk('Pronto', sucesso||'Alteração salva.');
    if(depois) depois(r); else carregar();
    return {ok:true,r};
  }catch(e){
    /* O servidor recusou. Pode vir uma lista de motivos: mostra todos, e joga
       no campo o que der pra casar pelo rótulo. */
    const motivos=String(e.message||'').split(';').map(x=>x.trim()).filter(Boolean);
    let casou=false;
    for(const m of motivos){
      const alvo=campos.find(c=>m.toLowerCase().includes(String(c.rotulo).toLowerCase()));
      if(alvo&&marcarCampo(alvo.id,m)) casou=true;
    }
    avisoErro(titulo||'Não consegui salvar',
      `O servidor recusou${casou?' — marquei os campos na tela':''}:`, motivos);
    return {ok:false,erro:e.message};
  }finally{
    if(bt){ bt.disabled=false; bt.innerHTML=antes; }
  }
}

let PERFIL_NO_NUMERO=null;

function previewPerfil(){
  const v=(id)=>(document.getElementById(id)||{}).value?.trim()||'';
  const nome=document.getElementById('pvNome');
  const recado=document.getElementById('pvRecado');
  /* Campo vazio mostra O QUE ESTA VALENDO, nao um texto de exemplo: o preview
     responde "como esta hoje", e so muda quando voce digita. */

  if(recado) recado.textContent=v('pfRecado')||PERFIL_NO_NUMERO?.recado||'sem recado';
  const arq=(document.getElementById('pfFoto')||{}).files?.[0];

  if(arq){
    const r=new FileReader();
    r.onload=()=>{ foto.style.backgroundImage=`url(${r.result})`; };
    r.readAsDataURL(arq);
  }else if(PERFIL_NO_NUMERO?.foto){
    foto.style.backgroundImage=`url(${PERFIL_NO_NUMERO.foto})`;
  }
}

/* Busca o perfil e PREENCHE os campos. Em rota propria porque ler isso baixa a
   foto do servidor da Meta — pendurar no carregamento da tela faria tudo

/**
 * Deixa a foto no tamanho que o WhatsApp usa, ANTES de mandar.
 *
 * A foto de perfil do WhatsApp e um quadrado pequeno. Mandar o arquivo original
 * era o que dava HTTP 413: uma imagem de 600 KB vira 800 KB em base64 e estoura
 * o teto de 256 KB da requisicao — e foto tirada no celular tem 3 a 5 MB.
 *
 * Corta pelo CENTRO em vez de espremer: rosto espremido fica grotesco, e a foto
 * de perfil e redonda no WhatsApp — o que sobra nas pontas ia sumir de qualquer
 * jeito.
 */
async function prepararFoto(arquivo, lado=640, qualidade=0.86){
  const bitmap=await createImageBitmap(arquivo);
  const corte=Math.min(bitmap.width,bitmap.height);
  const cv=document.createElement('canvas');
  cv.width=lado; cv.height=lado;
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(bitmap,(bitmap.width-corte)/2,(bitmap.height-corte)/2,corte,corte,0,0,lado,lado);
  bitmap.close?.();
  let url=cv.toDataURL('image/jpeg',qualidade);
  /* Cinto e suspensorio: se ainda assim ficar perto do teto, baixa a qualidade
     em vez de deixar o servidor recusar na cara da pessoa. */
  let q=qualidade;
  while(url.length>180*1024&&q>0.5){ q-=0.12; url=cv.toDataURL('image/jpeg',q); }
  return url;
}

/* Voltar atras tem de morar do lado de aplicar. Enquanto so existia o "aplicar",
   desfazer era tarefa manual no celular — e isso deixa a pessoa com medo de
   clicar em qualquer um dos dois. */
function restaurarPerfil(){
  const p=CANAIS?.perfilAnterior||{};
  confirmar({
    titulo:'Voltar a cara anterior do número?',
    texto:`Vou devolver a foto, o nome e o recado que este número tinha antes de o painel trocar${p.em?` (guardado em ${esc(String(p.em).slice(0,16).replace('T',' '))})`:''}.`,
    consequencia:'O perfil do assistente sai do ar para todos os contatos.',
    rotulo:'Voltar a anterior', icone:'atualizar', perigo:false,
    aoConfirmar:async()=>{
      /* A tela pode estar velha: o canal cai sozinho e o dado da tela e o do
         ultimo carregamento. Em campo apareceu como "erro diz desconectado, tela
         diz conectado" — e a tela e que estava mentindo. Recarrega ANTES, pra a
         pessoa ver o estado de agora junto com o erro. */
      const r=await api('canais/restaurar-perfil',{canal:'whatsapp-web'}).catch(async(e)=>{ await carregar(); throw e; });
      const ok=(r.feito||[]).join(', ');
      if(r.falhas&&r.falhas.length){
        avisoErro('Voltou pela metade',`Devolvido: ${ok||'nada'}.`,r.falhas);
      }else{
        avisoOk('Pronto',`Perfil anterior devolvido (${ok||'nada'}). Pode levar alguns minutos para aparecer em todos os contatos.`);
      }
      await carregar();
    },
  });
}

/* O WhatsApp devolve erro de programador quando recusa. "setPushname is not a
   function" nao diz nada pra quem so queria trocar o nome — e a pessoa fica
   achando que fez algo errado, quando a limitacao e da versao do WhatsApp Web. */
function traduzirFalhaPerfil(f){
  const t=String(f||'');
  if(/setPushname|setProfileName|is not a function/i.test(t))
    return 'nome: esta versão do WhatsApp Web não permite trocar o nome de exibição por aqui — mude direto no celular, em Configurações → Perfil.';
  if(/pic|photo|image|foto/i.test(t)&&/invalid|format|size/i.test(t))
    return 'foto: o WhatsApp recusou a imagem. Ela precisa ser quadrada — tente outra.';
  if(/status/i.test(t)&&/length|long/i.test(t))
    return 'recado: passou do tamanho que o WhatsApp aceita.';
  return t;
}

async function personalizarCanal(){
  limparErros();
  const nome=(document.getElementById('pfNome')||{}).value?.trim()||'';
  const recado=(document.getElementById('pfRecado')||{}).value?.trim()||'';
  const arq=(document.getElementById('pfFoto')||{}).files?.[0];
  if(!nome&&!recado&&!arq){
    marcarCampo('pfNome','Preencha ao menos um destes: nome, recado ou foto.');
    abrirModal('Nada para aplicar',
      '<p class="hint">Preencha ao menos um campo — nome, recado ou foto — antes de aplicar no número.</p>',
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
    return;
  }
  try{
    let foto=null;
    if(arq){
      if(arq.size>15*1024*1024){ avisoErro('Foto grande demais','Essa imagem passa de 15 MB. Escolha outra, ou tire um print dela.'); return; }
      foto=await prepararFoto(arq);
    }
    const r=await api('canais/personalizar',{canal:'whatsapp-web',foto,nome,recado});
    /* Sucesso PARCIAL e o caso comum: o WhatsApp recusa foto fora do formato e
       aceita o nome na mesma chamada. Dizer so "pronto" esconderia metade. */
    const ok=(r.feito||[]).join(', ');
    if((r.falhas||[]).length){
      /* Deu certo em parte NAO e "nao consegui". Em campo isso apareceu como
         "Nao consegui concluir" depois de a foto TER SIDO aplicada — e o dono
         foi olhar o celular achando que nada tinha acontecido. O titulo conta o
         que entrou; a lista conta o que faltou. */
      abrirModal(ok?`Aplicado: ${esc(ok)}`:'Não consegui aplicar nada',
        `<p class="hint" style="margin-bottom:12px">${ok
          ? 'Isso já está valendo no seu número. O que não entrou:'
          : 'O WhatsApp recusou tudo:'}</p>
         <ul class="notas">${r.falhas.map(f=>`<li>${esc(traduzirFalhaPerfil(f))}</li>`).join('')}</ul>`,
        BT.fechar());
    }else{
      avisoOk('Perfil atualizado',`Já está valendo no seu número: ${esc(ok)}. Pode levar alguns minutos para aparecer em todos os contatos.`);
    }
    carregar();
  }catch(e){ avisoErro('Não consegui concluir',e.message); }
}
/* Reconectar e derrubar e subir: sessao travada em "esperando o QR" nao se
   conserta mandando conectar de novo — o provider ja se acha conectando. */
/* Trocar de numero NAO e reconectar. Reconectar volta pro mesmo aparelho;
   trocar esquece o pareamento e pede QR do novo. Eram a mesma coisa na tela, e
   por isso parecia que o painel "nao aceitava numero novo". */
function trocarNumeroCanal(){
  const c=(CANAIS?.canais||[])[0]||null;
  confirmar({
    titulo:'Trocar o número que atende?',
    texto:`Vou esquecer o aparelho pareado${c?.numero?` (<b>+${esc(c.numero)}</b>)`:''} e pedir o QR Code do número novo.`,
    consequencia:'Até alguém ler o novo QR, o canal fica fora do ar e ninguém é atendido.',
    rotulo:'Esquecer e pedir QR', icone:'atualizar', perigo:false,
    aoConfirmar:async()=>{
      flash('Esquecendo o aparelho e subindo sessão nova…','ok');
      const r=await api('canais/trocar-numero',{canal:'whatsapp-web'});
      await carregar();
      if(r.qr||r.estado==='aguardando_qr'){
        avisoOk('Pronto para parear',
          'O QR Code aparece aqui nesta tela. Abra o WhatsApp do número novo → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b>.'
          +(r.anterior?'<br><br><small>A sessão anterior foi guardada, não apagada.</small>':''));
      }else{
        avisoErro('A sessão nova não chegou a pedir QR',`Estado atual: <b>${esc(r.estado||'?')}</b>. Tente "Reconectar (gera QR novo)".`);
      }
      /* Numero novo costuma ser CLIENTE NOVO. Perguntar aqui poupa a descoberta
         ruim: parear o chip do escritorio de advocacia e a Micaela receber os
         clientes dele pelo nome da lanchonete. */
      perguntarNomeDoAssistente();
    },
  });
}

/**
 * Depois de trocar o número, oferece trocar o nome do assistente.
 *
 * Não força: quem só mudou de chip mantém o mesmo atendimento. Mas quem trocou
 * de número porque trocou de cliente quase sempre quer trocar o nome junto — e
 * descobrir isso pela primeira conversa é tarde.
 */
function perguntarNomeDoAssistente(){
  const atual=String(BOT?.config?.nome||'').trim();
  const id='nq'+Math.random().toString(36).slice(2,9);
  window[id]=(ir)=>{
    fecharModal(); delete window[id];
    if(ir) location.hash='#wa-personalizar';
  };
  abrirModal('Quer trocar o nome do assistente?',
    `<p class="hint">O número mudou, mas o atendimento continua se chamando <b>${esc(atual||'sem nome')}</b>.</p>`
    +`<p class="hint" style="margin-top:8px">Se este número é de outro cliente ou de outra operação, vale trocar o nome, `
    +`a saudação e o perfil — é o que o cliente vê na primeira mensagem.</p>`,
    `<button class="btn btn-s" onclick="window['${id}'](false)">${ico('fechar')}<span>Manter ${esc(atual||'como está')}</span></button>`
    +`<button class="btn btn-p" onclick="window['${id}'](true)">${ico('person')}<span>Trocar o nome</span></button>`);
}

async function reconectarCanal(){
  try{
    flash('Derrubando a sessão para subir uma nova…','ok');
    await api('canais/desconectar',{canal:'whatsapp-web'}).catch(()=>null);
    await new Promise(r=>setTimeout(r,1200));
    await api('canais/conectar',{canal:'whatsapp-web'});
    await carregar();
    flash('Pronto. Se pedir QR, ele aparece aqui nesta tela.','ok');
  }catch(e){
    abrirModal('Não consegui reconectar',
      `<p class="hint" style="margin-bottom:12px">${esc(e.message)}</p>`,
      `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
  }
}

async function desconectarCanal(){
  return confirmar({
    titulo:'Desconectar o WhatsApp?',
    texto:'O canal sai do ar e ninguém é atendido até você parear de novo.',
    consequencia:'Mensagem que chegar enquanto estiver fora não é respondida.',
    rotulo:'Desconectar', icone:'power', perigo:true,
    aoConfirmar:async()=>{
      try{
        await api('canais/desconectar',{canal:'whatsapp-web'});
        CANAIS=await api('canais'); render(); flash('Canal desconectado.','ok');
      }catch(e){ avisoErro('Não consegui concluir',e.message); }
    },
  });
}
function copiar(t){navigator.clipboard?.writeText(t).then(()=>avisoErro('Não consegui concluir','Link copiado.','ok'),()=>flash('Copie manualmente: '+t));}

/* Leva a tela ate o bloco de configuracao daquele canal. A grade e um indice:
   clicar em "Configurar" tem de ir pro lugar, nao abrir outra pagina. */
function rolarAteCard(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.add('piscou');
  setTimeout(()=>el.classList.remove('piscou'),1400);
}

function sairDoPainel(){
  TOKEN='';sessionStorage.removeItem('crm_token');telaEntrar();
}

/** Decide entre criar acesso, login e dashboard antes de qualquer dado. */
(async function porta(){
  let est={exigeSenha:true};
  try{ est=await api('auth'); }catch{ /* backend antigo: pede senha assim mesmo */ }

  /* Instalacao nova: vai para a tela, que se vira em "criar acesso". Antes
     daqui saia direto para o dashboard — a regra velha era "sem CRM_TOKEN,
     painel aberto". Hoje o servidor bloqueia, entao seguir em frente so
     renderizava um painel que responde 403 em tudo. */
  if(est.precisaCriar){ return telaEntrar(); }

  if(!est.exigeSenha){ document.body.classList.remove('sem-nav'); return carregar(); }
  if(TOKEN){
    try{ await api('entrar',{senha:TOKEN}); document.body.classList.remove('sem-nav'); return carregar(); }
    catch{ /* token velho: cai na tela de entrada */ }
  }
  telaEntrar();
})();
</script>
