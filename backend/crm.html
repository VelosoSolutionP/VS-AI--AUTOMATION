<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veloso Solution — Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EVS%3C/text%3E%3C/svg%3E">
<style>
/* ── Sistema visual do console ────────────────────────────────────────────
   Antes era grafite em tudo: correto, mas plano — a tela inteira tinha o mesmo
   peso e nada puxava o olho. Agora existe UMA tinta de marca (índigo, a mesma
   do favicon e do painel de entrada) que marca o que é ação e o que está ativo,
   mais uma régua de tons (teal/violeta/âmbar/rosa) que só os indicadores usam,
   pra um número não parecer o outro. Cor de estado (ok/atenção/erro) continua
   significando estado, nunca decoração.

   Profundidade é em três degraus e só isso: repouso (sh-1), card (sh-2) e o que
   flutua por cima (sh-3). Sem borda grossa, sem sombra dura. */
:root{
  --bg:#f7f7f9; --panel:#fff; --panel-2:#fcfcfd; --raised:#f4f4f6; --line:#e6e6eb; --line-2:#d3d3dc;
  --fg:#16161c; --muted:#56565f; --dim:#9a9aa6;
  --ink:#16161c; --ink-fg:#fff;

  /* Tinta da marca */
  --ac:#4f46e5; --ac-2:#6366f1; --ac-3:#818cf8; --ac-fg:#fff;
  --ac-soft:#eef1ff; --ac-line:#c9cffb; --ac-glow:rgba(79,70,229,.32);

  /* Régua de tons — só indicadores e chips de seção */
  --t1:#4f46e5; --t1-bg:#eef1ff; --t2:#0d9488; --t2-bg:#e9f8f5;
  --t3:#7c3aed; --t3-bg:#f3edff; --t4:#c2410c; --t4-bg:#fff1e9;
  --t5:#be123c; --t5-bg:#ffeef2; --t6:#0369a1; --t6-bg:#e9f4fd;

  --ok:#15803d; --ok-bg:#effaf2; --ok-line:#b7e9c6;
  --warn:#b45309; --warn-bg:#fdf7e8; --warn-line:#f4dfa3;
  --err:#b91c1c; --err-bg:#fdf1f1; --err-line:#f6c7c7;

  --r:14px; --r-sm:10px; --r-xs:8px; --sidebar:252px;
  --sh-1:0 1px 2px rgba(20,20,35,.05);
  --sh-2:0 1px 2px rgba(20,20,35,.05), 0 6px 16px -10px rgba(20,20,35,.2);
  --sh-3:0 2px 6px -2px rgba(20,20,35,.1), 0 18px 40px -18px rgba(20,20,35,.32);
  --sh-ac:0 1px 2px rgba(20,20,35,.14), 0 8px 18px -10px var(--ac-glow);
  --shadow:var(--sh-1); --shadow-2:var(--sh-3); /* nomes antigos, ainda usados na entrada */
  color-scheme:light;
}
/* aninhar @media dentro da regra depende de CSS Nesting; versao plana funciona em todo lugar */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0a0d; --panel:#131318; --panel-2:#16161c; --raised:#1d1d24; --line:#292930; --line-2:#3d3d46;
  --fg:#f7f7f9; --muted:#a3a3ae; --dim:#71717e;
  --ink:#f7f7f9; --ink-fg:#16161c;
  --ac:#7c7cf5; --ac-2:#8f8cf8; --ac-3:#a5a2fb; --ac-fg:#fff;
  --ac-soft:rgba(124,124,245,.14); --ac-line:rgba(124,124,245,.32); --ac-glow:rgba(99,102,241,.45);
  --t1:#a5b4fc; --t1-bg:rgba(129,140,248,.14); --t2:#5eead4; --t2-bg:rgba(45,212,191,.13);
  --t3:#c4b5fd; --t3-bg:rgba(167,139,250,.14); --t4:#fdba74; --t4-bg:rgba(251,146,60,.13);
  --t5:#fda4af; --t5-bg:rgba(251,113,133,.13); --t6:#7dd3fc; --t6-bg:rgba(56,189,248,.13);
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.12); --ok-line:rgba(34,197,94,.3);
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.12); --warn-line:rgba(245,158,11,.3);
  --err:#f87171; --err-bg:rgba(239,68,68,.12); --err-line:rgba(239,68,68,.3);
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.8);
  --sh-3:0 2px 6px -2px rgba(0,0,0,.6), 0 18px 40px -18px rgba(0,0,0,.9);
  --sh-ac:0 1px 2px rgba(0,0,0,.5), 0 8px 18px -10px var(--ac-glow);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0a0d; --panel:#131318; --panel-2:#16161c; --raised:#1d1d24; --line:#292930; --line-2:#3d3d46;
  --fg:#f7f7f9; --muted:#a3a3ae; --dim:#71717e;
  --ink:#f7f7f9; --ink-fg:#16161c;
  --ac:#7c7cf5; --ac-2:#8f8cf8; --ac-3:#a5a2fb; --ac-fg:#fff;
  --ac-soft:rgba(124,124,245,.14); --ac-line:rgba(124,124,245,.32); --ac-glow:rgba(99,102,241,.45);
  --t1:#a5b4fc; --t1-bg:rgba(129,140,248,.14); --t2:#5eead4; --t2-bg:rgba(45,212,191,.13);
  --t3:#c4b5fd; --t3-bg:rgba(167,139,250,.14); --t4:#fdba74; --t4-bg:rgba(251,146,60,.13);
  --t5:#fda4af; --t5-bg:rgba(251,113,133,.13); --t6:#7dd3fc; --t6-bg:rgba(56,189,248,.13);
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.12); --ok-line:rgba(34,197,94,.3);
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.12); --warn-line:rgba(245,158,11,.3);
  --err:#f87171; --err-bg:rgba(239,68,68,.12); --err-line:rgba(239,68,68,.3);
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 1px 2px rgba(0,0,0,.5), 0 6px 16px -10px rgba(0,0,0,.8);
  --sh-3:0 2px 6px -2px rgba(0,0,0,.6), 0 18px 40px -18px rgba(0,0,0,.9);
  --sh-ac:0 1px 2px rgba(0,0,0,.5), 0 8px 18px -10px var(--ac-glow);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--ac-soft);color:var(--ac)}
a{color:var(--ac);text-underline-offset:2px}
a:hover{text-decoration:none}

.shell{display:flex;min-height:100vh}

/* ── Barra lateral ─────────────────────────────────────────────────────── */
aside{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:11px;padding:17px 16px;border-bottom:1px solid var(--line)}
.mark{width:32px;height:32px;border-radius:10px;flex:0 0 32px;display:grid;place-items:center;font-weight:750;font-size:12px;
  letter-spacing:-.03em;background:linear-gradient(145deg,var(--ac-2),var(--ac));color:var(--ac-fg);
  box-shadow:var(--sh-ac)}
.brand b{display:block;font-size:13.5px;line-height:1.3;letter-spacing:-.015em}
.brand span{display:block;font-size:11px;color:var(--dim)}
nav{flex:1;overflow-y:auto;padding:10px 10px 4px}
.sec-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:15px 9px 6px;font-weight:700}
/* O item ativo ganha tinta + uma barra na borda esquerda: em menu comprido,
   a barra é o que se acha de relance, a cor confirma. */
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:var(--r-sm);
  color:var(--muted);font-size:13.5px;text-align:left;transition:background .14s,color .14s}
.nav-item:hover{background:var(--raised);color:var(--fg)}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.65;transition:opacity .14s,color .14s}
.nav-item:hover svg{opacity:.9}
.nav-item.active{background:var(--ac-soft);color:var(--ac);font-weight:650}
.nav-item.active svg{opacity:1;color:var(--ac)}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;
  border-radius:0 3px 3px 0;background:var(--ac)}
.chev{margin-left:auto;transition:transform .18s;opacity:.45}
.nav-item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.submenu{overflow:hidden;max-height:0;transition:max-height .22s ease}
.submenu.open{max-height:340px}
.sub-item{display:block;width:100%;padding:6.5px 9px 6.5px 34px;border-radius:var(--r-sm);color:var(--dim);
  font-size:12.8px;text-align:left;position:relative;transition:color .14s,background .14s}
.sub-item::before{content:'';position:absolute;left:18px;top:2px;bottom:2px;width:1.5px;background:var(--line);border-radius:2px}
.sub-item:hover{color:var(--fg);background:var(--raised)}
.sub-item.active{color:var(--ac);font-weight:650}
.sub-item.active::before{background:var(--ac)}
.side-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--panel-2)}
.env{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-sm);background:var(--raised);
  border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--dim)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.env small{font-size:11px;color:var(--dim);line-height:1.3}
.env b{display:block;color:var(--fg);font-size:11.5px;font-weight:650}
.theme{display:flex;gap:3px;padding:3px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm)}
.theme button{flex:1;padding:6px;border-radius:7px;font-size:11.5px;color:var(--dim);display:flex;align-items:center;
  justify-content:center;gap:6px;transition:background .14s,color .14s}
.theme button svg{width:13px;height:13px}
.theme button:hover{color:var(--fg)}
.theme button.on{background:var(--panel);color:var(--fg);font-weight:650;box-shadow:var(--sh-1)}

/* ── Topo e área de conteúdo ───────────────────────────────────────────── */
main{flex:1;min-width:0;display:flex;flex-direction:column}
/* O topo fica translúcido com desfoque: a tela rola por baixo dele e continua
   legível, sem virar uma tarja opaca cortando o conteúdo. */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:11px 26px;
  padding-top:calc(11px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px) saturate(1.6);
  -webkit-backdrop-filter:blur(12px) saturate(1.6)}
.burger{display:none;padding:7px;border-radius:var(--r-xs);border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.crumb{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.crumb i{opacity:.45;font-style:normal}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:550;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap;box-shadow:var(--sh-1)}
.content{padding:26px;max-width:1440px;width:100%;margin:0 auto;flex:1}

/* Cabeçalho de página: sobrancelha em tinta, título grande, texto de apoio.
   A sobrancelha existe pra dizer ONDE a pessoa está sem ela reler o menu. */
.page-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.page-head .ph-txt{min-width:0;flex:1}
.page-head .eyebrow{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ac);margin-bottom:7px}
.page-head .eyebrow::before{content:'';width:14px;height:2px;border-radius:2px;background:var(--ac)}
.page-head h1{font-size:25px;letter-spacing:-.03em;font-weight:680;line-height:1.2}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:74ch;line-height:1.55}
.page-head .ph-acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* ── Cartões ───────────────────────────────────────────────────────────── */
.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--sh-2)}
.card h3{font-size:14px;font-weight:680;margin-bottom:3px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.card .hint{color:var(--dim);font-size:12.5px;line-height:1.5}
/* Chip de ícone: identifica o bloco de longe e é onde entra o tom. */
.chip{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;
  background:var(--ct-bg,var(--t1-bg));color:var(--ct,var(--t1));border:1px solid transparent}
.chip svg{width:16px;height:16px}
.card-h{display:flex;align-items:flex-start;gap:11px;margin:-2px 0 14px}
.card-h .card-h-t{min-width:0;flex:1}
.card-h h3{margin-bottom:2px}
.card-h .card-h-a{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* Indicador: rótulo, número grande e a linha que explica de onde ele vem.
   A faixa de tom no topo é o que faz quatro deles lado a lado pararem de
   parecer a mesma caixa repetida quatro vezes. */
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh-2);
  transition:box-shadow .18s,transform .18s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--kt,var(--t1)),transparent 88%)}
.kpi:hover{box-shadow:var(--sh-3);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.075em;color:var(--dim);font-weight:700}
.kpi .chip{width:28px;height:28px;flex:0 0 28px;border-radius:8px;margin-left:auto;
  background:var(--kt-bg,var(--t1-bg));color:var(--kt,var(--t1))}
.kpi .chip svg{width:15px;height:15px}
.kpi b{display:block;font-size:28px;font-weight:680;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:5px;line-height:1.4}

/* ── Estado vazio ──────────────────────────────────────────────────────── */
.empty{text-align:center;padding:46px 24px;border:1px solid var(--line);border-radius:var(--r);
  background:radial-gradient(120% 90% at 50% 0%,var(--ac-soft),transparent 62%),var(--panel);box-shadow:var(--sh-2)}
.empty .ico{width:52px;height:52px;border-radius:15px;margin:0 auto 15px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--ac-2),var(--ac));color:var(--ac-fg);box-shadow:var(--sh-ac)}
.empty .ico svg{width:24px;height:24px}
.empty h3{font-size:16px;margin-bottom:6px;font-weight:680;letter-spacing:-.02em}
.empty p{color:var(--muted);font-size:13px;max-width:56ch;margin:0 auto 18px;line-height:1.6}
.steps{text-align:left;max-width:540px;margin:0 auto;display:grid;gap:8px}
.step{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 13px;box-shadow:var(--sh-1)}
.step .n{width:21px;height:21px;flex:0 0 21px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:750;
  background:var(--ac-soft);color:var(--ac);border:1px solid var(--ac-line)}
.step div{font-size:12.5px;color:var(--muted);line-height:1.55}

/* ── Linha de estado ───────────────────────────────────────────────────── */
.stat-row{display:flex;align-items:center;gap:12px;padding:11px 8px;margin:0 -8px;border-bottom:1px solid var(--line);
  border-radius:var(--r-xs);transition:background .14s}
.stat-row:hover{background:var(--raised)}
.stat-row:last-child{border-bottom:0}
.stat-row .lbl{font-size:13px;min-width:0;font-weight:550}
.stat-row .lbl small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;font-weight:400}
.stat-row .btn,.stat-row .acoes{margin-left:auto}
.badge{margin-left:auto;font-size:11px;font-weight:650;padding:4px 10px;border-radius:99px;white-space:nowrap;
  border:1px solid var(--line);color:var(--muted);background:var(--raised)}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.b-err{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.b-ac{background:var(--ac-soft);color:var(--ac);border-color:var(--ac-line)}

/* ── Funil ─────────────────────────────────────────────────────────────── */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--r);
  min-width:272px;flex:1 0 272px;padding:13px;box-shadow:var(--sh-2)}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.col-h h3{font-size:12.5px;font-weight:680;letter-spacing:-.01em}
.col-h .n{font-size:11px;font-weight:650;color:var(--ac);background:var(--ac-soft);border:1px solid var(--ac-line);
  border-radius:99px;padding:1px 8px}
.col-h .v{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.lead{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;
  margin-bottom:9px;box-shadow:var(--sh-1);transition:box-shadow .16s,transform .16s,border-color .16s}
.lead:hover{border-color:var(--line-2);box-shadow:var(--sh-2);transform:translateY(-1px)}
.lead .nm{font-weight:680;font-size:13.5px;letter-spacing:-.01em}
.lead .meta{color:var(--dim);font-size:12px;margin:3px 0 9px;word-break:break-word}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:10px;font-weight:650;padding:2.5px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--raised)}
.t-quente{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.t-morno{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.t-frio{background:var(--raised);color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ── Campos ────────────────────────────────────────────────────────────── */
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:8.5px 11px;width:100%;
  transition:border-color .14s,box-shadow .14s;box-shadow:var(--sh-1)}
select:hover,input:hover,textarea:hover{border-color:var(--line-2)}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3.5px var(--ac-soft)}
select{flex:1;min-width:104px;font-size:12.5px;padding:6.5px 9px}
::placeholder{color:var(--dim)}

/* ── Botão: UM modelo, variações por tom e tamanho ─────────────────────────
   Todo botão de texto nasce daqui e todo botão leva ícone — o ícone é o que
   permite achar "Salvar" numa tela cheia sem ler botão por botão. No JS existe
   o atalho `botao({t,ic,v,on})`, que monta exatamente esta marcação.

     v:'p'  ação principal da tela (tinta cheia) — uma por tela
     v:'s'  ação secundária (contorno)
     v:'g'  ação discreta, sem peso visual
     v:'ok' confirma   v:'dan' destrói   v:'no' recusa
     sz:'xs' em linha de tabela/card   sz:'lg' formulário de entrada         */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--r-sm);font-size:13px;font-weight:650;letter-spacing:-.012em;
  border:1px solid transparent;white-space:nowrap;
  transition:transform .12s,box-shadow .18s,background .18s,border-color .18s,color .18s,opacity .18s}
.btn svg{width:15px;height:15px;flex:0 0 15px}
a.btn{text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn:disabled,.btn[disabled]{opacity:.5;pointer-events:none;box-shadow:none}
.btn-p{background:linear-gradient(180deg,var(--ac-2),var(--ac));color:var(--ac-fg);
  box-shadow:var(--sh-ac),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,20,35,.16),0 12px 24px -10px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.26)}
.btn-p:active{transform:translateY(0)}
.btn-s{background:var(--panel);border-color:var(--line);color:var(--fg);box-shadow:var(--sh-1)}
.btn-s:hover{border-color:var(--ac-line);color:var(--ac);background:var(--ac-soft);box-shadow:var(--sh-2)}
.btn-g{background:none;color:var(--muted)}
.btn-g:hover{background:var(--raised);color:var(--fg)}
.btn-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.btn-ok:hover{background:var(--ok);color:#fff;border-color:transparent;box-shadow:var(--sh-2)}
.btn-dan{background:var(--panel);color:var(--err);border-color:var(--err-line)}
.btn-dan:hover{background:var(--err);color:#fff;border-color:transparent;box-shadow:var(--sh-2)}
.btn-no{background:var(--panel);color:var(--dim);border-color:var(--line)}
.btn-no:hover{color:var(--err);border-color:var(--err-line);background:var(--err-bg)}
.btn-xs{padding:5.5px 10px;font-size:11.5px;border-radius:var(--r-xs);gap:5px}
.btn-xs svg{width:13px;height:13px;flex:0 0 13px}
.btn-lg{padding:12px 20px;font-size:14.5px;border-radius:12px}
.btn-lg svg{width:17px;height:17px;flex:0 0 17px}
.btn-block{width:100%}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;align-items:end}
.form-grid > .btn{justify-self:start;align-self:end}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:650}
.msg{padding:12px 15px;border-radius:var(--r-sm);margin-bottom:16px;font-size:13px;display:none;font-weight:550;box-shadow:var(--sh-1)}
.msg.err{display:block;background:var(--err-bg);border:1px solid var(--err-line);color:var(--err)}
.msg.ok{display:block;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,10,16,.45);backdrop-filter:blur(2px);z-index:29}

/* ── Tabela ────────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
  padding:10px;font-weight:700;background:var(--raised);border-bottom:1px solid var(--line)}
th:first-child{border-radius:var(--r-xs) 0 0 0}
th:last-child{border-radius:0 var(--r-xs) 0 0}
td{padding:12px 10px;border-top:1px solid var(--line)}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--raised)}
tbody tr:first-child td{border-top:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:5px 5px 5px 12px}
.linkbox span{flex:1;font:12px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Modal. `dialog` nativo daria o backdrop de graca, mas nao fecha no Esc do jeito
   que a gente quer nem centraliza igual em navegador antigo — dois divs resolvem. */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,10,16,.55);backdrop-filter:blur(3px);
  z-index:40;padding:20px;overflow-y:auto}
.modal-bg.show{display:block}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;margin:44px auto;
  box-shadow:var(--sh-3);animation:sobe .18s ease}
@keyframes sobe{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal-h{display:flex;align-items:center;gap:11px;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.02em}
.modal-b{padding:22px}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:15px 22px;border-top:1px solid var(--line);background:var(--panel-2);
  border-radius:0 0 15px 15px}
.x{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;cursor:pointer;padding:2px 7px;border-radius:var(--r-xs);
  transition:background .14s,color .14s}
.x:hover{color:var(--fg);background:var(--raised)}

/* Barra acima da tabela: busca a esquerda, acao primaria a direita. */
.tbl-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tbl-bar input{flex:1;min-width:190px}
.acoes{display:flex;gap:3px;justify-content:flex-end}
/* Botao so de icone. `title` e `aria-label` sao obrigatorios: icone sem nome
   e adivinhacao pra quem chega hoje e barreira pra leitor de tela. */
.bi{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-xs);border:1px solid transparent;
  background:none;color:var(--muted);cursor:pointer;transition:background .14s,color .14s,border-color .14s}
.bi svg{width:16px;height:16px}
.bi:hover{background:var(--ac-soft);color:var(--ac);border-color:var(--ac-line)}
.bi.dan:hover{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.bi.pri:hover{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.bi:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.bi[disabled]{opacity:.3;cursor:default}
.bi[disabled]:hover{background:none;color:var(--muted);border-color:transparent}
.thumb{width:42px;height:42px;border-radius:var(--r-xs);object-fit:cover;display:block;background:var(--raised);
  border:1px solid var(--line)}
.thumb.vazia{background:var(--raised)}
.th-ord{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;
  text-transform:inherit;cursor:pointer;transition:color .14s}
.th-ord:hover{color:var(--ac)}
.pag{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.fotos{display:flex;gap:9px;flex-wrap:wrap;min-height:4px}
.fotos .ft{position:relative;width:78px;height:78px;border-radius:11px;overflow:hidden;
  border:1px solid var(--line);background:var(--bg);box-shadow:var(--sh-1)}
.fotos .ft img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .ft .x{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:7px;
  background:rgba(0,0,0,.62);color:#fff;border:0;font-size:13px;line-height:1;cursor:pointer;padding:0}
.fotos .ft .capa{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.66);color:#fff;
  font-size:9.5px;text-align:center;padding:2.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.fotos .subindo{display:grid;place-items:center;color:var(--dim);font-size:11px}
@media(max-width:640px){.modal{margin:0;border-radius:14px}.modal-b{padding:16px}}

.notas{list-style:none;display:grid;gap:9px;margin:2px 0 0;padding:0}
.notas li{position:relative;padding-left:20px;font-size:13px;color:var(--muted);line-height:1.5}
.notas li::before{content:'';position:absolute;left:5px;top:8px;width:6px;height:6px;border-radius:50%;
  background:var(--ac);opacity:.55}

/* Campo recusado: borda vermelha e o motivo logo embaixo. Mensagem de erro
   longe do campo obriga a pessoa a adivinhar qual deles era. */
input.erro-campo,select.erro-campo,textarea.erro-campo{border-color:var(--err);box-shadow:0 0 0 3.5px var(--err-bg)}
.campo-erro{font-size:12.5px;margin-top:6px;font-weight:550;display:none}
.campo-erro.on{display:block;color:var(--err)}

.toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:grid;gap:9px;max-width:min(420px,calc(100vw - 36px))}
.toast{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-sm);
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh-3);font-size:13px;line-height:1.5;
  cursor:pointer;transition:opacity .3s;animation:sobe .18s ease}
.toast .ic{flex:none;width:18px;height:18px}
.toast .ic svg{width:18px;height:18px}
.toast.t-ok .ic{color:var(--ok)}
.toast.t-err .ic{color:var(--err)}
.toast.t-err{border-color:var(--err-line)}

/* ── Caixa de entrada do atendente ─────────────────────────────────────────
   Lista à esquerda, conversa à direita — o formato que todo mundo já sabe usar,
   e que deixa o atendente pular de uma conversa pra outra sem perder o lugar. */
.inbox{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;align-items:start}
.inbox-lista{display:grid;gap:8px;max-height:72vh;overflow-y:auto;padding-right:4px}
.conversa{display:block;width:100%;text-align:left;padding:12px;border-radius:var(--r-sm);
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh-1);cursor:pointer;
  transition:border-color .16s,background .16s,box-shadow .16s}
.conversa:hover{border-color:var(--ac-line);background:var(--ac-soft)}
.conversa.ativa{border-color:var(--ac);background:var(--ac-soft);box-shadow:var(--sh-2)}
.cv-top{display:flex;align-items:baseline;gap:8px}
.cv-top b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-top small{font-size:11px;color:var(--dim);flex:none}
.cv-msg{font-size:12.5px;color:var(--muted);margin:4px 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-eu{color:var(--dim)}
.cv-tags{display:flex;gap:5px;flex-wrap:wrap}

.conversa-fluxo{display:grid;gap:9px;max-height:46vh;overflow-y:auto;padding:12px;margin:2px 0 12px;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm)}
.bolha{max-width:78%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;position:relative;box-shadow:var(--sh-1)}
.bolha small{display:block;font-size:10.5px;opacity:.6;margin-top:4px}
/* Cliente à esquerda, nós à direita: a mesma convenção do app que ele usa. */
.b-cliente{background:var(--panel);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.b-nossa{background:var(--ac-soft);border:1px solid var(--ac-line);color:var(--fg);justify-self:end;border-bottom-right-radius:4px}
.responder{display:grid;gap:9px}
.responder-acoes{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){
  .inbox{grid-template-columns:1fr}
  .inbox-lista{max-height:34vh}
}

/* ── Atalhos da visão geral ────────────────────────────────────────────── */
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}
.atalho{display:flex;align-items:center;gap:11px;padding:11px 13px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);box-shadow:var(--sh-1);
  color:var(--fg);transition:border-color .16s,box-shadow .16s,transform .16s,background .16s}
.atalho:hover{border-color:var(--ac-line);background:var(--ac-soft);box-shadow:var(--sh-2);transform:translateY(-1px)}
.atalho .at-t{flex:1;min-width:0}
.atalho b{display:block;font-size:13px;font-weight:650;letter-spacing:-.01em}
.atalho small{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.atalho > svg{width:15px;height:15px;flex:0 0 15px;color:var(--dim);transition:transform .16s,color .16s}
.atalho:hover > svg{color:var(--ac);transform:translateX(2px)}

/* ── Distribuição do funil ─────────────────────────────────────────────────
   Uma barra por etapa, largura proporcional. O funil em coluna já mostra os
   leads; isto mostra ONDE eles estão empilhados, que é a pergunta de quem abre
   o CRM de manhã. Sem lead nenhum a barra não aparece. */
.funil-barra{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--raised);gap:2px;margin:2px 0 14px}
.funil-barra i{display:block;height:100%;border-radius:99px;transition:opacity .16s}
.funil-barra i:hover{opacity:.75}
.funil-leg{display:flex;flex-wrap:wrap;gap:7px 16px}
.funil-leg div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.funil-leg .pt{width:9px;height:9px;border-radius:3px;flex:none}
.funil-leg b{color:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}
.funil-leg small{color:var(--dim);font-size:11.5px}

@media(max-width:900px){
  aside{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sh-3)}
  aside.open{transform:none}
  .overlay.show{display:block}
  .burger{display:grid;place-items:center}
  .content,.topbar{padding-left:16px;padding-right:16px}
  .crumb .pai{display:none}
  .top-right .pill:first-child{display:none}
  .page-head h1{font-size:21px}
  /* No telefone os indicadores vao a DOIS por linha: um por linha empurrava o
     conteudo da tela pra baixo da dobra so pra mostrar quatro numeros. */
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:13px}
  .kpi b{font-size:22px}
  .kpi em{font-size:11.5px}
  .kpi span{font-size:10px}
  .kpi .chip{width:24px;height:24px;flex:0 0 24px;border-radius:7px}
  .kpi .chip svg{width:13px;height:13px}
  .page-head{padding-bottom:15px;margin-bottom:18px}
  .kpi b{font-size:25px}
}
/* ── Entrada do console ──────────────────────────────────────────────────
   Painel de marca à esquerda, formulário à direita — o padrão que todo mundo
   já reconhece. No celular a marca encolhe e o formulário vem primeiro: quem
   abre no telefone quer entrar, não ler sobre o produto. */
.entrar{display:grid;grid-template-columns:1fr;min-height:100vh}
.entrar-marca{display:none}
.entrar-form{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 18px}
.entrar-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:26px 24px;box-shadow:var(--shadow-2)}
.entrar-box h2{font-size:19px;margin:0;letter-spacing:-.02em}
.entrar-sub{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.entrar .senha-wrap{position:relative}
.entrar .senha-wrap input{width:100%;padding-right:74px;height:46px;font-size:15px}
.entrar .senha-wrap input.erro{border-color:var(--err)}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:6px}
.olho:hover{background:var(--raised);color:var(--fg)}
.campo-erro,.campo-dica{display:none;font-size:12.5px;margin-top:7px;font-weight:500}
.campo-erro.on{display:block;color:var(--err)}
.campo-dica.on{display:block;color:var(--warn)}
.entrar-btn{width:100%;height:46px;font-size:14.5px;margin-top:18px}
.entrar-btn:disabled{opacity:.6;cursor:progress}
.entrar-ajuda{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.entrar-ajuda b{font-size:12.5px;display:block;margin-bottom:4px}
.entrar-ajuda p{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}
.entrar-rodape{margin-top:22px;font-size:12px;color:var(--dim)}
@media (min-width:900px){
  .entrar{grid-template-columns:1.05fr 1fr}
  /* O painel de marca é escuro nos DOIS temas. Usar --ink faria ele inverter no
     modo escuro e virar uma placa branca gigante ao lado do formulário escuro. */
  .entrar-marca{display:flex;flex-direction:column;justify-content:space-between;
    padding:44px 40px;background:#141417;color:#fafafa}
  .entrar-marca h1{font-size:27px;margin:20px 0 10px;letter-spacing:-.03em}
  .entrar-marca p{font-size:14.5px;opacity:.72;max-width:34ch;line-height:1.6;margin:0}
  .entrar-marca small{font-size:12px;opacity:.5}
  .entrar-marca .brand-badge{background:#fafafa;color:#141417;
    width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    font-size:16px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .entrar-lista{list-style:none;padding:0;margin:26px 0 0;font-size:13.5px}
  .entrar-lista li{padding:7px 0 7px 22px;position:relative;opacity:.78}
  .entrar-lista li::before{content:'';position:absolute;left:0;top:14px;width:8px;height:8px;
    border-radius:50%;background:currentColor;opacity:.5}
}



/* ── Vida no painel de entrada ───────────────────────────────────────────
   A versão anterior era texto corrido com bolinha cinza na frente, num
   retângulo preto com um vão enorme no meio. Aqui entram três coisas: um
   fundo que respira, ícone de verdade em cada capacidade (bolinha não diz
   nada) e a tira de produtos embaixo, que é o que ocupa o vazio com
   informação em vez de espaço. */
.entrar-marca{position:relative;overflow:hidden}

/* Duas manchas de luz que derivam devagar. 22s e 28s de propósito: períodos
   diferentes nunca sincronizam, então o movimento não vira um pulso óbvio. */
.entrar-brilho{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.entrar-brilho::before,.entrar-brilho::after{content:'';position:absolute;border-radius:50%;filter:blur(72px)}
.entrar-brilho::before{width:460px;height:460px;top:-140px;left:-120px;
  background:radial-gradient(circle,rgba(99,102,241,.5),transparent 68%);animation:deriva1 22s ease-in-out infinite}
.entrar-brilho::after{width:400px;height:400px;bottom:-130px;right:-90px;
  background:radial-gradient(circle,rgba(13,148,136,.42),transparent 68%);animation:deriva2 28s ease-in-out infinite}
@keyframes deriva1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,70px)}}
@keyframes deriva2{0%,100%{transform:translate(0,0)}50%{transform:translate(-55px,-45px)}}
/* Malha fina por cima: dá textura de console sem competir com o texto. */
.entrar-grade{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(120% 90% at 20% 15%,#000,transparent 72%);
          mask-image:radial-gradient(120% 90% at 20% 15%,#000,transparent 72%)}
/* Só o conteúdo sobe; as camadas de fundo levam aria-hidden e ficam de fora.
   Com `> *` genérico, esta regra vinha depois e trocava o position:absolute
   do brilho por relative — as manchas caíam no fluxo e o painel ficava preto
   chapado, sem nada do fundo aparecer. */
.entrar-marca > div:not([aria-hidden]){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){
  .entrar-brilho::before,.entrar-brilho::after{animation:none}
}

/* ---- capacidades: ícone, título e a linha que explica ---- */
.entrar-caps{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:3px}
.entrar-caps li{display:flex;gap:13px;align-items:flex-start;padding:11px 12px;border-radius:11px;
  transition:background .25s ease}
.entrar-caps li:hover{background:rgba(255,255,255,.055)}
.entrar-caps .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--ct,#a5b4fc)}
.entrar-caps .ic svg{width:16px;height:16px}
.entrar-caps b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}

}
function marcarTema(t){
  document.getElementById('thLight')?.classList.toggle('on',t==='light');
  document.getElementById('thDark')?.classList.toggle('on',t==='dark');
}
(function(){

/* O aviso precisa aparecer ONDE A PESSOA ESTA OLHANDO. A versao anterior so
   escrevia no topo do conteudo: quem clicava num botao no fim de uma tela longa
   (importar fluxo, por exemplo) nao via resposta nenhuma e ficava sem saber se
   a operacao deu certo. Agora vai tambem num aviso flutuante. */
function flash(t,tipo,segundos){
  const m=document.getElementById('msg');
  if(m){ m.className='msg '+tipo; m.textContent=t; if(tipo==='ok') setTimeout(()=>m.className='msg',3200); }
  toast(t,tipo,segundos);
}
function toast(t,tipo,segundos){
  let c=document.getElementById('toasts');
  if(!c){ c=document.createElement('div'); c.id='toasts'; c.className='toasts'; document.body.appendChild(c); }
  const el=document.createElement('div');
  el.className='toast '+(tipo==='err'?'t-err':'t-ok');
  el.innerHTML=`<span class="ic">${ico(tipo==='err'?'alerta':'check')}</span><div>${esc(t).replace(/\n/g,'<br>')}</div>`;
  el.onclick=()=>el.remove();
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, (segundos||(tipo==='err'?9:4))*1000);
}
// O ?t= da URL continua funcionando (link direto), mas a sessao tem prioridade:
// token em querystring acaba em log de acesso e em historico de navegador.
let TOKEN=sessionStorage.getItem('crm_token')||new URLSearchParams(location.search).get('t')||'';
async function api(r,body){
  const res=await fetch('/crm/api/'+r,{method:body?'POST':'GET',
    headers:{'content-type':'application/json',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  const j=await res.json().catch(()=>({erro:'resposta invalida do servidor'}));
  if(!res.ok||j.erro) throw new Error(j.erro||('HTTP '+res.status));
  return j;
}

/* O TikTok tem três apps separados (login, anúncios e loja), cada um com autorização
   própria — por isso ele aparece como bloco, e não como mais uma linha de credencial. */
const TK_NOME={open:'Login Kit / Display',business:'Business (Ads)',shop:'Shop (produtos)'};
function tiktokCard(){
  if(!TK) return '';
  const app=TKAPP;
  const bloco=(f,nome,campos,ajuda)=>{
    const s=TK.familias[f];
    const badge=!s.appConfigurado?`<span class="badge">falta preencher</span>`
      :!s.autorizado?'<span class="badge b-warn">app pronto · falta autorizar</span>'
      :s.expirado?'<span class="badge b-err">token vencido</span>'
      :`<span class="badge b-ok">conectado${s.venceEmMin!=null?' · vence em '+s.venceEmMin+' min':''}</span>`;
    return `<div class="card" style="margin-bottom:12px">
      ${cardH('redes',`TikTok · ${nome}`,esc(ajuda),3,badge)}
      ${s.chave?linha('Chave gravada aqui','compare com a do app, na aba certa (Sandbox ou Production)',esc(s.chave),'b-ok'):''}
      ${s.conta?linha('Conta conectada','',esc(s.conta),'b-ok'):''}
      ${s.token?linha('Token','mascarado',esc(s.token),''):''}
      ${f==='open'?`<div style="margin:6px 0 10px">
        <p class="hint" style="margin-bottom:6px">O que pedir de permissão. Comece só com o perfil:
          escopo que o app ainda não teve aprovado derruba a autorização inteira, e a TikTok não diz qual foi.</p>
        ${[['user.info.basic','Perfil básico (sempre vai)',true,true],
           ['user.info.stats','Estatísticas do perfil',false,false],
           ['video.list','Listar vídeos',false,false],
           ['video.publish','Publicar vídeo (precisa de aprovação)',false,false],
           ['video.upload','Enviar vídeo (precisa de aprovação)',false,false]]
          .map(([v,rot,marcado,travado])=>`<label style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:13px">
            <input type="checkbox" data-esc="${esc(f)}" value="${esc(v)}"${marcado?' checked':''}${travado?' disabled':''}>${esc(rot)}</label>`).join('')}
      </div>`:''}
      ${!s.autorizado?`<div class="form-grid">
        ${campos.map(c=>`<div class="field"><label>${esc(c[1])}</label>
          <input id="tk-${esc(f)}-${esc(c[0])}" placeholder="${esc(c[2]||'')}" autocomplete="off"></div>`).join('')}

async function publicarNoTiktok(){
  const arq=(document.getElementById('tkVideo')||{}).files?.[0];
  const alvo=document.getElementById('tkPubResultado');
  if(!arq) return flash('Escolha o arquivo de vídeo.','err');
  const titulo=(document.getElementById('tkTitulo')||{}).value?.trim()||'';
  const priv=(document.getElementById('tkPriv')||{}).value||'SELF_ONLY';
  alvo.innerHTML='<p class="hint">Enviando o arquivo…</p>';
  try{
    // O vídeo NÃO vai em JSON: sobe cru, em streaming, pra rota própria — o leitor
    // de JSON do painel corta em 256 KB.
    const up=await fetch('/crm/api/midia?nome='+encodeURIComponent(arq.name),
      {method:'POST',headers:{'content-type':arq.type||'video/mp4',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:arq});
    const uj=await up.json().catch(()=>({erro:'resposta inválida do servidor'}));
    if(!up.ok||uj.erro) throw new Error(uj.erro||('HTTP '+up.status));

    alvo.innerHTML='<p class="hint">Arquivo no ar. Mandando pra TikTok…</p>';
    const r=await api('tiktok/publicar',{videoUrl:uj.url,titulo,privacidade:priv});
    alvo.innerHTML=`<div class="card" style="margin-top:12px;border-style:dashed">
    ${cardH('redes',`Enviado pra TikTok`,``,3)}${linha('Arquivo','hospedado neste painel',(uj.bytes/1048576).toFixed(1)+' MB','b-ok')}
      ${linha('Quem vê','',priv==='SELF_ONLY'?'só você (privado)':priv,'')}
      ${r.publishId?linha('Id da publicação','a TikTok ainda processa o vídeo',esc(r.publishId),'b-warn'):''}
      ${(r.avisos||[]).map(a=>`<p class="hint">⚠ ${esc(a)}</p>`).join('')}
      ${r.publishId?`<button class="btn btn-s" onclick="verStatusTiktok('${esc(r.publishId)}')">${ico('ver')}Ver situação</button>`:''}</div>`;
    flash('Vídeo enviado. A TikTok processa em alguns segundos.','ok');
  }catch(e){ alvo.innerHTML=''; flash(e.message,'err'); }
}

async function autorizarTiktok(familia){
  try{
    // So o que estiver marcado. O padrao e o minimo: escopo nao aprovado no app
    // derruba a autorizacao toda, e a TikTok nao diz qual foi.
    const escopos=[...document.querySelectorAll(`input[data-esc="${familia}"]:checked`)].map(i=>i.value);
    const r=await api('tiktok/autorizar',{familia,escopos});
    // Abre a tela de consentimento da rede. A volta cai no /oauth/callback deste painel.
    window.open(r.url,'_blank','noopener');
    flash('Abri a autorização do TikTok em outra aba. Ao voltar, recarregue esta tela.','ok');
  }catch(e){flash(e.message,'err');}
}
/* Valor digitado por gente: "R$ 1.299,90", "1299,90", "1299.90". O que NAO pode
   e virar 0 calado — cobranca de zero passa reto e so aparece no extrato. */
function centavosDe(bruto){
  const t=String(bruto||'').replace(/[^\d,.-]/g,'').trim();
  if(!t) return null;
  const norm=t.includes(',')?t.replace(/\./g,'').replace(',','.'):t;
  const n=Number(norm);
  if(!Number.isFinite(n)||n<=0) return null;
  return Math.round(n*100);
}

/* Tom e ícone do indicador saem do que ele MEDE, não da ordem em que aparece:
   assim "Ganhos" é o mesmo verde-azulado em toda tela do console, e quem já viu
   uma vez reconhece na outra. Quem quiser fugir da regra passa tom/ícone na mão.
   A primeira regra que casar vence — por isso as mais específicas vêm antes. */
const TONS=[
  [/perdid|problema|sem saldo|esquecid|vencid|saiu|chargeback|invalid/i, 5,'alerta'],
  /* Casos em que a regra geral juntava 3 ou 4 indicadores da MESMA tela no mesmo
     tom — quatro caixas iguais outra vez. Cada um destes veio de olhar a tela. */
  [/com verde|verde valido|em vigor|licenca/i, 2,'check'],
  [/\bversao|\bversoes/i, 3,'versao'],
  [/aceite/i, 1,'registrar'],
  [/rascunho/i, 4,'editar'],
  [/validade/i, 4,'relogio'],
  [/enviad/i, 1,'enviar'],
  [/recebid|disponivel/i, 6,'baixar'],
  [/\bestado\b/i, 4,'power'],
  [/saldo do mes/i, 6,'caixa'],
  [/entrou/i, 2,'mais'],
  [/numa venda/i, 4,'gerar'],
  [/\bconversa\b/i, 2,'whats'],
  [/repositorio|recibo/i, 6,'auditor'],
  [/nunca rodaram|nunca rodou/i, 4,'relogio'],
  [/a pagar|comiss|pago|fatur/i, 2,'financeiro'],
  [/ganho|receita|confirmad|disponivel|saldo|entrou|vendeu|viraram venda/i, 2,'financeiro'],
  [/venda|ticket/i, 3,'consumo'],
  [/parceir/i, 1,'indicacao'],
  [/indicad/i, 3,'crm'],
  [/convers|ticket|ciclo|gmv|custo|valor parado/i, 3,'consumo'],
  [/aguardand|pendente|em andamento/i, 4,'relogio'],
  [/lead|abert|pipeline|pedido/i, 1,'crm'],
  [/unidade|reservad|lote/i, 6,'caixa'],
  [/produto|estoque|catalogo/i, 4,'estoque'],
  [/chamam gente|handoff|humano/i, 3,'usuario'],
  [/canal|whatsapp/i, 2,'whats'],
  [/bot|motor|regra|estado|automa/i, 6,'bot'],
  [/mensage|enviad|recebid|interac|whats|conversa/i, 2,'whats'],
  [/evento|qualific|trilha|auditor/i, 6,'auditor'],
  [/licenca|plano|validade|\bvers(ao|oes|ão|ões)|aceite|rascunho|em vigor|contrato/i, 3,'contrato'],
  [/origem|origens|rede|conex/i, 6,'redes'],
];
const semAcento=(t)=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tomDoIndicador=(l)=>(TONS.find(([re])=>re.test(semAcento(l)))||[null,1,'visao']).slice(1);
/* Indicador: rótulo, número e a linha que explica de onde ele vem. */
const kpi=(l,v,e,tom,icone)=>{
  const [t,ic]=tomDoIndicador(l);
  tom=tom||t; icone=icone===undefined?ic:icone;
  return `<div class="kpi" style="--kt:var(--t${tom});--kt-bg:var(--t${tom}-bg)">`+
    `<div class="kpi-top"><span>${esc(l)}</span>${icone?`<div class="chip">${ico(icone)}</div>`:""}</div>`+
    `<b>${esc(String(v))}</b><em>${esc(e)}</em></div>`;
};
/* ── Modelo de botão ───────────────────────────────────────────────────────
   UM lugar monta todo botão de texto do console. Tela nova usa isto e já nasce
   com ícone, altura, raio e tom iguais aos do resto — foi a falta disso que fez
   a plataforma virar uma coleção de botões parecidos, mas nenhum igual.

     botao({t:'Salvar', ic:'salvar', v:'p', on:'salvar()'})

   t  texto (obrigatório)      ic ícone do conjunto `I` (obrigatório na prática)
   v  p | s | g | ok | dan | no        sz xs | lg        on conteúdo do onclick
   off desabilita              tit  title/tooltip        extra classes a mais  */
function botao({t,ic,v='s',sz,on,id,tit,off,extra}){
  return `<button class="btn btn-${v}${sz?' btn-'+sz:''}${extra?' '+extra:''}"`+
    `${id?` id="${id}"`:''}${on?` onclick="${on}"`:''}${tit?` title="${esc(tit)}"`:''}`+
    `${off?' disabled':''}>${ic?ico(ic):''}<span>${esc(t)}</span></button>`;
}
/* Cabeçalho de cartão: chip de ícone + título + apoio + ações à direita.
   O chip é o que diferencia um bloco do outro quando a tela tem seis cartões. */
const cardH=(icone,titulo,dica,tom,acts)=>
  `<div class="card-h"><div class="chip" style="--ct:var(--t${tom||1});--ct-bg:var(--t${tom||1}-bg)">${ico(icone)}</div>`+
  `<div class="card-h-t"><h3>${esc(titulo)}</h3>${dica?`<p class="hint">${dica}</p>`:''}</div>`+
  `${acts?`<div class="card-h-a">${acts}</div>`:''}</div>`;

function vazio(icone,titulo,texto,passos){
  return `<div class="empty"><div class="ico">${ico(icone)}</div><h3>${esc(titulo)}</h3><p>${texto}</p>
   ${passos?`<div class="steps">${passos.map((p,i)=>`<div class="step"><div class="n">${i+1}</div><div>${p}</div></div>`).join('')}</div>`:''}</div>`;
}
/* Botao so de icone. `title` e `aria-label` sao obrigatorios aqui: icone sem nome
   e adivinhacao pra quem chega hoje e barreira pra leitor de tela. */
const bi=(icone,rotulo,onclick,classe='')=>
  `<button class="bi ${classe}" title="${esc(rotulo)}" aria-label="${esc(rotulo)}" onclick="${onclick}">${ico(icone)}</button>`;

/* Lista de ressalvas — texto corrido, nao par rotulo/estado. Antes isto era
   `linha('•',' ',texto)`: a frase ia parar dentro do badge, espremida na ponta
   direita, e a coluna da esquerda ficava com uma bolinha sozinha. */
const notas=(lista)=>`<ul class="notas">${lista.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;

   outro recusa. `EDITANDO` diz em qual modo ele está. */
let EDITANDO=null;
/* Ordenacao e pagina vivem fora do render: a tela e redesenhada inteira a cada
   `carregar()`, e estado guardado no DOM se perderia a cada atualizacao. */
let TAB={ordem:'nome',desc:false,pagina:1,porPagina:20,busca:''};
/* Lista OU funil. O funil e bom pra arrastar a venda; a lista e melhor pra achar
   um lead pelo nome no meio de trezentos. Quem escolhe e quem usa. */

let PERIODO={de:'',ate:''};

  eMarca:'marca',eCat:'categoria',eGtin:'gtin',eLink:'link',eImgs:'imagens',eDesc:'descricao'};

function lerFormProduto(){
  const v=(id)=>(document.getElementById(id)||{}).value?.trim()||'';
  return {nome:v('eNome'),preco:v('ePreco'),precoPromocional:v('ePromo')||null,
    quantidade:Number(v('eQtd')||0),marca:v('eMarca'),categoria:v('eCat'),gtin:v('eGtin'),
    link:v('eLink'),imagens:v('eImgs').split(',').map(x=>x.trim()).filter(Boolean),descricao:v('eDesc')};
}

async function salvarProduto(){
  const d=lerFormProduto();
  if(!d.nome) return flash('O nome é obrigatório.','err');
  if(!EDITANDO&&!d.preco) return flash('O preço é obrigatório.','err');
  try{
    const r=EDITANDO
      ? await api('estoque/editar',{sku:EDITANDO,mudancas:d})
      : await api('estoque/produto',d);
    if(r.erros?.length) return flash(r.erros.join(' · '),'err');
    const feito=EDITANDO?'Produto atualizado.':'Produto cadastrado.';
    EDITANDO=null;
    fecharModal();
    // `carregar()` REDESENHA a tela: mostrar aviso antes dele e desenhar num
    // elemento que vai ser jogado fora no instante seguinte.
    await carregar();
    flash(feito,'ok');
    mostrarPendencias(r.produto||{nome:d.nome},r.avisos||[]);
  }catch(e){flash(e.message,'err');}
}



/* Um modal só, reaproveitado. Vários modais no HTML viram vários lugares pra
   esquecer de fechar — e aí um fica por cima do outro sem ninguém perceber. */
let FECHAR_MODAL=null;
function abrirModal(titulo,corpo,rodape){
  document.getElementById('modalT').textContent=titulo;
  document.getElementById('modalB').innerHTML=corpo;
  document.getElementById('modalF').innerHTML=rodape||'';
  document.getElementById('modalBg').classList.add('show');
  // Trava o fundo: sem isso a pagina atras rola junto e a pessoa perde o modal.
  document.body.style.overflow='hidden';
  FECHAR_MODAL=(e)=>{if(e.key==='Escape')fecharModal();};
  document.addEventListener('keydown',FECHAR_MODAL);
  setTimeout(()=>{
    document.querySelector('#modalB input:not([type=hidden]),#modalB textarea,#modalB select')?.focus();
    if(document.getElementById('eFotos')) pintarFotos();
  },60);
}
function fecharModal(){
  document.getElementById('modalBg').classList.remove('show');
  document.body.style.overflow='';
  /* LIMPA o conteudo, nao so esconde. Modal escondido com formulario dentro deixa
     os mesmos ids (#eNome, #ePreco) duplicados na pagina e botoes fantasmas
     respondendo a clique — a tela passa a ter dois "Editar" pro mesmo produto. */
  document.getElementById('modalB').innerHTML='';
  document.getElementById('modalF').innerHTML='';
  document.getElementById('modalT').textContent='';
  if(FECHAR_MODAL){document.removeEventListener('keydown',FECHAR_MODAL);FECHAR_MODAL=null;}
}

/* ---- fotos do produto ---- */

/* A lista real mora no input escondido: é ela que vai pro backend. As miniaturas
   são só a leitura dela — assim não existe um segundo lugar pra divergir. */
const fotosAtuais=()=>((document.getElementById('eImgs')||{}).value||'')
  .split(',').map(x=>x.trim()).filter(Boolean);

function pintarFotos(){
  const alvo=document.getElementById('eFotos');
  if(!alvo) return;
  const fs=fotosAtuais();
  alvo.innerHTML=fs.map((u,i)=>`<div class="ft">
    <img src="${esc(u)}" alt="" onerror="this.parentNode.classList.add('semfoto');this.remove()">
    <button type="button" class="x" title="Remover" aria-label="Remover foto" onclick="removerFoto(${i})">×</button>
    ${i===0?'<span class="capa">capa</span>':''}</div>`).join('');
}

function definirFotos(lista){
  const campo=document.getElementById('eImgs');
  if(campo) campo.value=lista.join(', ');
  pintarFotos();
}

function removerFoto(i){
  const fs=fotosAtuais();
  fs.splice(i,1);
  definirFotos(fs);
}

function colarUrlFoto(){
  const u=prompt('Cole o endereço da imagem (https://...)');
  if(!u) return;
  if(!/^https?:\/\//i.test(u.trim())) return flash('O endereço precisa começar com http:// ou https://','err');
  definirFotos([...fotosAtuais(),u.trim()]);
}

async function subirFotos(input){
  const arquivos=[...(input.files||[])];
  if(!arquivos.length) return;
  const alvo=document.getElementById('eFotos');
  const antes=fotosAtuais();
  // Mostra o espaço reservado antes de subir: upload sem retorno visual parece travado.
  if(alvo) alvo.insertAdjacentHTML('beforeend',arquivos.map(()=>'<div class="ft subindo">enviando…</div>').join(''));
  const novas=[]; const erros=[];
  for(const f of arquivos){
    try{
      const r=await fetch('/crm/api/midia?tipo=imagem&nome='+encodeURIComponent(f.name),
        {method:'POST',headers:{'content-type':f.type||'image/jpeg',...(TOKEN?{'x-crm-token':TOKEN}:{})},body:f});
      const j=await r.json().catch(()=>({erro:'resposta inválida do servidor'}));
      if(!r.ok||j.erro) throw new Error(j.erro||('HTTP '+r.status));
      novas.push(j.url);
    }catch(e){ erros.push(`${f.name}: ${e.message}`); }
  }
  input.value='';
  definirFotos([...antes,...novas]);
  // Falha parcial é o caso normal com vários arquivos: dizer só "enviado"
  // esconderia o que ficou de fora.
  if(erros.length) flash(`${novas.length} enviada(s). Falhou: ${erros.join('; ')}`,'err');
  else if(novas.length) flash(`${novas.length} foto(s) enviada(s).`,'ok');
}

async function importarProdutos(){
  const txt=(document.getElementById('impTxt')||{}).value?.trim()||'';
  if(!txt) return flash('Cole o conteúdo primeiro.','err');
  let itens;
  try{
    const d=JSON.parse(txt);
    itens=Array.isArray(d)?d:(d.produtos||[]);
  }catch(e){ return flash('JSON inválido: '+e.message,'err'); }
  if(!itens.length) return flash('Nenhum item encontrado no conteúdo.','err');

  const erros=[]; let entraram=0;
  for(const it of itens){
    try{
      const r=await api('estoque/produto',{...it,preco:it.preco??(it.precoCentavos!=null?it.precoCentavos/100:undefined)});
      if(r.erros?.length) erros.push(`${it.nome||it.sku||'sem nome'}: ${r.erros.join('; ')}`);
      else entraram++;
    }catch(e){ erros.push(`${it.nome||it.sku||'sem nome'}: ${e.message}`); }
  }
  fecharModal(); await carregar();
  // Importacao parcial e o caso normal: dizer so "importado" esconderia o que ficou de fora.
  if(erros.length) abrirModal('Importação concluída em parte',
    `${linha('Entraram','',String(entraram),'b-ok')}${linha('Recusados','',String(erros.length),'b-warn')}
     <div style="margin-top:12px">${erros.map(e=>`<p class="hint">• ${esc(e)}</p>`).join('')}</div>`,
    `<button class="btn btn-p" onclick="fecharModal()">${ico('check')}Entendi</button>`);
  else flash(`${entraram} produto(s) importado(s).`,'ok');
}

async function baixarLote(id){
  try{
    const res=await fetch('/crm/api/estoque/lote?id='+encodeURIComponent(id),
      {headers:TOKEN?{'x-crm-token':TOKEN}:{}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const nome=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||(id+'.json');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(await res.blob()); a.download=nome; a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){flash(e.message,'err');}
}

/* ---- DataTable genérica ----
   Uma só, usada por todas as telas de cadastro. Cada tela repetindo a sua
   diverge na primeira mudança: uma ganha busca, outra não; uma trata lista vazia,
   outra mostra tabela sem linha. */
const BUSCA={};
function buscarEm(chave,valor){ BUSCA[chave]=valor; render(); }
const casa=(termo,campos)=>{
  const t=String(termo||'').toLowerCase().trim();
  return !t || campos.filter(Boolean).some(c=>String(c).toLowerCase().includes(t));
};

/* `todos` e a lista antes do filtro. Sem ela nao da pra distinguir "nada
   cadastrado" de "a busca nao achou" — e sao duas telas diferentes: uma convida
   a cadastrar, a outra a corrigir o termo. */
function tabela({colunas,itens,todos,acoes,vazio,nenhum}){
  const bruto=todos||itens;
  if(!bruto.length) return `<p class="hint" style="padding:24px 0;text-align:center">${vazio||'Nada cadastrado ainda.'}</p>`;
  if(!itens.length) return `<p class="hint" style="padding:24px 0;text-align:center">${nenhum||'Nada encontrado.'}</p>`;
  const cab=colunas.map(c=>`<th style="text-align:${c.al||'left'}">${esc(c.t)}</th>`).join('');
  const corpo=itens.map(x=>`<tr>${colunas.map(c=>`<td style="text-align:${c.al||'left'}">${c.cel(x)}</td>`).join('')}
    ${acoes?`<td><div class="acoes">${acoes(x)}</div></td>`:''}</tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${cab}${acoes?'<th></th>':''}</tr></thead>
    <tbody>${corpo}</tbody></table></div>
    <p class="hint" style="margin-top:10px">${itens.length} registro(s)</p>`;
}

function ordenar(campo){
  if(!campo) return;
  if(TAB.ordem===campo) TAB.desc=!TAB.desc; else {TAB.ordem=campo;TAB.desc=false;}
  TAB.pagina=1; render();
}
function irPagina(n){ TAB.pagina=n; render(); }
function buscarNaTabela(v){ TAB.busca=v; TAB.pagina=1; render(); }
function porPagina(n){ TAB.porPagina=Number(n); TAB.pagina=1; render(); }

/* Filtra, ordena e pagina no cliente. A especificação pede servidor "quando o
   volume justificar" — com catálogo de loja pequena, ida ao servidor a cada
   tecla é pior: trava em rede ruim e não melhora nada. */
function linhasVisiveis(produtos){
  const t=TAB.busca.toLowerCase().trim();
  let ps=t?produtos.filter(p=>`${p.nome} ${p.sku} ${p.marca||''} ${p.categoria||''}`.toLowerCase().includes(t)):produtos.slice();
  const c=TAB.ordem;
  ps.sort((a,b)=>{
    const x=a[c],y=b[c];
    if(x==null&&y==null) return 0;
    if(x==null) return 1;   // vazio sempre no fim, subindo ou descendo
    if(y==null) return -1;
    const r=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'pt-BR');
    return TAB.desc?-r:r;
  });
  const total=ps.length;
  const paginas=Math.max(1,Math.ceil(total/TAB.porPagina));
  if(TAB.pagina>paginas) TAB.pagina=paginas;
  const ini=(TAB.pagina-1)*TAB.porPagina;
  return {pagina:ps.slice(ini,ini+TAB.porPagina),total,paginas,ini};
}

function tabelaProdutos(produtos){
  const {pagina,total,paginas,ini}=linhasVisiveis(produtos);
  const seta=(campo)=>TAB.ordem!==campo?'':(TAB.desc?' ↓':' ↑');
  const cab=COLUNAS.map(c=>c.ord
    ?`<th style="text-align:${c.al||'left'}"><button class="th-ord" onclick="ordenar('${c.ord}')">${esc(c.t)}${seta(c.ord)}</button></th>`
    :`<th style="text-align:${c.al||'left'}">${esc(c.t)}</th>`).join('');

  const corpo=pagina.map(x=>`<tr>${COLUNAS.map(c=>`<td style="text-align:${c.al||'left'}">${c.cel(x)}</td>`).join('')}
    <td><div class="acoes">
      ${bi('ver','Visualizar',`verProduto('${esc(x.sku)}')`)}
      ${bi('editar','Editar',`editarProduto('${esc(x.sku)}')`)}
      ${bi('comprar','Comprar (dar entrada)',`comprarProduto('${esc(x.sku)}','${esc(x.nome).replace(/'/g,"\\'")}')`)}
      ${bi('vender','Vender no canal',`venderProduto('${esc(x.sku)}','${esc(x.nome).replace(/'/g,"\\'")}')`,'pri')}
      ${bi('excluir','Excluir',`excluirProduto('${esc(x.sku)}','${esc(x.nome).replace(/'/g,"\\'")}')`,'dan')}
    </div></td></tr>`).join('');

  if(!produtos.length) return `<p class="hint" style="padding:26px 0;text-align:center">
    Catálogo vazio — clique em <b>+ Novo produto</b> pra cadastrar o primeiro.</p>`;
  if(!total) return `<p class="hint" style="padding:26px 0;text-align:center">Nenhum produto com “${esc(TAB.busca)}”.</p>`;

  const nav=paginas>1?`<div class="pag">
    <span class="hint">${ini+1}–${ini+pagina.length} de ${total}</span>
    <div style="display:flex;gap:4px">
      <button class="btn btn-s btn-xs" ${TAB.pagina<=1?'disabled':''} onclick="irPagina(${TAB.pagina-1})">${ico('ant')}anterior</button>
      ${Array.from({length:paginas},(_,i)=>i+1).filter(n=>Math.abs(n-TAB.pagina)<3||n===1||n===paginas)
        .map(n=>`<button class="btn btn-xs ${n===TAB.pagina?'btn-p':'btn-s'}" onclick="irPagina(${n})">${n}</button>`).join('')}
      <button class="btn btn-s btn-xs" ${TAB.pagina>=paginas?'disabled':''} onclick="irPagina(${TAB.pagina+1})">próxima${ico('prox')}</button>
    </div></div>`:`<p class="hint" style="margin-top:10px">${total} produto(s)</p>`;

  return `<div class="tbl-wrap"><table id="tblProdutos"><thead><tr>${cab}<th></th></tr></thead>
    <tbody>${corpo}</tbody></table></div>${nav}`;
}

/* Achata o histórico de todos os leads numa lista só, do mais novo pro mais
   velho. O histórico já é gravado por evento desde o início — o que faltava era
   olhar pra ele como TRILHA, não como detalhe de um lead. */
function trilhaDeLeads(){
  const out=[];
  for(const l of (ST.leads||[])){
    for(const h of (l.historico||[])){
      out.push({...h,lead:l.nome||('+'+l.telefone),telefone:l.telefone});
    }
  }
  return out.sort((a,b)=>String(b.quando||'').localeCompare(String(a.quando||'')));
}

const rotuloEvento=(e)=>({
  criado:'lead cadastrado',
  etapa:'mudou de etapa',
  fechado:'lead fechado',
  qualificado:'score calculado',
  interacao:'mensagem',
}[e.tipo]||e.tipo);

function detalheEvento(e){
  if(e.tipo==='etapa') return `${e.de||'—'} → ${e.para||'—'}`;
  if(e.tipo==='fechado') return e.status+(e.motivo?` · ${e.motivo}`:'');
  if(e.tipo==='qualificado') return `${e.faixa||'—'}${e.score!=null?' · '+e.score:''}${(e.motivos||[]).length?' · '+e.motivos.join('; '):''}`;
  if(e.tipo==='interacao') return `${e.direcao==='saida'?'enviada':'recebida'} · ${String(e.texto||'').slice(0,60)}`;
  if(e.tipo==='criado') return e.etapa||'';
  return '';
}

async function simular(){
  const campo=document.getElementById('simTxt');
  const txt=(campo?.value||'').trim();
  if(!txt) return;
  try{
    // Manda a conversa INTEIRA: o contador de falhas seguidas depende do que veio
    // antes, e mandar so a ultima mensagem faria o bot nunca chamar gente.
    const msgs=[...SIMULACAO.map(t=>t.recebida),txt];
    const r=await api('bot/simular',{mensagens:msgs});
    SIMULACAO=r.turnos||[];
    campo.value='';
    render();
    document.getElementById('simTxt')?.focus();
  }catch(e){flash(e.message,'err');}
}

/* Barra de distribuição: quanto de cada etapa no total em aberto. Os tons giram
   na régua --t1..--t6 pra duas etapas vizinhas nunca saírem da mesma cor. */
function funilBarra(){
  const et=ST.resumo.etapas.filter(e=>e.leads>0);
  const total=et.reduce((s,e)=>s+e.leads,0);
  if(!total) return '';
  const tom=(i)=>`var(--t${(i%6)+1})`;
  return `<div class="card" style="margin-bottom:16px">
    ${cardH('visao','Onde os leads estão','Distribuição do que está em aberto, por etapa.',1,
      `<span class="badge b-ac">${total} em aberto</span>`)}
    <div class="funil-barra">${et.map((e,i)=>
      `<i style="width:${(e.leads/total*100).toFixed(1)}%;background:${tom(i)}" title="${esc(e.etapa)}: ${e.leads}"></i>`).join('')}</div>
    <div class="funil-leg">${et.map((e,i)=>
      `<div><span class="pt" style="background:${tom(i)}"></span>${esc(e.etapa)} <b>${e.leads}</b>
        <small>${Math.round(e.leads/total*100)}%${e.valor?' · '+brl(e.valor):''}</small></div>`).join('')}</div></div>`;
}

function colHtml(etapa){
  const et=ST.resumo.etapas.find(e=>e.etapa===etapa)||{leads:0,valor:null};

   l.origem&&l.origem!=='manual'?`<span class="tag">${esc(l.origem)}</span>`:''].join('');
  return `<div class="lead"><div class="nm">${esc(l.nome||'sem nome')}</div>

 auditor:()=>{

    vazio('auditor','Backend sem a rota de auditoria','Atualize o backend para a versão com o VSpainel.',['Subir o backend novo','Recarregar']);
  const sit={'verde':'b-ok','vencido':'b-warn','nunca rodou':''};
  const cards=AUD.itens.map(i=>{
    if(!i.existe) return `<div class="card" style="margin-bottom:10px">
      ${cardH('alerta',i.nome||i.repo,`✖ ${esc(i.motivo)}<br><code>${esc(i.repo)}</code>`,5)}</div>`;
    const recs=Object.entries(i.recibos).map(([stack,r])=>{
      if(!r.existe) return linha(stack,'nenhum recibo gravado','nunca rodou','');
      return linha(stack, r.valido?`gravado há ${r.idadeMin} min na branch ${esc(r.branch||'—')}`:esc(r.motivo),
        r.valido?'verde':'não vale', r.valido?'b-ok':'b-err');

   :`<div class="card" style="margin-top:16px"><p class="hint">Nenhuma tarefa registrada em métricas ainda.</p></div>`}`;

 'wa-consumo':()=>{
  const inter=trilhaDeLeads().filter(e=>e.tipo==='interacao');
  const saida=inter.filter(e=>e.direcao==='saida').length;
  const w=STATUS?.whatsapp||{};
  const porMes={};
  inter.forEach(e=>{const m=String(e.quando||'').slice(0,7);if(m)porMes[m]=(porMes[m]||0)+1;});
  const meses=Object.entries(porMes).sort((a,b)=>b[0].localeCompare(a[0]));
  /* Absorveu os numeros que viviam em "WhatsApp > Relatorios": era outro item de
     menu com o mesmo nome do Relatorios de cima, e volume de conversa so faz
     sentido lido junto com o que ele virou em venda. */
  const comConversa=new Set(inter.map(e=>e.lead));
  const ganhosComConversa=ST.leads.filter(l=>l.status==='ganho'&&comConversa.has(l.nome||l.telefone)).length;
  const fechados=ST.leads.filter(l=>l.status!=='aberto').length;
  return head('WhatsApp · Consumo','Quanta conversa passou por aqui, o que ela virou no funil — e o que só a fatura da Meta responde.')+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Mensagens',inter.length,`${saida} enviada(s) · ${inter.length-saida} recebida(s)`)}
    ${kpi('Leads com conversa',comConversa.size,ST.leads.length?`de ${ST.leads.length} lead(s)`:'sem lead ainda')}
    ${kpi('Viraram venda',ganhosComConversa,comConversa.size?`de ${comConversa.size} com conversa`:'nenhuma conversa ainda')}
    ${kpi('Custo','—','só a fatura da Meta responde')}
  </div>
  <div class="card" style="margin-bottom:16px">
    ${cardH('crm',`Por etapa do funil`,``,1)}${ST.resumo.etapas.map(e=>linha(e.etapa,`${e.leads} lead(s) aberto(s)`,e.valor==null?'—':brl(e.valor),e.leads?'b-ok':'')).join('')
      ||'<p class="hint">Sem funil cadastrado.</p>'}</div>
  <div class="card" style="margin-bottom:16px">
    ${cardH('financeiro',`Por mês`,``,2)}${meses.length?meses.map(([m,n])=>linha(m.split('-').reverse().join('/'),'mensagens',String(n),'b-ok')).join('')
      :'<p class="hint">Nenhuma mensagem registrada ainda. O contador enche sozinho conforme as conversas acontecem.</p>'}</div>
  <div class="card" style="border-style:dashed">
    ${cardH('politica',`Por que o custo aparece como “—”`,`A Meta cobra por <b>conversa</b>, não por mensagem, e o preço muda com a categoria (atendimento, marketing, utilidade) e com o país. Estimar isso aqui seria inventar número: o valor real está na fatura deles.`,3)}
    ${linha('Canal de saída',esc(w.provider||'log'),w.envia?'enviando':'não envia',w.envia?'b-ok':'b-warn')}
    ${linha('Canal de entrada','webhook da Meta',w.envia?'depende da conta':'não existe','b-warn')}</div>`;
 },
 /* A caixa de entrada do especialista. O atendente trabalha AQUI, dentro do
    painel — nao no WhatsApp Web. E quando ele abre a conversa, ja ve o que a
    Micaela coletou: nao ha "qual e o problema?" duas vezes. */
 'wa-atendimento':()=>{
  const dados=ATEND||{conversas:[],esperando:0};
  const lista=dados.conversas||[];
  const sel=lista.find(c=>c.telefone===CONVERSA)||lista[0]||null;
  const canal=(CANAIS?.canais||[])[0];
  const online=canal?.estado==='conectado';
  const hora=(x)=>x?String(x).slice(11,16):'';
  const dia=(x)=>x?String(x).slice(8,10)+'/'+String(x).slice(5,7):'';

  const item=(c)=>`<button class="conversa${c.telefone===sel?.telefone?' ativa':''}" onclick="abrirConversa('${esc(c.telefone)}')">
    <div class="cv-top"><b>${esc(c.nome||'+'+c.telefone)}</b>
      <small>${dia(c.ultima?.quando)} ${hora(c.ultima?.quando)}</small></div>
    <div class="cv-msg">${c.ultima?.direcao==='saida'?'<span class="cv-eu">você:</span> ':''}${esc(String(c.ultima?.texto||'').slice(0,64))}</div>
    <div class="cv-tags">
      ${c.esperandoGente?`<span class="tag t-quente">esperando gente</span>`:'<span class="tag t-frio">com a Micaela</span>'}
      ${c.departamento?`<span class="tag">${esc(c.departamento)}</span>`:''}
      ${c.faixa?`<span class="tag t-${esc(c.faixa)}">${esc(c.faixa)}</span>`:''}
    </div></button>`;

  const bolha=(h)=>`<div class="bolha ${h.direcao==='saida'?'b-nossa':'b-cliente'}">
    <div>${esc(h.texto||'').replace(/\n/g,'<br>')}</div>
    <small>${hora(h.quando)}</small></div>`;

  const ctx=sel&&Object.keys(sel.contexto||{}).length
    ? `<div class="card" style="margin-top:12px">
        ${cardH('registrar','O que a Micaela já apurou',`Não pergunte de novo — a pessoa já respondeu isto.`,2)}
        ${Object.entries(sel.contexto).map(([k,v])=>linha(k.replace(/_/g,' '),'',String(v).slice(0,120),'b-ok')).join('')}
      </div>`:'';

  return head('WhatsApp · Atendimento','A conversa acontece aqui dentro. Quem atende vê o que a Micaela já perguntou e responde sem sair do painel.',
      online?botao({t:'Atualizar',ic:'atualizar',v:'s',on:'carregar()'})
            :botao({t:'Conectar o WhatsApp',ic:'whats',v:'p',on:"ir('canais')"}))+
  `<div class="grid g-kpi" style="margin-bottom:16px">
    ${kpi('Esperando gente',dados.esperando||0,'a Micaela já passou pra vocês')}
    ${kpi('Conversas',lista.length,'com mensagem registrada')}
    ${kpi('Canal',online?'no ar':'desligado',canal?.numero?'+'+esc(canal.numero):'ninguém pareado')}
  </div>
  ${!lista.length
    ? vazio('whats','Nenhuma conversa ainda','Quando alguém escrever no WhatsApp, a conversa aparece aqui — com tudo que a Micaela já perguntou.',
        ['Conectar o WhatsApp em Canais','Mandar uma mensagem de outro número','Voltar aqui pra responder'])
    : `<div class="inbox">
        <div class="inbox-lista">${lista.map(item).join('')}</div>
        <div class="inbox-conversa">
          ${sel?`<div class="card">
            ${cardH('crm',sel.nome||('+'+sel.telefone),`+${esc(sel.telefone)} · ${sel.mensagens} mensagem(ns) · etapa ${esc(sel.etapa||'—')}`,1,
              sel.esperandoGente
                ? `<span class="badge b-err">esperando desde ${hora(sel.desde)}</span>`
                : '<span class="badge b-ok">a Micaela está conduzindo</span>')}
            <div class="conversa-fluxo">${(sel.historico||[]).filter(h=>h.tipo==='interacao').map(bolha).join('')}</div>
            <div class="responder">
              <textarea id="respTexto" rows="2" placeholder="${online?'Escreva a resposta…':'Conecte o WhatsApp para poder responder'}" ${online?'':'disabled'}></textarea>
              <div class="responder-acoes">
                ${botao({t:'Enviar',ic:'enviar',v:'p',on:`responderCliente('${esc(sel.telefone)}')`,off:!online,id:'btResponder'})}
                ${sel.esperandoGente?botao({t:'Devolver pra Micaela',ic:'bot',v:'s',on:`devolverAoBot('${esc(sel.telefone)}')`}):''}
              </div>
            </div></div>${ctx}`:''}
        </div>
      </div>`}
  <div class="card" style="margin-top:16px">
    ${cardH('auditor',`Trilha completa`,`Cada linha foi gravada quando o evento aconteceu — nada aqui é escrito à mão. Era a tela "WhatsApp · Auditor"; virou parte do atendimento porque é o mesmo assunto.`,6)}
    <div class="tbl-bar">
      <input id="auBusca" value="${esc(BUSCA.auditor||'')}" placeholder="Buscar por lead, tipo ou texto"
        oninput="buscarEm('auditor',this.value)">
      ${botao({t:'Atualizar',ic:'atualizar',v:'s',on:'carregar()'})}
    </div>
    ${(()=>{const eventos=trilhaDeLeads();return tabela({
      vazio:'Nenhum evento ainda. A trilha enche sozinha conforme os leads andam no funil e as conversas acontecem.',
      nenhum:'Nenhum evento com esse termo.',
      colunas:[
        {t:'Quando',cel:(e)=>esc(String(e.quando||'').slice(0,16).replace('T',' '))},
        {t:'Lead',cel:(e)=>`<b>${esc(e.lead)}</b>`},
        {t:'O que houve',cel:(e)=>esc(rotuloEvento(e))},
        {t:'Detalhe',cel:(e)=>esc(detalheEvento(e))},
      ],
      todos:eventos, itens:eventos.filter(e=>casa(BUSCA.auditor,[e.lead,e.tipo,rotuloEvento(e),detalheEvento(e)])),
    });})()}</div>`;
 },

  const campo=document.getElementById('lgSenha');
