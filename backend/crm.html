 }
Object.assign(S,{
 /* Caixa de entrada. Aqui e chat: lista de quem esta esperando a esquerda,
    conversa a direita, e SO ISSO.

    A primeira versao tinha tres indicadores no topo, o cartao de contexto embaixo
    da conversa e a trilha inteira do CRM no rodape. Virou um relatorio com um
    chat no meio — quem atende precisa ler a conversa e responder, nao estudar
    metricas. Indicador foi pro Consumo, trilha voltou pro Auditor. */
 'wa-atendimento':()=>telaAtendimento('whatsapp'),
 /* Telegram tem o SEU layout (quadro de fila); o do WhatsApp segue como esta. */
 'tg-atendimento':()=>telaFilaTelegram(),
 'tg-canal':()=>telaTelegram(),
 'tg-auditor':()=>telaAuditorCanal('telegram'),
 'tg-consumo':()=>telaConsumoCanal('telegram'),
 'tg-resultados':()=>telaResultados('telegram'),
 'tg-campanhas':()=>telaCampanhas('telegram'),
 'qualificacao':()=>telaQualificacao(),
});
/* Mesma caixa de entrada pros dois canais: cada um ve SO as suas conversas. */
/* A central de conversas entre cliente, bot e vendedor. Responde UMA pergunta:
   quem precisa da minha atencao agora? Indicador financeiro mora em Resultados,
   campanha em Campanhas, configuracao em Canal e conexao — aqui e operacao. */
const SITUACAO={
  'aguardando':{rot:'Aguardando vendedor',cls:'sit-aguarda'},
  'com-vendedor':{rot:'Com vendedor',cls:'sit-vendedor'},
  'concluido':{rot:'Pedido concluído',cls:'sit-ok'},
  'com-bot':{rot:'Atendido pelo bot',cls:'sit-bot'},
};
const situacaoDe=(c)=>{ const s=c.situacao||(c.esperandoGente?'aguardando':'com-bot');
  return s==='com-bot'&&c.pedido?.estado==='pago'?'concluido':s; };
let FILTRO_CONV=null; // null = escolhe sozinho (quem precisa de voce, se houver)
function telaAtendimento(canal){
  if(HIST_ON[canal]) return telaHistorico(canal);
  const tg=canal==='telegram';
  const dados=ATEND||{conversas:[],esperando:0};
  const todas=(dados.conversas||[]).filter(c=>(c.canal||(ehTg(c.telefone)?'telegram':'whatsapp'))===canal);
  const irConexao=tg?"ir('tg-canal')":"ir('canais')";
  const nomeCanal=tg?'Telegram':'WhatsApp';
  const cont={agora:0,vendedor:0,bot:0,todas:todas.length};
  todas.forEach(c=>{ const s=situacaoDe(c); if(s==='aguardando') cont.agora++; else if(s==='com-vendedor') cont.vendedor++; else cont.bot++; });
  const filtro=FILTRO_CONV||(cont.agora?'agora':'todas');
  const passa=(c)=>{ const s=situacaoDe(c);
    return filtro==='todas'||(filtro==='agora'&&s==='aguardando')||(filtro==='vendedor'&&s==='com-vendedor')||(filtro==='bot'&&(s==='com-bot'||s==='concluido')); };
  /* Busca por nome, telefone ou protocolo: com trinta conversas abertas, rolar
     a lista procurando alguem e o que mais cansa quem atende. */
  const q=BUSCA_CONV.trim().toLowerCase();
  const lista=todas.filter(passa).filter(c=>!q||[c.nome,c.telefone,c.protocolo].some(x=>String(x||'').toLowerCase().includes(q)));
  const sel=todas.find(c=>c.telefone===CONVERSA)||lista[0]||null;
  const online=tg?TG?.estado==='conectado':(CANAIS?.canais||[])[0]?.estado==='conectado';
  const botLigado=BOT?.config?.ativo!==false;
  const contato=(c)=>tg?'Telegram':'+'+c.telefone;
  /* Hora e dia no fuso de QUEM ESTA OLHANDO. Cortar o texto ISO dava a hora UTC:
     tres horas adiantada no Brasil, e "ontem" em cima de mensagem de 23:55 que
     aparecia como 02:55. */
  const hora=(x)=>x?new Date(x).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
  const dia=(x)=>{ if(!x) return ''; const h=new Date(); const d=new Date(x);
    if(d.toDateString()===h.toDateString()) return 'hoje';
    const ontem=new Date(h); ontem.setDate(h.getDate()-1);
    return d.toDateString()===ontem.toDateString()?'ontem':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); };
  const itensTxt=(it)=>{ const g=new Map(); (it||[]).forEach(i=>{ const n=i?.nome||String(i||''); if(n) g.set(n,(g.get(n)||0)+1); });
    return [...g].map(([n,k])=>k>1?`${k}x ${n}`:n).join(' + ')||'pedido'; };

  const item=(c)=>{ const s=situacaoDe(c), S=SITUACAO[s];
    return `<button class="conversa${c.telefone===sel?.telefone?' ativa':''}${s==='aguardando'?' espera':''}" onclick="abrirConversa('${esc(c.telefone)}')">
    ${avatar(c.nome,c.telefone)}
    <div class="cv-corpo">
      <div class="cv-top"><b>${esc(c.nome||contato(c))}</b><small>${dia(c.ultima?.quando)==='hoje'?hora(c.ultima?.quando):dia(c.ultima?.quando)}</small></div>
      <div class="cv-msg">${c.ultima?.direcao==='saida'?'<span class="cv-eu">você: </span>':''}${esc(String(c.ultima?.texto||'').replace(/\n/g,' ').slice(0,80))}</div>
      <div class="cv-tags"><span class="cv-sit ${S.cls}"><i></i>${S.rot}${s==='aguardando'&&c.departamento&&c.departamento!=='humano'?' · '+esc(c.departamento):''}</span>
        ${c.pedido&&c.pedido.estado==='pendente'?`<span class="cv-mini-ped">${reais(c.pedido.valorCentavos)} em aberto</span>`:''}${tierTag(c)}${respTag(c)}</div>
    </div>
  </button>`; };

  /* Mensagem, evento do CRM e a passagem bot -> gente na MESMA linha do tempo.
     E o que evita o cliente contar a historia de novo: quem assume ve o que ele
     disse pro bot e em que momento pediu uma pessoa. */
  const linhaDoTempo=(c)=>{
    const marcos=[];
    if(c.transferidaEm) marcos.push({tipo:'_transferida',quando:c.transferidaEm});
    if(c.assumidaEm) marcos.push({tipo:'_assumida',quando:c.assumidaEm});
    const hist=[...(c.historico||[]),...marcos].sort((a,b)=>String(a.quando||'').localeCompare(String(b.quando||'')));
    let ultimoDia='';
    return hist.map(h=>{
      const d=dia(h.quando); let out='';
      if(d&&d!==ultimoDia){ ultimoDia=d; out+=`<div class="cv-dia"><span>${esc(d)}</span></div>`; }
      if(h.tipo==='interacao') return out+`<div class="bolha ${h.direcao==='saida'?'b-nossa':'b-cliente'}">
        ${h.direcao==='saida'&&h.autor==='atendente'?'<span class="b-autor">equipe</span>':''}
        <div>${esc(h.texto||'').replace(/\n/g,'<br>')}</div><small>${hora(h.quando)}</small></div>`;
      if(h.tipo==='_transferida') return out+`<div class="cv-evento ev-transf">${ico('alerta')}Transferido para humano${c.departamento&&c.departamento!=='humano'?' · '+esc(c.departamento):''} · ${hora(h.quando)}</div>`;
      if(h.tipo==='_assumida') return out+`<div class="cv-evento ev-assum">${ico('crm')}${esc(c.assumidaPor?.nome||'Vendedor')} assumiu a conversa · ${hora(h.quando)}</div>`;
      if(h.tipo==='roteamento'||h.tipo==='responsavel') return out+eventoComercial(h,hora);
      if(h.tipo==='etapa') return out+`<div class="cv-evento">${ico('seta')}etapa: <b>${esc(h.de||'—')}</b> → <b>${esc(h.para||'—')}</b>${h.auto?' · automático':''} · ${hora(h.quando)}</div>`;
      if(h.tipo==='fechado') return out+`<div class="cv-evento">${ico('check')}atendimento fechado${h.motivo?' · '+esc(h.motivo):''} · ${hora(h.quando)}</div>`;
      return out;
    }).join('');
  };

  const ctx=sel&&Object.keys(sel.contexto||{}).length
    ? `<div class="ctx-micaela">${ico('registrar')}<div><b>${esc(nomeBot())} já apurou</b>
        ${Object.entries(sel.contexto).map(([k,v])=>`<span>${esc(k.replace(/_/g,' '))}: <i>${esc(String(v).slice(0,90))}</i></span>`).join('')}
       </div></div>`:'';

  const P={pago:['Pedido concluído','Pago','ok'],pendente:['Pedido em aberto','Pagamento pendente','aberto'],
           'sem-pagamento':['Pedido','Pagar na entrega','aberto'],cancelado:['Pedido cancelado','Pagamento cancelado ou estornado','morto']};
  const pedido=sel?.pedido?(()=>{ const [rot,est,cls]=P[sel.pedido.estado]||P.pendente;
    return `<div class="cv-pedido cp-${cls}"><div><span class="cp-rot">${rot} · <span class="cv-proto">${esc(sel.pedido.referencia)}</span></span>
      <b>${reais(sel.pedido.valorCentavos)}</b><small>${esc(itensTxt(sel.pedido.itens))} · ${est}</small></div></div>`; })():'';

  const cabecalho=head(`${nomeCanal} · Atendimento`,
      cont.agora?`<b>${cont.agora}</b> pessoa(s) esperando você.`:`Ninguém esperando — ${nomeBot()} está dando conta.`,
      `<span class="badge ${botLigado?'b-ok':'b-warn'}" title="${botLigado?'O bot responde sozinho até alguém assumir':'Bot desligado: ninguém recebe resposta automática'}">${ico('bot')}${botLigado?'Bot ativo':'Bot desligado'}</span>`+
      botao({t:'Histórico',ic:'relogio',v:'s',on:`abrirHistorico('${canal}')`,tit:'Atendimentos encerrados, com avaliação e conversa'})+
      (online?botao({t:'Atualizar',ic:'atualizar',v:'s',on:'recarregarAtendimento(true)'})
            :botao({t:`Conectar o ${nomeCanal}`,ic:tg?'telegram':'whats',v:'p',on:irConexao})));

  if(!todas.length){
    return cabecalho+(online?'':`<div class="cv-offline">${ico('alerta')}<span><b>${nomeCanal} desconectado.</b> Ninguém recebe resposta até conectar de novo.</span>
      <button class="t-acao" onclick="${irConexao}">Conectar agora</button></div>`)+painelTranquilo(canal,online);
  }
  const fBt=(id,rot)=>`<button class="${filtro===id?'on':''}" onclick="filtrarConversas('${id}')">${rot}<em>${cont[id]}</em></button>`;
  const sSel=sel?situacaoDe(sel):null;
  return cabecalho+
  (online?'':`<div class="cv-offline">${ico('alerta')}<span><b>${nomeCanal} desconectado.</b> Dá pra ler as conversas, mas nada sai até conectar de novo.</span>
      <button class="t-acao" onclick="${irConexao}">Conectar agora</button></div>`)+
  `<div class="inbox">
    <div class="inbox-lateral">
      <div class="seg seg-sm cv-filtros" role="tablist">${fBt('agora','Precisam de você')}${fBt('vendedor','Com vendedor')}${fBt('bot','Com o bot')}${fBt('todas','Todas')}</div>
      <label class="cv-busca">${ico('busca')}<input id="cvBusca" placeholder="Buscar nome, telefone ou protocolo" value="${esc(BUSCA_CONV)}"
        oninput="buscarConversa(this.value)" autocomplete="off"></label>
      <div class="inbox-lista">${lista.length?lista.map(item).join('')
        :`<p class="vazio-curto" style="padding:14px 6px">${q?`<b>Ninguém com “${esc(BUSCA_CONV)}”.</b>`
          :filtro==='agora'?`<b>Ninguém esperando você.</b><small>${esc(nomeBot())} está dando conta. Quando alguém pedir uma pessoa, aparece aqui.</small>`
          :'<b>Nenhuma conversa neste filtro.</b>'}</p>`}</div>
    </div>
    <div class="inbox-conversa">${sel?`
      <div class="cv-cab">
        ${avatar(sel.nome,sel.telefone,'lg')}
        <div class="cv-cab-t"><b>${esc(sel.nome||contato(sel))}</b><small>${esc(contato(sel))} · ${esc(sel.etapa||'sem etapa')}${sel.protocolo?` · <span class="cv-proto" title="Protocolo deste atendimento — é este número que o cliente tem">${esc(sel.protocolo)}</span>`:''}</small></div>
        <span class="cv-sit ${SITUACAO[sSel].cls}"><i></i>${SITUACAO[sSel].rot}</span>
        <div class="cv-cab-a">
          ${sSel==='com-vendedor'
            ?botao({t:`Devolver pro bot`,ic:'bot',v:'s',sz:'xs',on:`devolverAoBot('${esc(sel.telefone)}')`,tit:`${nomeBot()} volta a responder esta pessoa`})
            :botao({t:'Assumir atendimento',ic:'crm',v:'p',sz:'xs',on:`assumirAtendimento('${esc(sel.telefone)}')`,tit:'O bot para de responder esta pessoa até você devolver'})}
          ${/* Sempre: conversa na lista e atendimento vivo. Se o protocolo fechou
               sozinho por silencio (ou nunca existiu), o servidor abre na hora. */''}
          ${ATEND?.orcamentoLigado?botao({t:'Orçamento',ic:'contrato',v:'s',sz:'xs',on:`abrirOrcamento('${esc(sel.telefone)}')`,tit:'Monta e manda um orçamento nesta conversa — o cliente aprova pelo link'}):''}
          ${botoesFechamento(sel,sSel)}
        </div>
      </div>
      ${pedido}${oportunidadeHtml(sel)}${ctx}
      <div class="conversa-fluxo">${linhaDoTempo(sel)}</div>
      <div class="responder">
        <div class="cv-compor">
          <textarea id="respTexto" rows="1" placeholder="${online?(sSel==='com-vendedor'?'Escreva a resposta…':'Escreva pra assumir e responder…'):`Conecte o ${nomeCanal} para responder`}" ${online?'':'disabled'}
            onkeydown="teclaResposta(event,'${esc(sel.telefone)}')" oninput="crescerResposta(this)"></textarea>
          <button class="cv-enviar" id="btResponder" title="Enviar (Enter)" aria-label="Enviar" ${online?'':'disabled'}
            onclick="responderCliente('${esc(sel.telefone)}')">${ico('enviar')}</button>
        </div>
        <div class="responder-acoes">
          ${online?`<span class="hint cv-dica">${sSel==='com-vendedor'?'':'Ao responder, você assume — o bot para de falar com esta pessoa. · '}<kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> pula linha</span>`:''}
        </div>
      </div>`:''}
    </div>
  </div>`;
}
/* ── Telegram · Atendimento: QUADRO DE FILA ─────────────────────────────────
   Tres colunas — Aguardando vendedor, Com vendedor, Com o bot — pra ver a fila
   de relance. O cartao abre a conversa num painel lateral. Layout proprio do
   Telegram por decisao do dono: nao e o inbox do WhatsApp com outra cor. */
let TG_GAVETA=false;
function abrirCartaoTg(tel){ CONVERSA=tel; TG_GAVETA=true; render();
  setTimeout(()=>{ const f=document.querySelector('.gaveta .conversa-fluxo'); if(f) f.scrollTop=f.scrollHeight; },0); }
function fecharGavetaTg(){ TG_GAVETA=false; render(); }
addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&TG_GAVETA&&rota==='tg-atendimento'&&!document.getElementById('modalBg')?.classList.contains('show')) fecharGavetaTg(); });
function telaFilaTelegram(){
  if(HIST_ON.telegram) return telaHistorico('telegram');
  const BOT=BOT_TG;
  const dados=ATEND||{conversas:[]};
  const todas=(dados.conversas||[]).filter(c=>(c.canal||(ehTg(c.telefone)?'telegram':'whatsapp'))==='telegram');
  const online=TG?.estado==='conectado';
  const botLigado=BOT?.config?.ativo!==false;
  const q=BUSCA_CONV.trim().toLowerCase();
  const achou=(c)=>!q||[c.nome,c.telefone,c.protocolo].some(x=>String(x||'').toLowerCase().includes(q));
  const agoraMs=Date.now();
  const ha=(iso)=>{ if(!iso) return ''; const m=Math.max(0,Math.round((agoraMs-new Date(iso))/60000));
    // "ha menos de 1 min", nao "agora": "Aguardando agora" / "Sem resposta agora" nao se le.
    return m<1?'há menos de 1 min':m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`há ${Math.round(m/1440)} d`; };
  const hora=(x)=>x?new Date(x).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
  const dia=(x)=>{ if(!x) return ''; const h=new Date(); const d=new Date(x);
    if(d.toDateString()===h.toDateString()) return 'hoje';
    const o=new Date(h); o.setDate(h.getDate()-1);
    return d.toDateString()===o.toDateString()?'ontem':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); };
  const itensTxt=(it)=>{ const g=new Map(); (it||[]).forEach(i=>{ const n=i?.nome||String(i||''); if(n) g.set(n,(g.get(n)||0)+1); });
    return [...g].map(([n,k])=>k>1?`${k}x ${n}`:n).join(' + ')||'pedido'; };
  const col={aguardando:[],vendedor:[],bot:[]};
  todas.filter(achou).forEach(c=>{ const s=situacaoDe(c); (s==='aguardando'?col.aguardando:s==='com-vendedor'?col.vendedor:col.bot).push(c); });
  // Quem espera ha mais tempo primeiro; nas outras, a conversa mais recente em cima.
  col.aguardando.sort((a,b)=>String(a.transferidaEm||a.desde||'').localeCompare(String(b.transferidaEm||b.desde||'')));
  const recente=(a,b)=>String(b.ultima?.quando||'').localeCompare(String(a.ultima?.quando||''));
  col.vendedor.sort(recente); col.bot.sort(recente);

  /* O tempo e o que decide quem atender primeiro: quem espera mais ou quem
     ficou sem resposta. A cor esquenta com a espera (5 min ambar, 15 min
     vermelho) — da pra varrer a fila sem ler numero por numero. */
  const minDe=(iso)=>iso?Math.max(0,(agoraMs-new Date(iso))/60000):0;
  const calor=(m)=>m>=15?'quente':m>=5?'morno':'';
  const espera=(c,s)=>{
    if(s==='aguardando'){ const d=c.transferidaEm||c.desde; return {txt:`Aguardando ${ha(d)}`,cls:calor(minDe(d))||'aguarda'}; }
    if(s==='com-vendedor'&&c.ultima?.direcao==='entrada') return {txt:`Sem resposta ${ha(c.ultima.quando)}`,cls:calor(minDe(c.ultima.quando))};
    if(s==='com-vendedor') return {txt:`Respondido ${ha(c.ultima?.quando)}`,cls:''};
    return {txt:`Última mensagem ${ha(c.ultima?.quando)}`,cls:''};
  };
  const cartao=(c)=>{ const s=situacaoDe(c); const e=espera(c,s);
    const ped=c.pedido?(c.pedido.estado==='pago'?`<span class="fc-ped ok">${ico('check')}pedido pago</span>`
      :c.pedido.estado==='pendente'?`<span class="fc-ped aberto">${reais(c.pedido.valorCentavos)} em aberto</span>`:''):'';
    /* div + role, nao <button>: o cartao tem um botao (Assumir) dentro, e botao
       dentro de botao e HTML invalido. */
    return `<div class="fila-card${c.telefone===CONVERSA&&TG_GAVETA?' ativo':''}" role="button" tabindex="0"
        onclick="abrirCartaoTg('${esc(c.telefone)}')" onkeydown="if(event.key==='Enter'&&event.target===this)abrirCartaoTg('${esc(c.telefone)}')">
      <div class="fc-top">${avatar(c.nome,c.telefone)}<div class="fc-t"><b>${esc(c.nome||'Cliente do Telegram')}</b>
        <small>Última mensagem: ${esc(hora(c.ultima?.quando))}</small></div></div>
      <p class="fc-msg">${c.ultima?.direcao==='saida'?`<span class="cv-eu">${c.ultima?.autor==='atendente'?'você':'bot'}: </span>`:''}“${esc(String(c.ultima?.texto||'').replace(/\n/g,' ').slice(0,90))}”</p>
      ${tierTag(c)||respTag(c)?`<div class="fc-q">${tierTag(c)}${respTag(c)}</div>`:''}
      <div class="fc-rodape"><span class="fc-espera ${e.cls}">${ico('relogio')}${esc(e.txt)}</span>${ped}
        ${s==='aguardando'?`<button class="btn btn-p btn-xs fc-assumir" onclick="event.stopPropagation();assumirAtendimento('${esc(c.telefone)}',true)">${ico('crm')}<span>Assumir</span></button>`:''}</div>
    </div>`; };
  const coluna=(id,titulo,cls,lista,vazioTxt)=>`<section class="fila-col ${cls}">
      <header><span class="cv-sit ${cls}"><i></i>${titulo}</span><em>${lista.length}</em></header>
      <div class="fila-cards">${lista.length?lista.map(cartao).join(''):`<p class="fila-vazia">${vazioTxt}</p>`}</div></section>`;

  const semConversa=!todas.length;
  const lembrete=semConversa?`<div class="fila-aviso">${ico('telegram')}<span><b>A fila enche sozinha.</b> Quando alguém escrever para
      ${online?`<a href="${esc(TG.link)}" target="_blank" rel="noopener">${esc(TG.numero)}</a>`:'o seu bot'}, a conversa aparece aqui — primeiro com o bot; se pedir uma pessoa, vai pra <b>Aguardando</b>.</span>
      ${online?`<a class="btn btn-s btn-xs" href="${esc(TG.link)}" target="_blank" rel="noopener">${ico('ver')}<span>Abrir o bot</span></a>`:botao({t:'Conectar o bot',ic:'telegram',v:'p',sz:'xs',on:"ir('tg-canal')"})}</div>`:'';

  const quadro=`<div class="fila">
      ${coluna('aguardando','Aguardando vendedor','sit-aguarda',col.aguardando,semConversa?'Ninguém aqui ainda.':'Ninguém esperando. 👌')}
      ${coluna('vendedor','Com vendedor','sit-vendedor',col.vendedor,'Nenhuma conversa assumida.')}
      ${coluna('bot','Com o bot','sit-bot',col.bot,semConversa?'O bot atende quem chegar.':'Nada com o bot agora.')}
    </div>`;

  // painel lateral com a conversa
  const sel=TG_GAVETA?todas.find(c=>c.telefone===CONVERSA):null;
  let gaveta='';
  if(sel){
    const sSel=situacaoDe(sel);
    const marcos=[]; if(sel.transferidaEm) marcos.push({tipo:'_t',quando:sel.transferidaEm}); if(sel.assumidaEm) marcos.push({tipo:'_a',quando:sel.assumidaEm});
    let ultimoDia='';
    const linha=[...(sel.historico||[]),...marcos].sort((a,b)=>String(a.quando||'').localeCompare(String(b.quando||''))).map(h=>{
      const d=dia(h.quando); let out=''; if(d&&d!==ultimoDia){ ultimoDia=d; out+=`<div class="cv-dia"><span>${esc(d)}</span></div>`; }
      if(h.tipo==='interacao') return out+`<div class="bolha ${h.direcao==='saida'?'b-nossa':'b-cliente'}">${h.direcao==='saida'&&h.autor==='atendente'?'<span class="b-autor">equipe</span>':''}<div>${esc(h.texto||'').replace(/\n/g,'<br>')}</div><small>${hora(h.quando)}</small></div>`;
      if(h.tipo==='_t') return out+`<div class="cv-evento ev-transf">${ico('alerta')}Transferido para humano · ${hora(h.quando)}</div>`;
      if(h.tipo==='_a') return out+`<div class="cv-evento ev-assum">${ico('crm')}${esc(sel.assumidaPor?.nome||'Vendedor')} assumiu a conversa · ${hora(h.quando)}</div>`;
      if(h.tipo==='roteamento'||h.tipo==='responsavel') return out+eventoComercial(h,hora);
      return out; }).join('');
    const P={pago:['Pedido concluído','Pago','ok'],pendente:['Pedido em aberto','Pagamento pendente','aberto'],'sem-pagamento':['Pedido','Pagar na entrega','aberto'],cancelado:['Pedido cancelado','Cancelado ou estornado','morto']};
    const ped=sel.pedido?(()=>{ const [r,e,c]=P[sel.pedido.estado]||P.pendente; return `<div class="cv-pedido cp-${c}"><div><span class="cp-rot">${r} · <span class="cv-proto">${esc(sel.pedido.referencia)}</span></span><b>${reais(sel.pedido.valorCentavos)}</b><small>${esc(itensTxt(sel.pedido.itens))} · ${e}</small></div></div>`; })():'';
    const ctx=Object.keys(sel.contexto||{}).length?`<div class="ctx-micaela">${ico('registrar')}<div><b>${esc(nomeBot())} já apurou</b>${Object.entries(sel.contexto).map(([k,v])=>`<span>${esc(k.replace(/_/g,' '))}: <i>${esc(String(v).slice(0,90))}</i></span>`).join('')}</div></div>`:'';
    gaveta=`<div class="gaveta-bg" onclick="fecharGavetaTg()"></div>
    <!-- div, nao <aside>: o CSS do menu lateral vale pra todo aside e, no celular,
         empurrava o painel pra fora da tela. -->
    <div class="gaveta" role="dialog" aria-label="Conversa com ${esc(sel.nome||'cliente')}">
      <div class="cv-cab">${avatar(sel.nome,sel.telefone,'lg')}
        <div class="cv-cab-t"><b>${esc(sel.nome||'Cliente do Telegram')}</b><small>Telegram · ${esc(sel.etapa||'sem etapa')}${sel.protocolo?` · <span class="cv-proto">${esc(sel.protocolo)}</span>`:''}</small></div>
        <button class="x" onclick="fecharGavetaTg()" aria-label="Fechar conversa">&times;</button></div>
      <div class="gv-acoes"><span class="cv-sit ${SITUACAO[sSel].cls}"><i></i>${SITUACAO[sSel].rot}</span>
        ${sSel==='com-vendedor'?botao({t:'Devolver pro bot',ic:'bot',v:'s',sz:'xs',on:`devolverAoBot('${esc(sel.telefone)}')`})
          :botao({t:'Assumir atendimento',ic:'crm',v:'p',sz:'xs',on:`assumirAtendimento('${esc(sel.telefone)}')`})}
        ${ATEND?.orcamentoLigado?botao({t:'Orçamento',ic:'contrato',v:'s',sz:'xs',on:`abrirOrcamento('${esc(sel.telefone)}')`,tit:'Monta e manda um orçamento nesta conversa — o cliente aprova pelo link'}):''}
        ${botoesFechamento(sel,sSel)}</div>
      ${ped}${oportunidadeHtml(sel)}${ctx}
      <div class="conversa-fluxo">${linha}</div>
      <div class="responder"><div class="cv-compor">
        <textarea id="respTexto" rows="1" placeholder="${online?(sSel==='com-vendedor'?'Escreva a resposta…':'Escreva pra assumir e responder…'):'Conecte o Telegram para responder'}" ${online?'':'disabled'}
          onkeydown="teclaResposta(event,'${esc(sel.telefone)}')" oninput="crescerResposta(this)"></textarea>
        <button class="cv-enviar" id="btResponder" title="Enviar (Enter)" aria-label="Enviar" ${online?'':'disabled'} onclick="responderCliente('${esc(sel.telefone)}')">${ico('enviar')}</button></div>
        ${online&&sSel!=='com-vendedor'?'<p class="hint cv-dica" style="margin-top:6px">Ao responder, você assume — o bot para de falar com esta pessoa.</p>':''}</div>
    </div>`;
  } else if(TG_GAVETA){ TG_GAVETA=false; }

  return head('Telegram · Atendimento',
      col.aguardando.length?`<b>${col.aguardando.length}</b> pessoa(s) esperando você.`:'Quem precisa da sua atenção agora.',
      `<span class="badge ${botLigado?'b-ok':'b-warn'}">${ico('bot')}${botLigado?'Bot ativo':'Bot desligado'}</span>`+
      botao({t:'Histórico',ic:'relogio',v:'s',on:"abrirHistorico('telegram')",tit:'Atendimentos encerrados, com avaliação e conversa'})+
      (online?botao({t:'Atualizar',ic:'atualizar',v:'s',on:'recarregarAtendimento(true)'}):botao({t:'Conectar o Telegram',ic:'telegram',v:'p',on:"ir('tg-canal')"})))+
    (online?'':`<div class="cv-offline">${ico('alerta')}<span><b>Telegram desconectado.</b> Dá pra ler as conversas, mas nada sai até conectar de novo.</span><button class="t-acao" onclick="ir('tg-canal')">Conectar agora</button></div>`)+
    `<div class="fila-resumo" aria-label="Resumo da fila">
      <span class="cv-sit sit-aguarda"><i></i>Aguardando <b>${col.aguardando.length}</b></span>
      <span class="cv-sit sit-vendedor"><i></i>Com vendedor <b>${col.vendedor.length}</b></span>
      <span class="cv-sit sit-bot"><i></i>Com o bot <b>${col.bot.length}</b></span></div>`+
    (semConversa?painelTranquilo('telegram',online):lembrete)+
    (todas.length?`<label class="cv-busca fila-busca">${ico('busca')}<input id="cvBusca" placeholder="Buscar nome ou protocolo" value="${esc(BUSCA_CONV)}" oninput="buscarConversa(this.value)" autocomplete="off"></label>`:'')+
    (semConversa?'':quadro)+gaveta;
}
/* ── Qualificação e roteamento (WhatsApp e Telegram) ─────────────────────────
   A conversa chega ao vendedor como OPORTUNIDADE: o que o cliente quer, o porte,
   a complexidade, quem é o responsável e o próximo passo — sem ele perguntar de
   novo o que o cliente já contou ao bot. Tudo por regras, sem IA. */
let EU=null,QUALI=null,QUALI_ED=null,QUALI_SIM=null,QUALI_TIERS=[];
const Q_INT={comprar:'Comprar',conhecer:'Conhecer',suporte:'Suporte',reclamacao:'Reclamação'};
const Q_PRAZO={imediato:'Imediato','esta-semana':'Esta semana','este-mes':'Este mês','sem-pressa':'Sem pressa'};
const ehVendedor=()=>EU?.papel==='vendedor';
const respTag=(c)=>{ const r=c.comercial?.responsavel; return r?`<span class="q-resp" title="Vendedor responsável">${ico('usuario')}${esc(r.nome)}</span>`:''; };
const tierTag=(c)=>{ const d=c.comercial?.decisao; if(!d) return '';
  return d.tier>=2?`<span class="q-tier t2" title="${esc(d.motivo||'')}">Tier ${d.tier}${d.equipe?' · '+esc(d.equipe):''}</span>`:''; };
function fichaPorte(p={}){ return [p.unidades&&`${p.unidades} unidade(s)`,p.vendedores&&`${p.vendedores} vendedor(es)`,p.funcionarios&&`${p.funcionarios} funcionário(s)`].filter(Boolean).join(', '); }
function fichaHtml(f){
  if(!f) return '<p class="hint">Ainda sem informação comercial.</p>';
  const it=(rot,val)=>`<div class="q-item"><small>${rot}</small><b class="${val?'':'q-nao'}">${val?esc(val):'não informado'}</b></div>`;
  return `<div class="q-ficha">
    ${it('Intenção',Q_INT[f.intencao])}${it('Produto',(f.produtos||[]).join(', '))}
    ${it('Porte',fichaPorte(f.porte))}${it('Complexidade',f.complexidade==='personalizada'?`Personalizada (${(f.sinaisComplexidade||[]).slice(0,3).join(', ')})`:f.complexidade==='padrao'?'Padrão':'')}
    ${it('Prazo',Q_PRAZO[f.prazo])}${it('Necessidade',f.necessidade)}</div>`;
}
/* O cartão da conversa. Colapsável: quem já leu não precisa dele ocupando a tela. */
function oportunidadeHtml(c){
  const k=c.comercial; if(!k||(!k.ficha&&!k.responsavel)) return '';
  const d=k.decisao, r=k.responsavel;
  const ops=(OPERADORES?.operadores||[]).filter(o=>o.ativo!==false);
  const trocar=!ehVendedor()&&ops.length?`<select class="q-sel" aria-label="Trocar o responsável" onchange="trocarResponsavel('${esc(c.telefone)}',this.value)">
      <option value="">${r?'Tirar o responsável':'Definir responsável…'}</option>${ops.map(o=>`<option value="${esc(o.id)}" ${r?.operadorId===o.id?'selected':''}>${esc(o.nome)} · ${esc(o.setor)}</option>`).join('')}</select>`:'';
  /* No celular nasce fechado: aberto, ocupava a tela e o chat sumia. */
  return `<details class="q-card" ${(d?.tier>=2||!ehVendedor())&&innerWidth>700?'open':''}>
    <summary><span class="q-h">${ico('relatorios')}Oportunidade comercial</span>
      ${d?`<span class="q-tier ${d.tier>=2?'t2':'t1'}">${d.tier>=2?`Tier ${d.tier} · ${d.destino==='tier'?'comercial':'equipe'}`:'Tier 1 · bot conduz'}</span>`:''}</summary>
    ${k.resumo?`<p class="q-resumo">${esc(k.resumo)}</p>`:''}
    ${fichaHtml(k.ficha)}
    <div class="q-rodape">
      <div><small>Equipe</small><b>${esc(d?.equipe||(d?.tier>=2?'fila geral':'—'))}</b></div>
      <div><small>Responsável</small><b>${r?esc(r.nome):'ninguém ainda'}</b>${trocar}</div>
      <div><small>Próxima ação</small><b>${esc(d?.proximaAcao||'—')}</b></div>
    </div>
    ${k.faltando?.length?`<p class="hint q-falta">${ico('alerta')}Ainda não sabemos: ${esc(k.faltando.join(', '))}.</p>`:''}
    ${d?.motivo?`<p class="hint">Por quê: ${esc(d.motivo)}.</p>`:''}
  </details>`;
}
/* Eventos novos na linha do tempo: quem decidiu e pra quem foi. */
function eventoComercial(h,hora){
  // Texto num <span> so: o cv-evento e flex, e cada <b> solto virava uma coluna.
  if(h.tipo==='roteamento') return `<div class="cv-evento ev-transf">${ico('seta')}<span>Encaminhado${h.equipe?' para <b>'+esc(h.equipe)+'</b>':''} · ${esc(h.motivo||'')} · ${hora(h.quando)}</span></div>`;
  if(h.tipo==='responsavel') return `<div class="cv-evento ev-assum">${ico('usuario')}<span>Responsável: <b>${esc(h.para||'ninguém')}</b>${h.de?` (antes: ${esc(h.de)})`:''}${h.motivo?' · '+esc(h.motivo):''} · ${hora(h.quando)}</span></div>`;
  return '';
}
async function trocarResponsavel(tel,operadorId){
  try{ await api('atendimentos/responsavel',{telefone:tel,operadorId:operadorId||null}); await recarregarAtendimento(true); flash(operadorId?'Responsável definido.':'Responsável removido.','ok'); }
  catch(e){ avisoErro('Não consegui trocar',esc(e.message)); }
}

/* ── Orçamentos (WhatsApp e Telegram) ─────────────────────────────────────────
   O vendedor monta o orçamento SEM sair da conversa: abre por cima da tela, puxa
   o catálogo, e o cliente recebe PDF + link pra aprovar na mesma conversa. A
   tela "Orçamentos" é a lista de tudo que saiu, com o que foi aprovado. */
let ORC=null, ORC_DIAS=30, ORC_ED=null, ORC_CLI=null, ORC_EM=0;
const ORC_SIT={rascunho:['Rascunho',''],enviado:['Aguardando cliente','b-warn'],aprovado:['Aprovado','b-ok'],recusado:['Recusado','b-err'],vencido:['Vencido','b-err'],cancelado:['Cancelado','']};
const orcCent=(v)=>{ if(v==null||String(v).trim()==='') return 0; let s=String(v).replace(/[R$\s]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=Number(s); return Number.isFinite(n)&&n>=0?Math.round(n*100):NaN; };
const orcNum=(v)=>{ const n=Number(String(v??'').replace(',','.')); return Number.isFinite(n)?n:NaN; };
const orcFmt=(c)=>c==null?'':(c/100).toFixed(2).replace('.',',');
const orcData=(d)=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';

async function carregarOrc(forcar){
  if(ORC&&!forcar) return ORC;
  try{ ORC=await api('orcamentos?dias='+ORC_DIAS); ORC_EM=Date.now(); }catch(e){ ORC={erro:e.message}; }
  if(rota==='orcamentos') render();
  return ORC;
}
function orcSelo(o){ const [t,c]=ORC_SIT[o.situacao]||[o.situacao,'']; return `<span class="badge ${c}" style="margin-left:0">${esc(t)}</span>`; }
/* As ações de um orçamento — as mesmas na lista e na janela da conversa. */
function orcAcoes(o){
  const b=[];
  if(o.situacao==='rascunho') b.push(botao({t:'Editar',ic:'editar',v:'s',sz:'xs',on:`abrirOrcamento('${esc(o.cliente.telefone)}','${esc(o.id)}')`}));
  if(o.situacao==='rascunho') b.push(botao({t:'Enviar',ic:'enviar',v:'p',sz:'xs',on:`orcAcao('enviar','${esc(o.id)}')`}));
  if(o.situacao==='enviado') b.push(botao({t:'Reenviar',ic:'enviar',v:'s',sz:'xs',on:`orcAcao('enviar','${esc(o.id)}')`,tit:'Manda de novo o mesmo orçamento na conversa'}));
  if(o.situacao==='aprovado'&&!o.cobranca) b.push(botao({t:'Cobrar por Pix',ic:'financeiro',v:'p',sz:'xs',on:`orcAcao('cobrar','${esc(o.id)}')`,tit:'Gera o Pix e manda na conversa'}));
  if(o.url) b.push(`<a class="btn btn-s btn-xs" href="${esc(o.url)}" target="_blank" rel="noopener">${ico('ver')}<span>Ver</span></a>`);
  b.push(botao({t:'PDF',ic:'baixar',v:'s',sz:'xs',on:`orcPdf('${esc(o.id)}')`}));
  if(o.situacao!=='rascunho') b.push(botao({t:'Duplicar',ic:'copiar',v:'g',sz:'xs',on:`orcAcao('duplicar','${esc(o.id)}')`,tit:'Novo rascunho com os mesmos itens — é assim que se muda um orçamento já enviado'}));
  if(!['aprovado','cancelado'].includes(o.situacao)) b.push(botao({t:'Cancelar',ic:'fechar',v:'g',sz:'xs',on:`orcAcao('cancelar','${esc(o.id)}')`}));
  return `<div class="orc-acoes">${b.join('')}</div>`;
}
async function orcAcao(acao,id){
  const fazer=async()=>{
    try{
      const r=await api('orcamentos/'+acao,{id});
      if(!r.ok) return avisoErro('Não consegui',esc(r.motivo||'o servidor recusou'));
      if(acao==='enviar') avisoOk('Orçamento enviado',`${esc(r.orcamento.numero)} saiu na conversa${r.pdf?' com o PDF':''}. ${r.pdf?'':'O PDF não foi, mas o link com o orçamento completo foi.'}`);
      if(acao==='cobrar') avisoOk('Pix enviado',`O Pix do ${esc(r.orcamento.numero)} está na conversa. Pagou, o funil fecha como Ganho.`);
      if(acao==='cancelar') flash('Orçamento cancelado.','ok');
      if(acao==='duplicar'){ flash(`Rascunho ${r.orcamento.numero} criado.`,'ok'); await carregarOrc(true); return abrirOrcamento(r.orcamento.cliente.telefone,r.orcamento.id); }
      await carregarOrc(true);
      if(document.getElementById('modalBg').classList.contains('show')&&ORC_CLI) abrirOrcamento(ORC_CLI.telefone);
      if(/atendimento$/.test(rota)) recarregarAtendimento(true);
    }catch(e){ avisoErro('Não consegui',esc(e.message)); }
  };
  if(acao==='cancelar') return confirmar({titulo:'Cancelar orçamento',texto:'O link para de aceitar aprovação.',consequencia:'O cliente continua vendo o orçamento, marcado como cancelado.',rotulo:'Cancelar orçamento',icone:'fechar',aoConfirmar:fazer});
  if(acao==='cobrar') return confirmar({titulo:'Cobrar por Pix',texto:'Gera a cobrança Pix do valor aprovado e manda na conversa do cliente.',rotulo:'Gerar e enviar',icone:'financeiro',perigo:false,aoConfirmar:fazer});
  return fazer();
}
async function orcLigar(v){
  try{
    const r=await api('orcamentos/config',{ligado:v});
    if(!r.ok) return avisoErro('Não consegui',esc(r.motivo||''));
    flash(v?'Orçamento ligado: o botão aparece nas conversas.':'Orçamento desligado.','ok');
    if(ATEND) ATEND.orcamentoLigado=v;
    await carregarOrc(true); renderNav();
  }catch(e){ avisoErro('Não consegui',esc(e.message)); }
}
async function orcPdf(id){
  try{
    const res=await fetch('/crm/api/orcamentos/pdf?id='+encodeURIComponent(id),{headers:TOKEN?{'x-crm-token':TOKEN}:{}});
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.erro||'HTTP '+res.status); }
    const url=URL.createObjectURL(await res.blob()); const a=document.createElement('a');
    a.href=url; a.download=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||'orcamento.pdf'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ avisoErro('Não consegui gerar o PDF',esc(e.message)); }
}

/* A janela: orçamentos anteriores do cliente + o formulário. */

  ORC_ED=ed?{id:ed.id,numero:ed.numero,itens:ed.itens.map(i=>({descricao:i.descricao,quantidade:String(i.quantidade).replace('.',','),preco:orcFmt(i.precoCentavos),sku:i.sku,unidade:i.unidade})),
      desconto:{tipo:ed.desconto?.tipo||'valor',valor:ed.desconto?.tipo==='percentual'?String(ed.desconto.valor).replace('.',','):orcFmt(ed.descontoCentavos)||''},
      frete:ed.freteCentavos?orcFmt(ed.freteCentavos):'',validadeDias:ed.validadeDias||7,condicoes:ed.condicoes||'',observacoes:ed.observacoes||''}
    :{itens:[{descricao:'',quantidade:'1',preco:''}],desconto:{tipo:'valor',valor:''},frete:'',validadeDias:7,condicoes:'',observacoes:''};
  desenharOrcamento();
}
let ORC_CAT=[];
function desenharOrcamento(){
  const e=ORC_ED, outros=(ORC_CLI.lista||[]).filter(o=>o.id!==e.id);
  const ant=outros.length?`<details class="orc-ant"${e.id?'':' open'}><summary>Orçamentos deste cliente (${outros.length})</summary>
      ${outros.slice(0,6).map(o=>`<div class="orc-ant-l"><span class="orc-num">${esc(o.numero)}</span>${orcSelo(o)}<b>${reais(o.totalCentavos)}</b><small>${orcData(o.enviadoEm||o.criadoEm)}</small>${orcAcoes(o)}</div>`).join('')}</details>`:'';

      <td><select onchange="orcItem(${i},'sku',this.value)" aria-label="Produto do item ${i+1}"><option value="">Escolha do catálogo…</option>${ORC_CAT.map(p=>`<option value="${esc(p.sku)}" ${it.sku===p.sku?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></td>
      <td><input class="orc-n" inputmode="decimal" placeholder="Qtd." value="${esc(it.quantidade)}" oninput="orcItem(${i},'quantidade',this.value)" aria-label="Quantidade do item ${i+1}"></td>

  abrirModal(e.id?`Orçamento ${e.numero} · rascunho`:`Novo orçamento · ${ORC_CLI.nome}`,
    !ORC_CAT.length?`${ant}<div class="orc-vazio">${ico('estoque')}<div><b>O catálogo está vazio.</b><p>O orçamento só usa produtos cadastrados no Estoque, com o preço de lá — é o que impede orçar o que a loja não vende.${ehVendedor()?' Peça ao administrador para cadastrar.':''}</p></div></div>`:
    `${ant}<p class="hint orc-regra">Só entram produtos do catálogo da loja, com o preço cadastrado. Pra negociar, use o desconto.</p>
    <div class="tbl-wrap"><table class="tbl orc-itens"><thead><tr><th>Item</th><th class="orc-n">Qtd.</th><th class="orc-n">Valor unit.</th><th class="orc-n">Total</th><th></th></tr></thead>
      <tbody>${e.itens.map(linha).join('')}</tbody></table></div>
    ${botao({t:'Adicionar item',ic:'mais',v:'g',sz:'xs',on:'orcMais()'})}
    <div class="orc-grade">
      <div class="field"><label>Desconto</label><div class="orc-par"><select onchange="ORC_ED.desconto.tipo=this.value;orcRecalc()" aria-label="Tipo de desconto"><option value="valor" ${e.desconto.tipo==='valor'?'selected':''}>R$</option><option value="percentual" ${e.desconto.tipo==='percentual'?'selected':''}>%</option></select>
        <input inputmode="decimal" value="${esc(e.desconto.valor)}" placeholder="0" oninput="ORC_ED.desconto.valor=this.value;orcRecalc()" aria-label="Valor do desconto"></div></div>
      <div class="field"><label>Frete (R$)</label><input inputmode="decimal" value="${esc(e.frete)}" placeholder="0,00" oninput="ORC_ED.frete=this.value;orcRecalc()"></div>
      <div class="field"><label>Validade (dias)</label><input type="number" min="1" max="90" value="${esc(e.validadeDias)}" oninput="ORC_ED.validadeDias=this.value"></div>
    </div>
    <div class="orc-grade orc-grade2">
      <div class="field"><label>Condições <small>(pagamento, prazo, entrega)</small></label><textarea rows="2" maxlength="600" placeholder="Ex.: 50% na aprovação, restante na entrega. Prazo de 5 dias úteis." oninput="ORC_ED.condicoes=this.value">${esc(e.condicoes)}</textarea></div>
      <div class="field"><label>Observações</label><textarea rows="2" maxlength="600" oninput="ORC_ED.observacoes=this.value">${esc(e.observacoes)}</textarea></div>
    </div>
    <div class="orc-tot" id="orcTot"></div>
    <p class="hint" id="orcErro" role="alert"></p>`,
    BT.cancelar('Fechar')+(ORC_CAT.length?botao({t:'Salvar rascunho',ic:'salvar',v:'s',on:'salvarOrcamento(false)'})+botao({t:'Salvar e enviar ao cliente',ic:'enviar',v:'p',on:'salvarOrcamento(true)',id:'orcEnviarBt'}):(ehVendedor()?'':botao({t:'Ir pro Estoque',ic:'estoque',v:'p',on:"fecharModal();ir('estoque')"}))),
    {classe:'modal-orc'});

}
function orcItem(i,k,v){
  const it=ORC_ED.itens[i]; it[k]=v;
  /* Produto do catálogo: nome e preço vêm de lá, sem digitar. */
  if(k==='sku'){ const p=ORC_CAT.find(x=>x.sku===v); it.descricao=p?.nome||''; it.preco=p?orcFmt(p.precoCentavos):''; const el=document.getElementById('orcP'+i); if(el) el.textContent=p?reais(p.precoCentavos):'—'; }
  orcRecalc();
}
function orcMais(){ ORC_ED.itens.push({descricao:'',quantidade:'1',preco:''}); desenharOrcamento(); setTimeout(()=>{ const l=[...document.querySelectorAll('.orc-itens tbody select')].pop(); l?.focus(); },80); }
function orcTirar(i){ ORC_ED.itens.splice(i,1); desenharOrcamento(); }
/* Conta na tela com a MESMA regra do servidor (centavos inteiros) — o que o vendedor vê é o que o cliente recebe. */
function orcRecalc(){
  const e=ORC_ED; let sub=0, erro='';
  e.itens.forEach((it,i)=>{ const q=orcNum(it.quantidade), p=orcCent(it.preco); const t=Number.isFinite(q)&&q>0&&Number.isFinite(p)?Math.round(Math.round(q*1000)/1000*p):NaN;
    const el=document.getElementById('orcT'+i); if(el) el.textContent=it.sku&&Number.isFinite(t)?reais(t):'—'; if(it.sku&&Number.isFinite(t)) sub+=t; else if(!erro&&it.sku) erro=`Confira a quantidade do item ${i+1}.`; });
  const dv=e.desconto.tipo==='percentual'?orcNum(e.desconto.valor||0):orcCent(e.desconto.valor);
  let desc=e.desconto.tipo==='percentual'?(Number.isFinite(dv)&&dv>=0&&dv<=100?Math.round(sub*dv/100):NaN):dv;
  if(!Number.isFinite(desc)){ erro=erro||'Desconto inválido.'; desc=0; } if(desc>sub){ erro=erro||'O desconto é maior que o valor dos itens.'; desc=sub; }
  const fr=orcCent(e.frete); if(!Number.isFinite(fr)) erro=erro||'Frete inválido.';
  const tot=Math.max(0,sub-desc+(Number.isFinite(fr)?fr:0));
  const el=document.getElementById('orcTot');
  if(el) el.innerHTML=`<div><span>Subtotal</span><b>${reais(sub)}</b></div>${desc?`<div><span>Desconto</span><b>− ${reais(desc)}</b></div>`:''}${fr?`<div><span>Frete</span><b>${reais(fr)}</b></div>`:''}<div class="g"><span>Total</span><b>${reais(tot)}</b></div>`;
  const er=document.getElementById('orcErro'); if(er) er.textContent=erro;
}
async function salvarOrcamento(enviar){
  const e=ORC_ED;
  const itens=e.itens.filter(it=>it.sku).map(it=>({sku:it.sku,quantidade:it.quantidade,unidade:it.unidade||null}));
  try{
    const r=await api('orcamentos/salvar',{id:e.id||undefined,cliente:{telefone:ORC_CLI.telefone,nome:ORC_CLI.nome},itens,desconto:e.desconto,frete:e.frete,
      validadeDias:Number(e.validadeDias),condicoes:e.condicoes,observacoes:e.observacoes});
    if(!r.ok){ const er=document.getElementById('orcErro'); if(er) er.textContent=r.motivo; return; }
    e.id=r.orcamento.id; e.numero=r.orcamento.numero;
    if(!enviar){ flash(`Rascunho ${r.orcamento.numero} salvo.`,'ok'); fecharModal(); await carregarOrc(true); return; }
    const s=await api('orcamentos/enviar',{id:r.orcamento.id});
    if(!s.ok){ const er=document.getElementById('orcErro'); if(er) er.textContent=`Salvei o rascunho ${r.orcamento.numero}, mas não enviei: ${s.motivo}`; return; }
    fecharModal();
    avisoOk('Orçamento enviado',`${esc(s.orcamento.numero)} (${reais(s.orcamento.totalCentavos)}) saiu na conversa${s.pdf?' com o PDF':''}. O cliente aprova pelo link.`);
    await carregarOrc(true); if(/atendimento$/.test(rota)) recarregarAtendimento(true);
  }catch(err){ const er=document.getElementById('orcErro'); if(er) er.textContent=err.message; }
}

  const periodo=`<div class="seg seg-sm">${[7,30,90].map(d=>`<button class="${ORC_DIAS===d?'on':''}" onclick="ORC_DIAS=${d};carregarOrc(true)">${d} dias</button>`).join('')}</div>`;
  const lista=o.orcamentos||[];

      <td>${orcSelo(x)}${x.cobranca?`<small class="orc-sub">Pix enviado</small>`:''}${x.situacao==='recusado'&&x.motivoRecusa?`<small class="orc-sub">"${esc(x.motivoRecusa)}"</small>`:''}</td>
      <td>${x.validoAte?orcData(x.validoAte):'—'}</td>

      ${audKpi('Taxa de aprovação',r.taxaAprovacao==null?'—':r.taxaAprovacao+'%','sobre os que o cliente já decidiu')}

/* ── Prospecção de clientes ────────────────────────────────────────────────────
   Não é campanha (vitrine com link): é o vendedor indo atrás do cliente, região
   por região. Pode ter resposta ou não — e quando não tem, a tela manda TROCAR a
   abordagem em vez de insistir. Em cima fica o plano aprovado: é o lastro da
   decisão de ir pro interior. */
let PROSP=null, PROSP_REG='', PROSP_Q='', PROSP_ET_F='', PROSP_PAG=1, PROSP_TAM=10;
const PROSP_SIT={lista:['Lista pronta','b-warn'],'nao-iniciada':['Não iniciada',''],andamento:['Em andamento','b-ok'],trocar:['Trocar abordagem','b-err']};
const PROSP_ET={'na-lista':'',contatado:'b-warn',respondeu:'b-ok',demonstracao:'b-ok',cliente:'b-ok','sem-resposta':'b-err','nao-quer':''};
async function carregarProsp(forcar){
  if(PROSP&&!forcar) return PROSP;
  try{ PROSP=await api('prospeccao?'+new URLSearchParams({regiao:PROSP_REG,busca:PROSP_Q,etapa:PROSP_ET_F,pagina:PROSP_PAG,limite:PROSP_TAM})); }catch(e){ PROSP={erro:e.message}; }
  if(rota==='prospeccao') render();
  return PROSP;
}
const prospData=(d)=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
function telaProspeccao(){

    `<div class="card"><p class="hint" style="padding:16px">Nenhum plano de prospecção ainda.${ehVendedor()?' Peça ao administrador para criar.':''}</p></div>`;
  const pct=pl.duracaoDias?Math.round(pl.diaAtual/pl.duracaoDias*100):0;

      <small>Funil, resultado por região e abordagem, quem fechou e quem ainda pode fechar. Sai em PDF.</small></div>${botao({t:'Ver balanço',ic:'ver',v:'p',sz:'s',on:"ir('prosp-balanco')"})}</div>`:'')+
    `<div class="prosp-aprov">${ico('check')}<div><b>${pl.aprovacao?`Aprovado por ${esc(pl.aprovacao.por)}`:'Plano ainda sem aprovação'}</b>
      <small>${pl.aprovacao?`em ${prospData(pl.aprovacao.em)}`:''}</small></div></div>
    <div class="prosp-plano">
      <div class="prosp-prop"><small>Propósito</small><p>${esc(pl.proposito)}</p></div>
      <div class="aud-kpis prosp-kpis">
        ${audKpi('Duração',`dia ${pl.diaAtual} de ${pl.duracaoDias}`,`${prospData(pl.inicio)} → ${prospData(pl.fim)}<span class="prosp-barra"><i style="width:${pct}%"></i></span>`)}
        ${audKpi('Meta',`${pl.clientes} de ${pl.meta}`,'clientes pagantes no período')}
        ${audKpi('A contatar',String(t.naLista),'empresas da base pública que ainda não receberam mensagem')}

        ${audKpi('Tocar hoje',String(t.tocarHoje),'contatos com toque vencido')}
      </div></div>`;
  const regs=p.regioes.map(r=>{ const [st,cl]=PROSP_SIT[r.situacao]||['',''];
    const tent=(r.tentadas||[]).filter(x=>x.ate).map(x=>p.abordagens[x.abordagem]).join(' · ');
    return `<tr class="${r.trocar?'prosp-alerta':''}">
      <td><b>${esc(r.nome)}</b><small class="orc-sub">${esc(r.cidades||'')}</small></td>
      <td>${esc(r.uf)}</td>
      <td>${esc(p.abordagens[r.abordagem]||r.abordagem)}${tent?`<small class="orc-sub">já tentado: ${esc(tent)}</small>`:''}</td>
      <td class="orc-n">${r.naLista}</td><td class="orc-n">${r.contatos}</td><td class="orc-n">${r.responderam}</td><td class="orc-n">${r.demonstracoes}</td><td class="orc-n"><b>${r.clientes}</b></td>
      <td><span class="badge ${cl}" style="margin-left:0">${st}</span>${r.trocar?`<small class="orc-sub">${r.naAbordagem.semResposta} sem resposta e ninguém respondeu nesta abordagem</small>`:''}</td>
      <td>${ehVendedor()?'':botao({t:r.trocar&&r.sugestao?`Trocar p/ ${p.abordagens[r.sugestao].split(' (')[0]}`:'Trocar abordagem',ic:'atualizar',v:r.trocar?'p':'g',sz:'xs',on:`prospTrocar('${esc(r.id)}')`})}</td></tr>`; }).join('');
  const lista=p.contatos;

  const prox=(c)=>c.etapa==='na-lista'?(c.email?'<small>1ª mensagem automática por e-mail <span class="prosp-pend">envio ainda não ligado</span></small>':'<small>sem e-mail — ligar</small>'):!c.proximo?'—':c.proximo.esgotado?'<span class="prosp-esg">cadência acabou — sem resposta?</span>':`${prospData(c.proximo.quando)}<small class="orc-sub">${esc(c.proximo.oque||'')}</small>${c.proximo.vencido?' <b class="prosp-hoje">vencido</b>':''}`;

  /* Regra do dono (28/09): 1ª e 2ª mensagem são AUTOMÁTICAS (e-mail) — nessas etapas

  const tel=(c)=>{ const n=String(c.whatsapp||c.telefone||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,''); return n.length>=10?n:''; };
  const vezDeGente=(c)=>!c.optout&&((c.etapa==='contatado'&&c.toques>=2&&c.proximo?.vencido)||['respondeu','demonstracao'].includes(c.etapa));
  const acoes=(c)=>{ const out=[]; const n=tel(c); const gente=vezDeGente(c);

        ${(c.alertas||[]).map(a=>`<small class="orc-sub prosp-aviso">${ico('alerta')}${esc(a)}</small>`).join('')}</td>

function prospPagina(d){ PROSP_PAG=Math.max(1,Math.min(PROSP?.paginas||1,PROSP_PAG+d)); carregarProsp(true).then(()=>document.querySelector('.prosp-cts')?.scrollIntoView({behavior:'smooth',block:'start'})); }
/* Ligar: o telefone abre; a tela só anota a ligação de quem já está na cadência (o
   dia 10 é o contato de gente). Quem está na lista continua esperando o automático. */
function prospLigou(id){ const c=PROSP?.contatos.find(x=>x.id===id); if(c&&c.etapa==='contatado'&&c.toques>=2) setTimeout(()=>prospMover(id,'toque'),400); }
/* De onde vieram as empresas: um chip por fonte, com o site oficial. Os chips quebram
   linha e cortam o texto com reticências — com 1 ou com 10 fontes a tela não estoura.
   Passou de 3, as outras ficam no "+N" (lista completa no title). */
function prospFontes(fs){
  if(!fs?.length) return '';
  const chip=(f)=>`<span class="prosp-fch" title="${esc(f.texto)} — ${f.n.toLocaleString('pt-BR')} empresa(s)">
      <span class="prosp-fch-t">${esc(f.texto)}</span><b>${f.n.toLocaleString('pt-BR')}</b>
      ${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">site ↗</a>`:''}${f.arquivos?`<a href="${esc(f.arquivos)}" target="_blank" rel="noopener noreferrer">arquivos ↗</a>`:''}</span>`;
  const vis=fs.slice(0,3), resto=fs.slice(3);
  return `<div class="prosp-fontes"><small>Fonte${fs.length>1?'s':''}:</small>${vis.map(chip).join('')}${resto.length?`<span class="prosp-fch prosp-fch-mais" title="${esc(resto.map(f=>f.texto).join('\n'))}">+${resto.length}</span>`:''}</div>`;
}
/* Na linha, só o nome curto com o link — o texto inteiro fica no title. */
function prospFonteLinha(txt,fs){
  const f=(fs||[]).find(x=>x.texto===txt);
  return `<small class="orc-sub prosp-fonte" title="${esc(txt)}">fonte: ${f?.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.nome)} ↗</a>`:esc(txt)}</small>`;
}
async function prospMover(id,etapa,extra={}){
  try{ const r=await api('prospeccao/mover',{id,etapa,...extra}); if(!r.ok) return avisoErro('Não consegui',esc(r.motivo||''));
    flash(extra.canal==='whatsapp'?'Envio registrado no histórico.':etapa==='toque'||etapa==='contatado'?'Toque registrado.':etapa==='saiu'?'Contato apagado e número bloqueado.':'Registrado.','ok'); await carregarProsp(true); }
  catch(e){ avisoErro('Não consegui',esc(e.message)); }
}

let PBAL=null;
async function carregarProspBalanco(){
  try{ PBAL=await api('prospeccao/balanco'); }catch(e){ PBAL={erro:e.message}; }
  if(rota==='prosp-balanco') render();

  const nomes=(tit,l,vazio)=>`<div class="card" style="margin-bottom:14px">${cardH('usuario',`${tit} · ${l.length}`,'',1)}${l.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Empresa</th><th>Região</th><th>Situação</th><th>Desde</th><th>Quem abordou</th></tr></thead><tbody>${
    l.map(c=>`<tr><td><b>${esc(c.nome)}</b><small class="orc-sub">${esc([c.cidade,c.segmento].filter(Boolean).join(' · '))}</small></td><td>${esc(c.regiao)}</td><td>${esc(c.etapa)}</td><td>${prospData(c.desde)}</td><td>${esc(c.por||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<p class="hint" style="padding:12px 16px">${vazio}</p>`}</div>`;
  const eMax=Math.max(1,...b.enviosPorDia.map(e=>e.n));
  return head('Balanço da prospecção',`${esc(pl.nome)} · ${prospData(pl.inicio)} → ${prospData(pl.fim)} ${selo}`,acts)+
    `<div class="viz"><div class="aud-kpis prosp-kpis prosp-bal-kpis">
      ${audKpi('Contatados',String(b.contatados),`de ${b.base} empresas na base`)}
      ${audKpi('Responderam',String(b.responderam),`taxa de resposta ${pctT(b.taxaResposta)}`)}
      ${audKpi('Podem fechar',String(b.emConversa),'responderam e estão em conversa')}
      ${audKpi('Fecharam',String(b.fechados),`meta ${pl.meta} · ${pctT(b.taxaFechamento)} dos contatados`)}
    </div>
    <div class="prosp-bal-g">
      <div class="card">${cardH('crm','Funil','Quanto de quem recebeu mensagem chegou em cada passo.',1)}${funil}</div>
      <div class="card">${cardH('relogio','Onde o resto está','',5)}
        ${audBarrasH([['Aguardando retorno',b.aguardando],['Sem resposta',b.semResposta],['Sem interesse',b.semInteresse],['Pediram pra sair',b.pediramSair],['Não contatados',b.naoContatados]].map(([rot,n])=>({rot,n})),Math.max(1,b.aguardando,b.semResposta,b.semInteresse,b.pediramSair,b.naoContatados))}</div>
    </div>

}
async function prospBalancoPdf(){
  try{
    const res=await fetch('/crm/api/prospeccao/balanco/pdf',{headers:TOKEN?{'x-crm-token':TOKEN}:{}});
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.erro||'HTTP '+res.status); }
    const url=URL.createObjectURL(await res.blob()); const a=document.createElement('a');
    a.href=url; a.download=(res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||'balanco-prospeccao.pdf'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ avisoErro('Não consegui gerar o PDF',esc(e.message)); }
}

/* ── tela: Qualificação e equipes ── */
async function carregarQuali(forcar){
  if(QUALI&&!forcar) return QUALI;
  try{ QUALI=await apiCru('qualificacao'); QUALI_ED=QUALI.matriz.map(r=>({...r})); QUALI_TIERS=(QUALI.tiers||[]).map(t=>({...t})); }catch(e){ QUALI={erro:e.message}; }
  if(rota==='qualificacao') render();
  return QUALI;
}
function telaQualificacao(){
  const q=QUALI; if(!q){ setTimeout(()=>carregarQuali(),0); return head('Qualificação e equipes','Carregando…'); }
  if(q.erro) return head('Qualificação e equipes','')+`<p class="hint">Não consegui carregar: ${esc(q.erro)}</p>`;
  const equipes=Object.keys(q.equipes||{}).sort();

          <span>→</span><select onchange="qSet(${i},'destino',this.value,true)">${Object.entries(q.destinos).map(([k,v])=>`<option value="${k}" ${r.destino===k?'selected':''}>${v}</option>`).join('')}</select>

          ${r.destino==='tier'?`<select onchange="qSet(${i},'tier',Number(this.value),true)">${QUALI_TIERS.map(t=>`<option value="${t.n}" ${Number(r.tier)===t.n?'selected':''}>Tier ${t.n} · ${esc(t.nome)}</option>`).join('')}</select>`:''}</div>

        ${sem?`<p class="hint" style="color:var(--warn);margin-top:4px">${ico('alerta')} Ninguém ativo na equipe “${esc(r.equipe)}” — a regra é pulada até alguém ser cadastrado nela.</p>`:''}
      </div>
      <div class="acoes">${bi('ant','Subir',`qMover(${i},-1)`)}${bi('prox','Descer',`qMover(${i},1)`)}${bi('excluir','Remover regra',`qRemover(${i})`,'dan')}</div></div>`; };
  const ops=q.operadores||[];
  const sim=QUALI_SIM;
  return head('Qualificação e equipes','O bot lê a conversa, preenche a ficha do cliente e decide — por regras suas, sem IA — se ele mesmo vende ou se passa para a equipe certa.')+
  `<div class="card" style="margin-bottom:16px">

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${botao({t:'Nova regra',ic:'mais',v:'s',sz:'xs',on:'qNova()'})}${botao({t:'Voltar ao padrão',ic:'atualizar',v:'g',sz:'xs',on:'qPadrao()'})}</div>

    <div class="field" style="margin-top:12px"><label>Mensagem ao transferir <small>({equipe} e {vendedor} viram o nome)</small></label>

        ${i===QUALI_TIERS.length-1&&QUALI_TIERS.length>1?bi('excluir','Remover este tier','qTirarTier()','dan'):''}</div>`).join('')}
    </div>
    ${QUALI_TIERS.length<(q.tierMax-q.tierMin+1)?`<div style="margin-top:10px">${botao({t:'Novo tier',ic:'mais',v:'s',sz:'xs',on:'qNovoTier()'})}</div>`:''}
    <div class="field" style="margin-top:14px"><label class="q-check"><input type="checkbox" id="qPergAtivo" ${q.perguntar?.ativo!==false?'checked':''}> O bot pergunta o porte quando faltar dado para decidir</label>

    <div style="margin-top:8px">${botao({t:'Salvar tiers e pergunta',ic:'salvar',v:'p',sz:'xs',on:'qSalvar()'})}</div>

    <textarea id="qSimTxt" rows="3" placeholder="Tenho 35 vendedores, três lojas e preciso integrar o CRM ao meu ERP.">${esc(sim?.texto||'')}</textarea>
    <div style="margin-top:8px">${botao({t:'Testar',ic:'testar',v:'s',on:'qSimular()'})}</div>

      ${sim.r.decisao.pergunta?`<p class="hint" style="margin-top:6px">${ico('alerta')} Falta dado para decidir — o bot vai perguntar: <i>“${esc(sim.r.decisao.pergunta)}”</i></p>`:''}
      <p class="q-resumo">${esc(sim.r.resumo)}</p>${fichaHtml(sim.r.ficha)}
      <p class="hint">Por quê: ${esc(sim.r.decisao.motivo)} · Próxima ação: ${esc(sim.r.decisao.proximaAcao)}${sim.r.faltando.length?` · Falta saber: ${esc(sim.r.faltando.join(', '))}`:''}</p></div>`:''}
  </div>
  <div class="card" style="margin-bottom:16px">

      ${ops.map(o=>`<tr${o.ativo===false?' style="opacity:.55"':''}><td><b>${esc(o.nome)}</b>${o.ativo===false?' <small>(desativado)</small>':''}</td><td><code>${esc(o.setor)}</code>${o.comercial?` <span class="q-tier t2" style="margin-left:4px">Tier ${esc(o.tier||2)}</span>`:''}</td>
        <td>${o.acesso?`<span class="badge b-ok" style="margin:0">${esc(o.acesso.email)}</span><small style="display:block;color:var(--dim);margin-top:3px">${o.acesso.ultimoLogin?'último acesso '+new Date(o.acesso.ultimoLogin).toLocaleString('pt-BR'):'ainda não entrou'}</small>`:'<span class="hint">sem acesso</span>'}</td>

          :o.ativo===false?'':botao({t:'Dar acesso',ic:'entrar',v:'s',sz:'xs',on:`qAcesso('${esc(o.id)}')`})}</td></tr>`).join('')}
      </tbody></table></div>`:`<p class="hint">Nenhum operador ainda. Cadastre em <a href="#canais" onclick="ir('canais');return false">WhatsApp → Canal e conexão → Operadores</a> — o setor vira a equipe.</p>`}
  </div>`;
}
function qSet(i,k,v,redesenhar){ QUALI_ED[i]={...QUALI_ED[i],[k]:v};
  if(k==='destino'&&v==='tier'&&!QUALI_ED[i].tier) QUALI_ED[i].tier=QUALI_TIERS[0]?.n||2;
  if(k==='condicao'){ const c=v; QUALI_ED[i].valor=c==='intencao'?'reclamacao':/^porte/.test(c)?3:c==='temResponsavel'||c==='complexidade'?undefined:''; if(c==='temResponsavel') QUALI_ED[i].destino='responsavel'; }
  if(redesenhar) render(); }
function qNovoTier(){ const n=(QUALI_TIERS.at(-1)?.n||1)+1; QUALI_TIERS.push({n,nome:`Tier ${n}`}); render(); }
function qTirarTier(){ const t=QUALI_TIERS.at(-1); if(QUALI_ED.some(r=>r.destino==='tier'&&Number(r.tier)===t.n)) return avisoErro('Tier em uso',`Há regra mandando para o Tier ${t.n}. Troque o destino dela antes de remover.`); QUALI_TIERS.pop(); render(); }
function qMover(i,d){ const j=i+d; if(j<0||j>=QUALI_ED.length) return; [QUALI_ED[i],QUALI_ED[j]]=[QUALI_ED[j],QUALI_ED[i]]; render(); }
function qRemover(i){ QUALI_ED.splice(i,1); render(); }
function qNova(){ QUALI_ED.push({ativa:true,nome:'Nova regra',condicao:'termo',valor:'',destino:'equipe',equipe:''}); render(); }
function qPadrao(){ confirmar({titulo:'Voltar às regras padrão?',texto:'As regras que você mudou somem e voltam as do Bolso Cheio. Só vale depois de salvar.',rotulo:'Voltar ao padrão',icone:'atualizar',perigo:false,
  aoConfirmar:async()=>{ const r=await api('qualificacao/salvar',{matriz:null}).catch(()=>null); await carregarQuali(true); }}); }
async function qSalvar(){
  try{ const r=await api('qualificacao/salvar',{matriz:QUALI_ED,mensagemTransferencia:document.getElementById('qMsg')?.value,tiers:QUALI_TIERS,
      perguntar:{ativo:document.getElementById('qPergAtivo')?.checked!==false,texto:document.getElementById('qPergTxt')?.value}}); QUALI=null; await carregarQuali(true); flash('Salvo — já vale na próxima mensagem.','ok'); }
  catch(e){ avisoErro('Não salvei as regras',esc(e.message)); }
}
async function qSimular(){
  const texto=document.getElementById('qSimTxt')?.value||''; const mensagens=texto.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!mensagens.length) return avisoErro('Escreva uma mensagem','Ex.: “Tenho 3 lojas e preciso integrar com o meu ERP”.');
  try{ const r=await api('qualificacao/simular',{mensagens,matriz:QUALI_ED}); QUALI_SIM={texto,r}; render(); }
  catch(e){ avisoErro('O teste não rodou',esc(e.message)); }
}
function qAcesso(id){
  const o=(QUALI?.operadores||[]).find(x=>x.id===id); if(!o) return;
  abrirModal(`Acesso de ${o.nome}`,
    `<p class="hint" style="margin-bottom:12px">${esc(o.nome)} entra com este e-mail e a senha inicial — e troca a senha depois, em <b>Trocar senha</b>. Vê só o Atendimento.</p>
     <div class="form-grid"><div class="field"><label>E-mail</label><input id="qaMail" value="${esc(o.acesso?.email||o.email||'')}" placeholder="vendedor@empresa.com.br"></div>

const GRUPOS_VENDEDOR=[{secao:'Atendimento',itens:[{id:'wa-atendimento',nome:'WhatsApp',icone:'whats'},{id:'tg-atendimento',nome:'Telegram',icone:'telegram'},{id:'orcamentos',nome:'Orçamentos',icone:'contrato'},{id:'prospeccao',nome:'Prospecção',icone:'usuario'}]}];
async function carregarVendedor(eu){
  EU=eu;
  try{ ATEND=await api('atendimentos'); CANAIS=ATEND?.canal||null; TG=await api('canais/telegram').catch(()=>null); }

  if(!['wa-atendimento','tg-atendimento','orcamentos','prospeccao'].includes(rota)) rota=(ATEND?.conversas||[]).some(c=>c.canal==='telegram')&&!(ATEND?.conversas||[]).some(c=>c.canal==='whatsapp')?'tg-atendimento':'wa-atendimento';

/* ── Histórico de atendimentos (WhatsApp e Telegram) ─────────────────────────
   Encerrado sai da fila e vem pra cá: quem atendeu, quem encerrou (cliente,
   atendente ou silêncio), quanto durou, a nota — e a conversa inteira, pra
   auditar depois. O vendedor vê só os dele (o servidor filtra). */
let HIST_ON={whatsapp:false,telegram:false},HIST={},HIST_DIAS=30,HIST_F='todos',HIST_Q='';
const ENC_POR={cliente:'Cliente',atendente:'Atendente',inatividade:'Inatividade',moderacao:'Moderação'};
const DESF={finalizado:['Finalizado','b-ok'],encerrado:['Encerrado','b-warn'],inatividade:['Por silêncio',''],moderacao:['Moderação','b-err']};
function abrirHistorico(canal){ HIST_ON[canal]=true; TG_GAVETA=false; carregarHistorico(canal,true); render(); }
function fecharHistorico(canal){ HIST_ON[canal]=false; render(); }
async function carregarHistorico(canal,forcar){
  const k=canal+':'+HIST_DIAS; if(HIST[k]&&!forcar) return;
  try{ HIST[k]=await apiCru(`atendimentos/historico?canal=${canal}&dias=${HIST_DIAS}`); }catch(e){ HIST[k]={erro:e.message,atendimentos:[]}; }
  if(HIST_ON[canal]) render();
}
const estrelas=(n)=>n==null?'':`<span class="h-estrelas" title="nota ${n} de 5">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></span>`;
const duracaoTxt=(m)=>m<1?'menos de 1 min':m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60?m%60+' min':''}`.trim();
function telaHistorico(canal){
  const k=canal+':'+HIST_DIAS, d=HIST[k]; if(!d) setTimeout(()=>carregarHistorico(canal),0);
  const nomeCanal=canal==='telegram'?'Telegram':'WhatsApp';
  const q=HIST_Q.trim().toLowerCase();
  const passa=(a)=>(HIST_F==='todos'||(HIST_F==='gente'&&a.comGente)||(HIST_F==='avaliados'&&a.avaliacao?.nota!=null)||(HIST_F==='baixa'&&a.avaliacao?.nota!=null&&a.avaliacao.nota<=3)||(HIST_F===a.desfecho)||(HIST_F==='cliente'&&a.encerradoPor?.tipo==='cliente'))
    &&(!q||[a.nome,a.numero,a.telefone,a.atendidoPor?.nome].some(x=>String(x||'').toLowerCase().includes(q)));
  const lista=(d?.atendimentos||[]).filter(passa);
  const s=d?.resumo||{};
  const kpi=(t,v,sub)=>`<div class="h-kpi"><small>${t}</small><b>${v}</b>${sub?`<span>${sub}</span>`:''}</div>`;
  const fBt=(id,rot)=>`<button class="${HIST_F===id?'on':''}" onclick="HIST_F='${id}';render()">${rot}</button>`;
  const periodo=`<div class="seg seg-sm">${[1,7,30,90].map(x=>`<button class="${HIST_DIAS===x?'on':''}" onclick="HIST_DIAS=${x};carregarHistorico('${canal}');render()">${x===1?'hoje':x+' dias'}</button>`).join('')}</div>`;
  const linha=(a)=>`<tr class="cp-linha" tabindex="0" onclick="abrirAtendimentoHist('${esc(a.numero)}')" onkeydown="if(event.key==='Enter')abrirAtendimentoHist('${esc(a.numero)}')">
      <td><b>${esc(a.nome||(canal==='telegram'?'Cliente do Telegram':'+'+a.telefone))}</b><small style="display:block;color:var(--dim)"><span class="cv-proto">${esc(a.numero)}</span></small></td>
      <td>${new Date(a.encerradoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}<small style="display:block;color:var(--dim)">${duracaoTxt(a.duracaoMin)}</small></td>
      <td>${esc(a.atendidoPor?.nome||(a.comGente?'equipe':'só o bot'))}${a.equipe?`<small style="display:block;color:var(--dim)">${esc(a.equipe)}</small>`:''}</td>
      <td><span class="badge ${(DESF[a.desfecho]||[])[1]||''}" style="margin:0">${esc((DESF[a.desfecho]||[a.desfecho||'—'])[0])}</span>
        <small style="display:block;color:var(--dim)">${a.desfecho==='inatividade'?'sistema':esc((a.encerradoPor?.tipo==='cliente'?'pelo cliente':a.encerradoPor?.nome?'por '+a.encerradoPor.nome:'')||'')}</small>
        ${a.motivoTexto?`<small class="h-motivo" title="${esc(a.motivoTexto)}">${esc(a.motivoTexto)}</small>`:''}</td>
      <td>${a.avaliacao?.nota!=null?estrelas(a.avaliacao.nota)+(a.avaliacao.comentario?` <span title="${esc(a.avaliacao.comentario)}">💬</span>`:''):`<span class="hint">${a.avaliacao?(a.avaliacao.estado==='aguardando'?'esperando nota':'não avaliou'):'—'}</span>`}</td>
      <td class="num">${a.mensagens}</td></tr>`;
  return head(`${nomeCanal} · Histórico de atendimentos`,'Atendimentos encerrados — pelo cliente, pelo atendente ou por silêncio. Clique para ver a conversa inteira.',
      botao({t:'Voltar para a fila',ic:'ant',v:'s',on:`fecharHistorico('${canal}')`}))+
  `${d&&!d.erro?`<div class="h-kpis">${kpi('Encerrados',d.total,`${s.comGente||0} com gente`)}${kpi('Nota média',s.media!=null?String(s.media).replace('.',',')+' / 5':'—',`${s.avaliados||0} de ${s.pedidas||0} avaliaram`)}
      ${kpi('Finalizados',s.finalizados||0,`${s.porCliente||0} pelo próprio cliente`)}${kpi('Encerrados à força',s.encerradosAForca||0,'com motivo')}${kpi('Por silêncio',s.porInatividade||0)}</div>`:''}
  <div class="card">

  if(HOJE[canal]&&Date.now()-HOJE[canal].em<60000) return;
  HOJE[canal]={em:Date.now(),r:HOJE[canal]?.r||null};
  try{ HOJE[canal]={em:Date.now(),r:await apiCru(`atendimentos/historico?canal=${canal}&dias=1`)}; }catch{ /* resumo do dia e enfeite */ }
  if(rota===(canal==='telegram'?'tg-atendimento':'wa-atendimento')) render();
}

/* Atualiza SO a caixa de conversas, sem perder o que o vendedor esta digitando
   nem o ponto em que ele parou de ler. */
async function recarregarAtendimento(forcar){
  const novo=await apiCru('atendimentos').catch(()=>null); if(!novo) return;
  const sig=(d)=>(d?.conversas||[]).map(c=>[c.telefone,c.situacao,c.mensagens,c.pedido?.estado,c.ultima?.quando,c.comercial?.responsavel?.operadorId,c.comercial?.decisao?.tier,c.aguardandoFinal].join(':')).join('|');
  if(!forcar&&sig(novo)===sig(ATEND)) return;
  const campo=document.getElementById('respTexto'), busca=document.getElementById('cvBusca');
  const texto=campo?.value||'', ini=campo?.selectionStart, fim=campo?.selectionEnd, foco=document.activeElement?.id;
  const fl=document.querySelector('.conversa-fluxo');
  const noFim=!fl||fl.scrollHeight-fl.scrollTop-fl.clientHeight<80, topo=fl?.scrollTop;
  ATEND=novo; if(ehVendedor()) CANAIS=novo.canal||CANAIS; render();
  const c2=document.getElementById('respTexto');
  if(c2&&texto){ c2.value=texto; crescerResposta(c2); if(foco==='respTexto'){ c2.focus(); try{ c2.setSelectionRange(ini,fim); }catch{} } }
  if(foco==='cvBusca'){ const b=document.getElementById('cvBusca'); b?.focus(); b?.setSelectionRange(b.value.length,b.value.length); }
  const fl2=document.querySelector('.conversa-fluxo'); if(fl2&&!noFim) fl2.scrollTop=topo;
}

function renderNav(){
  document.getElementById('nav').innerHTML=(ehVendedor()?GRUPOS_VENDEDOR:GRUPOS).map(g=>({...g,itens:g.itens.filter(i=>i.id!=='orcamentos'||ATEND?.orcamentoLigado)})).map(g=>
   `<div class="sec-label">${esc(g.secao)}</div>`+g.itens.map(m=>{
    if(!m.filhos) return `<button class="nav-item${rota===m.id?' active':''}" onclick="ir('${m.id}')">${ico(m.icone)}<span>${esc(m.nome)}</span></button>`;
    const ab=abertos.has(m.id);
    return `<button class="nav-item${m.filhos.some(f=>f.id===rota)&&!ab?' active':''}" aria-expanded="${ab}" onclick="toggleSub('${m.id}')">${ico(m.icone)}<span>${esc(m.nome)}</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="submenu${ab?' open':''}">${m.filhos.map(f=>`<button class="sub-item${rota===f.id?' active':''}" onclick="ir('${f.id}')">${esc(f.nome)}</button>`).join('')}</div>`;
   }).join('')).join('');
}
function render(){
  renderNav();
  const t=TITULO[rota]||['Console'];
  document.getElementById('crumb').innerHTML=t.map((x,i)=>i===t.length-1?`<b>${esc(x)}</b>`:`<span class="pai">${esc(x)} <i>/</i></span>`).join(' ');
  /* Na caixa de conversas o aviso vai pro alto: embaixo ele tapava o botao de enviar. */
  document.body.classList.toggle('tela-chat',/^(wa|tg)-atendimento$|^(whats|tg)$/.test(rota));
  document.getElementById('view').innerHTML=faixaConsumo()+faixaIntegracoes()+(TELAS[rota]||telaVisao)();
  if(rota==='indicacao') trocaModelo();
  /* O perfil do assistente e buscado DEPOIS de desenhar: ele baixa a foto do
     servidor da Meta, e segurar a tela por causa de uma imagem faria o console
     parecer travado. Os campos nascem vazios e se preenchem em seguida. */
  if(rota==='canais'){ previewPerfil(); carregarPerfilDoNumero(); }
  /* Chat abre na ULTIMA mensagem, como qualquer app de conversa. Abrir no topo
     obrigaria a rolar ate embaixo toda vez so pra ver o que acabou de chegar. */
  const fluxo=document.querySelector('.conversa-fluxo');
  if(fluxo) fluxo.scrollTop=fluxo.scrollHeight;
  /* Nas telas do Telegram a conta e so do Telegram — somar os leads do WhatsApp
     ali faria o canal parecer mais movimentado do que esta. */
  const noTg=rota==='tg'||rota.startsWith('tg-');
  const abertos=noTg?(ST.leads||[]).filter(l=>l.status==='aberto'&&ehTg(l.telefone)).length:ST.resumo.abertos;
  /* No Telegram as duas tarjas viram uma: status e leads do MESMO canal lado a
     lado, e o topo respira. */
  const pl=document.getElementById('pillLeads');
  pl.textContent=abertos+' lead(s) aberto(s)'; pl.hidden=noTg;
  const w=STATUS?.whatsapp||{};
  /* O canal pode ser a API oficial da Meta OU a sessao de WhatsApp Web. Ler so
     `w.envia` (que e a Meta) fazia a tarja dizer "inativo" com o WhatsApp Web
     conectado e conversando — o pior tipo de mentira: a que desmente o que a
     pessoa esta vendo acontecer. */
  const wpp=canalWhatsApp();
  /* A tarja do topo fala do canal DA TELA: nas telas do Telegram, dizer
     "WhatsApp no ar" responde uma pergunta que ninguem fez ali — e esconde se
     o Telegram, que e o assunto, esta ligado ou nao. */
  if(rota==='tg'||rota.startsWith('tg-')){
    const e=TG?.estado, no_ar=e==='conectado';
    const rot=no_ar?'no ar':e==='caido'?'caiu':e==='conectando'?'conectando…':'desligado';
    const nTg=(ST.leads||[]).filter(l=>l.status==='aberto'&&ehTg(l.telefone)).length;
    document.getElementById('pillWa').innerHTML=`<span class="dot ${no_ar?'on':''}"></span> Telegram ${rot}<span class="pill-sep"></span>${nTg} lead(s) aberto(s)`;
    document.getElementById('pillWa').title=TG?.numero?'Bot '+TG.numero:'';
  }else{
    document.getElementById('pillWa').innerHTML=`<span class="dot ${wpp.no_ar?'on':''}"></span> WhatsApp ${wpp.rotulo}`;
  }
}

/* ---------------------------------------------------------------------------
   SIRENE. Pedido de socorro, SOS ou URGENTE fazem o painel tocar uma sirene e
   cobrir a tela de vermelho ATÉ alguém clicar "Estou vendo" — em qualquer aba,
   em qualquer tela do painel. O som é gerado aqui (Web Audio): nada pra baixar,
   nada de direito autoral, e sai no máximo que a caixa de som do computador dá.
   Navegador não deixa tocar som antes de um clique na página: o primeiro clique
   (o de entrar) já libera; se a página foi recarregada, a tela vermelha pede o
   clique e a sirene começa nele.
   --------------------------------------------------------------------------- */
const SIRENE={ctx:null,no:null,giro:null,vistos:new Set(),mostrando:[],meuSos:0};
function sireneContexto(){
  if(!SIRENE.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; SIRENE.ctx=new C(); }
  if(SIRENE.ctx.state==='suspended') SIRENE.ctx.resume().catch(()=>{});
  return SIRENE.ctx;
}
addEventListener('pointerdown',()=>{ try{ sireneContexto(); if(SIRENE.mostrando.length&&!SIRENE.no) sireneTocar(); }catch{} },{capture:true});
function sireneTocar(){
  const ctx=sireneContexto(); if(!ctx||SIRENE.no) return;
  /* Duas ondas ásperas (dente de serra + quadrada) empurradas por distorção e
     compressor: é o que faz soar como sirene de verdade e parecer mais alto
     que um apito limpo no mesmo volume. */
  const saida=ctx.createDynamicsCompressor(); saida.threshold.value=-30; saida.ratio.value=12; saida.connect(ctx.destination);
  const dist=ctx.createWaveShaper(); const k=40, n=1024, curva=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i*2/n-1; curva[i]=((3+k)*x*20*Math.PI/180)/(Math.PI+k*Math.abs(x)); }
  dist.curve=curva; dist.connect(saida);
  const vol=ctx.createGain(); vol.gain.value=1; vol.connect(dist);
  const a=ctx.createOscillator(); a.type='sawtooth'; const b=ctx.createOscillator(); b.type='square';
  a.connect(vol); b.connect(vol); a.start(); b.start();
  const subirDescer=()=>{ const t=ctx.currentTime;
    for(const o of [a,b]){ o.frequency.cancelScheduledValues(t); o.frequency.setValueAtTime(620,t); o.frequency.linearRampToValueAtTime(1550,t+0.45); o.frequency.linearRampToValueAtTime(620,t+0.9); }
    b.detune.value=12; };
  subirDescer(); SIRENE.giro=setInterval(subirDescer,900);
  SIRENE.no={a,b,vol};
}
function sireneParar(){
  if(SIRENE.giro){ clearInterval(SIRENE.giro); SIRENE.giro=null; }
  if(SIRENE.no){ try{ SIRENE.no.a.stop(); SIRENE.no.b.stop(); SIRENE.no.vol.disconnect(); }catch{} SIRENE.no=null; }
}
const SIRENE_TITULO={'emergencia:violencia':'🚨 PEDIDO DE SOCORRO','emergencia:violencia_mulher':'🚨 POSSÍVEL VIOLÊNCIA DOMÉSTICA',
  'emergencia:saude':'🚨 EMERGÊNCIA MÉDICA','sos':'🆘 SOS DO ATENDIMENTO','urgente':'⚠️ URGENTE'};
function sireneTela(lista){
  let el=document.getElementById('sireneTela');
  if(!lista.length){ el?.remove(); document.title=document.title.replace(/^🚨 /,''); return; }
  if(!el){ el=document.createElement('div'); el.id='sireneTela'; document.body.appendChild(el); }
  const tocando=!!SIRENE.no, travado=SIRENE.ctx?.state!=='running';
  el.innerHTML=`<div class="sirene-caixa" role="alertdialog" aria-live="assertive">
    <div class="sirene-cab"><div class="sirene-anel">🚨</div><div>
      <div class="sirene-titulo">${esc((SIRENE_TITULO[lista[0].tipo]||'Alerta de segurança').replace(/^\S+\s/,''))}</div>
      <div class="sirene-sub">${lista.length>1?`${lista.length} ocorrências sem ninguém ver`:'Alguém precisa de ajuda agora'}</div></div></div>
    ${lista.map(a=>`<div class="sirene-item"><b>${esc(SIRENE_TITULO[a.tipo]||a.tipo)}</b>
      ${a.cliente?` · ${esc(a.cliente)}`:''}${a.protocolo?` · ${esc(a.protocolo)}`:''}
      <div>${esc(a.detalhe||'')}</div><small>${new Date(a.em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')}
    ${travado&&!tocando?'<p class="sirene-aviso">Clique em qualquer lugar para ouvir a sirene.</p>':''}
    <div class="sirene-botoes">
      <button class="btn sirene-parar" onclick="sireneVisto()">Estou vendo — parar a sirene</button>
      <button class="btn btn-s" onclick="sireneVisto('wa-atendimento')">Parar e abrir o atendimento</button>
    </div>
    <p class="sirene-rodape">Se houver risco à vida, ligue 190 (polícia), 192 (SAMU) ou 180 (violência contra a mulher).</p>
  </div>`;
  if(!/^🚨 /.test(document.title)) document.title='🚨 '+document.title;
}
async function sireneVisto(ir_para){
  const ids=SIRENE.mostrando.map(a=>a.id);
  sireneParar(); SIRENE.mostrando=[]; sireneTela([]);
  ids.forEach(i=>SIRENE.vistos.add(i));
  try{ await api('seguranca/visto',{ids}); }catch(e){ avisoErro('Não consegui registrar que você viu',e.message); }
  if(ir_para) ir(ir_para);
  if(document.getElementById('segCard')) carregarSeguranca();
}
async function checarSirene(){
  if(!TOKEN||document.body.classList.contains('sem-nav')) return;
  let r; try{ r=await api('seguranca/pendentes'); }catch{ return; }
  /* O SOS que ESTA tela disparou não toca aqui: quem apertou pode estar na
     frente do agressor, e uma sirene no computador dele piora a situação.
     Toca nos outros computadores e abas. */
  const lista=(r.pendentes||[]).filter(a=>!SIRENE.vistos.has(a.id)
    &&!(a.tipo==='sos'&&SIRENE.meuSos&&Math.abs(Date.parse(a.em)-SIRENE.meuSos)<15000));
  const novo=lista.some(a=>!SIRENE.mostrando.find(m=>m.id===a.id));
  SIRENE.mostrando=lista;
  if(!lista.length){ sireneParar(); sireneTela([]); return; }  // alguém viu em outra aba
  if(novo){
    sireneTocar();
    try{ if('Notification' in window&&Notification.permission==='granted'){ new Notification(SIRENE_TITULO[lista[0].tipo]||'Alerta de segurança',{body:`${lista[0].cliente||''} ${lista[0].detalhe||''}`.trim(),requireInteraction:true}); } }catch{}
  }
  sireneTela(lista);
}
setInterval(checarSirene,5000);
/* "Testar sirene": 3 segundos de sirene e, de quebra, pede permissão para o
   aviso do sistema — assim o alerta aparece mesmo com o painel em outra aba. */
function testarSirene(){
  sireneTocar(); setTimeout(sireneParar,3000);
  try{ if('Notification' in window&&Notification.permission==='default') Notification.requestPermission(); }catch{}
  flash('Tocando a sirene por 3 segundos. Confira o volume do computador.','ok');
}

  let criando=false;

  };

  const enviar=async()=>{
    if(!campo.value){ return mostrarErro(criando?'Escolha uma senha.':'Digite a sua senha.'); }
    if(criando){
      if(campo.value.length<8){ return mostrarErro('A senha precisa de pelo menos 8 caracteres.'); }

        erro.textContent='As duas senhas não são iguais.';

      if(criando){ await api('criar-acesso',{senha:campo.value}); }
