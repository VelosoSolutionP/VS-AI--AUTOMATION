<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar acesso — Bolso Cheio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/crm/simbolo.png">
<style>
:root{--bg:#f7f7f9;--panel:#fff;--line:#e4e4ea;--line-2:#cfcfd8;--fg:#16161c;--muted:#5b5b66;--brand:#4f46e5;--brand-fg:#fff;--err:#b91c1c;--err-bg:#fef2f2}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0e;--panel:#141419;--line:#2a2a32;--line-2:#3b3b45;--fg:#f4f4f6;--muted:#a3a3ae;--brand:#818cf8;--brand-fg:#0b0b0e;--err:#f87171;--err-bg:rgba(239,68,68,.12)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
main{width:100%;max-width:420px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
img{display:block;height:40px;margin:0 auto 16px}
h1{font-size:20px;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 20px;font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input{width:100%;font:15px inherit;font-family:inherit;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);color:var(--fg)}
input[readonly]{opacity:.75}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-fg);font:600 15px inherit;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6}
.erro{margin-top:14px;padding:11px 13px;border-radius:10px;background:var(--err-bg);color:var(--err);font-size:14px}
.dica{color:var(--muted);font-size:12px;margin-top:6px}
</style></head>
<body><main><div class="card">
  <img src="/crm/logo.png" alt="Bolso Cheio" onerror="this.remove()">
  <h1>Criar o seu acesso</h1>
  <p class="sub" id="sub">Conferindo o seu link…</p>
  <form id="f" hidden>
    <label for="email">Usuário (seu e-mail)</label>
    <input id="email" type="email" readonly autocomplete="username">
    <label for="s1">Senha</label>
    <input id="s1" type="password" autocomplete="new-password" minlength="8" required>
    <p class="dica">Pelo menos 8 caracteres.</p>
    <label for="s2">Repita a senha</label>
    <input id="s2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="b">Criar acesso e entrar</button>
  </form>
  <div id="erro" class="erro" hidden></div>
</div></main>
<script>
const $=(id)=>document.getElementById(id);
const t=new URLSearchParams(location.search).get('t')||'';
const erro=(m)=>{ $('erro').textContent=m; $('erro').hidden=false; };
(async()=>{
  try{
    const r=await fetch('/api/acesso/convite?t='+encodeURIComponent(t)); const j=await r.json();
    if(j.usado){ $('sub').innerHTML='Sua senha já está criada. <a href="/crm" style="font-weight:700">Entrar no Bolso Cheio</a>'; return; }
    if(!j.ok){ $('sub').textContent='Este link não vale mais.'; return erro((j.motivo||'link inválido')+'. Na tela de entrar, use "Pagou e não recebeu o acesso?" que mandamos outro na hora.'); }
    $('email').value=j.email; $('f').hidden=false;
    $('sub').textContent=j.jaTemUsuario?'Defina uma nova senha para o seu usuário.':'Olá'+(j.nome?', '+j.nome.split(' ')[0]:'')+'! Defina a sua senha para entrar no Bolso Cheio.';
  }catch{ erro('Sem conexão agora. Tente de novo em alguns segundos.'); }
})();
$('f').onsubmit=async(e)=>{
  e.preventDefault(); $('erro').hidden=true;
  if($('s1').value!==$('s2').value) return erro('As duas senhas não são iguais.');
  $('b').disabled=true; $('b').textContent='Criando…';
  try{
    const r=await fetch('/api/acesso/aceitar',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t,senha:$('s1').value})});
    const j=await r.json().catch(()=>({motivo:'A conexão caiu no meio. Tente de novo.'}));
    if(!j.ok){ $('b').disabled=false; $('b').textContent='Criar acesso e entrar'; return erro(j.motivo||'não consegui criar'); }
    try{ sessionStorage.setItem('crm_token',j.token); }catch{}
    location.href='/crm';
  }catch{ $('b').disabled=false; $('b').textContent='Criar acesso e entrar'; erro('Sem conexão agora. Tente de novo.'); }
};
</script></body></html>
