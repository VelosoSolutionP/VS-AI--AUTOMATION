<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quebra-Galho — Precisou, chamou, resolveu.</title>
<meta name="description" content="Encontre profissionais avaliados perto de você em BH e Grande BH. Peça, receba propostas e contrate com segurança.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F4511E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --laranja:#F4511E; --laranja-esc:#D93C0C; --laranja-claro:#FFF1EB;
  --verde:#0E9F6E; --verde-claro:#E6F7F1; --amarelo:#F59E0B;
  --vermelho:#DC2626; --vermelho-claro:#FEF2F2;
  --tinta:#1C1917; --tinta2:#57534E; --tinta3:#A8A29E;
  --papel:#FFFDFB; --cartao:#FFFFFF; --linha:#EDE9E6; --linha2:#E0DAD5;
  --r:16px; --r-s:10px; --sombra:0 1px 2px rgba(28,25,23,.06),0 8px 24px rgba(28,25,23,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.wide{max-width:1100px}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.02em}
h1{font-size:26px;font-weight:800}
h2{font-size:19px;font-weight:750}
h3{font-size:15px;font-weight:700}
p{margin:0}
.dim{color:var(--tinta2);font-size:14px}
.dim3{color:var(--tinta3);font-size:13px}

/* topo */
.topo{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;z-index:40;
  background:rgba(255,253,251,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0}
.marca .qg{width:34px;height:34px;border-radius:10px;background:var(--laranja);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;letter-spacing:-.04em}
.marca b{font-size:16.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.marca small{display:block;font-size:10.5px;color:var(--tinta2);font-weight:500;margin-top:-2px}
.voltar{background:none;border:0;font-size:15px;color:var(--tinta2);cursor:pointer;padding:6px 8px 6px 0;font-weight:600}

/* conteudo */
.tela{padding:18px 16px 90px}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--sombra)}
.cartao.sel{border-color:var(--laranja);box-shadow:0 0 0 3px var(--laranja-claro)}

/* botoes: alvo grande no dedo */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;padding:14px 18px;border-radius:var(--r-s);border:1.5px solid var(--linha2);
  background:var(--cartao);color:var(--tinta);font:inherit;font-weight:700;font-size:16px;
  cursor:pointer;transition:transform .06s}
.btn:active{transform:scale(.985)}
.btn-p{background:var(--laranja);border-color:var(--laranja);color:#fff}
.btn-p:hover{background:var(--laranja-esc)}
.btn-g{background:var(--verde);border-color:var(--verde);color:#fff}
.btn-peq{min-height:40px;padding:8px 14px;font-size:14px;width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:9px;flex-wrap:wrap}
.btns .btn{width:auto;flex:1;min-width:130px}

/* campos */
label{display:block;font-size:13px;font-weight:650;color:var(--tinta2);margin:0 0 6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:14px;border-radius:var(--r-s);
  border:1.5px solid var(--linha2);background:var(--cartao);color:var(--tinta);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--laranja)}
textarea{resize:vertical;min-height:96px}
.campo{margin-bottom:14px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* etiquetas */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;
  padding:4px 10px;border-radius:999px;background:#F5F3F1;color:var(--tinta2);white-space:nowrap}
.t-ok{background:var(--verde-claro);color:var(--verde)}
.t-al{background:#FEF6E7;color:#B45309}
.t-er{background:var(--vermelho-claro);color:var(--vermelho)}
.t-lj{background:var(--laranja-claro);color:var(--laranja-esc)}

/* categorias */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{background:var(--cartao);border:1.5px solid var(--linha2);border-radius:var(--r);
  padding:16px 12px;text-align:center;cursor:pointer;transition:.12s}
.cat:active{transform:scale(.97)}
.cat.on{border-color:var(--laranja);background:var(--laranja-claro)}
.cat .ic{font-size:26px;display:block;margin-bottom:6px}
.cat b{font-size:14px;font-weight:700;display:block}

/* card de proposta */
.prop{display:flex;gap:12px;align-items:flex-start}
.ava{width:48px;height:48px;border-radius:50%;background:var(--laranja-claro);color:var(--laranja-esc);
  display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.estrelas{color:var(--amarelo);letter-spacing:-1px;font-size:14px}
.preco{font-size:22px;font-weight:800;letter-spacing:-.03em}

/* passos / timeline */
.passos{display:flex;gap:6px;margin:14px 0 18px}
.passo{flex:1;height:4px;border-radius:99px;background:var(--linha2)}
.passo.on{background:var(--laranja)}
.linha-t{position:relative;padding-left:26px}
.linha-t .pt{position:relative;padding:0 0 18px}
.linha-t .pt:last-child{padding-bottom:0}
.linha-t .pt::before{content:'';position:absolute;left:-26px;top:4px;width:12px;height:12px;
  border-radius:50%;background:var(--linha2);border:2px solid var(--papel)}
.linha-t .pt.feito::before{background:var(--verde)}
.linha-t .pt.agora::before{background:var(--laranja);box-shadow:0 0 0 4px var(--laranja-claro)}
.linha-t .pt::after{content:'';position:absolute;left:-21px;top:16px;bottom:0;width:2px;background:var(--linha2)}
.linha-t .pt:last-child::after{display:none}
.linha-t .pt.feito::after{background:var(--verde)}

/* contador */
.contador{font-size:44px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  text-align:center;color:var(--laranja)}
.contador.urgente{color:var(--vermelho)}

#map{height:230px;border-radius:var(--r);border:1px solid var(--linha2);margin:10px 0}
.leaflet-container{font:inherit}

.aviso{padding:12px 14px;border-radius:var(--r-s);font-size:14px;margin-bottom:12px;display:none;font-weight:600}
.aviso.on{display:block}
.aviso.ok{background:var(--verde-claro);color:#065F46}
.aviso.er{background:var(--vermelho-claro);color:#991B1B}

.vazio{text-align:center;padding:40px 20px;color:var(--tinta2)}
.vazio .ic{font-size:44px;display:block;margin-bottom:12px;opacity:.6}

.abas{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--linha);
  position:sticky;top:62px;background:var(--papel);z-index:30;-webkit-overflow-scrolling:touch}
.abas button{background:none;border:0;padding:9px 14px;border-radius:99px;font:inherit;font-size:14px;
  font-weight:650;color:var(--tinta2);cursor:pointer;white-space:nowrap}
.abas button.on{background:var(--tinta);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r);padding:14px}
.kpi span{font-size:11px;font-weight:700;color:var(--tinta3);text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--tinta2)}

.item{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}

.hero{padding:26px 16px 20px;background:linear-gradient(170deg,var(--laranja-claro),var(--papel) 75%)}
.hero h1{font-size:30px;margin-bottom:8px}
.hero .slogan{font-size:17px;font-weight:700;color:var(--laranja-esc);margin-bottom:6px}
.como{counter-reset:p}
.como .p{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.como .n{width:26px;height:26px;border-radius:50%;background:var(--laranja);color:#fff;flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:800}
.rodape{padding:22px 16px 40px;border-top:1px solid var(--linha);color:var(--tinta2);font-size:13px}
@media(min-width:760px){
  .app.wide .tela{padding:24px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .cats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ═══ estado ═══ */
const S = {
  tela: 'home', cats: [], pedido: null, rascunho: {}, cards: [], escolha: null,
  aviso: null, escopo: null, os: null, timer: null, mapa: null, marca: null,
  token: sessionStorage.getItem('qg_token') || '', eu: null, prestador: null,
  aba: 'oportunidades', admin: null, ultimoPedido: sessionStorage.getItem('qg_pedido') || null,
  ultimaOS: sessionStorage.getItem('qg_os') || null,
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = (c) => (c == null ? '—' : (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }));
const iniciais = (n) => String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const estrelas = (n) => n == null ? '<span class="dim3">sem avaliação ainda</span>'
  : `<span class="estrelas">${'★'.repeat(Math.round(n))}${'☆'.repeat(5 - Math.round(n))}</span> <b>${n.toFixed(1)}</b>`;

function fala(t, tipo) {
  const a = $('aviso'); if (!a) return;
  a.className = 'aviso on ' + tipo; a.textContent = t;
  if (tipo === 'ok') setTimeout(() => { a.className = 'aviso'; }, 3800);
  a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

async function api(rota, corpo, metodo) {
  const r = await fetch('/api/' + rota, {
    method: metodo || (corpo ? 'POST' : 'GET'),
    headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const j = await r.json().catch(() => ({ erro: 'não consegui falar com o servidor' }));
  if (!r.ok || j.erro) throw new Error(j.erro || ('HTTP ' + r.status));
  return j;
}

function ir(tela) { S.tela = tela; clearInterval(S.timer); window.scrollTo(0, 0); render(); }

/* ═══ casca ═══ */
function topo(titulo, voltar) {
  return `<div class="topo">
    ${voltar ? `<button class="voltar" onclick="ir('${voltar}')">‹ Voltar</button>` : ''}
    <div class="marca" onclick="ir('home')">
      <div class="qg">QG</div>
      <div><b>Quebra-Galho</b><small>${esc(titulo || 'Precisou, chamou, resolveu.')}</small></div>
    </div>
  </div>`;
}
const casca = (html, larga) => { $('app').className = 'app' + (larga ? ' wide' : ''); $('app').innerHTML = html; };

/* ═══ HOME ═══ */
function telaHome() {
  casca(topo() + `
  <div class="hero">
    <div class="slogan">Precisou, chamou, resolveu.</div>
    <h1>Encontre quem resolve, pertinho de você.</h1>
    <p class="dim" style="margin-top:8px">Profissionais avaliados em BH e Grande BH. Você não paga para procurar.</p>
    <div style="margin-top:18px">
      <button class="btn btn-p" onclick="ir('categoria')">Encontrar profissional</button>
      <button class="btn" style="margin-top:9px" onclick="ir('login')">Quero prestar serviços</button>
    </div>
  </div>
  <div class="tela" style="padding-top:8px">
    <div id="aviso" class="aviso"></div>
    ${S.ultimaOS ? `<div class="cartao" style="border-color:var(--laranja)">
      <h3>Você tem um serviço em andamento</h3>
      <p class="dim" style="margin:6px 0 12px">Acompanhe o passo a passo do seu Quebra-Galho.</p>
      <button class="btn btn-p btn-peq" onclick="abrirOS('${esc(S.ultimaOS)}')">Ver meu serviço</button></div>` : ''}
    ${S.ultimoPedido && !S.ultimaOS ? `<div class="cartao" style="border-color:var(--laranja)">
      <h3>Seu pedido está recebendo propostas</h3>
      <button class="btn btn-p btn-peq" style="margin-top:10px" onclick="verPropostas('${esc(S.ultimoPedido)}')">Ver propostas</button></div>` : ''}

    <h2 style="margin:20px 0 12px">Como funciona</h2>
    <div class="cartao como">
      ${['Conte o que precisa.', 'Receba propostas.', 'Compare preço e avaliações.',
         'Escolha o profissional.', 'Pague pela plataforma.', 'Serviço concluído.', 'Avalie.']
        .map((t, i) => `<div class="p"><div class="n">${i + 1}</div><div>${t}</div></div>`).join('')}
    </div>
    <div class="cartao" style="background:var(--laranja-claro);border-color:transparent">
      <b>Você não paga para procurar.</b>
      <p class="dim" style="margin-top:4px;color:var(--tinta)">E o profissional não paga para disputar seu pedido.</p>
    </div>
    <h2 style="margin:20px 0 12px">O que você precisa?</h2>
    <div class="cats">${S.cats.map(c => `<div class="cat" onclick="escolherCat('${esc(c.id)}')">
      <span class="ic">${c.icone || '🔧'}</span><b>${esc(c.nome)}</b></div>`).join('')}</div>
  </div>
  <div class="rodape">
    <b style="color:var(--tinta)">Quebra-Galho</b> · Veloso Solution<br>
    Belo Horizonte e Grande BH · <a href="#" onclick="ir('admin-login');return false" style="color:var(--tinta2)">Administração</a>
  </div>`);
}

/* ═══ FLUXO DO CLIENTE ═══ */
function escolherCat(id) { S.rascunho.categoria = id; ir('local'); }

function telaCategoria() {
  casca(topo('Passo 1 de 4', 'home') + `<div class="tela">
    <div id="aviso" class="aviso"></div>
    <div class="passos"><div class="passo on"></div><div class="passo"></div><div class="passo"></div><div class="passo"></div></div>
    <h2>Do que você precisa?</h2>
    <p class="dim" style="margin:6px 0 16px">Escolha a área do serviço.</p>
    <div class="cats">${S.cats.map(c => `<div class="cat ${S.rascunho.categoria === c.id ? 'on' : ''}" onclick="escolherCat('${esc(c.id)}')">
      <span class="ic">${c.icone || '🔧'}</span><b>${esc(c.nome)}</b>
      <span class="dim3" style="display:block;margin-top:4px;font-size:11.5px">${esc((c.exemplos || [])[0] || '')}</span></div>`).join('')}</div>
  </div>`);
}

function telaLocal() {
  casca(topo('Passo 2 de 4', 'categoria') + `<div class="tela">
    <div id="aviso" class="aviso"></div>
    <div class="passos"><div class="passo on"></div><div class="passo on"></div><div class="passo"></div><div class="passo"></div></div>
    <h2>Onde é o serviço?</h2>
    <p class="dim" style="margin:6px 0 12px">Toque no mapa ou use sua localização.</p>
    <button class="btn" onclick="usarGps()">📍 Usar minha localização</button>
    <div id="map"></div>
    <div class="campo"><label>Endereço</label><input id="fRua" placeholder="Rua da Bahia, 1200" value="${esc(S.rascunho.endereco || '')}"></div>
    <div class="dupla">
      <div class="campo"><label>Bairro</label><input id="fBairro" placeholder="Centro" value="${esc(S.rascunho.bairro || '')}"></div>
      <div class="campo"><label>Cidade</label><input id="fCidade" value="${esc(S.rascunho.cidade || 'Belo Horizonte')}"></div>
    </div>
    <button class="btn btn-p" onclick="salvarLocal()">Continuar</button>
  </div>`);
  montarMapa();
}

function montarMapa() {
  const p = S.rascunho.lat ? [S.rascunho.lat, S.rascunho.lng] : [-19.9245, -43.9352];
  S.mapa = L.map('map').setView(p, S.rascunho.lat ? 16 : 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(S.mapa);
  S.mapa.on('click', e => marcar(e.latlng.lat, e.latlng.lng));
  if (S.rascunho.lat) marcar(S.rascunho.lat, S.rascunho.lng);
}
function marcar(lat, lng) {
  S.rascunho.lat = lat; S.rascunho.lng = lng;
  if (S.marca) S.mapa.removeLayer(S.marca);
  S.marca = L.marker([lat, lng]).addTo(S.mapa);
}
function usarGps() {
  if (!navigator.geolocation) return fala('Este navegador não tem GPS disponível.', 'er');
  fala('Buscando sua localização…', 'ok');
  navigator.geolocation.getCurrentPosition(
    p => { S.mapa.setView([p.coords.latitude, p.coords.longitude], 16); marcar(p.coords.latitude, p.coords.longitude); fala('Prontinho, achamos você.', 'ok'); },
    e => fala(e.code === 1 ? 'Você negou a permissão de localização. Toque no mapa para marcar.' : 'Não consegui pegar o GPS. Toque no mapa para marcar.', 'er'),
    { enableHighAccuracy: true, timeout: 10000 });
}
function salvarLocal() {
  if (!S.rascunho.lat) return fala('Toque no mapa para marcar onde é o serviço.', 'er');
  S.rascunho.endereco = $('fRua').value.trim();
  S.rascunho.bairro = $('fBairro').value.trim();
  S.rascunho.cidade = $('fCidade').value.trim();
  if (!S.rascunho.cidade) return fala('Informe a cidade.', 'er');
  ir('descricao');
}

function telaDescricao() {
  const cat = S.cats.find(c => c.id === S.rascunho.categoria);
  casca(topo('Passo 3 de 4', 'local') + `<div class="tela">
    <div id="aviso" class="aviso"></div>
    <div class="passos"><div class="passo on"></div><div class="passo on"></div><div class="passo on"></div><div class="passo"></div></div>
    <h2>Conte o que está acontecendo</h2>
    <p class="dim" style="margin:6px 0 14px">Quanto mais detalhe, melhor o orçamento.</p>
    <div class="campo"><textarea id="fDesc" placeholder="Ex.: ${esc((cat?.exemplos || ['A tomada do quarto parou de funcionar'])[0])}…">${esc(S.rascunho.descricao || '')}</textarea></div>
    <div class="campo"><label>Fotos (opcional, ajuda muito)</label>
      <button class="btn" onclick="fotoFake()">📷 Adicionar foto</button>
      <div id="fotos" class="dim3" style="margin-top:8px">${(S.rascunho.fotos || []).length} foto(s) anexada(s)</div></div>
    <div class="campo"><label>Quando você precisa?</label>
      <select id="fUrg">
        <option value="hoje">Hoje</option>
        <option value="esta_semana" selected>Esta semana</option>
        <option value="sem_pressa">Sem pressa</option>
      </select></div>
    <button class="btn btn-p" onclick="criarPedido()">Pedir orçamento</button>
    <p class="dim3" style="text-align:center;margin-top:10px">É grátis. Você só paga se contratar.</p>
  </div>`);
}
function fotoFake() {
  S.rascunho.fotos = [...(S.rascunho.fotos || []), 'foto-' + Date.now()];
  $('fotos').textContent = S.rascunho.fotos.length + ' foto(s) anexada(s)';
}

async function criarPedido() {
  S.rascunho.descricao = $('fDesc').value.trim();
  S.rascunho.urgencia = $('fUrg').value;
  try {
    const r = await api('pedidos', { ...S.rascunho, clienteNome: 'Você' });
    S.pedido = r.pedido;
    S.ultimoPedido = r.pedido.id;
    sessionStorage.setItem('qg_pedido', r.pedido.id);
    ir('procurando');
    setTimeout(() => verPropostas(r.pedido.id), 1600);
  } catch (e) { fala(e.message, 'er'); }
}

function telaProcurando() {
  const n = (S.pedido?.convidados || []).length;
  casca(topo('Quase lá') + `<div class="tela">
    <div class="vazio" style="padding-top:60px">
      <span class="ic">🔎</span>
      <h2>Procurando profissionais…</h2>
      <p class="dim" style="margin-top:8px">Avisamos ${n} profissional(is) da sua região.</p>
    </div></div>`);
}

async function verPropostas(pedidoId) {
  try {
    const r = await api('propostas-do-pedido?pedido=' + encodeURIComponent(pedidoId));
    S.pedido = r.pedido; S.cards = r.cards;
    ir('propostas');

function rodarContador(propostaId) {
  clearInterval(S.timer);
  S.timer = setInterval(async () => {
    try {
      const r = await api('aceite?proposta=' + encodeURIComponent(propostaId));
      const el = $('cont'); if (!el) return clearInterval(S.timer);
      if (r.expirou) {
        clearInterval(S.timer);
        S.proxima = r.proxima;
        return ir('expirou');
      }
      const s = r.segundosRestantes ?? 0;
      el.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      el.className = 'contador' + (s <= 60 ? ' urgente' : '');
    } catch { clearInterval(S.timer); }
  }, 1000);
}

      <div class="item"><span class="dim">Você recebe</span><span class="preco" style="color:var(--verde)">${brl(ga.totalRecebe)}</span></div>
      <p class="dim3" style="margin-top:10px">Nada aqui é escondido: a taxa aparece em cada serviço.</p>
    </div>
    ${ga.linhas.map(l => `<div class="cartao">
      <div style="display:flex;justify-content:space-between"><b>${esc(l.ordemId)}</b>
        <span class="tag ${l.liberado ? 't-ok' : 't-al'}">${esc(l.rotulo)}</span></div>
      <div class="item"><span class="dim">Serviço</span><b>${brl(l.brutoCentavos)}</b></div>
      <div class="item"><span class="dim">Taxa</span><span style="color:var(--vermelho)">− ${brl(l.taxaCentavos)}</span></div>
      <div class="item"><span class="dim">Você recebe</span><b style="color:var(--verde)">${brl(l.recebeCentavos)}</b></div>
    </div>`).join('') || '<div class="vazio"><span class="ic">💰</span><b>Sem ganhos ainda</b></div>'}`;
  }
  if (S.aba === 'area') {
    corpo = `<div class="cartao">
      <h3>${esc(meu.nome)}</h3>
      <div style="margin:6px 0 10px">${estrelas(meu.reputacao)} <span class="dim3">· ${meu.servicosConcluidos} serviços</span></div>
      <div class="item"><span class="dim">Raio de atendimento</span><b>${meu.raioKm} km</b></div>
      <div class="item"><span class="dim">Cidades</span><b>${esc((meu.cidades || []).join(', ') || '—')}</b></div>
      <div class="item"><span class="dim">Bairros</span><b>${esc((meu.bairros || []).join(', ') || '—')}</b></div>
      <div class="item"><span class="dim">Categorias</span><b>${esc((meu.categorias || []).join(', '))}</b></div>
    </div>
    <div class="cartao"><h3>Onde você atende</h3><div id="map"></div>
      <p class="dim3">O plano básico tem área padrão. Mais alcance virá em planos — sem comprar posição no ranking.</p></div>`;
  }

  casca(topo('Olá, ' + meu.nome.split(' ')[0]) + `
    <div class="abas">${abas.map(([id, n]) => `<button class="${S.aba === id ? 'on' : ''}" onclick="S.aba='${id}';render()">${n}</button>`).join('')}
      <button onclick="sair()">Sair</button></div>
    <div class="tela"><div id="aviso" class="aviso"></div>${corpo}</div>`);

  if (S.aba === 'area') {
    const m = L.map('map').setView([meu.base.lat, meu.base.lng], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(m);
    L.circle([meu.base.lat, meu.base.lng], { radius: meu.raioKm * 1000, color: '#F4511E', fillOpacity: .08 }).addTo(m);
    L.marker([meu.base.lat, meu.base.lng]).addTo(m);
  }
}

function formProposta(pedidoId) {
  casca(topo('Enviar proposta', 'prestador') + `<div class="tela">
    <div id="aviso" class="aviso"></div>
    <h2>Sua proposta</h2>
    <div class="campo" style="margin-top:14px"><label>Valor (R$)</label><input id="pVal" type="number" inputmode="decimal" placeholder="220,00"></div>
    <div class="campo"><label>Em quantos dias</label><input id="pPrazo" type="number" value="1"></div>
    <div class="campo"><label>O que está incluído</label><textarea id="pEsc" placeholder="Descreva o serviço que você vai fazer"></textarea></div>
    <div class="campo"><label>Material</label><select id="pMat">
      <option value="1">Incluído no valor</option><option value="0">Por conta do cliente</option></select></div>
    <div class="campo"><label>Disponibilidade</label><input id="pDisp" placeholder="Disponível hoje"></div>
    <button class="btn btn-p" onclick="enviarProposta('${esc(pedidoId)}')">Enviar proposta</button>
  </div>`);
}
async function enviarProposta(pedidoId) {
  try {
    await api('propostas', {
      pedidoId, prestadorId: S.prestador.id,
      valorCentavos: Math.round(Number(String($('pVal').value).replace(',', '.')) * 100),
      prazoDias: Number($('pPrazo').value), escopo: $('pEsc').value.trim(),
      materiaisInclusos: $('pMat').value === '1', disponibilidade: $('pDisp').value.trim(),
    });
    S.aba = 'oportunidades'; fala('Proposta enviada.', 'ok'); ir('prestador');
  } catch (e) { fala(e.message, 'er'); }
}

/* ═══ ADMIN ═══ */
async function carregarAdmin() { S.admin = await api('admin'); }

function telaAdmin() {
  const a = S.admin; if (!a) return;
  const n = a.numeros;
  casca(topo('Administração') + `
  <div class="abas"><button class="on">Painel</button><button onclick="sair()">Sair</button></div>
  <div class="tela">
    <div id="aviso" class="aviso"></div>
    <div class="kpis">
      <div class="kpi"><span>Pedidos hoje</span><b>${n.pedidosHoje}</b><em>${n.pedidosTotal} no total</em></div>
      <div class="kpi"><span>Em andamento</span><b>${n.emAndamento}</b><em>${n.concluidos} concluídos</em></div>
      <div class="kpi"><span>GMV</span><b>${brl(n.gmvCentavos)}</b><em>volume transacionado</em></div>
      <div class="kpi"><span>Receita</span><b>${brl(n.receitaCentavos)}</b><em>comissão da plataforma</em></div>
      <div class="kpi"><span>Profissionais</span><b>${a.prestadores.filter(p => p.status === 'ACTIVE').length}</b><em>ativos</em></div>
      <div class="kpi"><span>Clientes</span><b>${a.clientes.length}</b><em>cadastrados</em></div>
      <div class="kpi"><span>Contestações</span><b>${n.contestacoesAbertas}</b><em>abertas</em></div>
      <div class="kpi"><span>Cancelamentos</span><b>${n.cancelados}</b><em>no período</em></div>
    </div>
    <div class="cartao"><h3>Pedidos</h3>
      ${a.pedidos.slice(-8).reverse().map(p => `<div class="item"><div><b>${esc(p.categoria)}</b>
        <div class="dim3">${esc(p.bairro || p.cidade)} · ${esc(p.descricao.slice(0, 50))}…</div></div>
        <span class="tag">${esc(p.rotulo)}</span></div>`).join('') || '<p class="dim">Nenhum pedido.</p>'}
    </div>
    <div class="cartao"><h3>Ordens de serviço</h3>
      ${a.ordens.slice(-8).reverse().map(o => `<div class="item"><div><b>${esc(o.id)}</b>
        <div class="dim3">${brl(o.valorCentavos)}</div></div><span class="tag">${esc(o.status)}</span></div>`).join('') || '<p class="dim">Nenhuma OS.</p>'}
    </div>
    <div class="cartao"><h3>Pagamentos e repasses</h3>
      ${a.pagamentos.map(p => `<div class="item"><div><b>${esc(p.metodo)}</b>
        <div class="dim3">plataforma ${brl(p.plataformaCentavos)} · prestador ${brl(p.prestadorCentavos)}</div></div>
        <b>${brl(p.valorCentavos)}</b></div>`).join('') || '<p class="dim">Nenhum pagamento.</p>'}
    </div>
    <div class="cartao"><h3>Contestações</h3>
      ${a.disputas.map(d => `<div class="item"><div><b>${esc(d.rotuloMotivo)}</b>
        <div class="dim3">${esc(d.descricao.slice(0, 60))}…</div></div>
        <span class="tag ${d.status === 'RESOLVIDA' ? 't-ok' : 't-er'}">${esc(d.status)}</span></div>`).join('') || '<p class="dim">Nenhuma contestação.</p>'}
    </div>
    <div class="cartao"><h3>Profissionais</h3>
      ${a.prestadores.map(p => `<div class="item"><div><b>${esc(p.nome)}</b>
        <div class="dim3">${esc(p.documentoMascarado)} · ${p.raioKm} km</div></div>
        <span class="tag ${p.status === 'ACTIVE' ? 't-ok' : 't-al'}">${esc(p.status)}</span></div>`).join('')}
    </div>
  </div>`, true);
}

/* ═══ router ═══ */
const TELAS = {
  home: telaHome, categoria: telaCategoria, local: telaLocal, descricao: telaDescricao,
  procurando: telaProcurando, propostas: telaPropostas, aviso: telaAviso, aceite: telaAceite,
  expirou: telaExpirou, escopo: telaEscopo, pagamento: telaPagamento, os: telaOS,
  contestar: telaContestar, login: () => telaLogin(false), 'admin-login': () => telaLogin(true),
  prestador: telaPrestador, admin: telaAdmin,
};
function render() { (TELAS[S.tela] || telaHome)(); }

(async function inicio() {
  try { S.cats = (await api('categorias')).categorias; } catch { S.cats = []; }
  render();
})();
</script>
</body>
</html>
